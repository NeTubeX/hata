<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Sélectionnez votre établissement</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}

html,body{height:100%;background:#0a0a0a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8edf5;overflow:hidden;position:fixed;width:100%}

/* EMPÊCHE LA SÉLECTION DE TEXTE ET LE CLIC DROIT */
*{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body{overflow:hidden;position:fixed;width:100%;height:100%}

/* HEADER FIXE - NE BOUGE PAS */
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:#0a0a0a;padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.04);width:100%;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0}
.header{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{background:linear-gradient(145deg,#2a2a2a,#1a1a1a);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;border:1px solid rgba(255,255,255,0.04)}
.header-title{font-size:20px;font-weight:700;color:#e8edf5;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px}
.header-title span{font-weight:400;color:#6a7a8a;font-size:13px}
.btn-home{background:rgba(255,255,255,0.04);padding:8px 18px;border-radius:40px;font-size:13px;font-weight:500;color:#8a9aaa;border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all 0.2s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-home:hover{background:rgba(255,255,255,0.08);color:#e8edf5;border-color:rgba(255,255,255,0.08)}

/* BARRE DE RECHERCHE FIXE */
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#6a7a8a}
.search-input{width:100%;padding:12px 16px 12px 48px;border-radius:40px;border:1px solid rgba(255,255,255,0.04);background:#141414;font-size:15px;font-family:inherit;color:#e8edf5;transition:all 0.25s;outline:none}
.search-input:focus{border-color:rgba(255,255,255,0.08);background:#1a1a1a;box-shadow:0 0 0 4px rgba(255,255,255,0.02)}
.search-input::placeholder{color:#6a7a8a}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.04);border:none;font-size:14px;color:#8a9aaa;cursor:pointer;padding:4px 10px;display:none;border-radius:30px;transition:all 0.2s}
.search-clear:hover{color:#e8edf5;background:rgba(255,255,255,0.06)}

/* STATS - EN DESSOUS DU HEADER */
.stats-fixed{position:fixed;top:104px;left:0;right:0;z-index:150;background:#0a0a0a;padding:10px 0 14px;width:100%;backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.02)}
.stats-row{display:flex;gap:12px;max-width:880px;margin:0 auto;padding:0 16px}
.stat-card{background:#141414;border-radius:16px;padding:10px 16px;flex:1;min-width:0;border:1px solid rgba(255,255,255,0.02);display:flex;align-items:center;gap:10px;transition:all 0.2s}
.stat-card:hover{background:#1a1a1a;border-color:rgba(255,255,255,0.04)}
.stat-number{font-size:22px;font-weight:700;color:#e8edf5;flex-shrink:0;font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:#6a7a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-green{background:#10b981;box-shadow:0 0 16px rgba(16,185,129,0.08)}
.dot-gray{background:#2a2a2a}

/* ZONE DE CONTENU SCROLLABLE */
.main-container{position:fixed;top:156px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 80px;scroll-behavior:smooth}
.main-container::-webkit-scrollbar{width:4px}
.main-container::-webkit-scrollbar-track{background:transparent}
.main-container::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:10px}

/* GRILLE */
.schools-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:880px;margin:0 auto;padding-top:4px}

/* CARTE STYLE FACEBOOK DARK MODE */
.school-card{background:#141414;border-radius:20px;border:1px solid rgba(255,255,255,0.02);transition:all 0.35s cubic-bezier(0.2,0.9,0.4,1);cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;aspect-ratio:1/1;padding:20px;justify-content:space-between}
.school-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.06);background:#1a1a1a;box-shadow:0 12px 48px rgba(0,0,0,0.6)}
.school-card:active{transform:scale(0.97)}
.school-card.hidden{display:none}

/* BORDURE ANIMÉE - BIEN ATTACHÉE À LA CARTE */
.school-card::before{content:'';position:absolute;inset:-1.5px;border-radius:20px;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,0.15),transparent,rgba(255,255,255,0.15),transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:0;transition:opacity 0.6s ease;animation:borderSpin 4s linear infinite;z-index:0}
.school-card:hover::before{opacity:1}
@keyframes borderSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* LUMIERE AMBIANTE DERRIERE LA CARTE */
.school-card::after{content:'';position:absolute;inset:-80px;background:radial-gradient(circle at center,rgba(255,255,255,0.01),transparent 70%);pointer-events:none;opacity:0;transition:opacity 0.6s ease;z-index:0}
.school-card:hover::after{opacity:1}

/* TOP DE LA CARTE */
.school-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.school-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.school-number{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);color:#8a9aaa;font-size:11px;font-weight:600;width:28px;height:28px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.02)}
.school-icon{background:linear-gradient(145deg,#2a2a2a,#1a1a1a);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#e8edf5;flex-shrink:0;border:1px solid rgba(255,255,255,0.02)}
.school-name{font-size:14px;font-weight:600;color:#e8edf5;letter-spacing:-0.1px;word-break:break-word;line-height:1.3}
.school-location{font-size:12px;color:#6a7a8a;display:flex;align-items:center;gap:4px;margin-top:2px}
.school-status{font-size:10px;padding:4px 14px;border-radius:30px;font-weight:500;white-space:nowrap;flex-shrink:0;margin-top:2px}
.status-active{background:rgba(16,185,129,0.06);color:#34d399;border:1px solid rgba(16,185,129,0.04)}

/* CENTRE - GRAND NOM */
.school-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 0;position:relative;z-index:1}
.school-big-name{font-size:26px;font-weight:700;color:#e8edf5;letter-spacing:-0.5px;line-height:1.2;background:linear-gradient(135deg,#e8edf5,#8a9aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.school-big-sub{font-size:13px;color:#6a7a8a;margin-top:4px;display:flex;align-items:center;gap:6px}

/* BOTTOM */
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.02);margin-top:auto;position:relative;z-index:1}
.school-meta{font-size:11px;color:#6a7a8a;display:flex;align-items:center;gap:6px}
.school-meta .code{background:rgba(255,255,255,0.02);padding:2px 10px;border-radius:20px;font-family:monospace;font-size:10px;color:#6a7a8a}
.btn-access{background:#2a2a2a;border:1px solid rgba(255,255,255,0.04);padding:8px 24px;border-radius:40px;font-size:13px;font-weight:600;color:#e8edf5;transition:all 0.3s;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-access:after{content:"→";transition:transform 0.3s}
.school-card:hover .btn-access{background:#3a3a3a;border-color:rgba(255,255,255,0.06);box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.school-card:hover .btn-access:after{transform:translateX(4px)}

/* ETATS */
.no-result{text-align:center;padding:80px 20px;color:#6a7a8a;font-size:16px;grid-column:1/-1;background:#141414;border-radius:24px;border:1px solid rgba(255,255,255,0.02)}
.loading{text-align:center;padding:80px 20px;color:#6a7a8a;font-size:15px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:#141414;border-radius:24px;border:1px solid rgba(255,255,255,0.02)}
.loading:before{content:"";width:28px;height:28px;border:3px solid rgba(255,255,255,0.04);border-top-color:#8a9aaa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:60px 20px;color:#ef4444;background:rgba(239,68,68,0.04);border-radius:24px;font-weight:500;border-left:4px solid #ef4444;grid-column:1/-1}

/* RESPONSIVE */
@media (max-width:680px){
.schools-grid{grid-template-columns:1fr;gap:12px}
.school-card{aspect-ratio:auto;min-height:220px;padding:16px}
.school-big-name{font-size:22px}
.school-icon{width:40px;height:40px;font-size:18px}
.header-title{font-size:17px}
.header-title span{font-size:11px}
.header-icon{width:38px;height:38px;font-size:17px}
.stat-card{padding:8px 12px}
.stat-number{font-size:18px}
.stat-label{font-size:11px}
.btn-home{padding:6px 14px;font-size:12px}
.search-input{padding:10px 14px 10px 44px;font-size:14px}
.stats-fixed{top:96px}
.main-container{top:148px}
}

@media (max-width:420px){
.school-card{min-height:180px;padding:12px}
.school-big-name{font-size:18px}
.school-icon{width:36px;height:36px;font-size:15px}
.school-name{font-size:13px}
.school-number{width:24px;height:24px;font-size:10px}
.btn-access{padding:6px 16px;font-size:12px}
.stat-card{padding:6px 10px}
.stat-number{font-size:15px}
.stat-label{font-size:10px}
}

/* ANIMATION D'ENTRÉE */
.school-card{opacity:0;animation:cardFadeIn 0.5s cubic-bezier(0.2,0.9,0.4,1) forwards}
.school-card:nth-child(1){animation-delay:0.03s}
.school-card:nth-child(2){animation-delay:0.06s}
.school-card:nth-child(3){animation-delay:0.09s}
.school-card:nth-child(4){animation-delay:0.12s}
.school-card:nth-child(5){animation-delay:0.15s}
.school-card:nth-child(6){animation-delay:0.18s}
.school-card:nth-child(7){animation-delay:0.21s}
.school-card:nth-child(8){animation-delay:0.24s}
.school-card:nth-child(9){animation-delay:0.27s}
.school-card:nth-child(10){animation-delay:0.30s}

@keyframes cardFadeIn{
0%{opacity:0;transform:translateY(20px) scale(0.97)}
100%{opacity:1;transform:translateY(0) scale(1)}
}

/* EFFET DE BRILLANCE AU SURVOL */
.school-card:hover .school-big-name{
animation:textGlow 1.5s ease-in-out infinite alternate
}
@keyframes textGlow{
0%{filter:brightness(1)}
100%{filter:brightness(1.2)}
}

/* DESACTIVER LE CLIC DROIT - SUPPLEMENT */
body,html{overflow:hidden;position:fixed;width:100%;height:100%}
</style>
</head>
<body>
<div class="header-fixed">
<div class="header">
<div class="header-top">
<div class="header-left">
<div class="header-icon">🏫</div>
<div class="header-title">Établissements <span>· sélection</span></div>
</div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
<div class="search-wrap">
<span class="search-icon">🔍</span>
<input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off">
<button class="search-clear" id="searchClear" aria-label="Effacer">✕</button>
</div>
</div>
</div>

<div class="stats-fixed">
<div class="stats-row" id="statsRow">
<div class="stat-card"><span class="stat-number" id="totalCount">0</span><span class="stat-label">établissements</span></div>
<div class="stat-card"><span class="stat-dot dot-green"></span><span class="stat-number" id="activeCount">0</span><span class="stat-label">actifs</span></div>
<div class="stat-card"><span class="stat-dot dot-gray"></span><span class="stat-number" id="inactiveCount">0</span><span class="stat-label">inactifs</span></div>
</div>
</div>

<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList">
<div class="loading">Chargement des écoles…</div>
</div>
</div>

<script>
// BLOCK CONTEXT MENU ET RACCOURCIS
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 'U' || e.key === 'S' || e.key === 'P')) { e.preventDefault(); return false; }
    return true;
});
// BLOCK SELECTION TEXTE
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
document.addEventListener('paste', function(e) { e.preventDefault(); return false; });
</script>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
    authDomain: "gesco-67c43.firebaseapp.com",
    projectId: "gesco-67c43",
    storageBucket: "gesco-67c43.firebasestorage.app",
    messagingSenderId: "333004443566",
    appId: "1:333004443566:web:de41f60000e418dce9023f",
    measurementId: "G-V7MF88Y5EE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allCards = [];
const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

if (isPWA) {
    const savedSchool = localStorage.getItem('pwa_school_id');
    if (savedSchool && !window.location.search.includes('ecole')) {
        const targetUrl = new URL('/', window.location.origin);
        targetUrl.searchParams.set('ecole', savedSchool);
        targetUrl.searchParams.set('from', 'pwa');
        targetUrl.searchParams.set('t', Date.now());
        window.location.href = targetUrl.toString();
        throw new Error('Redirection PWA');
    }
}

async function chargerEcoles() {
    const container = document.getElementById('schoolsList');
    try {
        const snapshot = await getDocs(collection(db, "ecoles"));
        if (snapshot.empty) {
            container.innerHTML = '<div class="error">⚠️ Aucune école trouvée</div>';
            updateStats(0, 0, 0);
            return;
        }
        let total = 0, active = 0, inactive = 0;
        const cardsData = [];
        let index = 0;
        for (const docSnap of snapshot.docs) {
            const ecole = docSnap.data();
            const prefixe = docSnap.id;
            const estActif = ecole.actif !== false;
            
            if (!estActif) {
                inactive++;
                continue;
            }
            
            total++;
            active++;
            index++;
            
            const nomSafe = (ecole.nom || prefixe || '').replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
            const villeSafe = (ecole.ville || '').replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
            
            cardsData.push({
                html: `
                    <div class="school-card" data-prefixe="${prefixe}" data-nom="${nomSafe.toLowerCase()}" data-ville="${villeSafe.toLowerCase()}" data-index="${index}">
                        <div class="school-top">
                            <div class="school-left">
                                <span class="school-number">${index}</span>
                                <div class="school-icon">🏛️</div>
                                <div>
                                    <div class="school-name">${nomSafe}</div>
                                    <div class="school-location">${villeSafe || 'Localisation non renseignée'}</div>
                                </div>
                            </div>
                            <span class="school-status status-active">● Actif</span>
                        </div>
                        <div class="school-center">
                            <div class="school-big-name">${nomSafe}</div>
                            <div class="school-big-sub">${villeSafe || '📍 Localisation non renseignée'}</div>
                        </div>
                        <div class="school-bottom">
                            <div class="school-meta">
                                <span class="code">📋 ${prefixe || '—'}</span>
                            </div>
                            <div class="btn-access">Accéder</div>
                        </div>
                    </div>
                `,
                prefixe: prefixe,
                nom: nomSafe.toLowerCase(),
                ville: villeSafe.toLowerCase(),
                actif: estActif
            });
        }
        updateStats(total, active, inactive);
        allCards = cardsData;
        renderCards(cardsData);
        setupSearch();
        setupClicks();
    } catch(error) {
        container.innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
        console.error(error);
    }
}

function renderCards(cards) {
    const container = document.getElementById('schoolsList');
    if (cards.length === 0) {
        container.innerHTML = '<div class="no-result">🔍 Aucun établissement disponible</div>';
        return;
    }
    container.innerHTML = cards.map(c => c.html).join('');
}

function updateStats(total, active, inactive) {
    document.getElementById('totalCount').textContent = total;
    document.getElementById('activeCount').textContent = active;
    document.getElementById('inactiveCount').textContent = inactive;
}

function setupSearch() {
    const input = document.getElementById('searchInput');
    const clear = document.getElementById('searchClear');
    input.addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        if (q.length > 0) {
            clear.style.display = 'block';
        } else {
            clear.style.display = 'none';
        }
        const filtered = allCards.filter(c => c.nom.includes(q) || c.ville.includes(q));
        renderCards(filtered);
        setupClicks();
    });
    clear.addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        this.style.display = 'none';
        renderCards(allCards);
        setupClicks();
        document.getElementById('searchInput').focus();
    });
}

function setupClicks() {
    document.querySelectorAll('.school-card').forEach(card => {
        card.addEventListener('click', function(e) {
            e.stopPropagation();
            const prefixe = this.getAttribute('data-prefixe');
            if (prefixe && prefixe !== 'null' && prefixe !== 'undefined') {
                localStorage.setItem('pwa_school_id', prefixe);
                localStorage.setItem('lastSchoolId', prefixe);
                const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                let targetUrl;
                if (isPWA) {
                    const baseUrl = new URL('/', window.location.origin);
                    baseUrl.searchParams.set('ecole', prefixe);
                    baseUrl.searchParams.set('from', 'pwa');
                    baseUrl.searchParams.set('t', Date.now());
                    targetUrl = baseUrl.toString();
                } else {
                    targetUrl = `/schooling?ecole=${encodeURIComponent(prefixe)}`;
                }
                window.location.href = targetUrl;
            }
        });
    });
}

chargerEcoles();
</script>
</body>
