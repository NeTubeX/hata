<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1120">
<title>Sélectionnez votre établissement</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0b1120;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0;color:#e8edf5;overflow-x:hidden}

/* HEADER FIXE COMME FACEBOOK */
.header-fixed{position:sticky;top:0;z-index:100;background:#0b1120;padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);width:100%}
.header{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{background:linear-gradient(145deg,#2563eb,#1a4cff);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.header-title{font-size:20px;font-weight:700;color:#f1f5f9;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px}
.header-title span{font-weight:400;color:#94a3b8;font-size:13px}
.btn-home{background:rgba(37,99,235,0.12);padding:8px 18px;border-radius:40px;font-size:13px;font-weight:500;color:#60a5fa;border:1px solid rgba(37,99,235,0.12);cursor:pointer;transition:all 0.2s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-home:hover{background:#2563eb;color:#fff;border-color:#2563eb}

/* BARRE DE RECHERCHE STYLE FACEBOOK */
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#64748b}
.search-input{width:100%;padding:12px 16px 12px 48px;border-radius:40px;border:1px solid rgba(255,255,255,0.06);background:#1a2234;font-size:15px;font-family:inherit;color:#f1f5f9;transition:all 0.25s}
.search-input:focus{outline:none;border-color:#3b82f6;background:#1e2a3f;box-shadow:0 0 0 4px rgba(59,130,246,0.08)}
.search-input::placeholder{color:#64748b}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.06);border:none;font-size:14px;color:#94a3b8;cursor:pointer;padding:4px 10px;display:none;border-radius:30px;transition:all 0.2s}
.search-clear:hover{color:#f1f5f9;background:rgba(255,255,255,0.1)}

/* STATS STYLE FACEBOOK */
.stats-fixed{position:sticky;top:0;z-index:99;background:#0b1120;padding:10px 0 14px;width:100%;backdrop-filter:blur(12px)}
.stats-row{display:flex;gap:12px;max-width:880px;margin:0 auto;padding:0 16px}
.stat-card{background:#1a2234;border-radius:16px;padding:10px 16px;flex:1;min-width:0;border:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:10px;transition:all 0.2s}
.stat-card:hover{background:#232e42;border-color:rgba(59,130,246,0.1)}
.stat-number{font-size:22px;font-weight:700;color:#f1f5f9;flex-shrink:0}
.stat-label{font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-green{background:#10b981;box-shadow:0 0 16px rgba(16,185,129,0.2)}
.dot-gray{background:#475569}

/* CONTENEUR PRINCIPAL */
.main-container{max-width:880px;width:100%;padding:0 16px 40px}

/* GRILLE EN CARRÉ FULL SCREEN STYLE FACEBOOK POST */
.schools-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:4px}

/* CARTE STYLE POST FACEBOOK - CARRÉ */
.school-card{background:linear-gradient(145deg,#1a2234,#161e2e);border-radius:20px;border:1px solid rgba(255,255,255,0.04);transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1);cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;aspect-ratio:1/1;padding:20px;justify-content:space-between}
.school-card::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1.5px;background:conic-gradient(from 0deg,transparent,#3b82f6,transparent,#8b5cf6,transparent,#3b82f6,transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:0;transition:opacity 0.5s}
.school-card:hover::before{opacity:1;animation:borderSpin 3s linear infinite}
@keyframes borderSpin{to{transform:rotate(360deg)}}

.school-card:hover{transform:translateY(-4px);border-color:rgba(59,130,246,0.15);background:linear-gradient(145deg,#1e2a3f,#1a2234);box-shadow:0 12px 48px rgba(0,0,0,0.5),0 0 60px rgba(37,99,235,0.03)}
.school-card:active{transform:scale(0.97)}

.school-card.hidden{display:none}

/* TOP DE LA CARTE - ICONE ET STATUT */
.school-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.school-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.school-number{display:flex;align-items:center;justify-content:center;background:rgba(37,99,235,0.12);color:#60a5fa;font-size:11px;font-weight:600;width:28px;height:28px;border-radius:50%;flex-shrink:0;border:1px solid rgba(37,99,235,0.08)}
.school-icon{background:linear-gradient(145deg,#2563eb,#1a4cff);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 4px 20px rgba(37,99,235,0.15)}
.school-name{font-size:16px;font-weight:600;color:#f1f5f9;letter-spacing:-0.1px;word-break:break-word;line-height:1.3}
.school-location{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:4px;margin-top:2px}
.school-location:before{content:"📍";font-size:10px}
.school-status{font-size:10px;padding:4px 14px;border-radius:30px;font-weight:500;white-space:nowrap;flex-shrink:0;margin-top:2px}
.status-active{background:rgba(16,185,129,0.1);color:#34d399;border:1px solid rgba(16,185,129,0.06)}

/* CENTRE - GRAND NOM DE L'ÉCOLE (STYLE POST FACEBOOK) */
.school-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 0}
.school-big-name{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.5px;line-height:1.2;background:linear-gradient(135deg,#f1f5f9,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.school-big-sub{font-size:14px;color:#64748b;margin-top:4px;display:flex;align-items:center;gap:6px}
.school-big-sub:before{content:"📍";font-size:12px}

/* BOTTOM - ACTIONS COMME FACEBOOK */
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.04);margin-top:auto}
.school-meta{font-size:11px;color:#64748b;display:flex;align-items:center;gap:6px}
.school-meta .code{background:rgba(255,255,255,0.04);padding:2px 10px;border-radius:20px;font-family:monospace;font-size:10px;color:#94a3b8}
.btn-access{background:linear-gradient(145deg,#2563eb,#1a4cff);border:none;padding:8px 24px;border-radius:40px;font-size:13px;font-weight:600;color:#fff;transition:all 0.3s;cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,0.15);display:flex;align-items:center;gap:6px}
.btn-access:after{content:"→";transition:transform 0.3s}
.school-card:hover .btn-access{box-shadow:0 6px 30px rgba(37,99,235,0.3);transform:scale(1.02)}
.school-card:hover .btn-access:after{transform:translateX(4px)}

/* ETATS */
.no-result{text-align:center;padding:80px 20px;color:#94a3b8;font-size:16px;grid-column:1/-1;background:linear-gradient(145deg,#1a2234,#161e2e);border-radius:24px;border:1px solid rgba(255,255,255,0.04)}
.loading{text-align:center;padding:80px 20px;color:#94a3b8;font-size:15px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:linear-gradient(145deg,#1a2234,#161e2e);border-radius:24px;border:1px solid rgba(255,255,255,0.04)}
.loading:before{content:"";width:28px;height:28px;border:3px solid rgba(59,130,246,0.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:60px 20px;color:#f87171;background:rgba(127,29,29,0.12);border-radius:24px;font-weight:500;border-left:4px solid #ef4444;grid-column:1/-1}

/* RESPONSIVE */
@media (max-width:680px){
.schools-grid{grid-template-columns:1fr;gap:14px}
.school-card{aspect-ratio:auto;min-height:240px;padding:16px}
.school-big-name{font-size:22px}
.school-icon{width:40px;height:40px;font-size:18px}
.header-title{font-size:17px}
.header-title span{font-size:11px}
.header-icon{width:38px;height:38px;font-size:17px}
.stat-card{padding:8px 12px}
.stat-number{font-size:18px}
.stat-label{font-size:11px}
.btn-home{padding:6px 14px;font-size:12px}
.search-input{padding:10px 14px 10px 44px;font-size:14px}
}

@media (max-width:420px){
.school-card{min-height:200px;padding:12px}
.school-big-name{font-size:18px}
.school-icon{width:36px;height:36px;font-size:15px}
.school-name{font-size:13px}
.school-number{width:24px;height:24px;font-size:10px}
.btn-access{padding:6px 16px;font-size:12px}
.stat-card{padding:6px 10px}
.stat-number{font-size:15px}
.stat-label{font-size:10px}
}

/* ANIMATION D'ENTRÉE DES CARTES */
.school-card{opacity:0;animation:cardFadeIn 0.5s cubic-bezier(0.2,0.9,0.4,1) forwards}
.school-card:nth-child(1){animation-delay:0.05s}
.school-card:nth-child(2){animation-delay:0.10s}
.school-card:nth-child(3){animation-delay:0.15s}
.school-card:nth-child(4){animation-delay:0.20s}
.school-card:nth-child(5){animation-delay:0.25s}
.school-card:nth-child(6){animation-delay:0.30s}
.school-card:nth-child(7){animation-delay:0.35s}
.school-card:nth-child(8){animation-delay:0.40s}
.school-card:nth-child(9){animation-delay:0.45s}
.school-card:nth-child(10){animation-delay:0.50s}

@keyframes cardFadeIn{
0%{opacity:0;transform:translateY(20px) scale(0.97)}
100%{opacity:1;transform:translateY(0) scale(1)}
}

/* SCROLLBAR STYLE */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0b1120}
::-webkit-scrollbar-thumb{background:#1a2234;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#2d3748}
</style>
</head>
<body>
<div class="header-fixed">
<div class="header">
<div class="header-top">
<div class="header-left">
<div class="header-icon">🏫</div>
<div class="header-title">Établissements <span>· sélection</span></div>
</div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
<div class="search-wrap">
<span class="search-icon">🔍</span>
<input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off">
<button class="search-clear" id="searchClear" aria-label="Effacer">✕</button>
</div>
</div>
</div>
<div class="main-container">
<div class="stats-fixed">
<div class="stats-row" id="statsRow">
<div class="stat-card"><span class="stat-number" id="totalCount">0</span><span class="stat-label">établissements</span></div>
<div class="stat-card"><span class="stat-dot dot-green"></span><span class="stat-number" id="activeCount">0</span><span class="stat-label">actifs</span></div>
<div class="stat-card"><span class="stat-dot dot-gray"></span><span class="stat-number" id="inactiveCount">0</span><span class="stat-label">inactifs</span></div>
</div>
</div>
<div class="schools-grid" id="schoolsList">
<div class="loading">Chargement des écoles…</div>
</div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
    authDomain: "gesco-67c43.firebaseapp.com",
    projectId: "gesco-67c43",
    storageBucket: "gesco-67c43.firebasestorage.app",
    messagingSenderId: "333004443566",
    appId: "1:333004443566:web:de41f60000e418dce9023f",
    measurementId: "G-V7MF88Y5EE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allCards = [];
const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

if (isPWA) {
    const savedSchool = localStorage.getItem('pwa_school_id');
    if (savedSchool && !window.location.search.includes('ecole')) {
        const targetUrl = new URL('/', window.location.origin);
        targetUrl.searchParams.set('ecole', savedSchool);
        targetUrl.searchParams.set('from', 'pwa');
        targetUrl.searchParams.set('t', Date.now());
        window.location.href = targetUrl.toString();
        throw new Error('Redirection PWA');
    }
}

async function chargerEcoles() {
    const container = document.getElementById('schoolsList');
    try {
        const snapshot = await getDocs(collection(db, "ecoles"));
        if (snapshot.empty) {
            container.innerHTML = '<div class="error">⚠️ Aucune école trouvée</div>';
            updateStats(0, 0, 0);
            return;
        }
        let total = 0, active = 0, inactive = 0;
        const cardsData = [];
        let index = 0;
        for (const docSnap of snapshot.docs) {
            const ecole = docSnap.data();
            const prefixe = docSnap.id;
            const estActif = ecole.actif !== false;
            
            if (!estActif) {
                inactive++;
                continue;
            }
            
            total++;
            active++;
            index++;
            
            const nomSafe = (ecole.nom || prefixe || '').replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
            const villeSafe = (ecole.ville || '').replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
            
            cardsData.push({
                html: `
                    <div class="school-card" data-prefixe="${prefixe}" data-nom="${nomSafe.toLowerCase()}" data-ville="${villeSafe.toLowerCase()}" data-index="${index}">
                        <div class="school-top">
                            <div class="school-left">
                                <span class="school-number">${index}</span>
                                <div class="school-icon">🏛️</div>
                                <div>
                                    <div class="school-name">${nomSafe}</div>
                                    <div class="school-location">${villeSafe || 'Localisation non renseignée'}</div>
                                </div>
                            </div>
                            <span class="school-status status-active">● Actif</span>
                        </div>
                        <div class="school-center">
                            <div class="school-big-name">${nomSafe}</div>
                            <div class="school-big-sub">${villeSafe || '📍 Localisation non renseignée'}</div>
                        </div>
                        <div class="school-bottom">
                            <div class="school-meta">
                                <span class="code">📋 ${prefixe || '—'}</span>
                            </div>
                            <div class="btn-access">Accéder</div>
                        </div>
                    </div>
                `,
                prefixe: prefixe,
                nom: nomSafe.toLowerCase(),
                ville: villeSafe.toLowerCase(),
                actif: estActif
            });
        }
        updateStats(total, active, inactive);
        allCards = cardsData;
        renderCards(cardsData);
        setupSearch();
        setupClicks();
    } catch(error) {
        container.innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
        console.error(error);
    }
}

function renderCards(cards) {
    const container = document.getElementById('schoolsList');
    if (cards.length === 0) {
        container.innerHTML = '<div class="no-result">🔍 Aucun établissement disponible</div>';
        return;
    }
    container.innerHTML = cards.map(c => c.html).join('');
}

function updateStats(total, active, inactive) {
    document.getElementById('totalCount').textContent = total;
    document.getElementById('activeCount').textContent = active;
    document.getElementById('inactiveCount').textContent = inactive;
}

function setupSearch() {
    const input = document.getElementById('searchInput');
    const clear = document.getElementById('searchClear');
    input.addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        if (q.length > 0) {
            clear.style.display = 'block';
        } else {
            clear.style.display = 'none';
        }
        const filtered = allCards.filter(c => c.nom.includes(q) || c.ville.includes(q));
        renderCards(filtered);
        setupClicks();
    });
    clear.addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        this.style.display = 'none';
        renderCards(allCards);
        setupClicks();
        document.getElementById('searchInput').focus();
    });
}

function setupClicks() {
    document.querySelectorAll('.school-card').forEach(card => {
        card.addEventListener('click', function(e) {
            e.stopPropagation();
            const prefixe = this.getAttribute('data-prefixe');
            if (prefixe && prefixe !== 'null' && prefixe !== 'undefined') {
                localStorage.setItem('pwa_school_id', prefixe);
                localStorage.setItem('lastSchoolId', prefixe);
                const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                let targetUrl;
                if (isPWA) {
                    const baseUrl = new URL('/', window.location.origin);
                    baseUrl.searchParams.set('ecole', prefixe);
                    baseUrl.searchParams.set('from', 'pwa');
                    baseUrl.searchParams.set('t', Date.now());
                    targetUrl = baseUrl.toString();
                } else {
                    targetUrl = `/schooling?ecole=${encodeURIComponent(prefixe)}`;
                }
                window.location.href = targetUrl;
            }
        });
    });
}

chargerEcoles();

(function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u')) {
            e.preventDefault();
            return false;
        }
    });
})();
</script>
</body>
</html>
