<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-primary:#0B1120;
  --bg-secondary:#0F172A;
  --bg-card:#111827;
  --bg-card-hover:#1E293B;
  --text-primary:#F8FAFC;
  --text-secondary:#94A3B8;
  --text-muted:#475569;
  --border-color:rgba(255,255,255,0.05);
  --border-hover:rgba(255,255,255,0.08);
  --blue:#4F46E5;
  --blue-dark:#4338CA;
  --blue-glow:rgba(79,70,229,0.3);
  --green:#22C55E;
  --green-glow:rgba(34,197,94,0.3);
  --orange:#F59E0B;
  --orange-glow:rgba(245,158,11,0.3);
  --red:#EF4444;
  --red-glow:rgba(239,68,68,0.3);
  --purple:#A78BFA;
  --purple-glow:rgba(167,139,250,0.3);
  --pink:#EC4899;
  --pink-glow:rgba(236,72,153,0.3);
  --gold:#FBBF24;
  --gold-glow:rgba(251,191,36,0.3);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --shadow-glow:0 8px 32px rgba(79,70,229,0.15);
  --transition:0.3s cubic-bezier(0.16,1,0.3,1);
  --sidebar-width:260px;
  --sidebar-collapsed:72px;
}
body{background:var(--bg-primary);font-family:'Inter',-apple-system,sans-serif;color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-card);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}
/* === SIDEBAR MODERN === */
.sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-right:1px solid rgba(255,255,255,0.05);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  transition:width 0.3s ease;
  z-index:100;
}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar.collapsed .sidebar-brand h1,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px;}
.sidebar.collapsed .nav-item svg{width:24px;height:24px;}
.sidebar-brand{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 8px 24px 8px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  margin-bottom:12px;
}
.sidebar-brand .logo{
  width:44px;
  height:44px;
  background:linear-gradient(145deg,var(--blue),var(--purple));
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:20px;
  color:#fff;
  flex-shrink:0;
  box-shadow:0 4px 16px var(--blue-glow);
}
.sidebar-brand h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#fff;}
.sidebar-brand h1 span{background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
/* === NAV ITEMS === */
.nav-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 16px;
  border-radius:var(--radius-sm);
  font-weight:500;
  font-size:13px;
  color:var(--text-secondary);
  transition:all 0.2s;
  cursor:pointer;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  position:relative;
}
.nav-item svg{
  width:20px;
  height:20px;
  stroke:#64748B;
  stroke-width:1.8;
  fill:none;
  flex-shrink:0;
  transition:stroke 0.2s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
.nav-item:hover svg{stroke:var(--text-primary);}
.nav-item.active{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;
  box-shadow:0 4px 20px var(--blue-glow);
}
.nav-item.active svg{stroke:#fff;}
.nav-item .badge-nav{
  margin-left:auto;
  font-size:10px;
  font-weight:600;
  padding:2px 12px;
  border-radius:40px;
  background:rgba(255,255,255,0.06);
  color:var(--text-secondary);
}
.nav-item.active .badge-nav{background:rgba(255,255,255,0.15);color:#fff;}
.nav-divider{height:1px;background:linear-gradient(90deg,var(--blue),transparent);margin:10px 0;}
.sidebar-toggle{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:8px 18px;
  color:var(--text-secondary);
  cursor:pointer;
  font-size:12px;
  transition:0.2s;
  display:flex;
  align-items:center;
  gap:8px;
}
.sidebar-toggle:hover{border-color:var(--border-hover);color:var(--text-primary);background:var(--bg-card-hover);}
/* === MAIN === */
.main{flex:1;min-width:0;padding:16px 28px 40px 28px;background:var(--bg-primary);}
/* === TOPBAR === */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:10px 0 20px 0;
  margin-bottom:20px;
  position:sticky;
  top:0;
  background:rgba(11,17,32,0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.04);
  z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-left .breadcrumb{color:var(--text-secondary);font-size:13px;}
.topbar-left .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-left h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,#fff,var(--text-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar-actions .search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:8px 18px;
  transition:0.2s;
  min-width:220px;
  position:relative;
}
.topbar-actions .search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow);}
.topbar-actions .search-box input{background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.topbar-actions .search-box input::placeholder{color:var(--text-muted);}
.topbar-actions .search-box .shortcut-badge{
  font-size:9px;
  color:var(--text-muted);
  background:rgba(255,255,255,0.06);
  padding:2px 10px;
  border-radius:4px;
  border:1px solid rgba(255,255,255,0.04);
  font-weight:600;
  letter-spacing:0.3px;
}
.topbar-actions .search-box svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;}
.btn-topbar{
  background:transparent;
  border:none;
  color:var(--text-secondary);
  cursor:pointer;
  padding:8px 14px;
  border-radius:40px;
  transition:0.2s;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:500;
}
.btn-topbar:hover{background:var(--bg-card);color:var(--text-primary);}
.btn-topbar svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn-topbar.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 4px 16px var(--blue-glow);}
.btn-topbar.primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--blue-glow);}
.school-selector-top{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:8px 18px;
  color:var(--text-primary);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  outline:none;
}
.school-selector-top:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow);}
.topbar-avatar{
  width:40px;
  height:40px;
  border-radius:40px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
  color:#fff;
  cursor:default;
  position:relative;
  box-shadow:0 0 20px var(--blue-glow);
}
.topbar-avatar::after{
  content:'';
  position:absolute;
  top:-2px;
  right:-2px;
  width:12px;
  height:12px;
  background:var(--green);
  border-radius:50%;
  border:2px solid var(--bg-primary);
  box-shadow:0 0 12px var(--green-glow);
}
/* === STATS CARDS MODERN === */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:18px 16px;
  transition:all 0.3s;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.stat-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  opacity:0;
  transition:opacity 0.3s;
}
.stat-card:hover::before{opacity:1;}
.stat-card:hover{
  border-color:var(--border-hover);
  background:var(--bg-card-hover);
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}
.stat-card .stat-icon{
  position:relative;
  z-index:1;
  margin-bottom:4px;
  font-size:28px;
}
.stat-card .stat-value{
  font-size:28px;
  font-weight:900;
  letter-spacing:-0.02em;
  line-height:1.2;
  position:relative;
  z-index:1;
}
.stat-card .stat-value .blue{color:var(--blue);}
.stat-card .stat-value .purple{color:var(--purple);}
.stat-card .stat-value .gold{color:var(--gold);}
.stat-card .stat-value .danger{color:var(--red);}
.stat-card .stat-value .green{color:var(--green);}
.stat-card .stat-value .orange{color:var(--orange);}
.stat-card .stat-value .pink{color:var(--pink);}
.stat-card .stat-label{
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-secondary);
  margin-top:4px;
  position:relative;
  z-index:1;
}
.stat-card .stat-trend{
  font-size:11px;
  font-weight:600;
  margin-top:4px;
  position:relative;
  z-index:1;
}
.stat-card .stat-trend.up{color:var(--green);}
.stat-card .stat-trend.down{color:var(--red);}
.stat-card .stat-trend.neutral{color:var(--text-muted);}
/* === TABS === */
.tabs-container{
  display:flex;
  gap:4px;
  background:var(--bg-card);
  padding:4px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-color);
  margin-bottom:20px;
  flex-wrap:wrap;
  position:sticky;
  top:72px;
  z-index:40;
  backdrop-filter:blur(8px);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs-container::-webkit-scrollbar{display:none;}
.tab-btn{
  background:transparent;
  border:none;
  padding:10px 20px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
  color:var(--text-secondary);
  cursor:pointer;
  transition:0.2s;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.04);}
.tab-btn.active{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;
  box-shadow:0 4px 16px var(--blue-glow);
}
.tab-content{display:none;animation:fadeSlide 0.3s ease;}
.tab-content.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
/* === CARDS === */
.card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:22px 24px;
  margin-bottom:16px;
  transition:0.3s;
}
.card:hover{border-color:var(--border-hover);}
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  flex-wrap:wrap;
  gap:10px;
}
.card-header h3{
  font-size:17px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}
.card-header h3 .count{
  background:var(--bg-primary);
  padding:0 16px;
  border-radius:40px;
  font-size:12px;
  font-weight:500;
  color:var(--text-secondary);
}
.card-header .actions{display:flex;gap:8px;}
/* === TABLES === */
.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);}
.excel-table{width:100%;border-collapse:collapse;font-size:13px;}
.excel-table thead tr{background:linear-gradient(135deg,#1a2a4a,#0f1f33);}
.excel-table th{
  padding:14px 18px;
  text-align:left;
  color:var(--gold);
  font-weight:600;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.6px;
  border-bottom:2px solid rgba(255,215,0,0.15);
  white-space:nowrap;
}
.excel-table td{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text-primary);vertical-align:middle;}
.excel-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.excel-table tr:hover td{background:rgba(255,255,255,0.04);}
.excel-table .col-center{text-align:center;}
.excel-table .col-right{text-align:right;}
/* === BADGES === */
.excel-table .badge-table{
  font-size:11px;
  font-weight:500;
  padding:4px 14px;
  border-radius:40px;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.excel-table .badge-table::before{
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
}
.excel-table .badge-table.active::before{background:var(--green);box-shadow:0 0 12px var(--green-glow);}
.excel-table .badge-table.inactive::before{background:var(--red);box-shadow:0 0 12px var(--red-glow);}
.excel-table .badge-table.exempted::before{background:var(--green);box-shadow:0 0 12px var(--green-glow);}
.excel-table .badge-table.dropout::before{background:var(--red);box-shadow:0 0 12px var(--red-glow);}
.excel-table .badge-table.partial::before{background:var(--orange);box-shadow:0 0 12px var(--orange-glow);}
.excel-table .badge-table.paid::before{background:var(--green);box-shadow:0 0 12px var(--green-glow);}
.excel-table .badge-table.regulier::before{background:var(--blue);box-shadow:0 0 12px var(--blue-glow);}
.excel-table .badge-table.exonere::before{background:var(--green);box-shadow:0 0 12px var(--green-glow);}
.excel-table .badge-table.listenoir::before{background:var(--orange);box-shadow:0 0 12px var(--orange-glow);}
.excel-table .badge-table.abandon::before{background:var(--red);box-shadow:0 0 12px var(--red-glow);}
.excel-table .badge-table.active{background:rgba(34,197,94,0.15);color:var(--green);}
.excel-table .badge-table.inactive{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.exempted{background:rgba(34,197,94,0.15);color:var(--green);}
.excel-table .badge-table.dropout{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.partial{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .badge-table.paid{background:rgba(34,197,94,0.15);color:var(--green);}
.excel-table .badge-table.regulier{background:rgba(79,70,229,0.15);color:var(--blue);}
.excel-table .badge-table.exonere{background:rgba(34,197,94,0.15);color:var(--green);}
.excel-table .badge-table.listenoir{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .badge-table.abandon{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .btn-icon-table{
  background:transparent;
  border:none;
  color:var(--text-secondary);
  cursor:pointer;
  padding:6px 10px;
  border-radius:6px;
  transition:0.2s;
  font-size:14px;
}
.excel-table .btn-icon-table:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
.excel-table .btn-icon-table.danger:hover{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .btn-icon-table.success:hover{background:rgba(34,197,94,0.15);color:var(--green);}
.excel-table .code-cell{font-family:monospace;color:var(--blue);font-size:13px;letter-spacing:1px;}
/* === FILTERS === */
.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filter-group{flex:1;min-width:120px;}
.filter-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:4px;}
.filter-group select,.filter-group input{
  width:100%;
  padding:8px 14px;
  border-radius:var(--radius-sm);
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-primary);
  font-size:13px;
  outline:none;
  transition:0.2s;
}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow);}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-pill{
  padding:6px 18px;
  border-radius:40px;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-secondary);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:0.2s;
}
.filter-pill:hover{border-color:var(--border-hover);color:var(--text-primary);}
.filter-pill.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:transparent;box-shadow:0 4px 16px var(--blue-glow);}
/* === LOGS & AUDIT === */
.log-item,.audit-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
  border-radius:var(--radius-sm);
  background:rgba(255,215,0,0.04);
  border-bottom:1px solid rgba(255,215,0,0.06);
  flex-wrap:wrap;
  gap:6px;
  transition:0.2s;
}
.log-item:hover,.audit-item:hover{background:rgba(255,215,0,0.08);}
.log-item .user,.audit-item .audit-user{font-weight:600;color:var(--gold);}
.log-item .action,.audit-item .audit-action{color:var(--gold);font-size:13px;}
.log-item .time,.audit-item .audit-time{color:#FCD34D;font-size:11px;}
.log-item .detail,.audit-item .audit-detail{color:#FDE68A;font-size:12px;}
.log-item .badge-log,.audit-item .badge-audit{
  font-size:10px;
  font-weight:600;
  padding:3px 12px;
  border-radius:40px;
}
.log-item .badge-log.success{background:rgba(34,197,94,0.15);color:var(--green);}
.log-item .badge-log.error{background:rgba(239,68,68,0.15);color:var(--red);}
.log-item .badge-log.warning{background:rgba(245,158,11,0.15);color:var(--orange);}
.log-item .badge-log.info{background:rgba(79,70,229,0.15);color:var(--blue);}
.audit-item .badge-audit.desactivation{background:rgba(239,68,68,0.15);color:var(--red);}
.audit-item .badge-audit.reactivation{background:rgba(34,197,94,0.15);color:var(--green);}
.audit-item .badge-audit.suppression{background:rgba(239,68,68,0.15);color:var(--red);}

.school-grid{

  gap:12px;
  margin-top:16px;
}
.school-card{
  background:rgba(15,23,42,0.7);
  border-radius:var(--radius-sm);
  padding:16px 18px;
  border:1px solid rgba(255,215,0,0.06);
  cursor:pointer;
  transition:all 0.3s;
  position:relative;
  overflow:hidden;
}
.school-card::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:0;
  height:3px;
  background:linear-gradient(90deg,var(--gold),var(--orange));
  transition:width 0.3s ease;
}
.school-card:hover::after{width:100%;}
.school-card:hover{

.school-card .row span{background:rgba(0,0,0,0.3);padding:3px 12px;border-radius:12px;}
/* === CHARTS === */
.chart-grid{

.chart-box{

.chart-box h4{

  font-weight:600;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  gap:8px;
}
.chart-box.full{grid-column:span 2;}
.chart-box canvas{max-height:280px;max-width:100%;}
/* === COMMUNICATION === */
.msg-bubble{

  border-radius:16px;
  font-size:14px;
  line-height:1.6;

}
.msg-right{

.msg-left{

.msg-left .msg-sender{color:var(--purple);font-weight:600;font-size:12px;}

.msg-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.msg-actions button{

  padding:4px 14px;
  border-radius:30px;
  font-size:11px;
  cursor:pointer;

}
.msg-actions button:hover{background:rgba(255,255,255,0.08);color:var(--text-primary);}
.msg-unread{border-left:4px solid var(--red);}
.messages-grid{

}

.send-form{

/* === TOAST === */
.toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:400px;}
.toast{
  background:var(--bg-card);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-left:4px solid var(--green);

  font-size:13px;
  color:var(--text-primary);
  position:relative;
  overflow:hidden;
}
.toast::after{
  content:'';

  bottom:0;
  left:0;
  height:3px;
  background:var(--green);
  width:0%;

}
.toast.error::after{background:var(--red);}
.toast.warning::after{background:var(--orange);}
@keyframes progressBar{from{width:100%;}to{width:0%;}}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:var(--red);}
.toast.warning{border-left-color:var(--orange);}

// === UTILITIES ===
function toast(message, type = "success") {
  const container = document.getElementById("toastContainer");
  if (!container) return;
  const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
  const titles = { success: "Success", error: "Error", warning: "Warning", info: "Info" };
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || "📢"}</div>
    <div class="toast-content">
      <div class="toast-title">${titles[type] || "Info"}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;
  container.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
  }, 3400);
}

function showConfirm(title, message) {
  return new Promise((resolve) => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmMessage").innerHTML = message;
    modal.classList.add("show");
    const yes = document.getElementById("confirmYes");
    const no = document.getElementById("confirmNo");
    const clean = () => { modal.classList.remove("show"); yes.removeEventListener("click", h); no.removeEventListener("click", n); };
    const h = () => { clean(); resolve(true); };
    const n = () => { clean(); resolve(false); };
    yes.addEventListener("click", h);

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m);
}

const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];

// === DATA LOADING ===
async function getAllSchools() {
  const schoolsRef = collection(db, "ecoles");
  const snap = await getDocs(schoolsRef);
  const schools = [];
  for (const docSnap of snap.docs) {
    const id = docSnap.id;
    const testRef = collection(db, "ecoles", id, "compta_eleves");
    const testSnap = await getDocs(testRef);
    if (testSnap.size > 0) schools.push(id);
  }
  return schools;
}

async function loadSchoolStats(schoolId) {
  const q = query(collection(db, "ecoles", schoolId, "compta_eleves"), where("_type", "==", "compta_eleve"));
  const snap = await getDocs(q);
  let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
  const eleves = [];
  for (const doc of snap.docs) {
    const d = doc.data();
    const eleve = { id: doc.id, ...d };
    if (d.abandon === true) {
      abandons++;
      eleve.statut = 'abandon';
      eleves.push(eleve);
      continue;
    }
    total++;
    if (d.sexe === 'M') garcons++;
    else if (d.sexe === 'F') filles++;
    if (d.exonere === true) {
      exoneres++;
      eleve.statut = 'exonere';
      eleves.push(eleve);
      continue;
    }
    let moisImpayes = 0;
    const paiements = d.paiements || {};
    const minerval = d.minerval || 45000;
    for (const m of moisListe) {
      const mt = paiements[m]?.montant || 0;
      if (mt < minerval) moisImpayes++;
    }
    if (moisImpayes >= 3) {
      listenoir++;
      eleve.statut = 'listenoir';
    } else {
      reguliers++;
      eleve.statut = 'regulier';
    }
    eleves.push(eleve);
  }
  return { total, garcons, filles, abandons, exoneres, reguliers, listenoir, eleves };
}

async function chargerProfs(ecoleId) {
  try {
    const snap = await getDocs(collection(db, `${ecoleId}_professeurs`));
    const p = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "prof") {
        p.push({ id: d.profId || ds.id, nom: d.nom || "Unknown", code: d.code || "0000", actif: d.actif !== false });
      }
    });
    return p;
  } catch(e) { return []; }
}

async function chargerFiches(ecoleId) {
  try {
    const snap = await getDocs(collection(db, `${ecoleId}_fiches`));
    const f = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (!d._type) f.push({ id: ds.id, ecoleId, ...d });
    });
    return f;
  } catch(e) { return []; }
}

async function chargerLogs(ecoleId, last = null, lim = 20) {
  try {
    let q = query(collection(db, `${ecoleId}_logs`), orderBy("date", "desc"), limit(lim));
    if (last) {
      const snapLast = await getDoc(doc(db, `${ecoleId}_logs`, last));
      if (snapLast.exists()) {
        q = query(collection(db, `${ecoleId}_logs`), orderBy("date", "desc"), startAfter(snapLast), limit(lim));
      }
    }
    const snap = await getDocs(q);
    const l = [];
    snap.forEach(ds => { l.push({ id: ds.id, ...ds.data() }); });
    return l;
  } catch(e) { return []; }
}

async function chargerAuditLogs() {
  try {
    const snap = await getDocs(collection(db, AUDIT_COLLECTION));
    const logs = [];
    snap.forEach(ds => { logs.push({ id: ds.id, ...ds.data() }); });
    logs.sort((a, b) => new Date(b.date) - new Date(a.date));
    return logs;
  } catch(e) { return []; }
}

async function chargerTout() {
  toutesFiches = []; tousProfs = []; tousEleves = []; tousLogs = [];
  let statsMap = {};
  for (const e of toutesEcoles) {
    const stats = await loadSchoolStats(e.id);
    statsMap[e.id] = stats;
    stats.eleves.forEach(el => {
      el.ecoleNom = e.nom || e.id;
      el.ecoleId = e.id;
    });
    tousEleves = tousEleves.concat(stats.eleves);
    const p = await chargerProfs(e.id);
    tousProfs = tousProfs.concat(p.map(p => ({ ...p, ecoleId: e.id, ecoleNom: e.nom || e.id })));
    const f = await chargerFiches(e.id);
    f.forEach(f => { f.ecoleNom = e.nom || e.id; });
    toutesFiches = toutesFiches.concat(f);
    const logs = await chargerLogs(e.id);
    logs.forEach(l => { l.ecoleId = e.id; l.ecoleNom = e.nom || e.id; });
    tousLogs = tousLogs.concat(logs);
  }
  let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
  for (const e of toutesEcoles) {
    const s = statsMap[e.id];
    if (s) {
      total += s.total;
      garcons += s.garcons;
      filles += s.filles;
      abandons += s.abandons;
      exoneres += s.exoneres;
      reguliers += s.reguliers;
      listenoir += s.listenoir;
    }
  }
  return { total, garcons, filles, abandons, exoneres, reguliers, listenoir };
}

  let members = tousEleves;
  if (currentSchoolFilter !== "all") members = members.filter(e => e.ecoleId === currentSchoolFilter);
  if (currentEleveFilter.classe) members = members.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) members = members.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) members = members.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") members = members.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") members = members.filter(e => e.abandon === true);

  return members;
}

  if (currentSchoolFilter !== "all") logs = logs.filter(l => l.ecoleId === currentSchoolFilter);
  if (!logs.length) {
    container.innerHTML = '<div class="card"><div class="card-header"><h3>📊 Logs</h3></div><div class="empty-state"><span class="empty-icon">📭</span>No logs found</div></div>';
    return;
  }
  let html = '<div class="card"><div class="card-header"><h3>📊 Logs <span class="count">'+logs.length+'</span></h3></div>';
  const actionMap = {
    connexion_reussie: "🟢 Login", creation_fiche: "📄 Create sheet",
    modification_fiche: "✏️ Edit", suppression_fiche: "🗑️ Delete",
    connexion: "🟢 Login", creation: "📄 Create",
    modification: "✏️ Edit", suppression: "🗑️ Delete"
  };
  for (const log of logs.slice(0, 50)) {
    const actionLabel = actionMap[log.action] || log.action;
    const badgeClass = log.action === "suppression" || log.action === "suppression_fiche" ? "error" :
      (log.action === "connexion" || log.action === "connexion_reussie" ? "success" :
      (log.action === "modification" || log.action === "modification_fiche" ? "warning" : "info"));
    html += `<div class="log-item">
      <div class="left">
        <span class="user">${log.utilisateur||"Unknown"}</span>
        <span class="action">${actionLabel}</span>
        ${log.details?.cours ? `<span class="detail">${log.details.cours} ${log.details.classe||""}</span>` : ""}
        <span class="time">${formatDate(log.date)}</span>
      </div>
      <span class="badge-log ${badgeClass}">${log.action||"action"}</span>
    </div>`;
  }
  if (logs.length > 50) html += `<div class="text-muted" style="text-align:center;padding:8px;">+ ${logs.length - 50} more logs</div>`;
  html += '</div>';
  container.innerHTML = html;
}

function renderAudit() {
  const container = document.getElementById("auditContainer");
  let audit = auditList;
  if (currentSchoolFilter !== "all") audit = audit.filter(a => a.details?.ecole === currentSchoolFilter || a.details?.school === currentSchoolFilter);
  if (!audit.length) {
    container.innerHTML = '<div class="card"><div class="card-header"><h3>📜 Audit</h3></div><div class="empty-state"><span class="empty-icon">📜</span>No records found</div></div>';
    return;
  }
  let html = '<div class="card"><div class="card-header"><h3>📜 Audit <span class="count">'+audit.length+'</span></h3></div>';
  const labels = { desactivation: '❌ Deactivation', reactivation: '✅ Reactivation', suppression: '🗑️ Deletion', modification: '✏️ Modification' };
  for (const a of audit.slice(0, 100)) {
    const badgeClass = a.action === 'desactivation' ? 'desactivation' : a.action === 'reactivation' ? 'reactivation' : a.action === 'suppression' ? 'suppression' : 'modification';
    html += `<div class="audit-item">
      <div class="left">
        <span class="audit-user">${a.utilisateur||"Unknown"}</span>
        <span class="audit-action">${labels[a.action] || a.action}</span>
        ${a.details ? `<span class="audit-detail">${JSON.stringify(a.details)}</span>` : ""}
        <span class="audit-time">${formatDate(a.date)}</span>
      </div>
      <span class="badge-audit ${badgeClass}">${a.action||"action"}</span>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderFlory() {
  const container = document.getElementById("floryContainer");
  let html = `
    <div class="dashboard-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-header">
          <h3>💬 Communication</h3>
          <button class="btn outline sm" id="markAllReadFlory">✅ Mark all read</button>
        </div>
        <div id="floryMessagesGrid" class="messages-grid">
          ${floryMessages.length === 0 ? '<div class="empty-state"><span class="empty-icon">💬</span>No messages</div>' : ''}
        </div>
      </div>
      <div class="card">
        <div class="send-form" style="border:none;border-radius:0;background:transparent;margin-top:0;">
          <div class="send-header">✏️ Send message to Ursule Nyandji</div>
          <div class="send-body">
            <textarea id="floryMessage" rows="3" placeholder="Write your message..."></textarea>
            <button id="sendFloryBtn" class="btn-send">📤 SEND</button>
          </div>
        </div>
      </div>
    </div>
  `;
  container.innerHTML = html;

  const grid = document.getElementById('floryMessagesGrid');
  if (floryMessages.length > 0) {
    grid.innerHTML = '';
    floryMessages.forEach(msg => {
      const date = new Date(msg.date).toLocaleString('en-US');
      const isFlory = msg.sender === "flory" || msg.nom === "Flory";
      const isUrsule = msg.sender === "ursule" || msg.nom === "Ursule Nyandji";
      const unread = isUrsule && !getFloryReadMessages().includes(msg.id);
      const div = document.createElement('div');
      div.className = `msg-bubble ${isFlory ? 'msg-right' : 'msg-left'}${unread ? ' msg-unread' : ''}`;
      div.innerHTML = `
        <span class="msg-sender">${isFlory ? '👤 Flory (Me)' : '👩 Ursule Nyandji'}</span>
        ${unread ? '<span style="font-size:10px;background:#ef4444;color:white;padding:2px 10px;border-radius:30px;margin-left:6px;">🔴 UNREAD</span>' : ''}
        <div>${escapeHtml(msg.message || '')}</div>
        <span class="msg-time">${date}</span>
        <div class="msg-actions">
          <button class="btn-copy-msg" data-msg="${escapeHtml(msg.message || '')}">📋 Copy</button>
          ${isUrsule && unread ? `<button class="btn-mark-read" data-id="${msg.id}">✅ Mark read</button>` : ''}
          <button class="btn-delete-msg" data-id="${msg.id}" data-type="flory">🗑️</button>
        </div>
      `;
      grid.appendChild(div);
      div.querySelector('.btn-copy-msg')?.addEventListener('click', () => {
        navigator.clipboard.writeText(msg.message || '');
        toast("Copied", 'success');
      });
      div.querySelector('.btn-mark-read')?.addEventListener('click', () => {
        const list = getFloryReadMessages();
        if (!list.includes(msg.id)) { list.push(msg.id); saveFloryReadMessages(list); renderFlory(); }
      });
      div.querySelector('.btn-delete-msg')?.addEventListener('click', async () => {
        if (await showConfirm('Delete', 'Delete this message?')) {
          try {
            const toRemove = floryMessages.find(m => m.id === msg.id);
            if (toRemove) {
              await updateDoc(floryDocRef, { messages: arrayRemove(toRemove) });
              floryMessages = floryMessages.filter(m => m.id !== msg.id);
              renderFlory();
              toast("Message deleted", 'success');
            }
          } catch(e) { toast("Error: " + e.message, "error"); }
        }
      });
    });
    grid.scrollTop = grid.scrollHeight;
  }

  document.getElementById('markAllReadFlory')?.addEventListener('click', () => {
    const unreadIds = floryMessages.filter(m => m.sender === "ursule" && !getFloryReadMessages().includes(m.id)).map(m => m.id);
    const list = getFloryReadMessages();
    unreadIds.forEach(id => { if (!list.includes(id)) list.push(id); });
    saveFloryReadMessages(list);
    renderFlory();
    toast("All marked as read", 'success');
  });

  document.getElementById('sendFloryBtn')?.addEventListener('click', async () => {
    const textarea = document.getElementById('floryMessage');
    const msg = textarea.value.trim();
    if (!msg) { toast("Message is empty", 'warning'); return; }
    const newMsg = {
      id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
      nom: "Flory",
      message: msg,
      date: new Date().toISOString(),
      sender: "flory",
      type: "new_message"
    };
    try {
      await updateDoc(floryDocRef, { messages: arrayUnion(newMsg) });
      textarea.value = '';
      toast("Message sent to Ursule Nyandji", 'success');
      renderFlory();
    } catch(e) {
      floryMessages = [...floryMessages, newMsg];
      renderFlory();
      toast("Message queued (offline)", 'warning');
    }
  });
}

function renderParental() {
  const container = document.getElementById("parentalContainer");
  const codes = new Map();
  tousEleves.forEach(e => {
    if (e.parentCode && e.statut !== 'abandon') {
      if (!codes.has(e.parentCode)) codes.set(e.parentCode, []);
      codes.get(e.parentCode).push(e);
    }
  });
  let html = `
    <div class="card">
      <div class="card-header"><h3>👨‍👩‍👧‍👦 Parental Space</h3></div>
      <div class="filter-row">
        <div class="filter-group"><label>🔍 Parent Code</label><input type="text" id="searchParentCode" placeholder="6 digits" maxlength="6"></div>
        <div class="filter-group" style="flex:0.5;"><button class="btn primary" id="searchParentBtn" style="width:100%;">🔍 Search</button></div>
      </div>
      <div id="parentalResult"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>📊 Parental Statistics</h3></div>
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card"><div class="stat-value"><span class="blue">${codes.size}</span></div><div class="stat-label">Families</div></div>
        <div class="stat-card"><div class="stat-value"><span class="purple">${tousEleves.filter(e => e.parentCode && e.statut !== 'abandon').length}</span></div><div class="stat-label">With code</div></div>
        <div class="stat-card"><div class="stat-value"><span class="danger">${tousEleves.filter(e => !e.parentCode && e.statut !== 'abandon').length}</span></div><div class="stat-label">Without code</div></div>
        <div class="stat-card"><div class="stat-value"><span class="green">${[...codes.values()].filter(f => f.length > 1).length}</span></div><div class="stat-label">Multi-children</div></div>
      </div>
    </div>
  `;
  container.innerHTML = html;

  document.getElementById("searchParentBtn").onclick = function() {
    const code = document.getElementById("searchParentCode").value.trim();
    const resultDiv = document.getElementById("parentalResult");
    if (!code || code.length !== 6) {
      resultDiv.innerHTML = '<div class="empty-state">🔑 Enter a valid parent code (6 digits)</div>';
      return;
    }
    const enfants = codes.get(code) || [];
    if (enfants.length === 0) {
      resultDiv.innerHTML = `<div class="empty-state">🔑 No student found with code ${code}</div>`;
      return;
    }
    let html = `<div style="background:rgba(79,70,229,0.08);border-radius:12px;padding:18px;border-left:3px solid var(--blue);margin-top:12px;">
      <div style="font-weight:700;font-size:16px;color:var(--gold);">🔑 Code ${code} - ${enfants.length} child(ren)</div>`;
    for (const e of enfants) {
      const sexe = e.sexe === "F" ? "👩" : "👨";
      html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;">
        <span>${sexe} ${e.nom} ${e.postnom||""} ${e.prenom||""}</span>
        <span>📚 ${e.classe||""} ${e.option?"("+e.option+")":""}</span>
        <span>🏫 ${e.ecoleNom||""}</span>
      </div>`;
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  };
}

// === FIREBASE LISTENERS ===
function listenToFlory() {
  if (unsubscribeFlory) unsubscribeFlory();
  unsubscribeFlory = onSnapshot(floryDocRef, snap => {
    if (snap.exists()) {
      const data = snap.data();
      floryMessages = (data.messages || []).sort((a,b) => new Date(a.date) - new Date(b.date));
      if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
    }
  }, () => {});
}

// === GLOBAL FUNCTIONS ===
window.supprimerProfesseur = async function(ecoleId, profId, profNom) {
  if (await showConfirm("Delete Teacher", `Delete <strong>${profNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try {
      await deleteDoc(doc(db, `${ecoleId}_professeurs`, profId));
      toast(`Teacher ${profNom} deleted`, "success");
      await rafraichir();
    } catch(e) { toast("Error: " + e.message, "error"); }
  }
};

window.supprimerFiche = async function(ecoleId, ficheId, ficheNom) {
  if (await showConfirm("Delete Sheet", `Delete sheet <strong>${ficheNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try {
      await deleteDoc(doc(db, `${ecoleId}_fiches`, ficheId));
      toast(`Sheet ${ficheNom} deleted`, "success");
      await rafraichir();
    } catch(e) { toast("Error: " + e.message, "error"); }
  }
};

window.showSchoolEleves = function(schoolId) {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.querySelector('[data-tab="members"]').classList.add("active");
  document.getElementById("membersContainer").classList.add("active");
  document.getElementById("schoolFilter").value = schoolId;
  currentSchoolFilter = schoolId;
  renderMembers();
  renderEcoles();
  renderProfs();
  renderFiches();
  renderLogs();
  renderAudit();
  renderParental();
  toast(`👥 Students of ${schoolId.replace(/_/g, ' ')}`, "info");
};

window.rafraichir = async function() {
  const btn = document.getElementById('syncBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '⏳ Syncing...';
  btn.disabled = true;
  await chargerEcoles();
  await initSchoolSelect();
  const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
  updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
  auditList = await chargerAuditLogs();
  renderEcoles();
  renderProfs();
  renderFiches();
  renderMembers();
  renderLogs();
  renderAudit();
  renderParental();
  if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
  if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  btn.innerHTML = '✅ Synced';
  setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 1000);
  toast("Data refreshed", "info");
};

// === SETUP ===
function setupTabs() {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(el => {
    el.addEventListener("click", function() {
      const target = this.dataset.tab;
      if (!target) return;
      document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      const container = document.getElementById(target + "Container");
      if (container) container.classList.add("active");
      if (target === "dashboard") renderDashboard();
      else if (target === "members") renderMembers();
      else if (target === "logs") renderLogs();
      else if (target === "audit") renderAudit();
      else if (target === "flory") renderFlory();
      else if (target === "ecoles") renderEcoles();
      else if (target === "profs") renderProfs();
      else if (target === "fiches") renderFiches();
      else if (target === "parental") renderParental();
      document.getElementById("breadcrumb").textContent = this.textContent.trim();
      document.getElementById("pageTitle").textContent = this.textContent.trim();
    });
  });
}

function setupSchoolFilter() {
  document.getElementById("schoolFilter").addEventListener("change", function() {
    currentSchoolFilter = this.value;
    renderEcoles();
    renderProfs();
    renderFiches();
    renderLogs();
    renderAudit();
    renderMembers();
    renderParental();
    if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
    if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  });
}

async function initSchoolSelect() {
  const select = document.getElementById("schoolFilter");
  select.innerHTML = '<option value="all">🌍 All Schools</option>';
  toutesEcoles.forEach(e => { select.innerHTML += `<option value="${e.id}">🏫 ${e.nom||e.id}</option>`; });
}

async function chargerEcoles() {
  try {
    const schools = await getAllSchools();
    toutesEcoles = schools.map(id => ({ id, nom: id.replace(/_/g, ' ') }));
    return toutesEcoles;
  } catch(e) { toast("Error loading schools", "error"); return []; }
}

// === KEYBOARD SHORTCUTS ===
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('globalSearch')?.focus();
    toast("🔍 Global search", "info");
  }
  if (e.key === 'Escape') {
    document.getElementById('globalSearch')?.blur();
  }
});

// === SIDEBAR TOGGLE ===
document.getElementById("sidebarToggle")?.addEventListener("click", function() {
  document.getElementById("sidebar").classList.toggle("collapsed");
  const isCollapsed = document.getElementById("sidebar").classList.contains("collapsed");
  this.innerHTML = isCollapsed ? '▶ <span>Expand</span>' : '◀ <span>Collapse</span>';
});

// === INIT ===
(async function init() {
  try {
    await chargerEcoles();
    await initSchoolSelect();
    const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
    updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
    auditList = await chargerAuditLogs();
    listenToFlory();
    renderDashboard();
    renderEcoles();
    renderProfs();
    renderFiches();
    renderMembers();
    renderLogs();
    renderAudit();
    renderParental();
    setupTabs();
    setupSchoolFilter();
    toast("🚀 Dashboard ready", "success");
  } catch(e) {
    document.getElementById("dashboardContainer").innerHTML = `
      <div class="empty-state" style="color:var(--red);">
        <span class="empty-icon">❌</span>
        Error: ${e.message}
        <br><button class="btn primary" onclick="window.rafraichir()" style="margin-top:16px;">🔄 Retry</button>
      </div>
    `;
    toast("Loading error", "error");
  }
})();
</script>
