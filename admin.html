<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
body{background:var(--bg-primary);font-family:'Inter',-apple-system,sans-serif;color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden;}
:root{
  --bg-primary:#0B1120;
  --bg-secondary:#0F172A;
  --bg-card:#111827;
  --bg-card-hover:#1E293B;
  --text-primary:#F8FAFC;
  --text-secondary:#94A3B8;
  --text-muted:#475569;
  --border-color:rgba(255,255,255,0.05);
  --border-hover:rgba(255,255,255,0.08);
  --blue:#3B82F6;
  --blue-dark:#2563EB;
  --green:#10B981;
  --orange:#F59E0B;
  --red:#EF4444;
  --purple:#A78BFA;
  --gold:#FBBF24;
  --pink:#EC4899;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(0,0,0,0.4);
  --transition:0.2s cubic-bezier(0.16,1,0.3,1);
  --sidebar-width:260px;
  --sidebar-collapsed:72px;
}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-card);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}
.sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  background:rgba(26,26,46,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  transition:width 0.3s ease;
  z-index:100;
}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar.collapsed .sidebar-brand h1,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item svg{width:24px;height:24px;}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px 8px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:8px;flex-shrink:0;}
.sidebar-brand .logo{width:40px;height:40px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;}
.sidebar-brand .brand-text{display:flex;flex-direction:column;}
.sidebar-brand h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#fff;line-height:1.2;}
.sidebar-brand h1 span{background:linear-gradient(135deg,#3B82F6,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sidebar-brand .subtitle{font-size:8px;color:var(--text-muted);letter-spacing:0.5px;font-weight:400;margin-top:-2px;}
.nav-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;color:var(--text-secondary);transition:all 0.15s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;position:relative;flex-shrink:0;}
.nav-item svg{width:20px;height:20px;stroke:#64748B;stroke-width:1.8;fill:none;flex-shrink:0;transition:stroke 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:var(--text-primary);}
.nav-item:hover svg{stroke:var(--text-primary);}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,0.25);}
.nav-item.active svg{stroke:#fff;}
.nav-item .badge-nav{margin-left:auto;font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;background:rgba(255,255,255,0.06);color:var(--text-secondary);}
.nav-item.active .badge-nav{background:rgba(255,255,255,0.15);color:#fff;}
.nav-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 0;flex-shrink:0;}
.sidebar-bottom{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.sidebar-toggle{background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 14px;color:var(--text-secondary);cursor:pointer;font-size:12px;transition:0.15s;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;flex-shrink:0;}
.sidebar-toggle:hover{border-color:var(--border-hover);color:var(--text-primary);}
.sidebar-bottom .netubex-brand{font-size:9px;color:var(--text-muted);text-align:center;letter-spacing:0.5px;padding:4px 0;}
.main{flex:1;min-width:0;padding:16px 24px 40px 24px;background:var(--bg-primary);}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:8px 0 16px 0;
  margin-bottom:20px;
  position:sticky;
  top:0;
  background:rgba(11,17,32,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 20px rgba(0,0,0,0.3);
  border-bottom:1px solid rgba(255,255,255,0.04);
  z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-left .breadcrumb{color:var(--text-secondary);font-size:13px;}
.topbar-left .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-left h2{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-actions .search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:6px 16px;
  transition:0.15s;
  min-width:200px;
  position:relative;
}
.topbar-actions .search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.topbar-actions .search-box input{background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.topbar-actions .search-box input::placeholder{color:var(--text-muted);}
.topbar-actions .search-box .shortcut-badge{
  font-size:9px;
  color:var(--text-muted);
  background:rgba(255,255,255,0.06);
  padding:2px 8px;
  border-radius:4px;
  border:1px solid rgba(255,255,255,0.04);
  font-weight:600;
  letter-spacing:0.3px;
}
.topbar-actions .search-box svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;}
.btn-topbar{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:40px;transition:0.15s;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
.btn-topbar:hover{background:var(--bg-card);color:var(--text-primary);}
.btn-topbar svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn-topbar.primary{background:var(--blue);color:#fff;}
.btn-topbar.primary:hover{background:var(--blue-dark);}
.school-selector-top{background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;color:var(--text-primary);font-size:13px;font-weight:500;cursor:pointer;outline:none;}
.school-selector-top:focus{border-color:var(--blue);}
.topbar-avatar{
  width:36px;
  height:36px;
  border-radius:40px;
  background:var(--bg-card);
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:13px;
  color:var(--text-primary);
  cursor:default;
  position:relative;
}
.topbar-avatar::after{
  content:'';
  position:absolute;
  top:-2px;
  right:-2px;
  width:10px;
  height:10px;
  background:var(--green);
  border-radius:50%;
  border:2px solid var(--bg-primary);
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:14px 12px;
  transition:all 0.2s;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.stat-card:hover{border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card .stat-icon{position:relative;z-index:1;margin-bottom:2px;color:var(--blue);}
.stat-card .stat-icon svg{width:22px;height:22px;stroke-width:1.8;}
.stat-card::before{
  content:'';
  position:absolute;
  right:-10px;
  bottom:-10px;
  font-size:60px;
  opacity:0.04;
  pointer-events:none;
  z-index:0;
}
.stat-card:nth-child(1)::before{content:'📊';}
.stat-card:nth-child(2)::before{content:'👨';}
.stat-card:nth-child(3)::before{content:'👩';}
.stat-card:nth-child(4)::before{content:'⚠️';}
.stat-card:nth-child(5)::before{content:'⭐';}
.stat-card:nth-child(6)::before{content:'✅';}
.stat-card:nth-child(7)::before{content:'🚫';}
.stat-card:nth-child(8)::before{content:'💰';}
.stat-card .stat-value{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;position:relative;z-index:1;}
.stat-card .stat-value .blue{color:var(--blue);}
.stat-card .stat-value .purple{color:var(--purple);}
.stat-card .stat-value .gold{color:var(--gold);}
.stat-card .stat-value .danger{color:var(--red);}
.stat-card .stat-value .green{color:var(--green);}
.stat-card .stat-value .orange{color:var(--orange);}
.stat-card .stat-value .pink{color:var(--pink);}
.stat-card .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);margin-top:2px;position:relative;z-index:1;}
.stat-card .stat-sub{font-size:10px;color:var(--text-muted);margin-top:2px;position:relative;z-index:1;}
.stat-card .stat-locked{font-size:11px;color:var(--orange);background:rgba(245,158,11,0.1);padding:2px 10px;border-radius:30px;display:inline-block;margin-top:4px;border:1px solid rgba(245,158,11,0.15);cursor:pointer;}
.stat-card .stat-locked:hover{background:rgba(245,158,11,0.2);}
.tabs-container{
  display:flex;
  gap:4px;
  background:var(--bg-card);
  padding:4px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-color);
  margin-bottom:20px;
  flex-wrap:wrap;
  position:sticky;
  top:68px;
  z-index:40;
  backdrop-filter:blur(8px);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs-container::-webkit-scrollbar{display:none;}
.tab-btn{
  background:transparent;
  border:none;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
  color:var(--text-secondary);
  cursor:pointer;
  transition:0.15s;
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.04);}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.2);}
.tab-content{display:none;animation:fadeSlide 0.25s ease;}
.tab-content.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:0.2s;}
.card:hover{border-color:var(--border-hover);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;}
.card-header h3 .count{background:var(--bg-primary);padding:0 14px;border-radius:40px;font-size:12px;font-weight:500;color:var(--text-secondary);}
.card-header .actions{display:flex;gap:6px;}
.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);}
.excel-table{width:100%;border-collapse:collapse;font-size:13px;}
.excel-table thead tr{background:linear-gradient(135deg,#1a2a4a,#0f1f33);}
.excel-table th{padding:12px 16px;text-align:left;color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid rgba(255,215,0,0.15);white-space:nowrap;}
.excel-table td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text-primary);vertical-align:middle;}
.excel-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.excel-table tr:hover td{background:rgba(255,255,255,0.04);}
.excel-table .col-center{text-align:center;}
.excel-table .col-right{text-align:right;}
.excel-table .badge-table{
  font-size:11px;
  font-weight:500;
  padding:3px 12px;
  border-radius:40px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.excel-table .badge-table::before{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block;
}
.excel-table .badge-table.active::before{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,0.4);}
.excel-table .badge-table.inactive::before{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.4);}
.excel-table .badge-table.exempted::before{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,0.4);}
.excel-table .badge-table.dropout::before{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.4);}
.excel-table .badge-table.partial::before{background:var(--orange);box-shadow:0 0 8px rgba(245,158,11,0.4);}
.excel-table .badge-table.paid::before{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,0.4);}
.excel-table .badge-table.regulier::before{background:var(--blue);box-shadow:0 0 8px rgba(59,130,246,0.4);}
.excel-table .badge-table.exonere::before{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,0.4);}
.excel-table .badge-table.listenoir::before{background:var(--orange);box-shadow:0 0 8px rgba(245,158,11,0.4);}
.excel-table .badge-table.abandon::before{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.4);}
.excel-table .badge-table.active{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.inactive{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.exempted{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.dropout{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.partial{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .badge-table.paid{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.regulier{background:rgba(59,130,246,0.15);color:var(--blue);}
.excel-table .badge-table.exonere{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.listenoir{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .badge-table.abandon{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .btn-icon-table{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px;transition:0.15s;font-size:14px;}
.excel-table .btn-icon-table:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
.excel-table .btn-icon-table.danger:hover{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .btn-icon-table.success:hover{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .btn-icon-table.warning:hover{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .code-cell{font-family:monospace;color:var(--blue);font-size:13px;letter-spacing:1px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filter-group{flex:1;min-width:120px;}
.filter-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:4px;}
.filter-group select,.filter-group input{width:100%;padding:6px 12px;border-radius:var(--radius-sm);background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-primary);font-size:13px;outline:none;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-pill{
  padding:4px 14px;
  border-radius:40px;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-secondary);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:0.15s;
}
.filter-pill:hover{border-color:var(--border-hover);color:var(--text-primary);}
.filter-pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,215,0,0.05);border-bottom:1px solid rgba(255,215,0,0.08);flex-wrap:wrap;gap:6px;}
.log-item .user{font-weight:600;color:var(--gold);}
.log-item .action{color:var(--gold);font-size:13px;}
.log-item .time{color:#FCD34D;font-size:11px;}
.log-item .detail{color:#FDE68A;font-size:12px;}
.log-item .badge-log{font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;}
.log-item .badge-log.success{background:rgba(255,215,0,0.2);color:var(--gold);}
.log-item .badge-log.error{background:rgba(255,215,0,0.15);color:#FBBF24;}
.log-item .badge-log.warning{background:rgba(255,215,0,0.15);color:#FCD34D;}
.log-item .badge-log.info{background:rgba(255,215,0,0.15);color:#FDE68A;}
.audit-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,215,0,0.05);border-bottom:1px solid rgba(255,215,0,0.08);flex-wrap:wrap;gap:6px;}
.audit-item .audit-user{font-weight:600;color:var(--gold);}
.audit-item .audit-action{color:var(--gold);font-size:13px;}
.audit-item .audit-time{color:#FCD34D;font-size:11px;}
.audit-item .audit-detail{color:#FDE68A;font-size:12px;}
.audit-item .badge-audit{font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;}
.audit-item .badge-audit.desactivation{background:rgba(255,215,0,0.15);color:#FBBF24;}
.audit-item .badge-audit.reactivation{background:rgba(255,215,0,0.2);color:var(--gold);}
.audit-item .badge-audit.suppression{background:rgba(255,215,0,0.15);color:#FCD34D;}
.audit-item .badge-audit.modification{background:rgba(255,215,0,0.15);color:#FDE68A;}
.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:16px;}
.school-card{
  background:rgba(15,23,42,0.7);
  border-radius:8px;
  padding:12px 14px;
  border:1px solid rgba(255,215,0,0.06);
  cursor:pointer;
  transition:all 0.3s;
  position:relative;
  overflow:hidden;
}
.school-card::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:0;
  height:2px;
  background:var(--gold);
  transition:width 0.3s ease;
}
.school-card:hover::after{width:100%;}
.school-card:hover{background:rgba(15,23,42,0.9);border-color:rgba(255,215,0,0.2);}

function toast(m, t = "success") {
  const c = document.getElementById("toastContainer");

  const ic = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };

  const el = document.createElement("div");

}

function showConfirm(t, m) {
  return new Promise((resolve) => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    document.getElementById("confirmTitle").textContent = t;
    document.getElementById("confirmMessage").innerHTML = m;
    modal.classList.add("show");
    const yes = document.getElementById("confirmYes");
    const no = document.getElementById("confirmNo");
    const clean = () => { modal.classList.remove("show"); yes.removeEventListener("click", h); no.removeEventListener("click", n); };
    const h = () => { clean(); resolve(true); };
    const n = () => { clean(); resolve(false); };
    yes.addEventListener("click", h);
    no.addEventListener("click", n);
  });
}

async function getAllSchools() {
    const schoolsRef = collection(db, "ecoles");
    const snap = await getDocs(schoolsRef);
    const schools = [];
    for (const docSnap of snap.docs) {
        const id = docSnap.id;
        const testRef = collection(db, "ecoles", id, "compta_eleves");
        const testSnap = await getDocs(testRef);
        if (testSnap.size > 0) {
            schools.push(id);
        }
    }
    return schools;
}

async function loadSchoolStats(schoolId) {
    const q = query(collection(db, "ecoles", schoolId, "compta_eleves"), where("_type", "==", "compta_eleve"));
    const snap = await getDocs(q);
    let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
    const eleves = [];
    for (const doc of snap.docs) {
        const d = doc.data();
        const eleve = { id: doc.id, ...d };
        if (d.abandon === true) { abandons++; eleve.statut = 'abandon'; eleves.push(eleve); continue; }
        total++;
        if (d.sexe === 'M') garcons++;
        else if (d.sexe === 'F') filles++;
        if (d.exonere === true) { exoneres++; eleve.statut = 'exonere'; eleves.push(eleve); continue; }
        let moisImpayes = 0;
        const paiements = d.paiements || {};
        const minerval = d.minerval || 45000;
        for (const m of moisListe) {
            const mt = paiements[m]?.montant || 0;
            if (mt < minerval) moisImpayes++;
        }
        if (moisImpayes >= 3) { listenoir++; eleve.statut = 'listenoir'; } 
        else { reguliers++; eleve.statut = 'regulier'; }
        eleves.push(eleve);
    }
    return { total, garcons, filles, abandons, exoneres, reguliers, listenoir, eleves };
}

async function chargerEcoles() {
  try {
    const schools = await getAllSchools();
    toutesEcoles = schools.map(id => ({ id, nom: id.replace(/_/g, ' ') }));
    return toutesEcoles;
  } catch(e) { toast("Error loading schools", "error"); return []; }
}

async function chargerProfs(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_professeurs`));
    const p = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "prof") {
        p.push({ id: d.profId || ds.id, nom: d.nom || "Unknown", code: d.code || "0000", actif: d.actif !== false });
      }
    });
    return p;
  } catch(e) { return []; }
}

async function chargerFiches(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_fiches`));
    const f = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (!d._type) {
        f.push({ id: ds.id, ecoleId: e, ...d });
      }
    });
    return f;
  } catch(e) { return []; }
}

async function chargerLogs(e, last = null, lim = 20) {
  try {
    let q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), limit(lim));
    if (last) {
      const snapLast = await getDoc(doc(db, `${e}_logs`, last));
      if (snapLast.exists()) {
        q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), startAfter(snapLast), limit(lim));
      }
    }
    const snap = await getDocs(q);
    const l = [];
    snap.forEach(ds => { l.push({ id: ds.id, ...ds.data() }); });
    return l;
  } catch(e) { return []; }
}

async function chargerAuditLogs() {
  try {
    const snap = await getDocs(collection(db, "audit_logs"));
    const logs = [];
    snap.forEach(ds => { logs.push({ id: ds.id, ...ds.data() }); });
    logs.sort((a, b) => new Date(b.date) - new Date(a.date));
    return logs;
  } catch(e) { return []; }
}

async function chargerTout() {
  toutesFiches = []; tousProfs = []; tousEleves = []; tousLogs = [];
  let statsMap = {};
  for (const e of toutesEcoles) {
    const stats = await loadSchoolStats(e.id);
    statsMap[e.id] = stats;
    stats.eleves.forEach(el => { el.ecoleNom = e.nom || e.id; el.ecoleId = e.id; });
    tousEleves = tousEleves.concat(stats.eleves);
    const p = await chargerProfs(e.id);
    tousProfs = tousProfs.concat(p.map(p => ({ ...p, ecoleId: e.id, ecoleNom: e.nom || e.id })));
    const f = await chargerFiches(e.id);
    f.forEach(f => { f.ecoleNom = e.nom || e.id; });
    toutesFiches = toutesFiches.concat(f);
    const logs = await chargerLogs(e.id);
    logs.forEach(l => { l.ecoleId = e.id; l.ecoleNom = e.nom || e.id; });
    tousLogs = tousLogs.concat(logs);
  }
  let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
  for (const e of toutesEcoles) {
    const s = statsMap[e.id];
    if (s) {
      total += s.total; garcons += s.garcons; filles += s.filles;
      abandons += s.abandons; exoneres += s.exoneres;
      reguliers += s.reguliers; listenoir += s.listenoir;
    }
  }
  return { total, garcons, filles, abandons, exoneres, reguliers, listenoir };
}

function getFilteredMembers() {
  let members = tousEleves;
  if (currentSchoolFilter !== "all") members = members.filter(e => e.ecoleId === currentSchoolFilter);
  if (currentEleveFilter.classe) members = members.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) members = members.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) members = members.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") members = members.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") members = members.filter(e => e.abandon === true);
  else if (currentEleveFilter.statut === "exonere") members = members.filter(e => e.exonere === true);
  return members;
}

function renderFlory() {
  const container = document.getElementById("floryContainer");
  let html = `
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3>📋 Communication with Ursule Nyandji (Support & Technical)</h3>
          <div style="display:flex;gap:6px;align-items:center;">
            <span style="font-size:11px;color:var(--gold);padding:4px 12px;background:rgba(251,191,36,0.1);border-radius:30px;border:1px solid rgba(251,191,36,0.2);">👤 ${SENDER_NAME}</span>
            <button class="btn outline sm" id="markAllReadFlory">✅ Mark all as read</button>
          </div>
        </div>
        <div id="floryMessagesGrid" class="messages-grid">
          ${floryMessages.length === 0 ? '<div class="empty-state"><span class="empty-icon">💬</span>No messages</div>' : ''}
        </div>
      </div>
      <div class="card">
        <div class="send-form" style="border:none;border-radius:0;background:transparent;margin-top:0;">
          <div class="send-header">✏️ Reply to Ursule Nyandji</div>
          <div class="send-body">
            <textarea id="floryMessage" rows="3" placeholder="Write your message for Ursule Nyandji..."></textarea>
            <button id="sendFloryBtn" class="btn-send">📤 SEND TO URSULE NYANDJI</button>
          </div>
        </div>
      </div>
    </div>
  `;
  container.innerHTML = html;
  const grid = document.getElementById('floryMessagesGrid');
  if (floryMessages.length > 0) {
    grid.innerHTML = '';
    floryMessages.forEach(msg => {
      const date = new Date(msg.date).toLocaleString('en-US');
      const isFlory = msg.sender === "flory" || msg.nom === "M. Flory" || msg.nom === "Flory";
      const isUrsule = msg.sender === "ursule" || msg.nom === "Ursule Nyandji";
      const unread = isUrsule && !isFloryMessageRead(msg.id);
      const div = document.createElement('div');
      div.className = `msg-bubble ${isFlory ? 'msg-right' : 'msg-left'}${unread ? ' msg-unread' : ''}`;
      div.innerHTML = `
        <span class="msg-sender">${isFlory ? '👤 M. Flory (You)' : '👩 Ursule Nyandji (Support)'}</span>
        ${unread ? '<span style="font-size:10px;background:#ef4444;color:white;padding:2px 8px;border-radius:30px;margin-left:4px;">🔴 UNREAD</span>' : ''}
        <div>${escapeHtml(msg.message || '')}</div>
        <span class="msg-time">${date}</span>
        <div class="msg-actions">
          <button class="btn-copy-msg" data-msg="${escapeHtml(msg.message || '')}">📋 Copy</button>
          ${isUrsule && unread ? `<button class="btn-mark-read" data-id="${msg.id}">✅ Mark as read</button>` : ''}
          <button class="btn-delete-msg" data-id="${msg.id}" data-type="flory">🗑️</button>
        </div>
      `;
      grid.appendChild(div);
      div.querySelector('.btn-copy-msg')?.addEventListener('click', () => {
        navigator.clipboard.writeText(msg.message || '');
        toast("Copied", 'success');
      });
      div.querySelector('.btn-mark-read')?.addEventListener('click', () => {
        const list = getFloryReadMessages();
        if (!list.includes(msg.id)) { list.push(msg.id); saveFloryReadMessages(list); renderFlory(); toast("Message marked as read", 'success'); }
      });
      div.querySelector('.btn-delete-msg')?.addEventListener('click', async () => {
        if (await showConfirm('Delete', 'Delete this message?')) {
          try {
            const toRemove = floryMessages.find(m => m.id === msg.id);
            if (toRemove) {
              await updateDoc(poleDocRef, { messages: arrayRemove(toRemove) });
              floryMessages = floryMessages.filter(m => m.id !== msg.id);
              renderFlory();
              toast("Message deleted", 'success');
            }
          } catch(e) { toast("Error: " + e.message, "error"); }
        }
      });
    });
    grid.scrollTop = grid.scrollHeight;
  }
  document.getElementById('markAllReadFlory')?.addEventListener('click', () => {
    const unreadIds = floryMessages.filter(m => m.sender === "ursule" && !isFloryMessageRead(m.id)).map(m => m.id);
    const list = getFloryReadMessages();
    unreadIds.forEach(id => { if (!list.includes(id)) list.push(id); });
    saveFloryReadMessages(list);
    renderFlory();
    toast("All marked as read", 'success');
  });
  document.getElementById('sendFloryBtn')?.addEventListener('click', async () => {
    const textarea = document.getElementById('floryMessage');
    const msg = textarea.value.trim();
    if (!msg) { toast("Message is empty", 'warning'); return; }
    const newMsg = {
      id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
      nom: SENDER_NAME,
      message: msg,
      date: new Date().toISOString(),
      sender: "flory",
      type: "new_message"
    };
    try {
      await updateDoc(poleDocRef, { messages: arrayUnion(newMsg) });
      textarea.value = '';
      toast("Message sent to Ursule Nyandji", 'success');
      renderFlory();
    } catch(e) {
      floryMessages = [...floryMessages, newMsg];
      renderFlory();
      toast("Message queued (offline)", 'warning');
    }
  });
}

      <p style="margin-bottom:8px;">⚠️ Delete <strong style="color:var(--red);">${ecoleNom}</strong>?</p>
      <p style="font-size:13px;color:var(--text-muted);">This will permanently delete:</p>
      <ul style="text-align:left;padding-left:20px;font-size:13px;color:var(--text-muted);">
        <li>All students</li>
        <li>All teachers</li>
        <li>All sheets</li>
        <li>All logs</li>
        <li>All parent messages</li>
      </ul>
      <p style="margin-top:8px;color:var(--red);font-weight:600;">This action is IRREVERSIBLE!</p>
    </div>
  `;
  if (!await showConfirm('🗑️ Delete School', message)) return;
  try {
    toast(`🔄 Deleting ${ecoleNom}...`, 'info');
    const collections = [
      `${ecoleId}_compta_eleves`,
      `${ecoleId}_professeurs`,
      `${ecoleId}_fiches`,
      `${ecoleId}_logs`,
      `${ecoleId}_parent_messages`
    ];
    let totalDeleted = 0;
    for (const col of collections) {
      try {
        const snap = await getDocs(collection(db, col));
        for (const doc of snap.docs) {
          try { await deleteDoc(doc.ref); totalDeleted++; } catch(e) {}
        }
      } catch(e) {}
    }
    try {
      await deleteDoc(doc(db, "ecoles", ecoleId));
    } catch(e) {}
    toast(`✅ ${ecoleNom} deleted (${totalDeleted} documents removed)`, 'success');
    await rafraichir();
    renderSettings();
  } catch(e) {
    toast("❌ Error: " + e.message, "error");
  }
}

function setupTabs() {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(el => {
    el.addEventListener("click", function() {
      const target = this.dataset.tab;
      if (!target) return;
      document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      const container = document.getElementById(target + "Container");
      if (container) container.classList.add("active");
      if (target === "dashboard") renderDashboard();
      else if (target === "members") renderMembers();
      else if (target === "logs") renderLogs();
      else if (target === "audit") renderAudit();
      else if (target === "flory") renderFlory();
      else if (target === "ecoles") renderEcoles();
      else if (target === "profs") renderProfs();
      else if (target === "fiches") renderFiches();
      else if (target === "parental") renderParental();
      else if (target === "settings") renderSettings();
      document.getElementById("breadcrumb").textContent = this.textContent.trim();
      document.getElementById("pageTitle").textContent = this.textContent.trim();
    });
  });
}

function setupSchoolFilter() {
  document.getElementById("schoolFilter").addEventListener("change", function() {
    currentSchoolFilter = this.value;
    renderEcoles();
    renderProfs();
    renderFiches();
    renderLogs();
    renderAudit();
    renderMembers();
    renderParental();
    if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
    if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  });
}

async function initSchoolSelect() {
  const select = document.getElementById("schoolFilter");
  select.innerHTML = '<option value="all">🌍 All Schools</option>';
  toutesEcoles.forEach(e => { select.innerHTML += `<option value="${e.id}">🏫 ${e.nom||e.id}</option>`; });
}

async function rafraichir() {
  const btn = document.getElementById('syncBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '⏳ Syncing...';
  btn.disabled = true;
  await chargerEcoles();
  await initSchoolSelect();
  const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
  updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
  auditList = await chargerAuditLogs();
  renderEcoles();
  renderProfs();
  renderFiches();
  renderMembers();
  renderLogs();
  renderAudit();
  renderParental();
  if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
  if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  if (document.getElementById("settingsContainer").classList.contains("active")) renderSettings();
  btn.innerHTML = '✅ Synced';
  setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 1000);
  toast("Data refreshed", "info");
}
window.rafraichir = rafraichir;

window.showSchoolEleves = function(schoolId) {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.querySelector('[data-tab="members"]').classList.add("active");
  document.getElementById("membersContainer").classList.add("active");
  document.getElementById("schoolFilter").value = schoolId;
  currentSchoolFilter = schoolId;
  renderMembers();
  renderEcoles();
  renderProfs();
  renderFiches();
  renderLogs();
  renderAudit();
  renderParental();
  toast(`👥 Students of ${schoolId.replace(/_/g, ' ')}`, "info");
};

document.getElementById("sidebarToggle")?.addEventListener("click", function() {
  document.getElementById("sidebar").classList.toggle("collapsed");
  const btn = this;
  const isCollapsed = document.getElementById("sidebar").classList.contains("collapsed");
  btn.innerHTML = isCollapsed ? '▶ <span>Expand</span>' : '◀ <span>Collapse</span>';
});

document.getElementById("globalSearch")?.addEventListener('keyup', function(e) {
  const query = this.value.toLowerCase().trim();
  if (query.length > 1) {
    document.querySelectorAll('.stat-card, .school-card, .log-item, .audit-item, .msg-bubble').forEach(el => {
      const text = el.innerText.toLowerCase();
      el.style.display = text.includes(query) ? '' : 'none';
    });
  } else {
    document.querySelectorAll('.stat-card, .school-card, .log-item, .audit-item, .msg-bubble').forEach(el => {
      el.style.display = '';
    });
  }
});

document.getElementById("unlockExpected")?.addEventListener('click', function() {
  const code = prompt("Enter access code to view Expected Amount:");
  if (code === ACCESS_CODE) {
    isExpectedUnlocked = true;
    toast("✅ Expected Amount unlocked", 'success');
    updateStats(
      parseInt(document.getElementById("statTotalEleves").textContent) || 0,
      parseInt(document.getElementById("statGarcons").textContent) || 0,
      parseInt(document.getElementById("statFilles").textContent) || 0,
      parseInt(document.getElementById("statAbandons").textContent) || 0,
      parseInt(document.getElementById("statExoneres").textContent) || 0,
      parseInt(document.getElementById("statReguliers").textContent) || 0,
      parseInt(document.getElementById("statListenoir").textContent) || 0
    );
    renderDashboard();
  } else if (code !== null) {
    toast("❌ Incorrect code", 'error');
  }
});

document.getElementById("accessBtn")?.addEventListener('click', function() {
  const code = document.getElementById("accessCode").value;
  const error = document.getElementById("accessError");
  if (code === ACCESS_CODE) {
    isAppUnlocked = true;
    document.getElementById("accessOverlay").style.display = 'none';
    toast("🔓 Access granted", 'success');
    initApp();
  } else {
    error.style.display = 'block';
    document.getElementById("accessCode").value = '';
    document.getElementById("accessCode").focus();
  }
});

document.getElementById("accessCode")?.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById("accessBtn").click();
  }
});

async function supprimerProfesseur(ecoleId, profId, profNom) {
  if (await showConfirm("Delete Teacher", `Delete <strong>${profNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try {
      await deleteDoc(doc(db, `${ecoleId}_professeurs`, profId));
      toast(`Teacher ${profNom} deleted`, "success");
      await rafraichir();
    } catch(e) {
      toast("Error: " + e.message, "error");
    }
  }
}
window.supprimerProfesseur = supprimerProfesseur;

async function supprimerFiche(ecoleId, ficheId, ficheNom) {
  if (await showConfirm("Delete Sheet", `Delete sheet <strong>${ficheNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try {
      await deleteDoc(doc(db, `${ecoleId}_fiches`, ficheId));
      toast(`Sheet ${ficheNom} deleted`, "success");
      await rafraichir();
    } catch(e) {
      toast("Error: " + e.message, "error");
    }
  }
}
window.supprimerFiche = supprimerFiche;

async function initApp() {
  try {
    await chargerEcoles();
    await initSchoolSelect();
    const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
    updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
    auditList = await chargerAuditLogs();
    listenToFlory();
    renderDashboard();
    renderEcoles();
    renderProfs();
    renderFiches();
    renderMembers();
    renderLogs();
    renderAudit();
    renderParental();
    renderSettings();
    setupTabs();
    setupSchoolFilter();
    toast("🚀 Dashboard ready", "success");
  } catch(e) {
    document.getElementById("dashboardContainer").innerHTML = `<div class="empty-state" style="color:var(--red);">❌ Error: ${e.message}<br><button class="btn primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Retry</button></div>`;
    toast("Loading error", "error");
  }
}

// Initial access check - show overlay
document.getElementById("accessOverlay").style.display = 'flex';
document.getElementById("accessCode").focus();
</script>
</body>
