<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-primary:#0B1120;
  --bg-secondary:#0F172A;
  --bg-card:#111827;
  --bg-card-hover:#1E293B;
  --text-primary:#F8FAFC;
  --text-secondary:#94A3B8;
  --text-muted:#475569;
  --border-color:rgba(255,255,255,0.05);
  --border-hover:rgba(255,255,255,0.08);
  --blue:#3B82F6;
  --blue-dark:#2563EB;
  --green:#10B981;
  --orange:#F59E0B;
  --red:#EF4444;
  --purple:#A78BFA;
  --gold:#FBBF24;
  --pink:#EC4899;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(0,0,0,0.4);
  --transition:0.2s cubic-bezier(0.16,1,0.3,1);
  --sidebar-width:260px;
  --sidebar-collapsed:72px;
}
body{background:var(--bg-primary);font-family:'Inter',-apple-system,sans-serif;color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-card);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}

.sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  border-right:1px solid var(--border-color);
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  transition:width 0.3s ease;
  z-index:100;
}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar.collapsed .sidebar-brand h1,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item svg{width:24px;height:24px;}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px 8px;border-bottom:1px solid var(--border-color);margin-bottom:8px;}
.sidebar-brand .logo{width:40px;height:40px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;}
.sidebar-brand h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#fff;}
.sidebar-brand h1 span{color:var(--blue);}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;color:var(--text-secondary);transition:all 0.15s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;position:relative;}
.nav-item svg{width:20px;height:20px;stroke:#64748B;stroke-width:1.8;fill:none;flex-shrink:0;transition:stroke 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:var(--text-primary);}
.nav-item:hover svg{stroke:var(--text-primary);}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,0.25);}
.nav-item.active svg{stroke:#fff;}
.nav-divider{height:1px;background:var(--border-color);margin:8px 0;}
.sidebar-toggle{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 14px;color:var(--text-secondary);cursor:pointer;font-size:12px;transition:0.15s;display:flex;align-items:center;gap:6px;}
.sidebar-toggle:hover{border-color:var(--border-hover);color:var(--text-primary);}

.main{flex:1;min-width:0;padding:16px 24px 40px 24px;background:var(--bg-primary);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 16px 0;border-bottom:1px solid var(--border-color);margin-bottom:20px;position:sticky;top:0;background:var(--bg-primary);z-index:50;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-left .breadcrumb{color:var(--text-secondary);font-size:13px;}
.topbar-left .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-left h2{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-actions .search-box{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;transition:0.15s;min-width:200px;}
.topbar-actions .search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.topbar-actions .search-box input{background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.topbar-actions .search-box input::placeholder{color:var(--text-muted);}
.topbar-actions .search-box svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;}
.btn-topbar{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:40px;transition:0.15s;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
.btn-topbar:hover{background:var(--bg-card);color:var(--text-primary);}
.btn-topbar svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn-topbar.primary{background:var(--blue);color:#fff;}
.btn-topbar.primary:hover{background:var(--blue-dark);}
.school-selector-top{background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;color:var(--text-primary);font-size:13px;font-weight:500;cursor:pointer;outline:none;}
.school-selector-top:focus{border-color:var(--blue);}

/* STATS GRID - 8 compteurs */
.stats-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:14px 12px;transition:all 0.2s;text-align:center;cursor:pointer;}
.stat-card:hover{border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card .stat-icon{margin-bottom:2px;color:var(--blue);font-size:20px;}
.stat-card .stat-value{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
.stat-card .stat-value .blue{color:var(--blue);}
.stat-card .stat-value .purple{color:var(--purple);}
.stat-card .stat-value .gold{color:var(--gold);}
.stat-card .stat-value .danger{color:var(--red);}
.stat-card .stat-value .green{color:var(--green);}
.stat-card .stat-value .orange{color:var(--orange);}
.stat-card .stat-value .pink{color:var(--pink);}
.stat-card .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);margin-top:2px;}
.stat-card .stat-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}

.tabs-container{display:flex;gap:4px;background:var(--bg-card);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border-color);margin-bottom:20px;flex-wrap:wrap;position:sticky;top:68px;z-index:40;backdrop-filter:blur(8px);}
.tab-btn{background:transparent;border:none;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.04);}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.2);}
.tab-content{display:none;animation:fadeSlide 0.25s ease;}
.tab-content.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:0.2s;}
.card:hover{border-color:var(--border-hover);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;}
.card-header h3 .count{background:var(--bg-primary);padding:0 14px;border-radius:40px;font-size:12px;font-weight:500;color:var(--text-secondary);}
.card-header .actions{display:flex;gap:6px;}

.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);}
.excel-table{width:100%;border-collapse:collapse;font-size:13px;}
.excel-table thead tr{background:linear-gradient(135deg,#1a2a4a,#0f1f33);}
.excel-table th{padding:12px 16px;text-align:left;color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid rgba(255,215,0,0.15);white-space:nowrap;}
.excel-table td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text-primary);vertical-align:middle;}
.excel-table tr:hover td{background:rgba(255,255,255,0.02);}
.excel-table .col-center{text-align:center;}
.excel-table .col-right{text-align:right;}
.excel-table .badge-table{font-size:11px;font-weight:500;padding:3px 12px;border-radius:40px;display:inline-block;}
.excel-table .badge-table.active{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.inactive{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.exempted{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .badge-table.dropout{background:rgba(239,68,68,0.15);color:var(--red);}
.excel-table .badge-table.partial{background:rgba(245,158,11,0.15);color:var(--orange);}
.excel-table .badge-table.paid{background:rgba(16,185,129,0.15);color:var(--green);}
.excel-table .code-cell{font-family:monospace;color:var(--blue);font-size:13px;letter-spacing:1px;}

.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filter-group{flex:1;min-width:120px;}
.filter-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:4px;}
.filter-group select,.filter-group input{width:100%;padding:6px 12px;border-radius:var(--radius-sm);background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-primary);font-size:13px;outline:none;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);}

.empty-state{text-align:center;padding:32px;color:var(--text-muted);font-size:14px;}
.empty-state .empty-icon{font-size:36px;display:block;margin-bottom:8px;}

.toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px;}
.toast{background:var(--bg-card);backdrop-filter:blur(8px);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--green);transform:translateX(100%);transition:0.3s cubic-bezier(0.16,1,0.3,1);box-shadow:0 12px 32px rgba(0,0,0,0.7);font-size:13px;color:var(--text-primary);}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:var(--red);}
.toast.warning{border-left-color:var(--orange);}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:0.2s;}
.modal-overlay.show{visibility:visible;opacity:1;}
.modal-box{background:var(--bg-card);border-radius:var(--radius);padding:28px;max-width:420px;width:92%;border:1px solid var(--border-color);text-align:center;}
.modal-box .icon{font-size:36px;margin-bottom:4px;}
.modal-box h3{color:var(--text-primary);font-weight:700;}
.modal-box p{color:var(--text-secondary);margin:6px 0 16px;}
.modal-box .btn{background:var(--blue);color:#fff;border:none;padding:10px 24px;border-radius:40px;font-weight:600;cursor:pointer;transition:0.15s;}
.modal-box .btn:hover{background:var(--blue-dark);transform:scale(0.98);}
.modal-box .btn.outline{background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);}
.modal-box .btn.outline:hover{background:rgba(255,255,255,0.04);}
.modal-box .btn.danger{background:var(--red);}
.modal-box .btn.danger:hover{background:#dc2626;}

@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:992px){
  .sidebar{width:var(--sidebar-collapsed);}
  .sidebar .sidebar-brand h1,.sidebar .nav-item span,.sidebar .nav-item .nav-label{display:none;}
  .sidebar .nav-item{justify-content:center;padding:10px;}
  .sidebar .nav-item svg{width:24px;height:24px;}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{padding:12px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .topbar{flex-direction:column;align-items:stretch;gap:10px;}
  .topbar-actions{flex-wrap:wrap;}
  .topbar-actions .search-box{min-width:100%;}
  .tabs-container{flex-wrap:nowrap;overflow-x:auto;}
  .tab-btn{font-size:12px;padding:6px 12px;}
  .excel-table{font-size:12px;}
  .excel-table th,.excel-table td{padding:8px 10px;}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .stat-card .stat-value{font-size:20px;}
  .excel-table{font-size:11px;}
  .excel-table th,.excel-table td{padding:6px 8px;}
}
.flex{display:flex;}
.gap-2{gap:8px;}
.gap-4{gap:16px;}
.w-full{width:100%;}
.mt-2{margin-top:8px;}
.mb-2{margin-bottom:8px;}
.text-muted{color:var(--text-muted);}
.text-secondary{color:var(--text-secondary);}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== GLOBAL VARIABLES =====
let toutesEcoles = [];
let tousEleves = [];
let tousProfs = [];
let currentSchoolFilter = "all";
let currentEleveFilter = { classe: "", option: "", sexe: "", statut: "" };

// ===== TOAST =====
function toast(m, t = "success") {
  const c = document.getElementById("toastContainer");
  if (!c) return;
  const ic = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
  const ti = { success: "Success", error: "Error", warning: "Warning", info: "Info" };
  const el = document.createElement("div");
  el.className = `toast ${t}`;
  el.innerHTML = `<span style="font-size:18px;">${ic[t] || "📢"}</span><div>${m}</div>`;
  c.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => { if (el.parentNode) el.remove(); }, 280); }, 3400);
}

// ===== SHOW CONFIRM =====
function showConfirm(t, m) {
  return new Promise((resolve) => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    document.getElementById("confirmTitle").textContent = t;
    document.getElementById("confirmMessage").innerHTML = m;
    modal.classList.add("show");
    const yes = document.getElementById("confirmYes");
    const no = document.getElementById("confirmNo");
    const clean = () => { modal.classList.remove("show"); yes.removeEventListener("click", h); no.removeEventListener("click", n); };
    const h = () => { clean(); resolve(true); };
    const n = () => { clean(); resolve(false); };
    yes.addEventListener("click", h);
    no.addEventListener("click", n);
  });
}

// ===== FORMAT =====
function formatDateShort(d) { const dt = new Date(d); return dt.toLocaleDateString("en-US"); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }

// ===== CHARGER LES DONNÉES =====
async function chargerEcoles() {
  try {
    const snap = await getDocs(collection(db, "ecoles_autorisees"));
    toutesEcoles = [];
    snap.forEach(ds => { toutesEcoles.push({ id: ds.id, ...ds.data() }); });
    return toutesEcoles;
  } catch(e) { toast("Error loading schools", "error"); return []; }
}

async function chargerElevesParEcole(ecoleId) {
  try {
    console.log(`🔍 Chargement des élèves pour ${ecoleId}...`);
    const snap = await getDocs(collection(db, `${ecoleId}_compta_eleves`));
    const eleves = [];
    snap.forEach(ds => {
      const d = ds.data();
      // Vérifier le _type comme dans le code comptable
      if (d._type === "compta_eleve" || d._type === "compta_eleves") {
        eleves.push({
          id: d.eleveId || ds.id,
          nom: d.nom || "Inconnu",
          postnom: d.postnom || "",
          prenom: d.prenom || "",
          sexe: d.sexe || "M",
          classe: d.classe || "",
          option: d.option || "",
          exonere: d.exonere || false,
          abandon: d.abandon || false,
          parentCode: d.parentCode || "",
          minerval: d.minerval || 0,
          dateInscription: d.dateInscription || "",
          ecoleId: ecoleId,
          ...d
        });
      }
    });
    console.log(`👥 ${eleves.length} élèves pour ${ecoleId}`);
    return eleves;
  } catch(e) {
    console.warn("Error loading students for", ecoleId, e);
    return [];
  }
}

async function chargerProfsParEcole(ecoleId) {
  try {
    const snap = await getDocs(collection(db, `${ecoleId}_professeurs`));
    const profs = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "prof") {
        profs.push({
          id: d.profId || ds.id,
          nom: d.nom || "Inconnu",
          code: d.code || "0000",
          actif: d.actif !== false,
          ecoleId: ecoleId
        });
      }
    });
    return profs;
  } catch(e) { return []; }
}

async function chargerTout() {
  toutesEcoles = await chargerEcoles();
  tousEleves = [];
  tousProfs = [];
  
  for (const e of toutesEcoles) {
    const eleves = await chargerElevesParEcole(e.id);
    eleves.forEach(el => { el.ecoleNom = e.nom || e.id; });
    tousEleves = tousEleves.concat(eleves);
    
    const profs = await chargerProfsParEcole(e.id);
    profs.forEach(p => { p.ecoleNom = e.nom || e.id; });
    tousProfs = tousProfs.concat(profs);
  }
  
  return { total: tousEleves.length };
}

// ===== METTRE À JOUR LES STATS PAR ÉCOLE =====
function updateStats() {
  // Filtrer par école
  let eleves = tousEleves;
  if (currentSchoolFilter !== "all") {
    eleves = tousEleves.filter(e => e.ecoleId === currentSchoolFilter);
  }
  
  // Appliquer les filtres supplémentaires
  if (currentEleveFilter.classe) eleves = eleves.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) eleves = eleves.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) eleves = eleves.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") eleves = eleves.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") eleves = eleves.filter(e => e.abandon === true);
  else if (currentEleveFilter.statut === "exonere") eleves = eleves.filter(e => e.exonere === true);
  
  // Calcul des statistiques
  const total = eleves.length;
  const filles = eleves.filter(e => e.sexe === "F").length;
  const garcons = eleves.filter(e => e.sexe === "M").length;
  const exoneres = eleves.filter(e => e.exonere === true).length;
  const abandons = eleves.filter(e => e.abandon === true).length;
  
  // Liste noire = élèves avec 3+ mois impayés (comme dans la logique comptable)
  let listeNoire = 0;
  let reguliers = 0;
  for (const e of eleves) {
    if (e.abandon) continue;
    if (e.exonere) continue;
    const paiements = e.paiements || {};
    let moisImpayes = 0;
    const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];
    for (const m of moisListe) {
      const mt = paiements[m]?.montant || 0;
      if (mt < (e.minerval || 45000)) moisImpayes++;
    }
    if (moisImpayes >= 3) listeNoire++;
    else reguliers++;
  }
  
  // Mettre à jour l'affichage
  document.getElementById("statEcoles").textContent = toutesEcoles.length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statFilles").textContent = filles;
  document.getElementById("statGarcons").textContent = garcons;
  document.getElementById("statExoneres").textContent = exoneres;
  document.getElementById("statAbandons").textContent = abandons;
  document.getElementById("statListeNoire").textContent = listeNoire;
  document.getElementById("statReguliers").textContent = reguliers;
}

// ===== RENDER FUNCTIONS =====

  const filles = eleves.filter(e => e.sexe === "F").length;
  const garcons = eleves.filter(e => e.sexe === "M").length;
  const exoneres = eleves.filter(e => e.exonere === true).length;
  const abandons = eleves.filter(e => e.abandon === true).length;
  
  let html = `
    <div class="stats-grid" style="margin-bottom:16px;grid-template-columns:repeat(4,1fr);">
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value"><span class="blue">${total}</span></div><div class="stat-label">Active Students</div></div>
      <div class="stat-card"><div class="stat-icon">🌟</div><div class="stat-value"><span class="green">${exoneres}</span></div><div class="stat-label">Exempted</div></div>
      <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-value"><span class="danger">${abandons}</span></div><div class="stat-label">Dropouts</div></div>
      <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-value"><span class="orange">${document.getElementById("statListeNoire").textContent || 0}</span></div><div class="stat-label">Blacklist</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>📊 Gender Distribution</h3></div>
      <canvas id="chartSexe" height="200"></canvas>
    </div>
  `;
  container.innerHTML = html;
  
  setTimeout(() => {
    const ctx = document.getElementById("chartSexe");
    if (ctx) {
      new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Boys", "Girls"],
          datasets: [{ data: [garcons, filles], backgroundColor: ["#3B82F6", "#EC4899"] }]
        },
        options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: "#94A3B8" } } } }

}

function renderEcoles() {
  const container = document.getElementById("ecolesContainer");
  if (!toutesEcoles.length) {
    container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>No schools found</div>';
    return;
  }
  let html = `
    <div class="card">
      <div class="card-header">
        <h3>🏫 Schools <span class="count">${toutesEcoles.length}</span></h3>
      </div>
      <div class="table-wrapper">
        <table class="excel-table">
          <thead><tr>
            <th>School</th>
            <th>👥 Total</th>
            <th>👩 Girls</th>
            <th>👨 Boys</th>
            <th>🌟 Exempted</th>
            <th>❌ Dropouts</th>
            <th>⚠️ Blacklist</th>
          </tr></thead>
          <tbody>`;
  for (const e of toutesEcoles) {
    const eleves = tousEleves.filter(el => el.ecoleId === e.id);
    const total = eleves.length;
    const filles = eleves.filter(el => el.sexe === "F").length;
    const garcons = eleves.filter(el => el.sexe === "M").length;
    const exoneres = eleves.filter(el => el.exonere === true).length;
    const abandons = eleves.filter(el => el.abandon === true).length;
    
    // Calcul liste noire par école
    let listeNoire = 0;
    for (const el of eleves) {
      if (el.abandon || el.exonere) continue;
      const paiements = el.paiements || {};
      let moisImpayes = 0;
      const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];
      for (const m of moisListe) {
        const mt = paiements[m]?.montant || 0;
        if (mt < (el.minerval || 45000)) moisImpayes++;
      }
      if (moisImpayes >= 3) listeNoire++;
    }
    
    html += `<tr>
      <td><strong>${escapeHtml(e.nom || e.id)}</strong></td>
      <td><span style="color:var(--blue);font-weight:600;">${total}</span></td>
      <td><span style="color:var(--pink);font-weight:600;">${filles}</span></td>
      <td><span style="color:var(--blue);font-weight:600;">${garcons}</span></td>
      <td><span style="color:var(--green);font-weight:600;">${exoneres}</span></td>
      <td><span style="color:var(--red);font-weight:600;">${abandons}</span></td>
      <td><span style="color:var(--orange);font-weight:600;">${listeNoire}</span></td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;
  container.innerHTML = html;
}

function renderEleves() {
  const container = document.getElementById("elevesContainer");
  let eleves = tousEleves;
  if (currentSchoolFilter !== "all") {
    eleves = tousEleves.filter(e => e.ecoleId === currentSchoolFilter);
  }
  
  // Appliquer les filtres
  if (currentEleveFilter.classe) eleves = eleves.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) eleves = eleves.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) eleves = eleves.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") eleves = eleves.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") eleves = eleves.filter(e => e.abandon === true);
  else if (currentEleveFilter.statut === "exonere") eleves = eleves.filter(e => e.exonere === true);
  
  const classes = [...new Set(tousEleves.map(e => e.classe).filter(Boolean))].sort();
  const options = [...new Set(tousEleves.map(e => e.option).filter(Boolean))].sort();
  
  let html = `
    <div class="card">
      <div class="card-header">
        <h3>👥 Students <span class="count">${eleves.length}</span></h3>
      </div>
      <div class="filter-row">
        <div class="filter-group"><label>📚 Class</label><select id="eleveFilterClasse"><option value="">All</option>${classes.map(c => `<option value="${c}">${c}</option>`).join("")}</select></div>
        <div class="filter-group"><label>🎯 Option</label><select id="eleveFilterOption"><option value="">All</option>${options.map(o => `<option value="${o}">${o}</option>`).join("")}</select></div>
        <div class="filter-group"><label>⚧ Gender</label><select id="eleveFilterSexe"><option value="">All</option><option value="M">Male</option><option value="F">Female</option></select></div>
        <div class="filter-group"><label>📌 Status</label><select id="eleveFilterStatut"><option value="">All</option><option value="actif">Active</option><option value="abandon">Dropout</option><option value="exonere">Exempted</option></select></div>
        <div class="filter-group" style="flex:0.5;"><button class="btn-topbar primary" id="applyEleveFilter" style="width:100%;padding:8px 16px;">🔍 Filter</button></div>
      </div>
      <div class="table-wrapper">
        <table class="excel-table">
          <thead><tr>
            <th>#</th><th>Name</th><th>Class</th><th>Option</th><th>Gender</th><th>School</th><th>Parent Code</th><th class="col-center">Status</th>
          </tr></thead>
          <tbody>`;
  if (!eleves.length) {
    html += `<tr><td colspan="8" class="col-center" style="color:var(--text-muted);padding:20px;">No students found</td></tr>`;
  } else {
    eleves.forEach((el, idx) => {
      const statut = el.abandon ? "Dropout" : (el.exonere ? "Exempted" : "Active");
      const statutClass = el.abandon ? "dropout" : (el.exonere ? "exempted" : "active");
      const sexe = el.sexe === "F" ? "Female" : "Male";
      html += `<tr>
        <td>${idx + 1}</td>
        <td><strong>${escapeHtml(el.nom)} ${escapeHtml(el.postnom||'')} ${escapeHtml(el.prenom||'')}</strong></td>
        <td>${escapeHtml(el.classe||'-')}</td>
        <td>${escapeHtml(el.option||'-')}</td>
        <td>${sexe}</td>
        <td>${escapeHtml(el.ecoleNom||'-')}</td>
        <td><code class="code-cell">${el.parentCode || '-'}</code></td>
        <td class="col-center"><span class="badge-table ${statutClass}">${statut}</span></td>
      </tr>`;
    });
  }
  html += `</tbody></table></div></div>`;
  container.innerHTML = html;
  
  // Appliquer les filtres
  document.getElementById("applyEleveFilter").onclick = function() {
    currentEleveFilter.classe = document.getElementById("eleveFilterClasse").value;
    currentEleveFilter.option = document.getElementById("eleveFilterOption").value;
    currentEleveFilter.sexe = document.getElementById("eleveFilterSexe").value;
    currentEleveFilter.statut = document.getElementById("eleveFilterStatut").value;
    renderEleves();
    updateStats();
  };
}

function renderProfs() {
  const container = document.getElementById("profsContainer");
  let profs = tousProfs;
  if (currentSchoolFilter !== "all") {
    profs = tousProfs.filter(p => p.ecoleId === currentSchoolFilter);
  }
  if (!profs.length) {
    container.innerHTML = '<div class="empty-state"><span class="empty-icon">👨‍🏫</span>No teachers found</div>';
    return;
  }
  let html = `
    <div class="card">
      <div class="card-header">
        <h3>👨‍🏫 Teachers <span class="count">${profs.length}</span></h3>
      </div>
      <div class="table-wrapper">
        <table class="excel-table">
          <thead><tr>
            <th>#</th><th>Name</th><th>Code</th><th>School</th><th class="col-center">Status</th>
          </tr></thead>
          <tbody>`;
  profs.forEach((p, idx) => {
    html += `<tr>
      <td>${idx + 1}</td>
      <td><strong>${escapeHtml(p.nom)}</strong></td>
      <td><code class="code-cell">${p.code}</code></td>
      <td>${escapeHtml(p.ecoleNom||p.ecoleId)}</td>
      <td class="col-center"><span class="badge-table ${p.actif ? 'active' : 'inactive'}">${p.actif ? '🟢 Active' : '🔴 Inactive'}</span></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  container.innerHTML = html;
}

// ===== NAVIGATION =====
function setupTabs() {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(el => {
    el.addEventListener("click", function() {
      const target = this.dataset.tab;
      if (!target) return;
      document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      const container = document.getElementById(target + "Container");
      if (container) container.classList.add("active");

      if (target === "dashboard") renderDashboard();
      else if (target === "ecoles") renderEcoles();
      else if (target === "eleves") renderEleves();
      else if (target === "profs") renderProfs();

      document.getElementById("breadcrumb").textContent = this.textContent.trim();
      document.getElementById("pageTitle").textContent = this.textContent.trim();
    });
  });
}

function setupSchoolFilter() {
  document.getElementById("schoolFilter").addEventListener("change", function() {
    currentSchoolFilter = this.value;
    updateStats();
    renderDashboard();
    renderEcoles();
    renderEleves();
    renderProfs();
  });
}

async function initSchoolSelect() {
  const select = document.getElementById("schoolFilter");
  select.innerHTML = '<option value="all">🌍 All Schools</option>';
  toutesEcoles.forEach(e => { select.innerHTML += `<option value="${e.id}">🏫 ${e.nom||e.id}</option>`; });
}

async function rafraichir() {
  toast("🔄 Loading data...", "info");
  await chargerTout();
  await initSchoolSelect();
  updateStats();
  renderDashboard();
  renderEcoles();
  renderEleves();
  renderProfs();
  toast("✅ Data refreshed", "success");
}
window.rafraichir = rafraichir;

// ===== INIT =====
(async function init() {
  try {
    await chargerTout();
    await initSchoolSelect();
    updateStats();
    renderDashboard();
    renderEcoles();
    renderEleves();
    renderProfs();
    setupTabs();
    setupSchoolFilter();
    toast("🚀 Dashboard ready", "success");
  } catch(e) {
    document.getElementById("dashboardContainer").innerHTML = `<div class="empty-state" style="color:var(--red);">❌ Error: ${e.message}<br><button class="btn-topbar primary" onclick="window.rafraichir()" style="margin-top:12px;padding:10px 24px;">🔄 Retry</button></div>`;
    toast("Error loading", "error");
  }
})();

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('globalSearch')?.focus();
    toast("🔍 Search", "info");
  }
  if (e.key === 'Escape') document.getElementById('globalSearch')?.blur();
});

  this.innerHTML = isCollapsed ? '▶ <span>Expand</span>' : '◀ <span>Collapse</span>';
