<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-primary:#0B1120;
  --bg-secondary:#111B2E;
  --bg-card:#1A2A4A;
  --bg-card-hover:#243A5E;
  --bg-card-light:#1E3050;
  --text-primary:#F0F4FF;
  --text-secondary:#A8B8D0;
  --text-muted:#6A7F9A;
  --border-color:rgba(255,255,255,0.06);
  --border-hover:rgba(255,255,255,0.12);
  --blue:#4A8BFF;
  --blue-dark:#2A6BD9;
  --green:#2ECC9E;
  --orange:#F5A623;
  --red:#FF5A5A;
  --purple:#A78BFA;
  --gold:#FBBF24;
  --pink:#EC4899;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 8px 28px rgba(0,0,0,0.5);
  --shadow-card:0 4px 20px rgba(0,0,0,0.3);
  --transition:0.25s cubic-bezier(0.16,1,0.3,1);
  --sidebar-width:260px;
  --sidebar-collapsed:72px;
}
body{background:var(--bg-primary);font-family:'Inter',-apple-system,sans-serif;color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-card);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}
.sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  background:rgba(11,17,32,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.05);
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:2px;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  transition:width 0.3s ease;
  z-index:100;
}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar.collapsed .sidebar-brand h1,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item svg{width:24px;height:24px;}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 16px 8px;border-bottom:1px solid rgba(255,255,255,0.05);margin-bottom:6px;}
.sidebar-brand .logo{width:40px;height:40px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;}
.sidebar-brand h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#fff;}
.sidebar-brand h1 span{background:linear-gradient(135deg,#4A8BFF,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;color:var(--text-secondary);transition:all 0.15s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;position:relative;}
.nav-item svg{width:20px;height:20px;stroke:#64748B;stroke-width:1.8;fill:none;flex-shrink:0;transition:stroke 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
.nav-item:hover svg{stroke:var(--text-primary);}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(74,139,255,0.3);}
.nav-item.active svg{stroke:#fff;}
.nav-item .badge-nav{margin-left:auto;font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;background:rgba(255,255,255,0.06);color:var(--text-secondary);}
.nav-item.active .badge-nav{background:rgba(255,255,255,0.15);color:#fff;}
.nav-divider{height:1px;background:rgba(255,255,255,0.05);margin:6px 0;}
.sidebar-toggle{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 14px;color:var(--text-secondary);cursor:pointer;font-size:12px;transition:0.15s;display:flex;align-items:center;gap:6px;}
.sidebar-toggle:hover{border-color:var(--border-hover);color:var(--text-primary);}
.main{flex:1;min-width:0;padding:16px 24px 40px 24px;background:var(--bg-primary);}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:8px 0 16px 0;
  margin-bottom:20px;
  position:sticky;
  top:0;
  background:rgba(11,17,32,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 24px rgba(0,0,0,0.4);
  border-bottom:1px solid rgba(255,255,255,0.03);
  z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-left .breadcrumb{color:var(--text-secondary);font-size:13px;}
.topbar-left .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-left h2{font-size:20px;font-weight:700;letter-spacing:-0.02em;background:linear-gradient(135deg,#F0F4FF,#A8B8D0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-actions .search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:40px;
  padding:6px 16px;
  transition:0.15s;
  min-width:200px;
  position:relative;
}
.topbar-actions .search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,139,255,0.15);}
.topbar-actions .search-box input{background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.topbar-actions .search-box input::placeholder{color:var(--text-muted);}
.topbar-actions .search-box .shortcut-badge{
  font-size:9px;
  color:var(--text-muted);
  background:rgba(255,255,255,0.05);
  padding:2px 8px;
  border-radius:4px;
  border:1px solid rgba(255,255,255,0.03);
  font-weight:600;
  letter-spacing:0.3px;
}
.topbar-actions .search-box svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;}
.btn-topbar{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:40px;transition:0.15s;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;position:relative;overflow:hidden;}
.btn-topbar::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.05);border-radius:40px;transform:scale(0.8);opacity:0;transition:all 0.3s;}
.btn-topbar:active::after{transform:scale(1);opacity:1;transition:0s;}
.btn-topbar:hover{background:var(--bg-card);color:var(--text-primary);}
.btn-topbar svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn-topbar.primary{background:var(--blue);color:#fff;}
.btn-topbar.primary:hover{background:var(--blue-dark);}
.school-selector-top{background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;color:var(--text-primary);font-size:13px;font-weight:500;cursor:pointer;outline:none;}
.school-selector-top:focus{border-color:var(--blue);}
.topbar-avatar{
  width:36px;
  height:36px;
  border-radius:40px;
  background:var(--bg-card);
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:13px;
  color:var(--text-primary);
  cursor:default;
  position:relative;
}
.topbar-avatar::after{
  content:'';
  position:absolute;
  top:-2px;
  right:-2px;
  width:10px;
  height:10px;
  background:var(--green);
  border-radius:50%;
  border:2px solid var(--bg-primary);
  animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.4;}}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:16px 14px;
  transition:all 0.3s;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-card);
}
.stat-card:hover{border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.stat-card .stat-icon{
  position:relative;
  z-index:1;
  margin-bottom:4px;
  color:var(--blue);
}
.stat-card .stat-icon svg{width:24px;height:24px;stroke-width:1.8;}
.stat-card::before{
  content:'';
  position:absolute;
  right:-15px;
  bottom:-15px;
  font-size:64px;
  opacity:0.03;
  pointer-events:none;
  z-index:0;
}
.stat-card:nth-child(1)::before{content:'📊';}
.stat-card:nth-child(2)::before{content:'👨';}
.stat-card:nth-child(3)::before{content:'👩';}
.stat-card:nth-child(4)::before{content:'⚠️';}
.stat-card:nth-child(5)::before{content:'⭐';}
.stat-card:nth-child(6)::before{content:'✅';}
.stat-card:nth-child(7)::before{content:'🚫';}
.stat-card .stat-value{font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;position:relative;z-index:1;}
.stat-card .stat-value .blue{color:var(--blue);}
.stat-card .stat-value .purple{color:var(--purple);}
.stat-card .stat-value .gold{color:var(--gold);}
.stat-card .stat-value .danger{color:var(--red);}
.stat-card .stat-value .green{color:var(--green);}
.stat-card .stat-value .orange{color:var(--orange);}
.stat-card .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);margin-top:2px;position:relative;z-index:1;}
.stat-card .stat-sub{font-size:10px;color:var(--text-muted);margin-top:2px;position:relative;z-index:1;}
.stat-card .stat-progress{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:4px;margin-top:8px;overflow:hidden;position:relative;z-index:1;}
.stat-card .stat-progress-bar{height:100%;border-radius:4px;transition:width 1s ease;}
.tabs-container{
  display:flex;
  gap:4px;
  background:var(--bg-card);
  padding:4px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-color);
  margin-bottom:20px;
  flex-wrap:wrap;
  position:sticky;
  top:68px;
  z-index:40;
  backdrop-filter:blur(8px);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs-container::-webkit-scrollbar{display:none;}
.tab-btn{
  background:transparent;
  border:none;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
  color:var(--text-secondary);
  cursor:pointer;
  transition:0.15s;
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
}
.tab-btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);transform:scale(0.8);opacity:0;transition:all 0.3s;}
.tab-btn:active::after{transform:scale(1);opacity:1;transition:0s;}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.03);}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(74,139,255,0.25);}
.tab-btn.active::after{display:none;}
.tab-content{display:none;animation:fadeSlide 0.3s ease;}
.tab-content.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:0.25s;box-shadow:var(--shadow-card);}
.card:hover{border-color:var(--border-hover);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--text-primary);}
.card-header h3 .count{background:var(--bg-primary);padding:0 14px;border-radius:40px;font-size:12px;font-weight:500;color:var(--text-secondary);}
.card-header .actions{display:flex;gap:6px;}
.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-color);}
.excel-table{width:100%;border-collapse:collapse;font-size:13px;}
.excel-table thead tr{background:linear-gradient(135deg,#1A2A4A,#0F1F33);}
.excel-table th{padding:12px 16px;text-align:left;color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid rgba(255,215,0,0.1);white-space:nowrap;}
.excel-table td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text-primary);vertical-align:middle;transition:background 0.2s;}
.excel-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.excel-table tr:hover td{background:rgba(74,139,255,0.06);}
.excel-table .col-center{text-align:center;}
.excel-table .col-right{text-align:right;}
.excel-table .badge-table{
  font-size:11px;
  font-weight:500;
  padding:3px 12px;
  border-radius:40px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.excel-table .badge-table::before{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block;
  animation:pulse-dot 2s infinite;
}
.excel-table .badge-table.active::before{background:var(--green);box-shadow:0 0 8px rgba(46,204,158,0.5);}
.excel-table .badge-table.inactive::before{background:var(--red);box-shadow:0 0 8px rgba(255,90,90,0.5);}
.excel-table .badge-table.exempted::before{background:var(--green);box-shadow:0 0 8px rgba(46,204,158,0.5);}
.excel-table .badge-table.dropout::before{background:var(--red);box-shadow:0 0 8px rgba(255,90,90,0.5);}
.excel-table .badge-table.partial::before{background:var(--orange);box-shadow:0 0 8px rgba(245,166,35,0.5);}
.excel-table .badge-table.paid::before{background:var(--green);box-shadow:0 0 8px rgba(46,204,158,0.5);}
.excel-table .badge-table.regulier::before{background:var(--blue);box-shadow:0 0 8px rgba(74,139,255,0.5);}
.excel-table .badge-table.exonere::before{background:var(--green);box-shadow:0 0 8px rgba(46,204,158,0.5);}
.excel-table .badge-table.listenoir::before{background:var(--orange);box-shadow:0 0 8px rgba(245,166,35,0.5);}
.excel-table .badge-table.abandon::before{background:var(--red);box-shadow:0 0 8px rgba(255,90,90,0.5);}
.excel-table .badge-table.active{background:rgba(46,204,158,0.15);color:var(--green);}
.excel-table .badge-table.inactive{background:rgba(255,90,90,0.15);color:var(--red);}
.excel-table .badge-table.exempted{background:rgba(46,204,158,0.15);color:var(--green);}
.excel-table .badge-table.dropout{background:rgba(255,90,90,0.15);color:var(--red);}
.excel-table .badge-table.partial{background:rgba(245,166,35,0.15);color:var(--orange);}
.excel-table .badge-table.paid{background:rgba(46,204,158,0.15);color:var(--green);}
.excel-table .badge-table.regulier{background:rgba(74,139,255,0.15);color:var(--blue);}
.excel-table .badge-table.exonere{background:rgba(46,204,158,0.15);color:var(--green);}
.excel-table .badge-table.listenoir{background:rgba(245,166,35,0.15);color:var(--orange);}
.excel-table .badge-table.abandon{background:rgba(255,90,90,0.15);color:var(--red);}
.excel-table .btn-icon-table{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px;transition:0.15s;font-size:14px;position:relative;overflow:hidden;}
.excel-table .btn-icon-table::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.05);border-radius:6px;transform:scale(0.8);opacity:0;transition:all 0.3s;}
.excel-table .btn-icon-table:active::after{transform:scale(1);opacity:1;transition:0s;}
.excel-table .btn-icon-table:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
.excel-table .btn-icon-table.danger:hover{background:rgba(255,90,90,0.15);color:var(--red);}
.excel-table .btn-icon-table.success:hover{background:rgba(46,204,158,0.15);color:var(--green);}
.excel-table .code-cell{font-family:monospace;color:var(--blue);font-size:13px;letter-spacing:1px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filter-group{flex:1;min-width:120px;}
.filter-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:4px;}
.filter-group select,.filter-group input{width:100%;padding:6px 12px;border-radius:var(--radius-sm);background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-primary);font-size:13px;outline:none;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-pill{
  padding:4px 14px;
  border-radius:40px;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-secondary);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:0.15s;
}
.filter-pill:hover{border-color:var(--border-hover);color:var(--text-primary);background:rgba(255,255,255,0.03);}
.filter-pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,215,0,0.04);border-bottom:1px solid rgba(255,215,0,0.06);flex-wrap:wrap;gap:6px;}
.log-item .user{font-weight:600;color:var(--gold);}
.log-item .action{color:var(--gold);font-size:13px;}
.log-item .time{color:#FCD34D;font-size:11px;}
.log-item .detail{color:#FDE68A;font-size:12px;}
.log-item .badge-log{font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;}
.log-item .badge-log.success{background:rgba(255,215,0,0.15);color:var(--gold);}
.log-item .badge-log.error{background:rgba(255,215,0,0.1);color:#FBBF24;}
.log-item .badge-log.warning{background:rgba(255,215,0,0.1);color:#FCD34D;}
.log-item .badge-log.info{background:rgba(255,215,0,0.1);color:#FDE68A;}
.audit-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,215,0,0.04);border-bottom:1px solid rgba(255,215,0,0.06);flex-wrap:wrap;gap:6px;}
.audit-item .audit-user{font-weight:600;color:var(--gold);}
.audit-item .audit-action{color:var(--gold);font-size:13px;}
.audit-item .audit-time{color:#FCD34D;font-size:11px;}
.audit-item .audit-detail{color:#FDE68A;font-size:12px;}
.audit-item .badge-audit{font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;}
.audit-item .badge-audit.desactivation{background:rgba(255,215,0,0.1);color:#FBBF24;}
.audit-item .badge-audit.reactivation{background:rgba(255,215,0,0.15);color:var(--gold);}
.audit-item .badge-audit.suppression{background:rgba(255,215,0,0.1);color:#FCD34D;}
.audit-item .badge-audit.modification{background:rgba(255,215,0,0.1);color:#FDE68A;}
.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:16px;}
.school-card{
  background:rgba(26,42,74,0.6);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  border:1px solid rgba(255,215,0,0.06);
  cursor:pointer;
  transition:all 0.3s;
  position:relative;
  overflow:hidden;
}
.school-card::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:0;
  height:2px;
  background:var(--gold);
  transition:width 0.4s ease;

.school-card:hover::after{width:100%;}

.school-card .name{font-weight:700;color:var(--gold);font-size:14px;}

.school-card .row span{background:rgba(0,0,0,0.3);padding:2px 10px;border-radius:12px;}

.eleve-item{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,215,0,0.04);font-size:13px;}

.eleve-item .info{display:flex;gap:12px;flex-wrap:wrap;}

.eleve-item .badge.abandon{color:var(--red);}
.eleve-item .badge.exonere{color:var(--green);}

.msg-bubble{max-width:84%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;position:relative;margin-bottom:6px;animation:fadeSlide 0.25s ease;}

.msg-right .msg-sender{color:var(--gold);font-weight:600;font-size:12px;}
.msg-left{align-self:flex-start;background:rgba(26,42,74,0.7);border:1px solid rgba(255,255,255,0.04);border-bottom-left-radius:6px;}
.msg-left .msg-sender{color:var(--purple);font-weight:600;font-size:12px;}
.msg-time{font-size:10px;opacity:0.6;margin-top:4px;display:block;text-align:right;}
.msg-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.msg-actions button{background:rgba(255,255,255,0.04);color:var(--text-secondary);border:none;padding:4px 12px;border-radius:30px;font-size:11px;cursor:pointer;transition:0.2s;}
.msg-actions button:hover{background:rgba(255,255,255,0.08);color:var(--text-primary);}
.msg-unread{border-left:4px solid var(--red);}
.messages-grid{padding:16px;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
.messages-grid::-webkit-scrollbar{width:5px;}
.messages-grid::-webkit-scrollbar-track{background:transparent;}
.messages-grid::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}
.send-form{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color);overflow:hidden;margin-top:18px;}
.send-form .send-header{padding:14px 20px;font-weight:700;color:var(--gold);font-size:14px;border-bottom:1px solid var(--border-color);}
.send-form .send-body{padding:16px 20px;}
.send-form textarea{width:100%;padding:14px 18px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:14px;resize:vertical;min-height:80px;font-family:inherit;transition:0.2s;line-height:1.5;}
.send-form textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,139,255,0.1);}
.send-form .btn-send{background:var(--blue);color:#fff;border:none;padding:12px;border-radius:40px;font-weight:700;cursor:pointer;width:100%;font-size:14px;transition:0.2s;position:relative;overflow:hidden;}
.send-form .btn-send::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);border-radius:40px;transform:scale(0.8);opacity:0;transition:all 0.3s;}
.send-form .btn-send:active::after{transform:scale(1);opacity:1;transition:0s;}
.send-form .btn-send:hover{background:var(--blue-dark);transform:scale(0.99);}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;background:rgba(0,0,0,0.15);border-bottom:1px solid var(--border-color);align-items:center;}
.filter-bar label{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.filter-bar select,.filter-bar input{padding:6px 12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:13px;cursor:pointer;outline:none;min-width:130px;transition:0.2s;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue);}
.filter-info{font-size:13px;color:var(--orange);margin-left:auto;}
.empty-state{text-align:center;padding:32px;color:var(--text-muted);font-size:14px;}
.empty-state .empty-icon{font-size:36px;display:block;margin-bottom:8px;}
.toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px;}
.toast{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border-radius:14px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  border-left:4px solid var(--green);
  transform:translateX(100%);
  transition:0.35s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 12px 32px rgba(0,0,0,0.7);
  font-size:13px;
  color:var(--text-primary);
  position:relative;
  overflow:hidden;
}
.toast::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  height:2px;
  background:var(--green);
  width:0%;
  animation:progressBar 3.4s linear forwards;
}
.toast.error::after{background:var(--red);}
.toast.warning::after{background:var(--orange);}
@keyframes progressBar{from{width:100%;}to{width:0%;}}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:var(--red);}
.toast.warning{border-left-color:var(--orange);}
.modal-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);
  z-index:20000;
  display:flex;
  align-items:center;
  justify-content:center;
  visibility:hidden;
  opacity:0;
  transition:0.25s;
}
.modal-overlay.show{visibility:visible;opacity:1;}
.modal-box{
  background:var(--bg-card);
  border-radius:var(--radius);
  padding:28px;
  max-width:420px;
  width:92%;
  border:1px solid var(--border-color);
  text-align:center;
  transform:scale(0.92);
  transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-box .icon{font-size:36px;margin-bottom:4px;}
.modal-box h3{color:var(--text-primary);font-weight:700;}
.modal-box p{color:var(--text-secondary);margin:6px 0 16px;}
.separator-gradient{height:1px;background:linear-gradient(90deg,var(--blue),transparent);margin:12px 0;}
.back-to-top{
  position:fixed;
  bottom:30px;
  right:30px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  border:none;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(74,139,255,0.4);
  transition:all 0.3s;
  z-index:999;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
}
.back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.back-to-top:hover{transform:scale(1.1);background:var(--blue-dark);}
.footer{text-align:center;padding:20px 0 10px 0;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border-color);margin-top:20px;}
.footer span{color:var(--blue);}

  .stats-grid{grid-template-columns:repeat(4,1fr);}
}

}
.flex{display:flex;}
.gap-2{gap:8px;}
.gap-4{gap:16px;}
.w-full{width:100%;}
.mt-2{margin-top:8px;}
.mb-2{margin-bottom:8px;}
.text-muted{color:var(--text-muted);}
.text-secondary{color:var(--text-secondary);}
.loading{color:var(--text-secondary);text-align:center;padding:30px 0;font-size:14px;}
.error{color:var(--red);text-align:center;padding:20px 0;}
.btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:40px;transition:0.15s;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;position:relative;overflow:hidden;}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.05);border-radius:40px;transform:scale(0.8);opacity:0;transition:all 0.3s;}
.btn:active::after{transform:scale(1);opacity:1;transition:0s;}
.btn:hover{background:var(--bg-card);color:var(--text-primary);}
.btn.primary{background:var(--blue);color:#fff;}

.btn.danger{background:var(--red);color:#fff;}
.btn.danger:hover{background:#e04444;}

.tooltip-trigger{position:relative;cursor:help;}
.tooltip-trigger .tooltip-text{
  visibility:hidden;
  opacity:0;
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  background:var(--bg-card);

function toast(m, t = "success") {
  const c = document.getElementById("toastContainer");
  if (!c) return;
  const ic = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
  const ti = { success: "Success", error: "Error", warning: "Warning", info: "Info" };
  const el = document.createElement("div");
  el.className = `toast ${t}`;
  el.innerHTML = `<div class="icon">${ic[t] || "📢"}</div><div class="content"><div class="title">${ti[t] || "Info"}</div><div class="message">${m}</div></div>`;
  c.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);

}
function showConfirm(t, m) {
  return new Promise((resolve) => {
    const modal = document.getElementById("confirmModal");
    if (!modal) { resolve(false); return; }
    document.getElementById("confirmTitle").textContent = t;
    document.getElementById("confirmMessage").innerHTML = m;
    modal.classList.add("show");

    const h = () => { clean(); resolve(true); };
    const n = () => { clean(); resolve(false); };
    yes.addEventListener("click", h);
    no.addEventListener("click", n);
  });
}

async function getAllSchools() {
  const schoolsRef = collection(db, "ecoles");
  const snap = await getDocs(schoolsRef);
  const schools = [];
  for (const docSnap of snap.docs) {
    const id = docSnap.id;
    const testRef = collection(db, "ecoles", id, "compta_eleves");
    const testSnap = await getDocs(testRef);
    if (testSnap.size > 0) schools.push(id);
  }
  return schools;
}
async function loadSchoolStats(schoolId) {
  const q = query(collection(db, "ecoles", schoolId, "compta_eleves"), where("_type", "==", "compta_eleve"));
  const snap = await getDocs(q);
  let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
  const eleves = [];
  for (const doc of snap.docs) {
    const d = doc.data();
    const eleve = { id: doc.id, ...d };
    if (d.abandon === true) { abandons++; eleve.statut = 'abandon'; eleves.push(eleve); continue; }
    total++;
    if (d.sexe === 'M') garcons++; else if (d.sexe === 'F') filles++;
    if (d.exonere === true) { exoneres++; eleve.statut = 'exonere'; eleves.push(eleve); continue; }
    let moisImpayes = 0;
    const paiements = d.paiements || {};
    const minerval = d.minerval || 45000;
    for (const m of moisListe) {
      const mt = paiements[m]?.montant || 0;
      if (mt < minerval) moisImpayes++;
    }
    if (moisImpayes >= 3) { listenoir++; eleve.statut = 'listenoir'; } else { reguliers++; eleve.statut = 'regulier'; }
    eleves.push(eleve);
  }
  return { total, garcons, filles, abandons, exoneres, reguliers, listenoir, eleves };
}
async function chargerEcoles() {
  try {
    const schools = await getAllSchools();
    toutesEcoles = schools.map(id => ({ id, nom: id.replace(/_/g, ' ') }));
    return toutesEcoles;
  } catch(e) { toast("Error loading schools", "error"); return []; }
}
async function chargerProfs(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_professeurs`));
    const p = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "prof") p.push({ id: d.profId || ds.id, nom: d.nom || "Unknown", code: d.code || "0000", actif: d.actif !== false });
    });
    return p;
  } catch(e) { return []; }
}
async function chargerFiches(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_fiches`));
    const f = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (!d._type) f.push({ id: ds.id, ecoleId: e, ...d });
    });
    return f;
  } catch(e) { return []; }
}
async function chargerLogs(e, last = null, lim = 20) {
  try {
    let q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), limit(lim));
    if (last) {
      const snapLast = await getDoc(doc(db, `${e}_logs`, last));
      if (snapLast.exists()) q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), startAfter(snapLast), limit(lim));
    }
    const snap = await getDocs(q);
    const l = [];
    snap.forEach(ds => { l.push({ id: ds.id, ...ds.data() }); });
    return l;
  } catch(e) { return []; }
}
async function chargerAuditLogs() {
  try {
    const snap = await getDocs(collection(db, AUDIT_COLLECTION));
    const logs = [];
    snap.forEach(ds => { logs.push({ id: ds.id, ...ds.data() }); });
    logs.sort((a, b) => new Date(b.date) - new Date(a.date));
    return logs;
  } catch(e) { return []; }
}
function isRegularStudent(eleve) {
  if (eleve.abandon) return false;
  if (eleve.exonere) return true;
  const paiements = eleve.paiements || {};
  const minerval = eleve.minerval || 45000;
  const currentPaid = (paiements[moisCourant]?.montant || 0) >= minerval;
  const prevPaid = (paiements[moisPrecedent]?.montant || 0) >= minerval;
  return currentPaid || prevPaid;
}
async function chargerTout() {
  toutesFiches = []; tousProfs = []; tousEleves = []; tousLogs = [];
  let statsMap = {};
  for (const e of toutesEcoles) {
    const stats = await loadSchoolStats(e.id);
    statsMap[e.id] = stats;
    stats.eleves.forEach(el => {
      el.ecoleNom = e.nom || e.id;
      el.ecoleId = e.id;
      el.isRegular = isRegularStudent(el);
    });
    tousEleves = tousEleves.concat(stats.eleves);
    const p = await chargerProfs(e.id);
    tousProfs = tousProfs.concat(p.map(p => ({ ...p, ecoleId: e.id, ecoleNom: e.nom || e.id })));
    const f = await chargerFiches(e.id);
    f.forEach(f => { f.ecoleNom = e.nom || e.id; });
    toutesFiches = toutesFiches.concat(f);
    const logs = await chargerLogs(e.id);
    logs.forEach(l => { l.ecoleId = e.id; l.ecoleNom = e.nom || e.id; });
    tousLogs = tousLogs.concat(logs);
  }
  let total = 0, garcons = 0, filles = 0, abandons = 0, exoneres = 0, reguliers = 0, listenoir = 0;
  for (const e of toutesEcoles) {
    const s = statsMap[e.id];
    if (s) {
      total += s.total;
      garcons += s.garcons;
      filles += s.filles;
      abandons += s.abandons;
      exoneres += s.exoneres;
      reguliers += s.reguliers;
      listenoir += s.listenoir;
    }
  }
  const regularCount = tousEleves.filter(e => !e.abandon && e.isRegular).length;
  return { total, garcons, filles, abandons, exoneres, reguliers: regularCount, listenoir };
}

function getFilteredSchools() {
  if (currentSchoolFilter === "all") return toutesEcoles;
  return toutesEcoles.filter(e => e.id === currentSchoolFilter);
}
function getFilteredMembers() {
  let members = tousEleves;
  if (currentSchoolFilter !== "all") members = members.filter(e => e.ecoleId === currentSchoolFilter);
  if (currentEleveFilter.classe) members = members.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) members = members.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) members = members.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") members = members.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") members = members.filter(e => e.abandon === true);
  else if (currentEleveFilter.statut === "exonere") members = members.filter(e => e.exonere === true);
  return members;
}

      else if (el.isRegular) { statutLabel = 'Regular'; statutClass = 'active'; }
      else if (el.statut === 'listenoir') { statutLabel = 'Blacklist'; statutClass = 'partial'; }
      html += `<tr><td>${idx+1}</td><td><strong>${escapeHtml(el.nom||'?')}</strong></td><td>${escapeHtml(el.prenom||'')}</td><td>${escapeHtml(el.classe||'-')}</td><td>${el.sexe==='F'?'👩 Girl':'👨 Boy'}</td><td>${escapeHtml(el.ecoleNom||'-')}</td><td class="col-center"><span class="badge-table ${statutClass}">${statutLabel}</span></td></tr>`;
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  container.innerHTML = html;
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', function() {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      const val = this.dataset.filter;
      if (val === 'all') currentEleveFilter.statut = '';
      else currentEleveFilter.statut = val;
      renderMembers();
    });
  });
  document.getElementById("applyMemberFilter").onclick = function() {
    currentEleveFilter.classe = document.getElementById("memberFilterClasse").value;
    currentEleveFilter.option = document.getElementById("memberFilterOption").value;
    currentEleveFilter.sexe = document.getElementById("memberFilterSexe").value;
    renderMembers();
  };
}
function renderProfs() {
  const container = document.getElementById("profsContainer");
  const profs = currentSchoolFilter === "all" ? tousProfs : tousProfs.filter(p => p.ecoleId === currentSchoolFilter);
  if (!profs.length) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">👨‍🏫</span>No teachers found</div>'; return; }
  let html = `<div class="card"><div class="card-header"><h3>👨‍🏫 Teachers <span class="count">${profs.length}</span></h3><div class="actions"><button class="btn primary sm" onclick="window.rafraichir()">🔄 Refresh</button></div></div><div class="table-wrapper"><table class="excel-table"><thead><tr><th>#</th><th>Name</th><th>Code</th><th>School</th><th class="col-center">Status</th><th class="col-center">Actions</th></tr></thead><tbody>`;
  profs.forEach((pr, idx) => {
    html += `<tr><td>${idx+1}</td><td><strong>${escapeHtml(pr.nom)}</strong></td><td><code class="code-cell">${pr.code}</code></td><td>${escapeHtml(pr.ecoleNom||pr.ecoleId)}</td><td class="col-center"><span class="badge-table ${pr.actif?'active':'inactive'}">${pr.actif?'🟢 Active':'🔴 Inactive'}</span></td><td class="col-center"><button class="btn-icon-table danger" onclick="window.supprimerProfesseur('${pr.ecoleId}','${pr.id}','${escapeHtml(pr.nom)}')" title="Delete">🗑️</button></td></tr>`;
  });
  html += '</tbody></table></div></div>';
  container.innerHTML = html;
  window.supprimerProfesseur = supprimerProfesseur;
}
function renderFiches() {
  const container = document.getElementById("fichesContainer");
  let fiches = currentSchoolFilter === "all" ? toutesFiches : toutesFiches.filter(f => f.ecoleId === currentSchoolFilter);
  if (!fiches.length) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">📄</span>No sheets found</div>'; return; }
  let html = `<div class="card"><div class="card-header"><h3>📄 Sheets <span class="count">${fiches.length}</span></h3><div class="actions"><button class="btn primary sm" onclick="window.rafraichir()">🔄 Refresh</button></div></div><div class="table-wrapper"><table class="excel-table"><thead><tr><th>#</th><th>Subject</th><th>Class</th><th>Option</th><th>School</th><th class="col-center">👥 Students</th><th class="col-center">Actions</th></tr></thead><tbody>`;
  fiches.forEach((f, idx) => {
    const nb = f.eleves ? f.eleves.length : 0;
    html += `<tr><td>${idx+1}</td><td><strong>${escapeHtml(f.cours||'No subject')}</strong></td><td>${escapeHtml(f.classe||'-')}</td><td>${escapeHtml(f.option||'-')}</td><td>${escapeHtml(f.ecoleNom||'-')}</td><td class="col-center"><span style="color:var(--purple);font-weight:600;">${nb}</span></td><td class="col-center"><button class="btn-icon-table danger" onclick="window.supprimerFiche('${f.ecoleId}','${f.id}','${escapeHtml(f.cours||'No subject')}')" title="Delete">🗑️</button></td></tr>`;
  });
  html += '</tbody></table></div></div>';
  container.innerHTML = html;
  window.supprimerFiche = supprimerFiche;
}
function renderLogs() {
  const container = document.getElementById("logsContainer");
  let logs = tousLogs;
  if (currentSchoolFilter !== "all") logs = logs.filter(l => l.ecoleId === currentSchoolFilter);
  if (!logs.length) { container.innerHTML = '<div class="card"><div class="card-header"><h3>📊 Logs</h3></div><div class="empty-state"><span class="empty-icon">📭</span>No logs found</div></div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>📊 Logs <span class="count">'+logs.length+'</span></h3></div><div class="table-wrapper"><table class="excel-table"><thead><tr><th>User</th><th>Action</th><th>Details</th><th>Time</th><th>School</th></tr></thead><tbody>';
  logs.slice(0, 50).forEach(log => {
    const actionMap = { connexion_reussie: "Login", creation_fiche: "Create sheet", modification_fiche: "Edit", suppression_fiche: "Delete", connexion: "Login", creation: "Create", modification: "Edit", suppression: "Delete" };
    const actionLabel = actionMap[log.action] || log.action;
    const badgeClass = (log.action === "suppression" || log.action === "suppression_fiche") ? "error" : (log.action === "connexion" || log.action === "connexion_reussie") ? "success" : (log.action === "modification" || log.action === "modification_fiche") ? "warning" : "info";
    html += `<tr><td><strong>${log.utilisateur||"Unknown"}</strong></td><td><span class="badge-log ${badgeClass}">${actionLabel}</span></td><td>${log.details?.cours ? log.details.cours + ' ' + (log.details.classe||'') : '-'}</td><td>${formatDate(log.date)}</td><td>${log.ecoleNom||'-'}</td></tr>`;
  });
  if (logs.length > 50) html += `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:8px;">+ ${logs.length-50} more logs</td></tr>`;
  html += '</tbody></table></div></div>';
  container.innerHTML = html;
}
function renderAudit() {
  const container = document.getElementById("auditContainer");
  let audit = auditList;
  if (currentSchoolFilter !== "all") audit = audit.filter(a => a.details?.ecole === currentSchoolFilter || a.details?.school === currentSchoolFilter);
  if (!audit.length) { container.innerHTML = '<div class="card"><div class="card-header"><h3>📜 Audit</h3></div><div class="empty-state"><span class="empty-icon">📜</span>No records found</div></div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>📜 Audit <span class="count">'+audit.length+'</span></h3></div><div class="table-wrapper"><table class="excel-table"><thead><tr><th>User</th><th>Action</th><th>Details</th><th>Time</th></tr></thead><tbody>';
  const labels = { desactivation: 'Deactivation', reactivation: 'Reactivation', suppression: 'Deletion', modification: 'Modification' };
  audit.slice(0, 100).forEach(a => {
    const badgeClass = a.action === 'desactivation' ? 'desactivation' : a.action === 'reactivation' ? 'reactivation' : a.action === 'suppression' ? 'suppression' : 'modification';
    html += `<tr><td><strong>${a.utilisateur||"Unknown"}</strong></td><td><span class="badge-audit ${badgeClass}">${labels[a.action]||a.action}</span></td><td>${a.details ? JSON.stringify(a.details) : '-'}</td><td>${formatDate(a.date)}</td></tr>`;
  });
  html += '</tbody></table></div></div>';
  container.innerHTML = html;
}
function getFloryReadMessages() {
  try { return JSON.parse(localStorage.getItem(READ_STATUS_KEY) || '[]'); } catch(e) { return []; }
}
function saveFloryReadMessages(list) { localStorage.setItem(READ_STATUS_KEY, JSON.stringify(list)); }
function isFloryMessageRead(id) { return getFloryReadMessages().includes(id); }
function renderFlory() {
  const container = document.getElementById("floryContainer");
  let html = `<div class="dashboard-grid"><div class="card"><div class="card-header"><h3>📋 Communication</h3><button class="btn outline sm" id="markAllReadFlory">✅ Mark all as read</button></div><div id="floryMessagesGrid" class="messages-grid">${floryMessages.length===0?'<div class="empty-state"><span class="empty-icon">💬</span>No messages</div>':''}</div></div><div class="card"><div class="send-form" style="border:none;border-radius:0;background:transparent;margin-top:0;"><div class="send-header">✏️ Send message to Ursule Nyandji</div><div class="send-body"><textarea id="floryMessage" rows="3" placeholder="Write your message for Ursule Nyandji..."></textarea><button id="sendFloryBtn" class="btn-send">📤 SEND TO URSULE NYANDJI</button></div></div></div></div>`;
  container.innerHTML = html;
  const grid = document.getElementById('floryMessagesGrid');
  if (floryMessages.length > 0) {
    grid.innerHTML = '';
    floryMessages.forEach(msg => {
      const date = new Date(msg.date).toLocaleString('en-US');
      const isFlory = msg.sender === "flory" || msg.nom === "Flory";
      const isUrsule = msg.sender === "ursule" || msg.nom === "Ursule Nyandji";
      const unread = isUrsule && !isFloryMessageRead(msg.id);
      const div = document.createElement('div');
      div.className = `msg-bubble ${isFlory?'msg-right':'msg-left'}${unread?' msg-unread':''}`;
      div.innerHTML = `<span class="msg-sender">${isFlory?'👤 Flory (Me)':'👩 Ursule Nyandji'}</span>${unread?' <span style="font-size:10px;background:#FF5A5A;color:white;padding:2px 8px;border-radius:30px;margin-left:4px;">🔴 UNREAD</span>':''}<div>${escapeHtml(msg.message||'')}</div><span class="msg-time">${date}</span><div class="msg-actions"><button class="btn-copy-msg" data-msg="${escapeHtml(msg.message||'')}">📋 Copy</button>${isUrsule&&unread?`<button class="btn-mark-read" data-id="${msg.id}">✅ Mark as read</button>`:''}<button class="btn-delete-msg" data-id="${msg.id}" data-type="flory">🗑️</button></div></div>`;
      grid.appendChild(div);
      div.querySelector('.btn-copy-msg')?.addEventListener('click', () => { navigator.clipboard.writeText(msg.message||''); toast("Copied",'success'); });
      div.querySelector('.btn-mark-read')?.addEventListener('click', () => { const list=getFloryReadMessages(); if(!list.includes(msg.id)){list.push(msg.id);saveFloryReadMessages(list);renderFlory();} });
      div.querySelector('.btn-delete-msg')?.addEventListener('click', async () => { if(await showConfirm('Delete','Delete this message?')){ try{ const toRemove=floryMessages.find(m=>m.id===msg.id); if(toRemove){ await updateDoc(floryDocRef,{messages:arrayRemove(toRemove)}); floryMessages=floryMessages.filter(m=>m.id!==msg.id); renderFlory(); toast("Message deleted",'success'); } }catch(e){ toast("Error: "+e.message,"error"); } } });
    });
    grid.scrollTop = grid.scrollHeight;
  }
  document.getElementById('markAllReadFlory')?.addEventListener('click', () => {
    const unreadIds = floryMessages.filter(m => m.sender === "ursule" && !isFloryMessageRead(m.id)).map(m => m.id);
    const list = getFloryReadMessages();
    unreadIds.forEach(id => { if (!list.includes(id)) list.push(id); });
    saveFloryReadMessages(list);
    renderFlory();
    toast("All marked as read", 'success');
  });
  document.getElementById('sendFloryBtn')?.addEventListener('click', async () => {
    const textarea = document.getElementById('floryMessage');
    const msg = textarea.value.trim();
    if (!msg) { toast("Message is empty", 'warning'); return; }
    const newMsg = { id: Date.now().toString()+Math.random().toString(36).substr(2,4), nom: "Flory", message: msg, date: new Date().toISOString(), sender: "flory", type: "new_message" };
    try {
      await updateDoc(floryDocRef, { messages: arrayUnion(newMsg) });
      textarea.value = '';
      toast("Message sent to Ursule Nyandji", 'success');
      renderFlory();
    } catch(e) {
      floryMessages = [...floryMessages, newMsg];
      renderFlory();
      toast("Message queued (offline)", 'warning');
    }
  });
}
function renderParental() {
  const container = document.getElementById("parentalContainer");
  const codes = new Map();
  tousEleves.forEach(e => {
    if (e.parentCode && !e.abandon) {
      if (!codes.has(e.parentCode)) codes.set(e.parentCode, []);
      codes.get(e.parentCode).push(e);
    }
  });
  let html = `<div class="card"><div class="card-header"><h3>👨‍👩‍👧‍👦 Parental Space</h3></div><div class="filter-row"><div class="filter-group"><label>🔍 Parent Code</label><input type="text" id="searchParentCode" placeholder="6 digits" maxlength="6"></div><div class="filter-group" style="flex:0.5;"><button class="btn primary" id="searchParentBtn" style="width:100%;">🔍 Search</button></div></div><div id="parentalResult"></div></div><div class="card"><div class="card-header"><h3>📊 Parental Statistics</h3></div><div class="stats-grid" style="grid-template-columns:repeat(4,1fr);"><div class="stat-card"><div class="stat-value"><span class="blue">${codes.size}</span></div><div class="stat-label">Families</div></div><div class="stat-card"><div class="stat-value"><span class="purple">${tousEleves.filter(e=>e.parentCode&&!e.abandon).length}</span></div><div class="stat-label">With code</div></div><div class="stat-card"><div class="stat-value"><span class="danger">${tousEleves.filter(e=>!e.parentCode&&!e.abandon).length}</span></div><div class="stat-label">Without code</div></div><div class="stat-card"><div class="stat-value"><span class="green">${[...codes.values()].filter(f=>f.length>1).length}</span></div><div class="stat-label">Multi-children</div></div></div></div>`;
  container.innerHTML = html;
  document.getElementById("searchParentBtn").onclick = function() {
    const code = document.getElementById("searchParentCode").value.trim();
    const resultDiv = document.getElementById("parentalResult");
    if (!code || code.length !== 6) { resultDiv.innerHTML = '<div class="empty-state">🔑 Enter a valid parent code (6 digits)</div>'; return; }
    const enfants = codes.get(code) || [];
    if (enfants.length === 0) { resultDiv.innerHTML = `<div class="empty-state">🔑 No student found with code ${code}</div>`; return; }
    let html2 = `<div style="background:rgba(74,139,255,0.08);border-radius:12px;padding:16px;border-left:3px solid var(--blue);margin-top:12px;"><div style="font-weight:700;font-size:16px;color:var(--gold);">🔑 Code ${code} - ${enfants.length} child(ren)</div>`;
    for (const e of enfants) {
      const sexe = e.sexe === "F" ? "👩" : "👨";
      html2 += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;"><span>${sexe} ${e.nom} ${e.postnom||""} ${e.prenom||""}</span><span>📚 ${e.classe||""} ${e.option?"("+e.option+")":""}</span><span>🏫 ${e.ecoleNom||""}</span></div>`;
    }
    html2 += '</div>';
    resultDiv.innerHTML = html2;
  };
}
function listenToFlory() {
  if (unsubscribeFlory) unsubscribeFlory();
  unsubscribeFlory = onSnapshot(floryDocRef, snap => {
    if (snap.exists()) {
      const data = snap.data();
      floryMessages = (data.messages || []).sort((a,b) => new Date(a.date) - new Date(b.date));
      if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
    }
  }, () => {});
}
function listenToSupport() {
  if (unsubscribeSupport) unsubscribeSupport();
  unsubscribeSupport = onSnapshot(supportDocRef, snap => {
    if (snap.exists()) {
      const data = snap.data();
      supportMessages = (data.messages || []).sort((a,b) => new Date(a.date) - new Date(b.date));
    }
  }, () => {});
}
function setupTabs() {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(el => {
    el.addEventListener("click", function() {
      const target = this.dataset.tab;
      if (!target) return;
      document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      const container = document.getElementById(target + "Container");
      if (container) container.classList.add("active");
      if (target === "dashboard") renderDashboard();
      else if (target === "members") renderMembers();
      else if (target === "logs") renderLogs();
      else if (target === "audit") renderAudit();
      else if (target === "flory") renderFlory();
      else if (target === "ecoles") renderEcoles();
      else if (target === "profs") renderProfs();
      else if (target === "fiches") renderFiches();
      else if (target === "parental") renderParental();
      document.getElementById("breadcrumb").textContent = this.textContent.trim();
      document.getElementById("pageTitle").textContent = this.textContent.trim();
    });
  });
}
function setupSchoolFilter() {
  document.getElementById("schoolFilter").addEventListener("change", function() {
    currentSchoolFilter = this.value;
    renderEcoles(); renderProfs(); renderFiches(); renderLogs(); renderAudit(); renderMembers(); renderParental();
    if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
    if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  });
}
async function initSchoolSelect() {
  const select = document.getElementById("schoolFilter");
  select.innerHTML = '<option value="all">🌍 All Schools</option>';
  toutesEcoles.forEach(e => { select.innerHTML += `<option value="${e.id}">🏫 ${e.nom||e.id}</option>`; });
}
async function rafraichir() {
  const btn = document.getElementById('syncBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '⏳ Syncing...';
  btn.disabled = true;
  await chargerEcoles();
  await initSchoolSelect();
  const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
  updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
  auditList = await chargerAuditLogs();
  renderEcoles(); renderProfs(); renderFiches(); renderMembers(); renderLogs(); renderAudit(); renderParental();
  if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
  if (document.getElementById("floryContainer").classList.contains("active")) renderFlory();
  btn.innerHTML = '✅ Synced';
  setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 1000);
  toast("Data refreshed", "info");
}
window.rafraichir = rafraichir;
window.showSchoolEleves = function(schoolId) {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.querySelector('[data-tab="members"]').classList.add("active");
  document.getElementById("membersContainer").classList.add("active");
  document.getElementById("schoolFilter").value = schoolId;
  currentSchoolFilter = schoolId;
  renderMembers(); renderEcoles(); renderProfs(); renderFiches(); renderLogs(); renderAudit(); renderParental();
  toast(`👥 Students of ${schoolId.replace(/_/g, ' ')}`, "info");
};
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('globalSearch')?.focus(); toast("🔍 Global search", "info"); }
  if (e.key === 'Escape') { document.getElementById('globalSearch')?.blur(); }
});
document.getElementById("sidebarToggle")?.addEventListener("click", function() {
  document.getElementById("sidebar").classList.toggle("collapsed");
  const btn = this;
  const isCollapsed = document.getElementById("sidebar").classList.contains("collapsed");
  btn.innerHTML = isCollapsed ? '▶ <span>Expand</span>' : '◀ <span>Collapse</span>';
});
document.getElementById("backToTop")?.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
window.addEventListener('scroll', () => {
  const btn = document.getElementById("backToTop");
  if (window.scrollY > 300) btn.classList.add('show');
  else btn.classList.remove('show');
});
async function supprimerProfesseur(ecoleId, profId, profNom) {
  if (await showConfirm("Delete Teacher", `Delete <strong>${profNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try { await deleteDoc(doc(db, `${ecoleId}_professeurs`, profId)); toast(`Teacher ${profNom} deleted`, "success"); await rafraichir(); } catch(e) { toast("Error: " + e.message, "error"); }
  }
}
window.supprimerProfesseur = supprimerProfesseur;
async function supprimerFiche(ecoleId, ficheId, ficheNom) {
  if (await showConfirm("Delete Sheet", `Delete sheet <strong>${ficheNom}</strong> from ${ecoleId}?<br><br>This action is irreversible.`)) {
    try { await deleteDoc(doc(db, `${ecoleId}_fiches`, ficheId)); toast(`Sheet ${ficheNom} deleted`, "success"); await rafraichir(); } catch(e) { toast("Error: " + e.message, "error"); }
  }
}
window.supprimerFiche = supprimerFiche;
(async function init() {
  try {
    await chargerEcoles();
    await initSchoolSelect();
    const { total, garcons, filles, abandons, exoneres, reguliers, listenoir } = await chargerTout();
    updateStats(total, garcons, filles, abandons, exoneres, reguliers, listenoir);
    auditList = await chargerAuditLogs();
    listenToFlory();
    listenToSupport();
    renderDashboard();
    renderEcoles(); renderProfs(); renderFiches(); renderMembers(); renderLogs(); renderAudit(); renderParental();
    setupTabs();
    setupSchoolFilter();
    toast("🚀 Dashboard ready", "success");
  } catch(e) {
    document.getElementById("dashboardContainer").innerHTML = `<div class="empty-state" style="color:var(--red);">❌ Error: ${e.message}<br><button class="btn primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Retry</button></div>`;
    toast("Loading error", "error");
  }
})();
</script>
