<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Administration - Gestion Complète</title>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e0f2fe;padding:16px;line-height:1.6;font-size:16px;overflow-x:hidden}
.container{max-width:1400px;margin:0 auto;width:100%}
.header{background:linear-gradient(145deg,#0f1f33,#060d1a);border-radius:20px;padding:20px 24px;margin-bottom:20px;border:1px solid rgba(255,215,0,.12);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#facc15,#e6b800);padding:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(250,204,21,.25)}
.logo img{width:100%;height:100%;object-fit:contain}
.header-text h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#facc15,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-text p{font-size:.85rem;color:#94a3b8;margin-top:2px}
.header-text p span{color:#8b5cf6;font-weight:600}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;border:none;padding:8px 18px;border-radius:30px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-outline{background:transparent;border:1px solid rgba(255,215,0,.12);color:#94a3b8}
.btn-outline:hover{background:rgba(255,215,0,.06);color:#facc15;border-color:#facc15}
.btn-sm{padding:4px 12px;font-size:.75rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:linear-gradient(145deg,#0f1f33,#0a1628);border-radius:14px;padding:14px 18px;border:1px solid rgba(255,215,0,.06);text-align:center;transition:all .3s}
.stat-card:hover{transform:translateY(-3px);border-color:rgba(255,215,0,.15)}
.stat-value{font-size:1.8rem;font-weight:800;color:#facc15;line-height:1.2}
.stat-value.danger{color:#ef4444}
.stat-value.success{color:#10b981}
.stat-value.purple{color:#8b5cf6}
.stat-label{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:2px}
.ecole-card{background:linear-gradient(145deg,#0f1f33,#0a1628);border-radius:16px;margin-bottom:16px;overflow:hidden;border:1px solid rgba(255,215,0,.06);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.ecole-header{background:linear-gradient(145deg,#0f1f33,#0a1628);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid rgba(255,215,0,.05)}
.ecole-header .nom{font-size:1.1rem;font-weight:700;color:#facc15}
.ecole-header .id{font-size:.7rem;color:#94a3b8;font-family:monospace}
.ecole-header .stats{display:flex;gap:6px;flex-wrap:wrap}
.ecole-header .stats .badge{background:rgba(59,130,246,.15);padding:2px 10px;border-radius:20px;font-size:.7rem;color:#60a5fa}
.ecole-header .stats .badge.green{background:rgba(16,185,129,.15);color:#10b981}
.ecole-header .stats .badge.purple{background:rgba(139,92,246,.15);color:#8b5cf6}
.ecole-actions{display:flex;gap:4px;flex-wrap:wrap}
.section-profs,.section-fiches{padding:8px 14px}
.section-title{font-size:.8rem;font-weight:600;color:#60a5fa;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.section-title .count{background:rgba(59,130,246,.15);padding:0 8px;border-radius:20px;font-size:.65rem;color:#94a3b8}
.prof-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(59,130,246,.05);flex-wrap:wrap;gap:4px;background:rgba(0,0,0,.15);border-radius:8px;margin-bottom:4px}
.prof-item .info{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem}
.prof-item .name{font-weight:600;color:#fff}
.prof-item .code{color:#94a3b8;font-size:.7rem;font-family:monospace}
.prof-item .status{font-size:.65rem;padding:1px 8px;border-radius:20px}
.prof-item .status.active{background:rgba(16,185,129,.2);color:#10b981}
.prof-item .status.inactive{background:rgba(239,68,68,.2);color:#ef4444}
.fiche-item{display:flex;flex-direction:column;padding:6px 10px;border-bottom:1px solid rgba(59,130,246,.05);gap:3px;background:rgba(0,0,0,.1);border-radius:8px;margin-bottom:4px}
.fiche-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.fiche-item .cours{font-weight:600;color:#fff;font-size:.85rem}
.fiche-item .classe{color:#94a3b8;font-size:.75rem}
.fiche-item .option{background:rgba(255,215,0,.12);padding:1px 8px;border-radius:20px;font-size:.7rem;color:#fbbf24}
.fiche-item .ref{color:#64748b;font-size:.65rem;font-family:monospace}
.fiche-item .eleves-list{color:#60a5fa;font-size:.75rem;word-break:break-all}
.empty-state{text-align:center;padding:24px;color:#94a3b8;font-size:.9rem}
.loading{text-align:center;padding:30px;color:#60a5fa;font-size:.9rem}
.loading::before{content:"";display:inline-block;width:16px;height:16px;border:3px solid rgba(255,215,0,.15);border-top-color:#facc15;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-container{position:fixed;top:12px;right:12px;left:12px;z-index:10000;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:400px;margin:0 auto}
.toast{background:rgba(15,23,42,.96);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-left:4px solid #10b981;transform:translateX(100%);transition:transform .3s;pointer-events:auto;box-shadow:0 8px 32px rgba(0,0,0,.5);font-size:.85rem}
.toast.show{transform:translateX(0)}
.toast.error{border-left-color:#ef4444}
.toast.warning{border-left-color:#f59e0b}
.toast .icon{font-size:1.1rem}
.toast .content{flex:1}
.toast .title{font-weight:600;font-size:.8rem;color:#fff}
.toast .message{font-size:.75rem;color:#94a3b8}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s}
.modal-overlay.show{visibility:visible;opacity:1}
.modal-box{background:linear-gradient(145deg,#0f1f33,#060d1a);border-radius:20px;padding:24px;max-width:420px;width:92%;border:1px solid rgba(255,215,0,.12);text-align:center}
.modal-box .icon{font-size:2.5rem;margin-bottom:8px}
.modal-box h3{color:#facc15;font-size:1.1rem;margin-bottom:6px}
.modal-box p{color:#94a3b8;font-size:.9rem;margin-bottom:16px;line-height:1.5}
.modal-box .buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal-box .btn{min-width:90px}
@media(max-width:768px){body{padding:10px}.stats-grid{grid-template-columns:repeat(2,1fr)}.stat-value{font-size:1.4rem}.header{padding:14px 16px}.header-text h1{font-size:1.2rem}.ecole-header{flex-direction:column;align-items:stretch;text-align:center}.ecole-header .stats{justify-content:center}.ecole-actions{justify-content:center}.prof-item,.fiche-item .top{flex-direction:column;text-align:center}.prof-item .info{justify-content:center}.toast-container{top:8px;right:8px;left:8px}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr 1fr;gap:8px}.stat-card{padding:10px 12px}.stat-value{font-size:1.2rem}.btn{font-size:.75rem;padding:6px 12px}.section-title{font-size:.7rem}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="header-left">
<div class="logo"><img src="https://www.netubex.com/favicon.png.png" alt="NETUBEX" onerror="this.style.display='none'"></div>
<div class="header-text"><h1>🏫 Administration</h1><p>Gestion <span>complète</span></p></div>
</div>
<div class="header-actions">
<button class="btn btn-danger btn-sm" onclick="window.toutSupprimer()">🗑️ TOUT</button>
<button class="btn btn-primary btn-sm" onclick="window.rafraichir()">🔄</button>
</div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="statEcoles">0</div><div class="stat-label">🏫 Écoles</div></div>
<div class="stat-card"><div class="stat-value purple" id="statProfs">0</div><div class="stat-label">👨‍🏫 Profs</div></div>
<div class="stat-card"><div class="stat-value success" id="statFiches">0</div><div class="stat-label">📄 Fiches</div></div>
<div class="stat-card"><div class="stat-value" id="statEleves">0</div><div class="stat-label">👥 Élèves</div></div>
</div>
<div id="ecolesContainer"><div class="loading">Chargement des données...</div></div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="confirmModal">
<div class="modal-box">
<div class="icon">⚠️</div>
<h3 id="confirmTitle">Confirmation</h3>
<p id="confirmMessage">Êtes-vous sûr ?</p>
<div class="buttons">
<button class="btn btn-danger" id="confirmYes">OUI</button>
<button class="btn btn-outline" id="confirmNo">ANNULER</button>
</div>
</div>
</div>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,deleteDoc,doc}from"firebase/firestore";

const firebaseConfig={
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let toutesEcoles=[],toutesFiches=[],tousProfs=[];

function toast(m,t='success'){
const c=document.getElementById('toastContainer');if(!c)return;
const ic={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
const ti={success:'Succès',error:'Erreur',warning:'Attention',info:'Info'};
const el=document.createElement('div');
el.className=`toast ${t}`;
el.innerHTML=`<div class="icon">${ic[t]||'📢'}</div><div class="content"><div class="title">${ti[t]||'Info'}</div><div class="message">${m}</div></div>`;
c.appendChild(el);
setTimeout(()=>el.classList.add('show'),10);
setTimeout(()=>{el.classList.remove('show');setTimeout(()=>{if(el.parentNode)el.remove()},300);},3500);
}

function showConfirm(t,m,onConfirm){
const modal=document.getElementById('confirmModal');
if(!modal)return;
document.getElementById('confirmTitle').textContent=t;
document.getElementById('confirmMessage').innerHTML=m;
modal.classList.add('show');
const yes=document.getElementById('confirmYes');
const no=document.getElementById('confirmNo');
const clean=()=>{modal.classList.remove('show');yes.removeEventListener('click',h);no.removeEventListener('click',clean);};
const h=()=>{clean();if(onConfirm)onConfirm();};
yes.addEventListener('click',h);
no.addEventListener('click',clean);
}

async function chargerEcoles(){
try{const snap=await getDocs(collection(db,"ecoles_autorisees"));toutesEcoles=[];snap.forEach(ds=>{toutesEcoles.push({id:ds.id,...ds.data()});});return toutesEcoles;}catch(e){toast("❌ Erreur chargement écoles","error");return[];}
}

async function chargerProfs(e){
try{const snap=await getDocs(collection(db,`${e}_professeurs`));const p=[];snap.forEach(ds=>{const d=ds.data();if(d._type==='prof'){p.push({id:d.profId||ds.id,nom:d.nom||'Inconnu',code:d.code||'0000',actif:d.actif!==false});}});return p;}catch(e){return[];}
}

async function chargerFiches(e){
try{const snap=await getDocs(collection(db,`${e}_fiches`));const f=[];snap.forEach(ds=>{const d=ds.data();if(!d._type){f.push({id:ds.id,ecoleId:e,...d});}});return f;}catch(e){return[];}
}

async function chargerTout(){
document.getElementById('ecolesContainer').innerHTML='<div class="loading">Chargement des données...</div>';
toutesFiches=[];tousProfs=[];let total=0;
for(const e of toutesEcoles){
const p=await chargerProfs(e.id);
tousProfs=tousProfs.concat(p.map(p=>({...p,ecoleId:e.id,ecoleNom:e.nom||e.id})));
const f=await chargerFiches(e.id);
f.forEach(f=>{f.ecoleNom=e.nom||e.id;});
toutesFiches=toutesFiches.concat(f);
f.forEach(f=>{if(f.eleves)total+=f.eleves.length;});
}
return{total};
}

async function supprimerEcole(id){
try{
const f=await getDocs(collection(db,`${id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",id));}catch(e){}
toast(`✅ École supprimée`,'success');await rafraichir();
}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function supprimerProf(e,id,n){
try{await deleteDoc(doc(db,`${e}_professeurs`,id));toast(`✅ ${n} supprimé`,'success');await rafraichir();}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function supprimerFiche(e,id,c){
try{await deleteDoc(doc(db,`${e}_fiches`,id));toast(`✅ ${c} supprimée`,'success');await rafraichir();}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function toutSupprimer(){
showConfirm("🗑️ RÉINITIALISATION",
`⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${toutesEcoles.length} écoles<br>${tousProfs.length} professeurs<br>${toutesFiches.length} fiches`,
async()=>{
try{
for(const e of toutesEcoles){
const f=await getDocs(collection(db,`${e.id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${e.id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",e.id));}catch(e){}
}
toast('✅ Tout supprimé','success');await rafraichir();
}catch(e){toast(`❌ ${e.message}`,'error');}
});
}

function afficher(total){
const c=document.getElementById('ecolesContainer');if(!c)return;
if(!toutesEcoles.length){c.innerHTML='<div class="empty-state">📭 Aucune école enregistrée</div>';return;}
document.getElementById('statEcoles').textContent=toutesEcoles.length;
document.getElementById('statProfs').textContent=tousProfs.length;
document.getElementById('statFiches').textContent=toutesFiches.length;
document.getElementById('statEleves').textContent=total;
let html='';
for(const e of toutesEcoles){
const p=tousProfs.filter(p=>p.ecoleId===e.id);
const f=toutesFiches.filter(f=>f.ecoleId===e.id);
const nb=f.reduce((s,f)=>{if(f.eleves)s+=f.eleves.length;return s;},0);
html+=`<div class="ecole-card"><div class="ecole-header">
<div><div class="nom">🏫 ${e.nom||e.id}</div><div class="id">${e.id}</div></div>
<div class="stats"><span class="badge">👨‍🏫 ${p.length}</span><span class="badge green">📄 ${f.length}</span><span class="badge purple">👥 ${nb}</span></div>
<div class="ecole-actions"><button class="btn btn-danger btn-sm" onclick="window.suppEcole('${e.id}')">🗑️</button></div>
</div>`;
if(p.length){
html+=`<div class="section-profs"><div class="section-title">👨‍🏫 Professeurs <span class="count">${p.length}</span></div>`;
for(const pr of p){
html+=`<div class="prof-item"><div class="info"><span class="name">${pr.nom}</span><span class="code">${pr.code}</span><span class="status ${pr.actif?'active':'inactive'}">${pr.actif?'Actif':'Inactif'}</span></div><button class="btn btn-danger btn-sm" onclick="window.suppProf('${e.id}','${pr.id}','${pr.nom}')">✕</button></div>`;
}
html+=`</div>`;
}
if(f.length){
html+=`<div class="section-fiches"><div class="section-title">📄 Fiches <span class="count">${f.length}</span></div>`;
for(const fc of f){
const eleves=fc.eleves||[];
const noms=eleves.slice(0,3).map(e=>e.nom||'?').join(', ')+(eleves.length>3?` +${eleves.length-3}`:'');
html+=`<div class="fiche-item"><div class="top"><div><span class="cours">📘 ${fc.cours||'?'}</span><span class="classe">${fc.classe||'?'}</span>${fc.option?`<span class="option">${fc.option}</span>`:''}${fc.numeroRef?`<span class="ref">#${fc.numeroRef}</span>`:''}</div><button class="btn btn-danger btn-sm" onclick="window.suppFiche('${e.id}','${fc.id}','${fc.cours||'?'}')">✕</button></div><div class="eleves-list">👥 ${eleves.length} élèves: ${noms||'Aucun'}</div></div>`;
}
html+=`</div>`;
}
html+=`</div>`;
}
c.innerHTML=html;
}

window.suppEcole=function(id){const e=toutesEcoles.find(e=>e.id===id);showConfirm("🗑️ Supprimer",`⚠️ <strong>${e?.nom||id}</strong><br><br>Action irréversible !`,()=>supprimerEcole(id));};
window.suppProf=function(e,id,n){showConfirm("🗑️ Supprimer",`⚠️ <strong>${n}</strong><br><br>Action irréversible !`,()=>supprimerProf(e,id,n));};
window.suppFiche=function(e,id,c){showConfirm("🗑️ Supprimer",`⚠️ <strong>${c}</strong><br><br>Action irréversible !`,()=>supprimerFiche(e,id,c));};
window.toutSupprimer=toutSupprimer;
window.rafraichir=rafraichir;

async function rafraichir(){
await chargerEcoles();
const {total}=await chargerTout();
afficher(total);
toast('✅ Données actualisées','info');
}

// ====== INITIALISATION COMME DANS TON EXEMPLE ======
(async function init() {
console.log("🚀 Initialisation du panneau d'administration...");
try {
await rafraichir();
console.log(`✅ Chargé: ${toutesEcoles.length} écoles, ${tousProfs.length} professeurs, ${toutesFiches.length} fiches`);
toast('✅ Données chargées avec succès','success');
} catch(e) {
console.error("❌ Erreur d'initialisation:", e);
document.getElementById('ecolesContainer').innerHTML = `
<div class="empty-state" style="color:#ef4444;">
❌ Erreur de chargement: ${e.message}<br>
<button class="btn btn-primary" onclick="window.rafraichir()" style="margin-top:16px;">🔄 Réessayer</button>
</div>
`;
toast('❌ Erreur de chargement des données','error');
}
})();
</script>
</body>
</html>
