<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>Dashboard · NETUBEX</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b1324;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8edf5;padding:16px;line-height:1.4;min-height:100vh}
    .container{max-width:1440px;margin:0 auto}

    .glass{background:rgba(16,28,52,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(59,130,246,0.15);box-shadow:0 12px 40px -8px rgba(0,0,0,0.7), inset 0 1px 0 rgba(59,130,246,0.05);border-radius:24px}

    .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 24px;margin-bottom:24px}
    .header-left{display:flex;align-items:center;gap:16px}
    .logo-badge{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(59,130,246,0.3)}
    .logo-badge img{width:60%;height:60%;object-fit:contain;filter:brightness(0)invert(1)}
    .header-text h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;color:#e8edf5}
    .header-text h1 span{color:#60a5fa}
    .header-text p{font-size:.85rem;color:#8ba0c7;letter-spacing:0.3px}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}

    .btn{background:transparent;border:none;padding:6px 18px;border-radius:40px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
    .btn:active{transform:scale(.94)}
    .btn-danger{background:#ef4444;color:#fff;box-shadow:0 4px 12px rgba(239,68,68,0.2)}
    .btn-danger:hover{background:#dc2626;box-shadow:0 6px 16px rgba(239,68,68,0.3)}
    .btn-primary{background:#3b82f6;color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
    .btn-primary:hover{background:#2563eb;box-shadow:0 6px 16px rgba(59,130,246,0.4)}
    .btn-outline{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.15);color:#8ba0c7}
    .btn-outline:hover{background:rgba(59,130,246,0.15);color:#60a5fa;border-color:#3b82f6}
    .btn-success{background:#10b981;color:#fff;box-shadow:0 4px 12px rgba(16,185,129,0.2)}
    .btn-success:hover{background:#059669;box-shadow:0 6px 16px rgba(16,185,129,0.3)}
    .btn-sm{padding:4px 14px;font-size:.7rem;border-radius:32px}

    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .stat-card{background:rgba(16,28,52,0.7);backdrop-filter:blur(6px);border-radius:20px;padding:16px 12px;border:1px solid rgba(59,130,246,0.08);text-align:center;transition:all .2s}
    .stat-card:hover{border-color:rgba(59,130,246,0.25);background:rgba(16,28,52,0.85)}
    .stat-value{font-size:1.9rem;font-weight:800;color:#60a5fa;line-height:1.2;letter-spacing:-0.02em}
    .stat-value.danger{color:#ef4444}
    .stat-value.success{color:#34d399}
    .stat-value.purple{color:#a78bfa}
    .stat-value.orange{color:#f59e0b}
    .stat-label{font-size:.7rem;color:#8ba0c7;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:4px}

    .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;background:rgba(16,28,52,0.5);padding:6px;border-radius:16px;border:1px solid rgba(59,130,246,0.08)}
    .tab{background:transparent;border:none;padding:8px 20px;border-radius:12px;font-size:.85rem;font-weight:600;color:#8ba0c7;cursor:pointer;transition:all .2s;flex:1;min-width:80px;text-align:center}
    .tab:hover{color:#e8edf5;background:rgba(59,130,246,0.1)}
    .tab.active{background:#3b82f6;color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
    .tab-content{display:none}
    .tab-content.active{display:block}

    .section-card{background:rgba(16,28,52,0.6);backdrop-filter:blur(6px);border-radius:20px;padding:20px;border:1px solid rgba(59,130,246,0.08);margin-bottom:16px}
    .section-card h3{font-size:1rem;font-weight:700;color:#60a5fa;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .section-card h3 .count{background:rgba(59,130,246,0.15);padding:0 12px;border-radius:20px;font-size:.75rem;color:#8ba0c7}

    .ecole-item{background:rgba(0,0,0,0.2);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:3px solid #3b82f6;transition:all .2s}
    .ecole-item:hover{background:rgba(0,0,0,0.3)}
    .ecole-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .ecole-item .nom{font-weight:700;color:#e8edf5;font-size:1rem}
    .ecole-item .id{font-size:.7rem;color:#8ba0c7;font-family:monospace;background:rgba(0,0,0,0.2);padding:0 10px;border-radius:12px}
    .ecole-item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .badge{background:rgba(59,130,246,0.12);padding:3px 12px;border-radius:24px;font-size:.7rem;color:#60a5fa;font-weight:500}
    .badge.green{background:rgba(16,185,129,0.12);color:#34d399}
    .badge.purple{background:rgba(167,139,250,0.12);color:#a78bfa}
    .badge.orange{background:rgba(245,158,11,0.12);color:#f59e0b}
    .badge.source{background:rgba(59,130,246,0.08);font-size:.6rem;padding:1px 8px;border-radius:12px;color:#64748b}

    .prof-item, .eleve-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:10px;margin-bottom:4px;background:rgba(0,0,0,0.15);flex-wrap:wrap;gap:4px;transition:background .15s}
    .prof-item:hover, .eleve-item:hover{background:rgba(0,0,0,0.25)}
    .prof-item .info, .eleve-item .info{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem}
    .prof-item .name, .eleve-item .name{font-weight:600;color:#f1f5f9}
    .prof-item .code{color:#8ba0c7;font-size:.7rem;font-family:monospace;background:rgba(0,0,0,0.15);padding:0 8px;border-radius:12px}
    .prof-item .status{font-size:.6rem;padding:2px 10px;border-radius:20px;font-weight:500}
    .prof-item .status.active{background:rgba(16,185,129,0.15);color:#34d399}
    .prof-item .status.inactive{background:rgba(239,68,68,0.15);color:#ef4444}

    .eleve-item .classe{color:#8ba0c7;font-size:.7rem}

    .empty-state{text-align:center;padding:28px;color:#8ba0c7;font-size:.9rem}
    .loading{text-align:center;padding:28px;color:#60a5fa;font-size:.9rem}
    .loading::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid rgba(59,130,246,0.15);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:380px}
    .toast{background:rgba(11,19,36,0.96);backdrop-filter:blur(6px);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;border-left:4px solid #34d399;transform:translateX(100%);transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1);pointer-events:auto;box-shadow:0 12px 32px rgba(0,0,0,0.7);font-size:.85rem}
    .toast.show{transform:translateX(0)}
    .toast.error{border-left-color:#ef4444}
    .toast .icon{font-size:1.2rem}
    .toast .content{flex:1}
    .toast .title{font-weight:600;font-size:.8rem;color:#fff}
    .toast .message{font-size:.75rem;color:#8ba0c7}

    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .25s}
    .modal-overlay.show{visibility:visible;opacity:1}
    .modal-box{background:rgba(16,28,52,0.96);backdrop-filter:blur(8px);border-radius:24px;padding:28px;max-width:420px;width:92%;border:1px solid rgba(59,130,246,0.15);text-align:center;box-shadow:0 20px 48px rgba(0,0,0,0.8)}
    .modal-box .icon{font-size:2.6rem;margin-bottom:6px}
    .modal-box h3{color:#60a5fa;font-size:1.1rem;margin-bottom:6px;font-weight:700}
    .modal-box p{color:#8ba0c7;font-size:.9rem;margin-bottom:18px;line-height:1.5}
    .modal-box .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .modal-box .btn{min-width:90px;padding:8px 20px}

    .form-add{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;background:rgba(0,0,0,0.15);padding:16px;border-radius:16px;align-items:center}
    .form-add input{flex:2;min-width:180px;background:rgba(0,0,0,0.3);border:1px solid rgba(59,130,246,0.15);border-radius:40px;padding:10px 16px;color:#e8edf5;font-size:.85rem;outline:none}
    .form-add input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
    .form-add select{flex:1;min-width:140px;background:rgba(0,0,0,0.3);border:1px solid rgba(59,130,246,0.15);border-radius:40px;padding:10px 16px;color:#e8edf5;font-size:.85rem;outline:none}
    .form-add select:focus{border-color:#3b82f6}
    .form-add .btn{flex-shrink:0}

    @media(max-width:640px){body{padding:10px}.stats-grid{grid-template-columns:1fr 1fr;gap:10px}.stat-value{font-size:1.5rem}.header{padding:12px 16px}.header-text h1{font-size:1.2rem}.tabs{flex-wrap:nowrap;overflow-x:auto}.tab{flex:1;min-width:60px;padding:6px 12px;font-size:.75rem}.form-add{flex-direction:column}.form-add input,.form-add select{width:100%}}
  </style>
</head>
<body>
<div class="container">
  <div class="header glass">
    <div class="header-left">
      <div class="logo-badge"><img src="https://www.netubex.com/favicon.png.png" alt="NETUBEX" onerror="this.style.display='none'"></div>
      <div class="header-text"><h1><span>NETUBEX</span> Admin</h1><p>Gestion complète</p></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger btn-sm" onclick="window.toutSupprimer()">🗑️ TOUT</button>
      <button class="btn btn-primary btn-sm" onclick="window.rafraichir()">🔄</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="statEcoles">0</div><div class="stat-label">🏫 Écoles (totales)</div></div>
    <div class="stat-card"><div class="stat-value orange" id="statEcolesAutorisees">0</div><div class="stat-label">✅ Écoles autorisées</div></div>
    <div class="stat-card"><div class="stat-value purple" id="statProfs">0</div><div class="stat-label">👨‍🏫 Profs</div></div>
    <div class="stat-card"><div class="stat-value success" id="statEleves">0</div><div class="stat-label">👥 Élèves</div></div>
  </div>

  <!-- ONGLETS -->
  <div class="tabs">
    <button class="tab active" data-tab="ecoles">🏫 Écoles</button>
    <button class="tab" data-tab="profs">👨‍🏫 Professeurs</button>
    <button class="tab" data-tab="eleves">👥 Élèves</button>
  </div>

  <div id="ecolesContainer" class="tab-content active"></div>
  <div id="profsContainer" class="tab-content"></div>
  <div id="elevesContainer" class="tab-content"></div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="icon">⚠️</div>
    <h3 id="confirmTitle">Confirmation</h3>
    <p id="confirmMessage">Êtes-vous sûr ?</p>
    <div class="buttons">
      <button class="btn btn-danger" id="confirmYes">OUI</button>
      <button class="btn btn-outline" id="confirmNo">ANNULER</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, deleteDoc, doc, setDoc, query, where } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let toutesEcoles = [];
let toutesEcolesAutorisees = [];
let toutesFiches = [];
let tousProfs = [];

function toast(m, t = 'success') {
  const c = document.getElementById('toastContainer'); if (!c) return;
  const ic = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const ti = { success: 'Succès', error: 'Erreur', warning: 'Attention', info: 'Info' };
  const el = document.createElement('div');
  el.className = `toast ${t}`;
  el.innerHTML = `<div class="icon">${ic[t] || '📢'}</div><div class="content"><div class="title">${ti[t] || 'Info'}</div><div class="message">${m}</div></div>`;
  c.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => { if (el.parentNode) el.remove(); }, 280); }, 3400);
}

function showConfirm(t, m, onConfirm) {
  const modal = document.getElementById('confirmModal');
  if (!modal) return;
  document.getElementById('confirmTitle').textContent = t;
  document.getElementById('confirmMessage').innerHTML = m;
  modal.classList.add('show');
  const yes = document.getElementById('confirmYes');
  const no = document.getElementById('confirmNo');
  const clean = () => { modal.classList.remove('show'); yes.removeEventListener('click', h); no.removeEventListener('click', clean); };
  const h = () => { clean(); if (onConfirm) onConfirm(); };
  yes.addEventListener('click', h);
  no.addEventListener('click', clean);
}

// Charger les écoles depuis la collection "ecoles"
async function chargerEcoles() {
  try {
    const snap = await getDocs(collection(db, "ecoles"));
    toutesEcoles = [];
    snap.forEach(ds => {
      toutesEcoles.push({ id: ds.id, ...ds.data() });
    });
    return toutesEcoles;
  } catch (e) {
    toast("Erreur chargement écoles", "error");
    return [];
  }
}

// Charger les écoles autorisées depuis "ecoles_autorisees"
async function chargerEcolesAutorisees() {
  try {
    const snap = await getDocs(collection(db, "ecoles_autorisees"));
    toutesEcolesAutorisees = [];
    snap.forEach(ds => {
      toutesEcolesAutorisees.push({ id: ds.id, ...ds.data() });
    });
    return toutesEcolesAutorisees;
  } catch (e) {
    toast("Erreur chargement écoles autorisées", "error");
    return [];
  }
}

async function chargerProfs(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_professeurs`));
    const p = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === 'prof') {
        p.push({ id: d.profId || ds.id, nom: d.nom || 'Inconnu', code: d.code || '0000', actif: d.actif !== false });
      }
    });
    return p;
  } catch (e) { return []; }
}

async function chargerFiches(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_fiches`));
    const f = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (!d._type) {
        f.push({ id: ds.id, ecoleId: e, ...d });
      }
    });
    return f;
  } catch (e) { return []; }
}

async function chargerTout() {
  document.getElementById('ecolesContainer').innerHTML = '<div class="loading">Chargement...</div>';
  document.getElementById('profsContainer').innerHTML = '<div class="loading">Chargement...</div>';
  document.getElementById('elevesContainer').innerHTML = '<div class="loading">Chargement...</div>';
  
  toutesFiches = [];
  tousProfs = [];
  let totalEleves = 0;
  
  // Combiner les deux listes d'écoles pour une vue unifiée
  const toutesEcolesUnifiees = [...toutesEcoles, ...toutesEcolesAutorisees];
  const ecolesUniques = new Map();
  for (const e of toutesEcolesUnifiees) {
    if (!ecolesUniques.has(e.id)) {
      ecolesUniques.set(e.id, { 
        id: e.id, 
        nom: e.nom || e.id,
        dansEcoles: toutesEcoles.some(ee => ee.id === e.id),
        dansAutorisees: toutesEcolesAutorisees.some(ee => ee.id === e.id)
      });
    }
  }
  
  for (const [id, info] of ecolesUniques) {
    const p = await chargerProfs(id);
    tousProfs = tousProfs.concat(p.map(p => ({ ...p, ecoleId: id, ecoleNom: info.nom })));
    const f = await chargerFiches(id);
    f.forEach(f => { f.ecoleNom = info.nom; });
    toutesFiches = toutesFiches.concat(f);
    f.forEach(f => { if (f.eleves) totalEleves += f.eleves.length; });
  }
  
  return { total: totalEleves, ecolesUniques };
}

// Ajouter une école
async function ajouterEcole(id, nom, collectionCible = 'ecoles') {
  if (!id || id.trim() === '') { toast("Veuillez entrer un ID d'école", "error"); return false; }
  const idClean = id.trim().toLowerCase().replace(/\s+/g, '-');
  
  try {
    // Vérifier si l'école existe déjà
    const docRef = doc(db, collectionCible, idClean);
    await setDoc(docRef, { 
      id: idClean, 
      nom: nom || idClean,
      dateCreation: new Date().toISOString()
    });
    toast(`École "${nom || idClean}" ajoutée à ${collectionCible}`, "success");
    return true;
  } catch (e) {
    toast(`Erreur: ${e.message}`, "error");
    return false;
  }
}

// Supprimer une école et toutes ses données
async function supprimerEcole(id) {
  try {
    // Supprimer les fiches
    const f = await getDocs(collection(db, `${id}_fiches`));
    for (const d of f.docs) { await deleteDoc(d.ref); }
    
    // Supprimer les professeurs
    const p = await getDocs(collection(db, `${id}_professeurs`));
    for (const d of p.docs) { await deleteDoc(d.ref); }
    
    // Supprimer de "ecoles"
    try { await deleteDoc(doc(db, "ecoles", id)); } catch (e) {}
    
    // Supprimer de "ecoles_autorisees"
    try { await deleteDoc(doc(db, "ecoles_autorisees", id)); } catch (e) {}
    
    toast(`École "${id}" supprimée avec toutes ses données`, "success");
    return true;
  } catch (e) {
    toast(`Erreur: ${e.message}`, "error");
    return false;
  }
}

async function supprimerProf(e, id, n) {
  try {
    await deleteDoc(doc(db, `${e}_professeurs`, id));
    toast(`${n} supprimé`, "success");
    await rafraichir();
  } catch (e) { toast(`Erreur: ${e.message}`, "error"); }
}

function afficher(totalEleves, ecolesUniques) {
  const statsOk = document.getElementById('statEcoles') && document.getElementById('statProfs');
  if (!statsOk) return;
  
  document.getElementById('statEcoles').textContent = ecolesUniques.size;
  document.getElementById('statEcolesAutorisees').textContent = toutesEcolesAutorisees.length;
  document.getElementById('statProfs').textContent = tousProfs.length;
  document.getElementById('statEleves').textContent = totalEleves;

  // --- ONGLET ECOLES ---
  let htmlEcoles = '';
  
  // Formulaire d'ajout
  htmlEcoles += `
    <div class="section-card">
      <h3>➕ Ajouter une école</h3>
      <div class="form-add">
        <input type="text" id="newEcoleId" placeholder="ID (ex: mon-ecole)" style="flex:1;">
        <input type="text" id="newEcoleNom" placeholder="Nom (ex: Complexe Scolaire)" style="flex:1;">
        <select id="newEcoleCollection">
          <option value="ecoles">ecoles</option>
          <option value="ecoles_autorisees">ecoles_autorisees</option>
          <option value="both">Les deux</option>
        </select>
        <button class="btn btn-success" id="addEcoleBtn">✅ Ajouter</button>
      </div>
    </div>
  `;
  
  if (!ecolesUniques.size) {
    htmlEcoles += '<div class="empty-state">📭 Aucune école</div>';
  } else {
    htmlEcoles += `<div class="section-card"><h3>🏫 Écoles <span class="count">${ecolesUniques.size}</span></h3>`;
    
    for (const [id, info] of ecolesUniques) {
      const profs = tousProfs.filter(p => p.ecoleId === id);
      const fiches = toutesFiches.filter(f => f.ecoleId === id);
      const nb = fiches.reduce((s, f) => { if (f.eleves) s += f.eleves.length; return s; }, 0);
      
      let badges = [];
      if (info.dansEcoles) badges.push('<span class="badge source">📁 ecoles</span>');
      if (info.dansAutorisees) badges.push('<span class="badge green">✅ autorisée</span>');
      
      htmlEcoles += `<div class="ecole-item" style="border-left-color: ${info.dansAutorisees ? '#10b981' : '#3b82f6'}">
        <div class="top">
          <div>
            <span class="nom">🏫 ${info.nom}</span>
            <span class="id">${id}</span>
            ${badges.join(' ')}
          </div>
          <div class="meta">
            <span class="badge">👨‍🏫 ${profs.length}</span>
            <span class="badge purple">📄 ${fiches.length}</span>
            <span class="badge green">👥 ${nb}</span>
            <button class="btn btn-danger btn-sm" onclick="window.suppEcole('${id}')">🗑️</button>
          </div>
        </div>
        <div style="font-size:.7rem;color:#64748b;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;">
          ${info.dansEcoles ? '<span>📁 Collection "ecoles"</span>' : ''}
          ${info.dansAutorisees ? '<span>✅ Collection "ecoles_autorisees"</span>' : ''}
        </div>
      </div>`;
    }
    htmlEcoles += `</div>`;
  }
  document.getElementById('ecolesContainer').innerHTML = htmlEcoles;

  // Gestionnaire du bouton Ajouter
  document.getElementById('addEcoleBtn')?.addEventListener('click', async () => {
    const id = document.getElementById('newEcoleId').value.trim().toLowerCase().replace(/\s+/g, '-');
    const nom = document.getElementById('newEcoleNom').value.trim() || id;
    const collection = document.getElementById('newEcoleCollection').value;
    
    if (!id) { toast("Veuillez entrer un ID d'école", "error"); return; }
    
    let success = 0;
    if (collection === 'ecoles' || collection === 'both') {
      const ok = await ajouterEcole(id, nom, 'ecoles');
      if (ok) success++;
    }
    if (collection === 'ecoles_autorisees' || collection === 'both') {
      const ok = await ajouterEcole(id, nom, 'ecoles_autorisees');
      if (ok) success++;
    }
    
    if (success > 0) {
      document.getElementById('newEcoleId').value = '';
      document.getElementById('newEcoleNom').value = '';
      await rafraichir();
    }
  });

  // --- ONGLET PROFESSEURS ---
  let htmlProfs = '';
  if (!tousProfs.length) {
    htmlProfs = '<div class="empty-state">👨‍🏫 Aucun professeur</div>';
  } else {
    htmlProfs = `<div class="section-card"><h3>👨‍🏫 Professeurs <span class="count">${tousProfs.length}</span></h3>`;
    for (const pr of tousProfs) {
      const ecolenom = ecolesUniques.get(pr.ecoleId)?.nom || pr.ecoleId;
      htmlProfs += `<div class="prof-item">
        <div class="info">
          <span class="name">${pr.nom}</span>
          <span class="code">${pr.code}</span>
          <span style="color:#8ba0c7;font-size:.7rem;">${ecolenom}</span>
          <span class="status ${pr.actif ? 'active' : 'inactive'}">${pr.actif ? 'Actif' : 'Inactif'}</span>
        </div>
        <button class="btn btn-danger btn-sm" onclick="window.suppProf('${pr.ecoleId}','${pr.id}','${pr.nom}')">✕</button>
      </div>`;
    }
    htmlProfs += `</div>`;
  }
  document.getElementById('profsContainer').innerHTML = htmlProfs;

  // --- ONGLET ÉLÈVES ---
  let htmlEleves = '';
  const tousEleves = [];
  toutesFiches.forEach(f => {
    if (f.eleves) {
      f.eleves.forEach(e => {
        tousEleves.push({ ...e, ecoleNom: f.ecoleNom, classe: f.classe, cours: f.cours, ficheId: f.id });
      });
    }
  });
  if (!tousEleves.length) {
    htmlEleves = '<div class="empty-state">👥 Aucun élève</div>';
  } else {
    htmlEleves = `<div class="section-card"><h3>👥 Élèves <span class="count">${tousEleves.length}</span></h3>`;
    for (const el of tousEleves) {
      htmlEleves += `<div class="eleve-item">
        <div class="info">
          <span class="name">${el.nom || '?'}</span>
          <span style="color:#8ba0c7;font-size:.7rem;">${el.ecoleNom || ''}</span>
          <span class="classe">${el.classe || ''}</span>
        </div>
      </div>`;
    }
    htmlEleves += `</div>`;
  }
  document.getElementById('elevesContainer').innerHTML = htmlEleves;

  // Gestion des onglets
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      const target = this.dataset.tab;
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (target === 'ecoles') document.getElementById('ecolesContainer').classList.add('active');
      if (target === 'profs') document.getElementById('profsContainer').classList.add('active');
      if (target === 'eleves') document.getElementById('elevesContainer').classList.add('active');
    });
  });
}

// Exposer les fonctions globalement
window.suppEcole = function(id) {
  const e = toutesEcoles.find(e => e.id === id) || toutesEcolesAutorisees.find(e => e.id === id);
  showConfirm("Supprimer l'école",
    `⚠️ <strong>${e?.nom || id}</strong><br><br>Cette action supprimera :<br>• Tous les professeurs<br>• Toutes les fiches<br>• Tous les élèves<br><br><span style="color:#ef4444;">Action irréversible !</span>`,
    () => supprimerEcole(id).then(() => rafraichir())
  );
};

window.suppProf = function(e, id, n) {
  showConfirm("Supprimer le professeur", `⚠️ <strong>${n}</strong><br><br>Action irréversible !`, () => supprimerProf(e, id, n));
};

window.toutSupprimer = function() {
  const total = toutesEcoles.length + toutesEcolesAutorisees.length;
  showConfirm("RÉINITIALISATION COMPLÈTE",
    `⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${total} école(s)<br>${tousProfs.length} professeurs<br>${toutesFiches.length} fiches<br><br><span style="color:#ef4444;">Toutes les données seront supprimées !</span>`,
    async () => {
      try {
        // Supprimer toutes les écoles
        const toutes = [...toutesEcoles, ...toutesEcolesAutorisees];
        const uniques = new Map();
        for (const e of toutes) uniques.set(e.id, e);
        
        for (const [id] of uniques) {
          await supprimerEcole(id);
        }
        toast('Toutes les données ont été supprimées', 'success');
        await rafraichir();
      } catch (e) {
        toast(`Erreur: ${e.message}`, 'error');
      }
    }
  );
};

window.rafraichir = rafraichir;

async function rafraichir() {
  await chargerEcoles();
  await chargerEcolesAutorisees();
  const { total, ecolesUniques } = await chargerTout();
  afficher(total, ecolesUniques);
  toast('Données actualisées', 'info');
}

// Initialisation
(async function init() {
  try {
    await rafraichir();
    toast('Données chargées', 'success');
  } catch (e) {
    document.getElementById('ecolesContainer').innerHTML = 
      `<div class="empty-state" style="color:#ef4444;">❌ Erreur: ${e.message}<br>
      <button class="btn btn-primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Réessayer</button></div>`;
    toast('Erreur de chargement', 'error');
  }
})();
</script>
</body>
