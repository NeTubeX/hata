<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test NeTubeX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            text-align: center;
            max-width: 450px;
        }

        h1 {
            color: #0d6efd;
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: #0d6efd;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0b5ed7;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>NeTubeX Test</h1>
    <p>Si cette page s'affiche, GitHub Pages fonctionne correctement.</p>

    <button onclick="tester()">Tester JavaScript</button>

    <div id="result"></div>
</div>

<script>
function tester(){
    document.getElementById("result").textContent =
        "✅ JavaScript fonctionne correctement !";
}
</script>

</body>
</html>
