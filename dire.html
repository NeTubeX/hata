<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NetubeX Card</title>

<style>
body{font-family:Arial;background:#ddd;display:flex;gap:20px;flex-wrap:wrap;padding:20px;}

.card{
width:340px;height:210px;background:#fff;border-radius:14px;
position:relative;overflow:hidden;border:2px solid #000;
padding:12px;
}

.watermark{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%) rotate(-30deg);
font-size:32px;color:rgba(0,0,0,0.06);
font-weight:bold;pointer-events:none;
}

.photo{
width:70px;height:70px;border:1px solid #000;border-radius:8px;
position:absolute;top:12px;right:12px;
object-fit:cover;
}

.title{font-size:13px;font-weight:bold;}
.info{font-size:12px;line-height:1.5;margin-top:8px;}
.barcodes{position:absolute;bottom:10px;left:10px;}
</style>
</head>

<body>

<!-- RECTO -->
<div class="card">
  <div class="watermark">NETUBEX-SARL</div>

  <div class="title">CARTE MEMBRE OFFICIELLE</div>

  <img class="photo" src="https://via.placeholder.com/70">

  <div class="info">
    Nom : John Doe<br>
    ID : NXB-2026-0001<br>
    Statut : Actif<br>
    Pays : DRC
  </div>

  <div class="barcodes">
    <svg id="barcode1"></svg>
  </div>
</div>

<!-- VERSO -->
<div class="card">
  <div class="watermark">VERIFIED</div>

  <div class="title">NETUBEX VERIFICATION</div>

  <div class="info">
    Code sécurité : VERIFY-8F3A91<br>
    Émis : 2026<br>
    Statut : Valid
  </div>

  <svg id="barcode2"></svg>

  <div id="qrcode"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
// CODE BARRES 1
JsBarcode("#barcode1", "NETUBEX-SARL-2026-0001", {
  format:"CODE128",
  width:1,
  height:40,
  displayValue:true
});

// CODE BARRES 2
JsBarcode("#barcode2", "VERIFY-8F3A91", {
  format:"CODE128",
  width:1,
  height:40,
  displayValue:false
});

// QR CODE
QRCode.toCanvas(document.getElementById('qrcode'),
"https://netubex.com/verify/NXB-2026-0001",
function (error) {});
</script>

</body>
</html>
