<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>Sélectionnez votre établissement | NeTubeX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;background:#080c18;color:#e8edf5}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:#080c18}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,0.04),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(56,189,248,0.02),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(8,12,24,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.04);padding:14px 20px}
.header{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:17px;color:#8a9aaa}
.header-title{font-size:18px;font-weight:600;color:#e8edf5;letter-spacing:-0.2px}
.header-title span{font-weight:400;color:#5a6a7a;font-size:13px}
.btn-home{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);padding:6px 16px;border-radius:40px;font-size:12px;font-weight:500;color:#8a9aaa;cursor:pointer;transition:all 0.3s;text-decoration:none;display:flex;align-items:center;gap:6px}
.btn-home:hover{background:rgba(255,255,255,0.06);color:#e8edf5;border-color:rgba(255,255,255,0.06)}
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;color:#4a5a6a}
.search-input{width:100%;padding:10px 16px 10px 44px;border-radius:40px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);font-size:13px;font-family:inherit;color:#e8edf5;transition:all 0.3s;outline:none}
.search-input:focus{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.04)}
.search-input::placeholder{color:#4a5a6a}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.02);border:none;font-size:12px;color:#5a6a7a;cursor:pointer;padding:2px 10px;display:none;border-radius:30px}
.search-clear:hover{color:#e8edf5}
.main-container{position:fixed;top:100px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:32px 20px 80px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:3px}
.main-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.04);border-radius:10px}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px;max-width:1100px;margin:0 auto}
.school-card{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;padding:24px 12px 20px;border-radius:50%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);transition:all 0.4s cubic-bezier(0.2,0.9,0.4,1);opacity:0;animation:cardFadeIn 0.5s cubic-bezier(0.2,0.9,0.4,1) forwards;aspect-ratio:1/1;justify-content:center;position:relative}
.school-card:nth-child(1){animation-delay:0.02s}
.school-card:nth-child(2){animation-delay:0.04s}
.school-card:nth-child(3){animation-delay:0.06s}
.school-card:nth-child(4){animation-delay:0.08s}
.school-card:nth-child(5){animation-delay:0.10s}
.school-card:nth-child(6){animation-delay:0.12s}
.school-card:nth-child(7){animation-delay:0.14s}
.school-card:nth-child(8){animation-delay:0.16s}
.school-card:nth-child(9){animation-delay:0.18s}
.school-card:nth-child(10){animation-delay:0.20s}
.school-card:nth-child(11){animation-delay:0.22s}
.school-card:nth-child(12){animation-delay:0.24s}
@keyframes cardFadeIn{0%{opacity:0;transform:scale(0.92)}100%{opacity:1;transform:scale(1)}}
.school-card:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.06);transform:scale(1.03)}
.school-card:active{transform:scale(0.95)}
.school-card.hidden{display:none}
.school-logo-area{width:80px;height:80px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);transition:all 0.4s ease}
.school-card:hover .school-logo-area{border-color:rgba(255,255,255,0.06)}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:cover}
.school-logo-area .logo-placeholder{font-size:32px;color:#4a5a6a;opacity:0.3}
.school-name{font-size:13px;font-weight:600;color:#e8edf5;letter-spacing:-0.1px;line-height:1.3;margin-bottom:4px;max-width:100%}
.school-name .prefix{font-weight:400;color:#5a6a7a;font-size:11px}
.school-location{font-size:11px;color:#5a6a7a;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:4px}
.school-rating{font-size:11px;display:flex;align-items:center;gap:4px;justify-content:center}
.school-rating .stars{color:#fbbf24;letter-spacing:0.5px}
.school-rating .value{color:#5a6a7a;font-weight:400}
.school-code{font-size:9px;color:#3a4a5a;font-family:monospace;margin-top:4px;background:rgba(255,255,255,0.02);padding:2px 10px;border-radius:30px;letter-spacing:0.5px}
.no-result{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:14px;grid-column:1/-1;background:rgba(255,255,255,0.01);border-radius:40px;border:1px solid rgba(255,255,255,0.02)}
.loading{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:14px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:rgba(255,255,255,0.01);border-radius:40px;border:1px solid rgba(255,255,255,0.02)}
.loading:before{content:"";width:22px;height:22px;border:2px solid rgba(255,255,255,0.04);border-top-color:#8a9aaa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px 20px;color:#f87171;background:rgba(239,68,68,0.03);border-radius:40px;font-weight:500;grid-column:1/-1;border:1px solid rgba(239,68,68,0.04)}
@media(max-width:768px){.schools-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.school-card{padding:18px 10px 16px}
.school-logo-area{width:64px;height:64px}
.school-logo-area .logo-placeholder{font-size:26px}
.school-name{font-size:12px}
.school-name .prefix{font-size:10px}
.school-location{font-size:10px}
.school-rating{font-size:10px}
.main-container{padding:24px 14px 80px;top:96px}
.header-title{font-size:16px}
.header-title span{font-size:12px}
.header-icon{width:34px;height:34px;font-size:15px}
.btn-home{padding:5px 14px;font-size:11px}
.search-input{padding:8px 14px 8px 40px;font-size:12px}}
@media(max-width:480px){.schools-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.school-card{padding:14px 8px 12px;border-radius:40px}
.school-logo-area{width:56px;height:56px}
.school-logo-area .logo-placeholder{font-size:22px}
.school-name{font-size:11px}
.school-name .prefix{font-size:9px}
.school-location{font-size:9px}
.school-rating{font-size:9px}
.school-code{font-size:8px}
.main-container{padding:16px 10px 80px;top:92px}
.header-fixed{padding:10px 14px}
.header-title{font-size:14px}
.header-title span{font-size:10px}
.header-icon{width:30px;height:30px;font-size:13px}
.search-input{padding:7px 12px 7px 36px;font-size:11px}
.search-icon{font-size:12px;left:13px}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="header-top">
<div class="header-left"><div class="header-icon">◆</div><div class="header-title">Établissements <span>· sélection</span></div></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">Accueil</a>
</div>
<div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"><div class="loading">Chargement des écoles…</div></div>
</div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});
</script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let allCards=[];
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(isPWA){const savedSchool=localStorage.getItem('pwa_school_id');if(savedSchool&&!window.location.search.includes('ecole')){const targetUrl=new URL('/',window.location.origin);targetUrl.searchParams.set('ecole',savedSchool);targetUrl.searchParams.set('from','pwa');targetUrl.searchParams.set('t',Date.now());window.location.href=targetUrl.toString();throw new Error('Redirection PWA')}}
const placeholders=['⌘','✦','◈','◆','▣','◉','◎','●','◐','◑','◒','◓','◔','◕','⬤','⏣','⚬','◌','⊚','⊛'];
async function chargerEcoles(){const container=document.getElementById('schoolsList');try{const snapshot=await getDocs(collection(db,"ecoles"));if(snapshot.empty){container.innerHTML='<div class="error">Aucune école trouvée</div>';return}const cardsData=[];let index=0;for(const docSnap of snapshot.docs){const ecole=docSnap.data();const prefixe=docSnap.id;const estActif=ecole.actif!==false;if(!estActif){continue}index++;const nomSafe=(ecole.nom||prefixe||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const villeSafe=(ecole.ville||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const rating=(3.5+Math.random()*1.5).toFixed(1);const stars='★'.repeat(Math.round(parseFloat(rating)));const logoUrl=ecole.logoUrl||null;const phIndex=(index-1)%placeholders.length;const logoHtml=logoUrl?`<img class="school-logo-img" src="${logoUrl}" alt="${nomSafe}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:`<div class="logo-placeholder">${placeholders[phIndex]}</div>`;
cardsData.push({html:`<div class="school-card" data-prefixe="${prefixe}" data-nom="${nomSafe.toLowerCase()}" data-ville="${villeSafe.toLowerCase()}">
<div class="school-logo-area">${logoHtml}</div>
<div class="school-name"><span class="prefix">ÉCOLE</span> ${nomSafe}</div>
<div class="school-location">${villeSafe}</div>
<div class="school-rating"><span class="stars">${stars}</span><span class="value">${rating}</span></div>
<div class="school-code">${prefixe}</div>
</div>`,prefixe:prefixe,nom:nomSafe.toLowerCase(),ville:villeSafe.toLowerCase(),actif:estActif})}
const tSchools=cardsData.filter(function(c){return c.nom.startsWith('t')});
const otherSchools=cardsData.filter(function(c){return !c.nom.startsWith('t')});
const sortedCards=tSchools.concat(otherSchools);
allCards=sortedCards;renderCards(sortedCards);setupSearch();setupClicks()}catch(error){container.innerHTML='<div class="error">Erreur: '+error.message+'</div>';console.error(error)}}
function renderCards(cards){const container=document.getElementById('schoolsList');if(cards.length===0){container.innerHTML='<div class="no-result">Aucun établissement disponible</div>';return}container.innerHTML=cards.map(function(c){return c.html}).join('')}
function setupSearch(){const input=document.getElementById('searchInput');const clear=document.getElementById('searchClear');input.addEventListener('input',function(){const q=this.value.trim().toLowerCase();if(q.length>0){clear.style.display='block'}else{clear.style.display='none'}const filtered=allCards.filter(function(c){return c.nom.includes(q)||c.ville.includes(q)});renderCards(filtered);setupClicks()});clear.addEventListener('click',function(){document.getElementById('searchInput').value='';this.style.display='none';renderCards(allCards);setupClicks();document.getElementById('searchInput').focus()})}
function setupClicks(){document.querySelectorAll('.school-card').forEach(function(card){card.addEventListener('click',function(e){e.stopPropagation();const prefixe=this.getAttribute('data-prefixe');if(prefixe&&prefixe!=='null'&&prefixe!=='undefined'){localStorage.setItem('pwa_school_id',prefixe);localStorage.setItem('lastSchoolId',prefixe);const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;let targetUrl;if(isPWA){const baseUrl=new URL('/',window.location.origin);baseUrl.searchParams.set('ecole',prefixe);baseUrl.searchParams.set('from','pwa');baseUrl.searchParams.set('t',Date.now());targetUrl=baseUrl.toString()}else{targetUrl='/schooling?ecole='+encodeURIComponent(prefixe)}window.location.href=targetUrl}})})}
chargerEcoles();
</script>
</body>
</html>
