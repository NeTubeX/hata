<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>Sélectionnez votre établissement | NeTubeX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;background:#0a0e1a;color:#e8edf5}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(160deg,#0a0e1a 0%,#0d1a2b 40%,#0f2840 70%,#0a1a2e 100%)}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 20% 20%,rgba(37,99,235,0.08),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(56,189,248,0.06),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,14,26,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(56,189,248,0.06);padding:12px 16px}
.header{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{background:rgba(37,99,235,0.12);border:1px solid rgba(56,189,248,0.06);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#60a5fa}
.header-title{font-size:20px;font-weight:700;color:#e8edf5;letter-spacing:-0.3px}
.header-title span{font-weight:400;color:#5a6a7a;font-size:13px}
.btn-home{background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.06);padding:8px 18px;border-radius:40px;font-size:13px;font-weight:500;color:#60a5fa;cursor:pointer;transition:all 0.3s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-home:hover{background:rgba(56,189,248,0.1);color:#93bbfc}
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#4a5a6a}
.search-input{width:100%;padding:11px 16px 11px 46px;border-radius:40px;border:1px solid rgba(56,189,248,0.06);background:rgba(255,255,255,0.02);font-size:14px;font-family:inherit;color:#e8edf5;transition:all 0.3s;outline:none}
.search-input:focus{border-color:rgba(56,189,248,0.15);background:rgba(255,255,255,0.04);box-shadow:0 0 0 4px rgba(56,189,248,0.02)}
.search-input::placeholder{color:#4a5a6a}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.03);border:none;font-size:13px;color:#5a6a7a;cursor:pointer;padding:4px 10px;display:none;border-radius:30px}
.search-clear:hover{color:#e8edf5;background:rgba(255,255,255,0.05)}
.main-container{position:fixed;top:105px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:24px 16px 80px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:4px}
.main-container::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.1);border-radius:10px}
.schools-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;max-width:1200px;margin:0 auto;padding-top:8px}
.school-card{background:linear-gradient(145deg,#1a2a3e,#12202e);border:1px solid rgba(56,189,248,0.06);border-radius:28px;overflow:hidden;cursor:pointer;transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);position:relative;min-height:300px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.3);opacity:0;animation:cardFadeIn 0.6s cubic-bezier(0.2,0.9,0.4,1) forwards}
.school-card.priority{animation-delay:0.01s;border-color:rgba(251,191,36,0.15);background:linear-gradient(145deg,#1a2a3a,#1a2a2a)}
.school-card.priority .school-logo-area{border-bottom-color:rgba(251,191,36,0.1)}
.school-card.priority .logo-badge{background:rgba(251,191,36,0.15);color:#fbbf24;border-color:rgba(251,191,36,0.1)}
.school-card.priority .priority-badge{position:absolute;top:12px;left:12px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.1);padding:4px 14px;border-radius:30px;font-size:10px;font-weight:700;color:#fbbf24;text-transform:uppercase;letter-spacing:0.5px;backdrop-filter:blur(10px);z-index:5}
.school-card:nth-child(1){animation-delay:0.03s}
.school-card:nth-child(2){animation-delay:0.06s}
.school-card:nth-child(3){animation-delay:0.09s}
.school-card:nth-child(4){animation-delay:0.12s}
.school-card:nth-child(5){animation-delay:0.15s}
.school-card:nth-child(6){animation-delay:0.18s}
.school-card:nth-child(7){animation-delay:0.21s}
.school-card:nth-child(8){animation-delay:0.24s}
.school-card:nth-child(9){animation-delay:0.27s}
.school-card:nth-child(10){animation-delay:0.30s}
@keyframes cardFadeIn{0%{opacity:0;transform:translateY(30px) scale(0.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
.school-card:hover{transform:translateY(-8px) scale(1.01);border-color:rgba(56,189,248,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(37,99,235,0.04)}
.school-card.priority:hover{border-color:rgba(251,191,36,0.2);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(251,191,36,0.04)}
.school-card:active{transform:scale(0.97)}
.school-card.hidden{display:none}
.school-logo-area{position:relative;width:100%;padding-top:65%;background:linear-gradient(145deg,#0d1a2b,#162638);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(56,189,248,0.04);flex-shrink:0}
.school-logo-area .logo-placeholder{font-size:72px;color:#3a5a7a;opacity:0.3;transition:all 0.5s ease}
.school-card:hover .school-logo-area .logo-placeholder{opacity:0.5;transform:scale(1.05)}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:contain;padding:12px;transition:all 0.5s ease;background:rgba(255,255,255,0.02)}
.school-card:hover .school-logo-img{transform:scale(1.04)}
.school-logo-area .logo-badge{position:absolute;top:12px;right:12px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.06);padding:4px 14px;border-radius:30px;font-size:10px;font-weight:600;color:#60a5fa;text-transform:uppercase;letter-spacing:0.5px;backdrop-filter:blur(10px)}
.school-logo-area .logo-badge.active{background:rgba(34,197,94,0.12);color:#34d399;border-color:rgba(34,197,94,0.06)}
.school-body{padding:18px 20px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.school-body .school-name{font-size:18px;font-weight:800;color:#e8edf5;letter-spacing:-0.2px;line-height:1.2}
.school-body .school-name .prefix{font-weight:500;color:#8a9aaa;font-size:14px}
.school-body .school-location{font-size:13px;color:#6a7a8a;display:flex;align-items:center;gap:6px;margin-top:2px}
.school-body .school-location .pin{font-size:14px}
.school-bottom{padding:12px 20px 18px;border-top:1px solid rgba(56,189,248,0.04);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.school-bottom .school-code{font-family:monospace;font-size:11px;color:#4a5a6a;background:rgba(255,255,255,0.02);padding:4px 12px;border-radius:20px}
.school-bottom .btn-access{background:rgba(37,99,235,0.1);border:1px solid rgba(56,189,248,0.06);padding:8px 28px;border-radius:40px;font-size:13px;font-weight:600;color:#60a5fa;transition:all 0.3s;cursor:pointer;display:flex;align-items:center;gap:8px}
.school-bottom .btn-access:after{content:"→";transition:transform 0.3s}
.school-card:hover .btn-access{background:rgba(37,99,235,0.18);border-color:rgba(56,189,248,0.1);box-shadow:0 4px 20px rgba(37,99,235,0.08)}
.school-card:hover .btn-access:after{transform:translateX(6px)}
.school-card .school-rating{display:flex;align-items:center;gap:6px;font-size:13px}
.school-card .school-rating .stars{color:#fbbf24;letter-spacing:1px;font-size:14px}
.school-card .school-rating .value{color:#8a9aaa;font-weight:500}
.school-card.priority .school-rating .stars{color:#f59e0b}
.no-result{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:15px;grid-column:1/-1;background:rgba(255,255,255,0.02);border-radius:24px;border:1px solid rgba(56,189,248,0.04)}
.loading{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:15px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:rgba(255,255,255,0.02);border-radius:24px;border:1px solid rgba(56,189,248,0.04)}
.loading:before{content:"";width:24px;height:24px;border:2px solid rgba(56,189,248,0.06);border-top-color:#60a5fa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px 20px;color:#f87171;background:rgba(239,68,68,0.04);border-radius:24px;font-weight:500;border-left:3px solid #ef4444;grid-column:1/-1}
@media(max-width:1024px){.schools-grid{grid-template-columns:1fr 1fr;gap:20px}}
@media(max-width:680px){.schools-grid{grid-template-columns:1fr;gap:18px;padding-top:4px}
.school-card{min-height:260px;border-radius:24px}
.school-logo-area{padding-top:55%}
.school-logo-area .logo-placeholder{font-size:52px}
.school-body .school-name{font-size:16px}
.school-body .school-name .prefix{font-size:13px}
.school-bottom .btn-access{padding:6px 20px;font-size:12px}
.main-container{padding:16px 12px 80px;top:100px}
.header-title{font-size:17px}
.header-title span{font-size:11px}
.header-icon{width:38px;height:38px;font-size:17px}
.btn-home{padding:6px 14px;font-size:12px}
.search-input{padding:9px 14px 9px 42px;font-size:13px}
.school-card{animation:cardFadeInMobile 0.5s cubic-bezier(0.2,0.9,0.4,1) forwards}
@keyframes cardFadeInMobile{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}}
@media(max-width:400px){.school-card{min-height:220px;border-radius:20px}
.school-logo-area{padding-top:50%}
.school-body{padding:14px 16px 10px}
.school-body .school-name{font-size:15px}
.school-bottom{padding:10px 16px 14px}
.school-bottom .btn-access{padding:5px 16px;font-size:11px}
.main-container{padding:12px 10px 80px}
.school-card .school-rating .stars{font-size:12px}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="header-top">
<div class="header-left"><div class="header-icon">🏫</div><div class="header-title">Établissements <span>· sélection</span></div></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
<div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"><div class="loading">Chargement des écoles…</div></div>
</div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});
</script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let allCards=[];
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(isPWA){const savedSchool=localStorage.getItem('pwa_school_id');if(savedSchool&&!window.location.search.includes('ecole')){const targetUrl=new URL('/',window.location.origin);targetUrl.searchParams.set('ecole',savedSchool);targetUrl.searchParams.set('from','pwa');targetUrl.searchParams.set('t',Date.now());window.location.href=targetUrl.toString();throw new Error('Redirection PWA')}}
const schoolColors=['#1a2a3e','#1a2e3e','#1a2a4a','#1a2e4a','#1a2a3a','#1a2e3a','#1a2a44','#1a2e44','#1a2a38','#1a2e38'];
const schoolIcons=['🏛️','📚','🎓','🏫','🎯','🌟','📖','✏️','🔬','🎨','🏆','⚡','🌈','🚀','💡','🎵','🎭','⚽','🧠','💎'];
async function chargerEcoles(){const container=document.getElementById('schoolsList');try{const snapshot=await getDocs(collection(db,"ecoles"));if(snapshot.empty){container.innerHTML='<div class="error">⚠️ Aucune école trouvée</div>';return}const cardsData=[];let index=0;for(const docSnap of snapshot.docs){const ecole=docSnap.data();const prefixe=docSnap.id;const estActif=ecole.actif!==false;if(!estActif){continue}index++;const colorIndex=(index-1)%schoolColors.length;const iconIndex=(index-1)%schoolIcons.length;const nomSafe=(ecole.nom||prefixe||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const villeSafe=(ecole.ville||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const rating=(3.5+Math.random()*1.5).toFixed(1);const stars='⭐'.repeat(Math.round(parseFloat(rating)));const logoUrl=ecole.logoUrl||null;const isPriority=nomSafe.toUpperCase().startsWith('T');const priorityClass=isPriority?' priority':'';const priorityBadge=isPriority?'<span class="priority-badge">⭐ Prioritaire</span>':'';const logoHtml=logoUrl?`<img class="school-logo-img" src="${logoUrl}" alt="${nomSafe}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:`<div class="logo-placeholder">${schoolIcons[iconIndex]}</div>`;cardsData.push({html:`<div class="school-card${priorityClass}" data-prefixe="${prefixe}" data-nom="${nomSafe.toLowerCase()}" data-ville="${villeSafe.toLowerCase()}" data-priority="${isPriority}">
<div class="school-logo-area" style="background:linear-gradient(145deg,${schoolColors[colorIndex]},#0d1a2b);">
${logoHtml}
<span class="logo-badge active">● Actif</span>
${priorityBadge}
</div>
<div class="school-body">
<div class="school-name"><span class="prefix">ÉCOLE</span> ${nomSafe}</div>
<div class="school-location"><span class="pin">📍</span> ${villeSafe}</div>
</div>
<div class="school-bottom">
<span class="school-code">📋 ${prefixe}</span>
<div style="display:flex;align-items:center;gap:12px;">
<span class="school-rating"><span class="stars">${stars}</span><span class="value">${rating}</span></span>
<span class="btn-access">Accéder</span>
</div>
</div>
</div>`,prefixe:prefixe,nom:nomSafe.toLowerCase(),ville:villeSafe.toLowerCase(),actif:estActif,priority:isPriority})}cardsData.sort(function(a,b){if(a.priority&&!b.priority)return -1;if(!a.priority&&b.priority)return 1;return 0});allCards=cardsData;renderCards(cardsData);setupSearch();setupClicks()}catch(error){container.innerHTML='<div class="error">❌ Erreur: '+error.message+'</div>';console.error(error)}}
function renderCards(cards){const container=document.getElementById('schoolsList');if(cards.length===0){container.innerHTML='<div class="no-result">🔍 Aucun établissement disponible</div>';return}container.innerHTML=cards.map(function(c){return c.html}).join('')}
function setupSearch(){const input=document.getElementById('searchInput');const clear=document.getElementById('searchClear');input.addEventListener('input',function(){const q=this.value.trim().toLowerCase();if(q.length>0){clear.style.display='block'}else{clear.style.display='none'}const filtered=allCards.filter(function(c){return c.nom.includes(q)||c.ville.includes(q)});renderCards(filtered);setupClicks()});clear.addEventListener('click',function(){document.getElementById('searchInput').value='';this.style.display='none';renderCards(allCards);setupClicks();document.getElementById('searchInput').focus()})}
function setupClicks(){document.querySelectorAll('.school-card').forEach(function(card){card.addEventListener('click',function(e){e.stopPropagation();const prefixe=this.getAttribute('data-prefixe');if(prefixe&&prefixe!=='null'&&prefixe!=='undefined'){localStorage.setItem('pwa_school_id',prefixe);localStorage.setItem('lastSchoolId',prefixe);const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;let targetUrl;if(isPWA){const baseUrl=new URL('/',window.location.origin);baseUrl.searchParams.set('ecole',prefixe);baseUrl.searchParams.set('from','pwa');baseUrl.searchParams.set('t',Date.now());targetUrl=baseUrl.toString()}else{targetUrl='/schooling?ecole='+encodeURIComponent(prefixe)}window.location.href=targetUrl}})})}
chargerEcoles();
</script>
</body>
</html>
