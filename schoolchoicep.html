<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f8fafc">
<title>Complexe Scolaire | Sélection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:#f8fafc;color:#0f172a}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:#f8fafc}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,0.02),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(37,99,235,0.015),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,0,0,0.04);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.header{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.search-wrap{position:relative;flex:1;max-width:560px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:#94a3b8}
.search-input{width:100%;padding:9px 16px 9px 40px;border-radius:40px;border:1px solid rgba(0,0,0,0.04);background:rgba(255,255,255,0.6);font-size:13px;font-family:inherit;color:#0f172a;transition:all 0.3s;outline:none}
.search-input:focus{border-color:rgba(37,99,235,0.15);background:rgba(255,255,255,0.85);box-shadow:0 0 0 4px rgba(37,99,235,0.02)}
.search-input::placeholder{color:#94a3b8}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.02);border:none;font-size:11px;color:#94a3b8;cursor:pointer;padding:2px 8px;display:none;border-radius:30px}
.search-clear:hover{color:#0f172a;background:rgba(0,0,0,0.04)}
.btn-home{background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.04);padding:6px 18px;border-radius:40px;font-size:12px;font-weight:500;color:#475569;cursor:pointer;transition:all 0.3s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-home:hover{background:rgba(37,99,235,0.04);color:#2563eb;border-color:rgba(37,99,235,0.08)}
.main-container{position:fixed;top:66px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:32px 20px 40px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:3px}
.main-container::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:48px 32px;max-width:1200px;margin:0 auto;padding-top:8px}
.school-card{position:relative;background:#ffffff;border-radius:32px;padding:0 24px 24px;cursor:pointer;transition:all 0.6s cubic-bezier(0.22,1,0.36,1);box-shadow:0 2px 12px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.01);opacity:0;animation:cardFadeIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards;transform-style:preserve-3d;perspective:1000px}
.school-card:nth-child(1){animation-delay:0.02s}
.school-card:nth-child(2){animation-delay:0.04s}
.school-card:nth-child(3){animation-delay:0.06s}
.school-card:nth-child(4){animation-delay:0.08s}
.school-card:nth-child(5){animation-delay:0.10s}
.school-card:nth-child(6){animation-delay:0.12s}
.school-card:nth-child(7){animation-delay:0.14s}
.school-card:nth-child(8){animation-delay:0.16s}
.school-card:nth-child(9){animation-delay:0.18s}
.school-card:nth-child(10){animation-delay:0.20s}
@keyframes cardFadeIn{0%{opacity:0;transform:translateY(20px) rotateX(2deg)}100%{opacity:1;transform:translateY(0) rotateX(0deg)}}
.school-card::before{content:'';position:absolute;inset:0;border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,0.6),rgba(255,255,255,0));pointer-events:none;z-index:1}
.school-card::after{content:'';position:absolute;bottom:-8px;left:12%;right:12%;height:20px;background:radial-gradient(ellipse,rgba(0,0,0,0.02),transparent 70%);filter:blur(12px);border-radius:50%;pointer-events:none;transition:all 0.6s ease;z-index:0}
.school-card:hover{transform:translateY(-6px) rotateX(2deg) rotateY(-1deg) scale(1.005);box-shadow:0 20px 48px rgba(0,0,0,0.04),0 8px 16px rgba(0,0,0,0.02)}
.school-card:hover::after{bottom:-12px;left:6%;right:6%;background:radial-gradient(ellipse,rgba(0,0,0,0.03),transparent 70%)}
.school-card:active{transform:scale(0.98) rotateX(0deg);transition-duration:0.1s}
.school-card.hidden{display:none}
.school-card .card-accent{position:absolute;top:0;left:0;right:0;height:140px;border-radius:32px 32px 0 0;z-index:0;background:linear-gradient(145deg,rgba(37,99,235,0.04),rgba(37,99,235,0.01));border-bottom:1px solid rgba(37,99,235,0.03)}
.school-logo-area{position:relative;width:220px;height:220px;margin:0 auto;margin-top:12px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#ffffff;border:1px solid rgba(0,0,0,0.02);box-shadow:0 4px 24px rgba(0,0,0,0.02),0 1px 4px rgba(0,0,0,0.01);transition:all 0.6s cubic-bezier(0.22,1,0.36,1);transform:translateY(0) rotateX(0deg) rotateY(0deg);z-index:2;transform-style:preserve-3d}
.school-card:hover .school-logo-area{transform:translateY(-4px) rotateX(4deg) rotateY(2deg) scale(1.01);box-shadow:0 16px 48px rgba(0,0,0,0.04),0 4px 12px rgba(37,99,235,0.02),0 1px 4px rgba(0,0,0,0.01)}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:cover}
.school-logo-area .logo-placeholder{font-size:64px;color:#d1d5db;font-weight:300}
.school-logo-area .logo-shadow{position:absolute;bottom:-8px;left:20%;right:20%;height:16px;background:radial-gradient(ellipse,rgba(0,0,0,0.02),transparent 70%);filter:blur(8px);border-radius:50%;pointer-events:none;transition:all 0.6s ease}
.school-card:hover .school-logo-area .logo-shadow{bottom:-12px;left:10%;right:10%;background:radial-gradient(ellipse,rgba(0,0,0,0.04),transparent 70%)}
.school-info{position:relative;z-index:2;text-align:center;padding-top:18px}
.school-name{font-size:17px;font-weight:700;color:#0f172a;letter-spacing:-0.2px;line-height:1.3}
.school-name .prefix{font-weight:400;color:#94a3b8;font-size:13px;display:block;margin-bottom:3px}
.school-location{font-size:13px;color:#64748b;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:16px;border-top:1px solid rgba(0,0,0,0.03)}
.school-rating{font-size:12px;display:flex;align-items:center;gap:4px}
.school-rating .stars{color:#f59e0b;letter-spacing:0.5px}
.school-rating .value{color:#94a3b8;font-weight:500}
.school-code{font-size:10px;color:#94a3b8;font-family:monospace;background:#f1f5f9;padding:2px 12px;border-radius:30px;letter-spacing:0.3px}
.btn-access{background:#ffffff;border:1px solid rgba(0,0,0,0.04);padding:7px 22px;border-radius:40px;font-size:12px;font-weight:600;color:#2563eb;cursor:pointer;transition:all 0.5s cubic-bezier(0.22,1,0.36,1);display:flex;align-items:center;gap:4px;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,0.02),0 1px 2px rgba(0,0,0,0.01);transform:translateY(0) rotateX(0deg);transform-style:preserve-3d}
.btn-access:after{content:"→";transition:transform 0.4s cubic-bezier(0.22,1,0.36,1)}
.school-card:hover .btn-access{background:#2563eb;border-color:#2563eb;color:#ffffff;box-shadow:0 8px 24px rgba(37,99,235,0.10),0 2px 8px rgba(37,99,235,0.04);transform:translateY(-2px) rotateX(2deg) scale(1.02)}
.school-card:hover .btn-access:after{transform:translateX(6px)}
.school-card:active .btn-access{transform:scale(0.96) rotateX(0deg);transition-duration:0.1s}
.no-result{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;grid-column:1/-1;background:#ffffff;border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.02)}
.loading{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:#ffffff;border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.02)}
.loading:before{content:"";width:20px;height:20px;border:2px solid #e2e8f0;border-top-color:#94a3b8;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px 20px;color:#ef4444;background:#fef2f2;border-radius:24px;font-weight:500;grid-column:1/-1;border:1px solid #fecaca}
@media(max-width:768px){.schools-grid{grid-template-columns:1fr 1fr;gap:36px 20px}
.school-logo-area{width:180px;height:180px}
.school-card{padding:0 18px 18px}
.school-card .card-accent{height:120px}
.main-container{padding:24px 14px 30px;top:62px}}
@media(max-width:480px){.schools-grid{grid-template-columns:1fr;gap:32px;max-width:400px;margin:0 auto}
.school-logo-area{width:200px;height:200px;margin-top:8px}
.school-logo-area .logo-placeholder{font-size:52px}
.school-card{padding:0 16px 16px;border-radius:24px}
.school-card .card-accent{height:110px;border-radius:24px 24px 0 0}
.school-name{font-size:15px}
.school-name .prefix{font-size:12px}
.school-bottom{flex-wrap:wrap;justify-content:center;gap:8px}
.btn-access{width:100%;justify-content:center;padding:8px 22px}
.main-container{padding:16px 12px 30px;top:58px}
.search-input{padding:7px 12px 7px 36px;font-size:12px}
.search-icon{font-size:12px;left:12px}
.btn-home{padding:5px 14px;font-size:11px}
.header{padding:8px 12px}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">Accueil</a>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"><div class="loading">Chargement des écoles…</div></div>
</div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});
</script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let allCards=[];
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(isPWA){const savedSchool=localStorage.getItem('pwa_school_id');if(savedSchool&&!window.location.search.includes('ecole')){const targetUrl=new URL('/',window.location.origin);targetUrl.searchParams.set('ecole',savedSchool);targetUrl.searchParams.set('from','pwa');targetUrl.searchParams.set('t',Date.now());window.location.href=targetUrl.toString();throw new Error('Redirection PWA')}}
const placeholders=['⌘','✦','◈','◆','▣','◉','◎','●','◐','◑','◒','◓','◔','◕','⬤','⏣','⚬','◌','⊚','⊛'];
async function chargerEcoles(){const container=document.getElementById('schoolsList');try{const snapshot=await getDocs(collection(db,"ecoles"));if(snapshot.empty){container.innerHTML='<div class="error">Aucune école trouvée</div>';return}const cardsData=[];let index=0;for(const docSnap of snapshot.docs){const ecole=docSnap.data();const prefixe=docSnap.id;const estActif=ecole.actif!==false;if(!estActif){continue}index++;const nomSafe=(ecole.nom||prefixe||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const villeSafe=(ecole.ville||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const rating=(3.5+Math.random()*1.5).toFixed(1);const stars='★'.repeat(Math.round(parseFloat(rating)));const logoUrl=ecole.logoUrl||null;const phIndex=(index-1)%placeholders.length;const logoHtml=logoUrl?`<img class="school-logo-img" src="${logoUrl}" alt="${nomSafe}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:`<div class="logo-placeholder">${placeholders[phIndex]}</div>`;
const nomDisplay=nomSafe;
cardsData.push({html:`<div class="school-card" data-prefixe="${prefixe}" data-nom="${nomSafe.toLowerCase()}" data-ville="${villeSafe.toLowerCase()}">
<div class="card-accent"></div>
<div class="school-logo-area">
${logoHtml}
<div class="logo-shadow"></div>
</div>
<div class="school-info">
<div class="school-name"><span class="prefix">COMPLEXE SCOLAIRE</span> ${nomDisplay}</div>
<div class="school-location">${villeSafe}</div>
<div class="school-bottom">
<div class="school-rating"><span class="stars">${stars}</span><span class="value">${rating}</span></div>
<span class="school-code">${prefixe}</span>
<div class="btn-access">Accéder</div>
</div>
</div>
</div>`,prefixe:prefixe,nom:nomSafe.toLowerCase(),ville:villeSafe.toLowerCase(),actif:estActif,nomOriginal:nomSafe})}
const tSchools=cardsData.filter(function(c){return c.nom.startsWith('t')});
const sSchools=cardsData.filter(function(c){return c.nom.startsWith('s')&&!c.nom.startsWith('t')});
const otherSchools=cardsData.filter(function(c){return !c.nom.startsWith('t')&&!c.nom.startsWith('s')});
tSchools.forEach(function(c){c.nomDisplay='LE '+c.nomOriginal});
const sortedCards=tSchools.concat(sSchools,otherSchools);
allCards=sortedCards;renderCards(sortedCards);setupSearch();setupClicks()}catch(error){container.innerHTML='<div class="error">Erreur: '+error.message+'</div>';console.error(error)}}
function renderCards(cards){const container=document.getElementById('schoolsList');if(cards.length===0){container.innerHTML='<div class="no-result">Aucun établissement disponible</div>';return}let html='';cards.forEach(function(c,index){let nomDisplay=c.nomOriginal||c.nom;if(c.nom.startsWith('t')){nomDisplay='LE '+nomDisplay}html+=`<div class="school-card" data-prefixe="${c.prefixe}" data-nom="${c.nom}" data-ville="${c.ville}">
<div class="card-accent"></div>
<div class="school-logo-area">
${c.logoHtml||'<div class="logo-placeholder">◈</div>'}
<div class="logo-shadow"></div>
</div>
<div class="school-info">
<div class="school-name"><span class="prefix">COMPLEXE SCOLAIRE</span> ${nomDisplay}</div>
<div class="school-location">${c.ville}</div>
<div class="school-bottom">
<div class="school-rating"><span class="stars">${c.stars||'★★★★'}</span><span class="value">${c.rating||'4.5'}</span></div>
<span class="school-code">${c.prefixe}</span>
<div class="btn-access">Accéder</div>
</div>
</div>
</div>`});container.innerHTML=html}
function setupSearch(){const input=document.getElementById('searchInput');const clear=document.getElementById('searchClear');input.addEventListener('input',function(){const q=this.value.trim().toLowerCase();if(q.length>0){clear.style.display='block'}else{clear.style.display='none'}const filtered=allCards.filter(function(c){return c.nom.includes(q)||c.ville.includes(q)});renderCards(filtered);setupClicks()});clear.addEventListener('click',function(){document.getElementById('searchInput').value='';this.style.display='none';renderCards(allCards);setupClicks();document.getElementById('searchInput').focus()})}
function setupClicks(){document.querySelectorAll('.school-card').forEach(function(card){card.addEventListener('click',function(e){e.stopPropagation();const prefixe=this.getAttribute('data-prefixe');if(prefixe&&prefixe!=='null'&&prefixe!=='undefined'){localStorage.setItem('pwa_school_id',prefixe);localStorage.setItem('lastSchoolId',prefixe);const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;let targetUrl;if(isPWA){const baseUrl=new URL('/',window.location.origin);baseUrl.searchParams.set('ecole',prefixe);baseUrl.searchParams.set('from','pwa');baseUrl.searchParams.set('t',Date.now());targetUrl=baseUrl.toString()}else{targetUrl='/schooling?ecole='+encodeURIComponent(prefixe)}window.location.href=targetUrl}})})}
chargerEcoles();
</script>
</body>
</html>
