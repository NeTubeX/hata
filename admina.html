<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>Dashboard · NETUBEX</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080d1a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8edf5;padding:16px;line-height:1.4;min-height:100vh}
    .container{max-width:1440px;margin:0 auto}

    /* design amélioré : verre profond, bords plus lumineux */
    .glass{background:rgba(18,30,51,0.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,215,0,0.12);box-shadow:0 12px 32px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,215,0,0.05);border-radius:24px}

    /* header plus aéré */
    .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 24px;margin-bottom:24px}
    .header-left{display:flex;align-items:center;gap:16px}
    .logo-badge{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(250,204,21,0.25)}
    .logo-badge img{width:60%;height:60%;object-fit:contain;filter:brightness(0)invert(1)}
    .header-text h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,#facc15,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .header-text p{font-size:.85rem;color:#94a3b8;letter-spacing:0.3px}
    .header-text p span{color:#a5b4fc;font-weight:500}

    /* boutons plus raffinés */
    .btn{background:transparent;border:none;padding:6px 18px;border-radius:40px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
    .btn:active{transform:scale(.94)}
    .btn-danger{background:#ef4444;color:#fff;box-shadow:0 4px 12px rgba(239,68,68,0.2)}
    .btn-danger:hover{background:#dc2626;box-shadow:0 6px 16px rgba(239,68,68,0.3)}
    .btn-primary{background:#3b82f6;color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.2)}
    .btn-primary:hover{background:#2563eb;box-shadow:0 6px 16px rgba(59,130,246,0.3)}
    .btn-outline{background:rgba(255,255,255,0.02);border:1px solid rgba(255,215,0,0.15);color:#94a3b8}
    .btn-outline:hover{background:rgba(255,215,0,0.08);color:#facc15;border-color:#facc15}
    .btn-sm{padding:4px 14px;font-size:.7rem;border-radius:32px}

    /* statistiques : cartes plus élégantes */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .stat-card{background:rgba(18,30,51,0.55);backdrop-filter:blur(4px);border-radius:20px;padding:16px 12px;border:1px solid rgba(255,215,0,0.06);text-align:center;transition:all .2s}
    .stat-card:hover{border-color:rgba(255,215,0,0.15);background:rgba(18,30,51,0.7)}
    .stat-value{font-size:1.9rem;font-weight:800;color:#facc15;line-height:1.2;letter-spacing:-0.02em}
    .stat-value.danger{color:#ef4444}
    .stat-value.success{color:#34d399}
    .stat-value.purple{color:#a5b4fc}
    .stat-label{font-size:.7rem;color:#8b9bb5;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:4px}

    /* écoles : cartes plus spacieuses */
    .ecole-card{background:rgba(18,30,51,0.5);backdrop-filter:blur(4px);border-radius:20px;margin-bottom:16px;border:1px solid rgba(255,215,0,0.06);overflow:hidden;transition:all .2s}
    .ecole-card:hover{border-color:rgba(255,215,0,0.12)}
    .ecole-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 20px;border-bottom:1px solid rgba(255,215,0,0.04)}
    .ecole-header .nom{font-weight:700;color:#facc15;font-size:1.1rem}
    .ecole-header .id{font-size:.7rem;color:#8b9bb5;font-family:monospace;margin-left:8px;background:rgba(0,0,0,0.2);padding:0 8px;border-radius:12px}
    .ecole-header .stats{display:flex;gap:6px;flex-wrap:wrap}
    .badge{background:rgba(59,130,246,0.15);padding:3px 12px;border-radius:24px;font-size:.7rem;color:#60a5fa;font-weight:500}
    .badge.green{background:rgba(16,185,129,0.15);color:#34d399}
    .badge.purple{background:rgba(129,140,248,0.15);color:#a5b4fc}

    /* sections profs & fiches */
    .section-profs,.section-fiches{padding:8px 18px}
    .section-title{font-size:.8rem;font-weight:600;color:#60a5fa;margin:6px 0 6px;display:flex;align-items:center;gap:8px;letter-spacing:0.3px}
    .section-title .count{background:rgba(59,130,246,0.12);padding:0 10px;border-radius:20px;font-size:.65rem;color:#94a3b8}

    .prof-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:10px;margin-bottom:4px;background:rgba(0,0,0,0.15);flex-wrap:wrap;gap:4px;transition:background .15s}
    .prof-item:hover{background:rgba(0,0,0,0.25)}
    .prof-item .info{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem}
    .prof-item .name{font-weight:600;color:#f1f5f9}
    .prof-item .code{color:#8b9bb5;font-size:.7rem;font-family:monospace;background:rgba(0,0,0,0.15);padding:0 8px;border-radius:12px}
    .prof-item .status{font-size:.6rem;padding:2px 10px;border-radius:20px;font-weight:500}
    .prof-item .status.active{background:rgba(16,185,129,0.15);color:#34d399}
    .prof-item .status.inactive{background:rgba(239,68,68,0.15);color:#ef4444}

    .fiche-item{padding:6px 12px;border-radius:10px;margin-bottom:4px;background:rgba(0,0,0,0.1);transition:background .15s}
    .fiche-item:hover{background:rgba(0,0,0,0.2)}
    .fiche-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
    .fiche-item .cours{font-weight:600;color:#f1f5f9;font-size:.85rem}
    .fiche-item .classe{color:#8b9bb5;font-size:.75rem;margin-left:6px}
    .fiche-item .option{background:rgba(255,215,0,0.1);padding:0 10px;border-radius:20px;font-size:.65rem;color:#fbbf24;font-weight:500}
    .fiche-item .ref{color:#64748b;font-size:.65rem;font-family:monospace;margin-left:6px}
    .fiche-item .eleves-list{color:#60a5fa;font-size:.75rem;word-break:break-all;margin-top:2px}

    .empty-state{text-align:center;padding:28px;color:#8b9bb5;font-size:.9rem}
    .loading{text-align:center;padding:28px;color:#60a5fa;font-size:.9rem}
    .loading::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid rgba(255,215,0,0.15);border-top-color:#facc15;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* toasts plus design */
    .toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:380px;margin:0 auto}
    .toast{background:rgba(12,20,38,0.96);backdrop-filter:blur(6px);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;border-left:4px solid #34d399;transform:translateX(100%);transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1);pointer-events:auto;box-shadow:0 12px 32px rgba(0,0,0,0.7);font-size:.85rem}
    .toast.show{transform:translateX(0)}
    .toast.error{border-left-color:#ef4444}
    .toast.warning{border-left-color:#f59e0b}
    .toast .icon{font-size:1.2rem}
    .toast .content{flex:1}
    .toast .title{font-weight:600;font-size:.8rem;color:#fff}
    .toast .message{font-size:.75rem;color:#94a3b8}

    /* modal plus soignée */
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .25s}
    .modal-overlay.show{visibility:visible;opacity:1}
    .modal-box{background:rgba(18,30,51,0.96);backdrop-filter:blur(8px);border-radius:24px;padding:28px;max-width:420px;width:92%;border:1px solid rgba(255,215,0,0.12);text-align:center;box-shadow:0 20px 48px rgba(0,0,0,0.8)}
    .modal-box .icon{font-size:2.6rem;margin-bottom:6px}
    .modal-box h3{color:#facc15;font-size:1.1rem;margin-bottom:6px;font-weight:700}
    .modal-box p{color:#94a3b8;font-size:.9rem;margin-bottom:18px;line-height:1.5}
    .modal-box .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .modal-box .btn{min-width:90px;padding:8px 20px}

    @media(max-width:640px){body{padding:10px}.stats-grid{grid-template-columns:1fr 1fr;gap:10px}.stat-value{font-size:1.5rem}.header{padding:12px 16px}.header-text h1{font-size:1.2rem}.ecole-header{flex-direction:column;align-items:stretch;text-align:center;gap:6px}.ecole-header .stats{justify-content:center}.ecole-actions{justify-content:center}.prof-item,.fiche-item .top{flex-direction:column;text-align:center}.prof-item .info{justify-content:center}}
  </style>
</head>
<body>
<div class="container">
  <div class="header glass">
    <div class="header-left">
      <div class="logo-badge"><img src="https://www.netubex.com/favicon.png.png" alt="NETUBEX" onerror="this.style.display='none'"></div>
      <div class="header-text"><h1>Administration</h1><p>Gestion <span>complète</span></p></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger btn-sm" onclick="window.toutSupprimer()">🗑️ TOUT</button>
      <button class="btn btn-primary btn-sm" onclick="window.rafraichir()">🔄</button>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="statEcoles">0</div><div class="stat-label">🏫 Écoles</div></div>
    <div class="stat-card"><div class="stat-value purple" id="statProfs">0</div><div class="stat-label">👨‍🏫 Profs</div></div>
    <div class="stat-card"><div class="stat-value success" id="statFiches">0</div><div class="stat-label">📄 Fiches</div></div>
    <div class="stat-card"><div class="stat-value" id="statEleves">0</div><div class="stat-label">👥 Élèves</div></div>
  </div>
  <div id="ecolesContainer"><div class="loading">Chargement...</div></div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="icon">⚠️</div>
    <h3 id="confirmTitle">Confirmation</h3>
    <p id="confirmMessage">Êtes-vous sûr ?</p>
    <div class="buttons">
      <button class="btn btn-danger" id="confirmYes">OUI</button>
      <button class="btn btn-outline" id="confirmNo">ANNULER</button>
    </div>
  </div>
</div>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,deleteDoc,doc}from"firebase/firestore";

const firebaseConfig={
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let toutesEcoles=[],toutesFiches=[],tousProfs=[];

function toast(m,t='success'){
const c=document.getElementById('toastContainer');if(!c)return;
const ic={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
const ti={success:'Succès',error:'Erreur',warning:'Attention',info:'Info'};
const el=document.createElement('div');
el.className=`toast ${t}`;
el.innerHTML=`<div class="icon">${ic[t]||'📢'}</div><div class="content"><div class="title">${ti[t]||'Info'}</div><div class="message">${m}</div></div>`;
c.appendChild(el);
setTimeout(()=>el.classList.add('show'),10);
setTimeout(()=>{el.classList.remove('show');setTimeout(()=>{if(el.parentNode)el.remove()},280);},3400);
}

function showConfirm(t,m,onConfirm){
const modal=document.getElementById('confirmModal');
if(!modal)return;
document.getElementById('confirmTitle').textContent=t;
document.getElementById('confirmMessage').innerHTML=m;
modal.classList.add('show');
const yes=document.getElementById('confirmYes');
const no=document.getElementById('confirmNo');
const clean=()=>{modal.classList.remove('show');yes.removeEventListener('click',h);no.removeEventListener('click',clean);};
const h=()=>{clean();if(onConfirm)onConfirm();};
yes.addEventListener('click',h);
no.addEventListener('click',clean);
}

async function chargerEcoles(){
try{const snap=await getDocs(collection(db,"ecoles_autorisees"));toutesEcoles=[];snap.forEach(ds=>{toutesEcoles.push({id:ds.id,...ds.data()});});return toutesEcoles;}catch(e){toast("Erreur chargement écoles","error");return[];}
}

async function chargerProfs(e){
try{const snap=await getDocs(collection(db,`${e}_professeurs`));const p=[];snap.forEach(ds=>{const d=ds.data();if(d._type==='prof'){p.push({id:d.profId||ds.id,nom:d.nom||'Inconnu',code:d.code||'0000',actif:d.actif!==false});}});return p;}catch(e){return[];}
}

async function chargerFiches(e){
try{const snap=await getDocs(collection(db,`${e}_fiches`));const f=[];snap.forEach(ds=>{const d=ds.data();if(!d._type){f.push({id:ds.id,ecoleId:e,...d});}});return f;}catch(e){return[];}
}

async function chargerTout(){
document.getElementById('ecolesContainer').innerHTML='<div class="loading">Chargement...</div>';
toutesFiches=[];tousProfs=[];let total=0;
for(const e of toutesEcoles){
const p=await chargerProfs(e.id);
tousProfs=tousProfs.concat(p.map(p=>({...p,ecoleId:e.id,ecoleNom:e.nom||e.id})));
const f=await chargerFiches(e.id);
f.forEach(f=>{f.ecoleNom=e.nom||e.id;});
toutesFiches=toutesFiches.concat(f);
f.forEach(f=>{if(f.eleves)total+=f.eleves.length;});
}
return{total};
}

async function supprimerEcole(id){
try{
const f=await getDocs(collection(db,`${id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",id));}catch(e){}
toast("École supprimée",'success');await rafraichir();
}catch(e){toast(`Erreur: ${e.message}`,'error');}
}

async function supprimerProf(e,id,n){
try{await deleteDoc(doc(db,`${e}_professeurs`,id));toast(`${n} supprimé`,'success');await rafraichir();}catch(e){toast(`Erreur: ${e.message}`,'error');}
}

async function supprimerFiche(e,id,c){
try{await deleteDoc(doc(db,`${e}_fiches`,id));toast(`${c} supprimée`,'success');await rafraichir();}catch(e){toast(`Erreur: ${e.message}`,'error');}
}

async function toutSupprimer(){
showConfirm("RÉINITIALISATION",
`⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${toutesEcoles.length} écoles<br>${tousProfs.length} professeurs<br>${toutesFiches.length} fiches`,
async()=>{
try{
for(const e of toutesEcoles){
const f=await getDocs(collection(db,`${e.id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${e.id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",e.id));}catch(e){}
}
toast('Tout supprimé','success');await rafraichir();
}catch(e){toast(`Erreur: ${e.message}`,'error');}
});
}

function afficher(total){
const c=document.getElementById('ecolesContainer');if(!c)return;
if(!toutesEcoles.length){c.innerHTML='<div class="empty-state">📭 Aucune école</div>';return;}
document.getElementById('statEcoles').textContent=toutesEcoles.length;
document.getElementById('statProfs').textContent=tousProfs.length;
document.getElementById('statFiches').textContent=toutesFiches.length;
document.getElementById('statEleves').textContent=total;
let html='';
for(const e of toutesEcoles){
const p=tousProfs.filter(p=>p.ecoleId===e.id);
const f=toutesFiches.filter(f=>f.ecoleId===e.id);
const nb=f.reduce((s,f)=>{if(f.eleves)s+=f.eleves.length;return s;},0);
html+=`<div class="ecole-card"><div class="ecole-header">
<div><span class="nom">🏫 ${e.nom||e.id}</span><span class="id">${e.id}</span></div>
<div class="stats"><span class="badge">👨‍🏫 ${p.length}</span><span class="badge green">📄 ${f.length}</span><span class="badge purple">👥 ${nb}</span></div>
<div class="ecole-actions"><button class="btn btn-danger btn-sm" onclick="window.suppEcole('${e.id}')">🗑️</button></div>
</div>`;
if(p.length){
html+=`<div class="section-profs"><div class="section-title">👨‍🏫 Professeurs <span class="count">${p.length}</span></div>`;
for(const pr of p){
html+=`<div class="prof-item"><div class="info"><span class="name">${pr.nom}</span><span class="code">${pr.code}</span><span class="status ${pr.actif?'active':'inactive'}">${pr.actif?'Actif':'Inactif'}</span></div><button class="btn btn-danger btn-sm" onclick="window.suppProf('${e.id}','${pr.id}','${pr.nom}')">✕</button></div>`;
}
html+=`</div>`;
}
if(f.length){
html+=`<div class="section-fiches"><div class="section-title">📄 Fiches <span class="count">${f.length}</span></div>`;
for(const fc of f){
const eleves=fc.eleves||[];
const noms=eleves.slice(0,3).map(e=>e.nom||'?').join(', ')+(eleves.length>3?` +${eleves.length-3}`:'');
html+=`<div class="fiche-item"><div class="top"><div><span class="cours">📘 ${fc.cours||'?'}</span><span class="classe">${fc.classe||'?'}</span>${fc.option?`<span class="option">${fc.option}</span>`:''}${fc.numeroRef?`<span class="ref">#${fc.numeroRef}</span>`:''}</div><button class="btn btn-danger btn-sm" onclick="window.suppFiche('${e.id}','${fc.id}','${fc.cours||'?'}')">✕</button></div><div class="eleves-list">👥 ${eleves.length} élèves: ${noms||'Aucun'}</div></div>`;
}
html+=`</div>`;
}
html+=`</div>`;
}
c.innerHTML=html;
}

window.suppEcole=function(id){const e=toutesEcoles.find(e=>e.id===id);showConfirm("Supprimer",`⚠️ <strong>${e?.nom||id}</strong><br><br>Action irréversible !`,()=>supprimerEcole(id));};
window.suppProf=function(e,id,n){showConfirm("Supprimer",`⚠️ <strong>${n}</strong><br><br>Action irréversible !`,()=>supprimerProf(e,id,n));};
window.suppFiche=function(e,id,c){showConfirm("Supprimer",`⚠️ <strong>${c}</strong><br><br>Action irréversible !`,()=>supprimerFiche(e,id,c));};
window.toutSupprimer=toutSupprimer;
window.rafraichir=rafraichir;

async function rafraichir(){
await chargerEcoles();
const {total}=await chargerTout();
afficher(total);
toast('Données actualisées','info');
}

(async function init(){
try{
await rafraichir();
toast('Données chargées','success');
}catch(e){
document.getElementById('ecolesContainer').innerHTML=`<div class="empty-state" style="color:#ef4444;">❌ Erreur: ${e.message}<br><button class="btn btn-primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Réessayer</button></div>`;
toast('Erreur de chargement','error');
}
})();
</script>
</body>
</html>
