<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>NETUBEX · Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
  </script>
  <!-- Font & Icons (Inter + Lucide) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ----- reset & base ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1E293B; }
    ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 12px; }

    /* ----- SIDEBAR ----- */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #0B1324;
      border-right: 1px solid rgba(255,255,255,0.05);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      transition: transform 0.25s ease;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 8px;
    }
    .sidebar-brand .logo {
      width: 40px; height: 40px;
      background: linear-gradient(145deg, #3B82F6, #1D4ED8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff;
    }
    .sidebar-brand h1 {
      font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    }
    .sidebar-brand h1 span { color: #3B82F6; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      color: #94A3B8;
      transition: all 0.15s;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .nav-item svg {
      width: 20px; height: 20px;
      stroke: #64748B;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
      transition: stroke 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: #F8FAFC; }
    .nav-item:hover svg { stroke: #F8FAFC; }
    .nav-item.active {
      background: #3B82F6;
      color: #fff;
      box-shadow: 0 6px 14px rgba(59,130,246,0.25);
    }
    .nav-item.active svg { stroke: #fff; }
    .nav-divider {
      height: 1px;
      background: rgba(255,255,255,0.05);
      margin: 8px 0;
    }

    /* ----- MAIN LAYOUT ----- */
    .main {
      flex: 1;
      min-width: 0;
      padding: 20px 24px 40px 24px;
      background: #0F172A;
    }

    /* ----- HEADER ----- */
    .header-premium {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .header-left h2 {
      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    }
    .header-left p {
      color: #94A3B8; font-size: 14px; margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-right .school-selector {
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 8px 16px;
      color: #F8FAFC;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      min-width: 160px;
    }
    .header-right .school-selector:focus { border-color: #3B82F6; }
    .avatar-btn {
      width: 38px; height: 38px;
      border-radius: 40px;
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600; font-size: 14px;
      color: #F8FAFC;
      cursor: default;
    }
    .header-right .btn-icon {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      padding: 6px;
      border-radius: 40px;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-right .btn-icon:hover { background: #1E293B; color: #F8FAFC; }
    .header-right .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; }

    /* ----- STATS GRID (7 cartes) ----- */
    .stats-grid-7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card-premium {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 20px;
      padding: 16px 12px;
      transition: 0.2s;
      text-align: center;
    }
    .stat-card-premium:hover {
      border-color: rgba(255,255,255,0.08);
      background: #1E293B;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -12px rgba(0,0,0,0.6);
    }
    .stat-card-premium .stat-icon { margin-bottom: 4px; color: #3B82F6; }
    .stat-card-premium .stat-icon svg { width: 24px; height: 24px; stroke-width: 1.8; }
    .stat-value-premium {
      font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
      color: #F8FAFC; line-height: 1.2;
    }
    .stat-value-premium .accent-blue { color: #3B82F6; }
    .stat-value-premium .accent-purple { color: #A78BFA; }
    .stat-value-premium .accent-gold { color: #FBBF24; }
    .stat-value-premium .accent-danger { color: #EF4444; }
    .stat-value-premium .accent-success { color: #10B981; }
    .stat-value-premium .accent-warning { color: #F59E0B; }
    .stat-label-premium {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: #64748B; margin-top: 2px;
    }
    .stat-sub-premium {
      font-size: 11px; color: #475569; margin-top: 2px;
    }

    /* ----- TABS (navigation secondaire) ----- */
    .tabs-premium {
      display: flex;
      gap: 4px;
      background: #111827;
      padding: 4px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .tab-premium {
      background: transparent;
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-premium svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .tab-premium:hover { color: #F8FAFC; background: rgba(255,255,255,0.04); }
    .tab-premium.active {
      background: #3B82F6;
      color: #fff;
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ----- CARDS / SECTIONS ----- */
    .section-card-premium {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 20px;
      transition: 0.2s;
    }
    .section-card-premium:hover { border-color: rgba(255,255,255,0.07); }
    .section-card-premium h3 {
      font-size: 16px; font-weight: 600; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      color: #F8FAFC;
    }
    .section-card-premium h3 .count {
      background: #1E293B; padding: 0 14px; border-radius: 40px;
      font-size: 12px; font-weight: 500; color: #94A3B8;
    }

    /* ----- ITEMS (écoles, profs, fiches, logs, eleves, corbeille) ----- */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: 0.12s;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-row:hover { background: rgba(255,255,255,0.04); }
    .item-row .left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .item-row .left .name { font-weight: 600; color: #F8FAFC; }
    .item-row .left .sub { color: #94A3B8; font-size: 13px; }
    .item-row .left .badge-premium {
      font-size: 11px; font-weight: 500; padding: 2px 12px;
      border-radius: 40px; background: #1E293B; color: #94A3B8;
    }
    .badge-premium.green { background: rgba(16,185,129,0.12); color: #10B981; }
    .badge-premium.purple { background: rgba(167,139,250,0.12); color: #A78BFA; }
    .badge-premium.gold { background: rgba(251,191,36,0.12); color: #FBBF24; }
    .badge-premium.danger { background: rgba(239,68,68,0.12); color: #EF4444; }
    .badge-premium.warning { background: rgba(245,158,11,0.12); color: #F59E0B; }
    .item-row .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* buttons premium */
    .btn-premium {
      border: none; padding: 6px 16px; border-radius: 40px;
      font-weight: 600; font-size: 12px; cursor: pointer;
      transition: 0.15s; display: inline-flex; align-items: center;
      gap: 6px; background: transparent; color: #94A3B8;
    }
    .btn-premium svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .btn-premium.primary { background: #3B82F6; color: #fff; box-shadow: 0 4px 10px rgba(59,130,246,0.2); }
    .btn-premium.primary:hover { background: #2563EB; transform: scale(0.97); }
    .btn-premium.danger { background: #EF4444; color: #fff; }
    .btn-premium.danger:hover { background: #DC2626; transform: scale(0.97); }
    .btn-premium.success { background: #10B981; color: #fff; }
    .btn-premium.success:hover { background: #059669; transform: scale(0.97); }
    .btn-premium.outline { border: 1px solid rgba(255,255,255,0.06); background: transparent; }
    .btn-premium.outline:hover { background: rgba(255,255,255,0.04); color: #F8FAFC; }
    .btn-premium.sm { padding: 4px 12px; font-size: 11px; }

    /* ----- CHART GRID ----- */
    .chart-grid-premium {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;
    }
    .chart-box-premium {
      background: #111827; border: 1px solid rgba(255,255,255,0.04);
      border-radius: 20px; padding: 16px;
    }
    .chart-box-premium h4 { font-size: 14px; font-weight: 500; color: #94A3B8; margin-bottom: 12px; text-align: center; }
    .chart-box-premium canvas { max-height: 200px; max-width: 100%; }
    .chart-box-premium.full { grid-column: span 2; }

    /* filter row */
    .filter-row-premium {
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end;
    }
    .filter-group-premium { flex: 1; min-width: 130px; }
    .filter-group-premium label {
      display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: #64748B; margin-bottom: 4px;
    }
    .filter-group-premium select, .filter-group-premium input {
      width: 100%; padding: 8px 14px; border-radius: 12px;
      background: #1E293B; border: 1px solid rgba(255,255,255,0.06);
      color: #F8FAFC; font-size: 13px; outline: none;
    }
    .filter-group-premium select:focus, .filter-group-premium input:focus { border-color: #3B82F6; }

    /* focus grid */
    .focus-grid-premium {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
      gap: 16px; padding: 4px 0 20px 0;
    }
    .focus-card-premium {
      background: #111827; border: 1px solid rgba(255,255,255,0.04);
      border-radius: 20px; padding: 20px; text-align: center;
      transition: 0.2s;
    }
    .focus-card-premium:hover { border-color: rgba(255,255,255,0.08); background: #1E293B; }
    .focus-card-premium .ecole-name { font-weight: 700; color: #FBBF24; margin-bottom: 6px; }
    .focus-card-premium .total { font-size: 32px; font-weight: 800; color: #3B82F6; }
    .focus-card-premium .today { font-size: 16px; font-weight: 600; color: #10B981; margin-top: 4px; }
    .focus-total-premium {
      background: #111827; border: 1px solid rgba(251,191,36,0.08);
      border-radius: 16px; padding: 16px; text-align: center;
      margin: 0 4px 16px 4px;
    }
    .focus-total-premium .total-nb { font-size: 36px; font-weight: 800; color: #FBBF24; }
    .focus-total-premium .total-label { color: #94A3B8; font-size: 13px; }

    /* log / corbeille */
    .log-item-premium {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      flex-wrap: wrap; gap: 6px;
    }
    .log-item-premium .user { font-weight: 600; color: #F8FAFC; }
    .log-item-premium .action { color: #94A3B8; font-size: 13px; }
    .log-item-premium .time { color: #475569; font-size: 12px; }

    /* rank */
    .rank-item-premium {
      display: flex; align-items: center; gap: 14px;
      padding: 8px 12px; background: rgba(255,255,255,0.02);
      border-radius: 12px; margin-bottom: 6px;
    }
    .rank-item-premium .pos { font-size: 20px; font-weight: 800; min-width: 40px; color: #FBBF24; }
    .rank-item-premium .pos.silver { color: #C0C0C0; }
    .rank-item-premium .pos.bronze { color: #CD7F32; }
    .rank-item-premium .name { font-weight: 600; flex: 1; color: #F8FAFC; }

    /* pdf preview */
    .pdf-preview-premium {
      background: rgba(0,0,0,0.2); border-radius: 16px; padding: 16px; max-height: 400px; overflow: auto;
    }
    .pdf-preview-premium table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pdf-preview-premium th { padding: 8px; text-align: left; color: #FBBF24; border-bottom: 1px solid rgba(251,191,36,0.1); }
    .pdf-preview-premium td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); color: #F8FAFC; }

    /* empty state */
    .empty-state-premium { text-align: center; padding: 32px; color: #64748B; font-size: 14px; }

    /* toast / modal (conservé) */
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
    .toast { background: #1E293B; backdrop-filter: blur(8px); border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; gap: 12px; border-left: 4px solid #10B981; transform: translateX(100%); transition: 0.3s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 12px 32px rgba(0,0,0,0.7); font-size: 14px; color: #F8FAFC; }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left-color: #EF4444; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index:20000; display:flex; align-items:center; justify-content:center; visibility:hidden; opacity:0; transition:0.2s; }
    .modal-overlay.show { visibility:visible; opacity:1; }
    .modal-box { background: #1E293B; border-radius: 24px; padding: 32px; max-width: 420px; width:92%; border:1px solid rgba(255,255,255,0.06); text-align:center; }
    .modal-box .icon { font-size: 40px; margin-bottom: 6px; }
    .modal-box h3 { color: #F8FAFC; font-weight: 700; }
    .modal-box p { color: #94A3B8; margin: 8px 0 18px; }

    /* responsive */
    @media (max-width: 1024px) {
      .sidebar { width: 72px; padding: 16px 8px; }
      .sidebar-brand h1, .sidebar-brand span, .nav-item span { display: none; }
      .nav-item { justify-content: center; padding: 10px; }
      .nav-item svg { width: 24px; height: 24px; }
      .stats-grid-7 { grid-template-columns: repeat(4,1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 16px; }
      .stats-grid-7 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .chart-grid-premium { grid-template-columns: 1fr; }
      .chart-box-premium.full { grid-column: span 1; }
      .header-right { width: 100%; justify-content: flex-start; }
    }
    @media (max-width: 480px) {
      .stats-grid-7 { grid-template-columns: 1fr 1fr; }
      .stat-value-premium { font-size: 22px; }
      .tabs-premium { flex-wrap: nowrap; overflow-x: auto; }
      .tab-premium { font-size: 12px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">N</div>
      <h1><span>NETU</span>BEX</h1>
    </div>
    <button class="nav-item active" data-tab="ecoles"><svg viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M5 6v15M19 6v15"/></svg><span>Dashboard</span></button>
    <button class="nav-item" data-tab="ecoles"><svg viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12 12 0 0 1 0 6.844L12 21l-6.16-3.422a12 12 0 0 1 0-6.844L12 14z"/></svg><span>Écoles</span></button>
    <button class="nav-item" data-tab="profs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5.3 18.3C6.8 16.5 9.2 15 12 15s5.2 1.5 6.7 3.3"/></svg><span>Profs</span></button>
    <button class="nav-item" data-tab="fiches"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Fiches</span></button>
    <button class="nav-item" data-tab="eleves"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Élèves</span></button>
    <button class="nav-item" data-tab="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Analytics</span></button>
    <button class="nav-item" data-tab="logs"><svg viewBox="0 0 24 24"><path d="M12 20v-6M12 6v4M4 10h4M16 10h4M4 16h4M16 16h4"/></svg><span>Logs</span></button>
    <button class="nav-item" data-tab="classement"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>Classement</span></button>
    <button class="nav-item" data-tab="pdf"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>PDF</span></button>
    <button class="nav-item" data-tab="corbeille"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg><span>Corbeille</span></button>
    <button class="nav-item" data-tab="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>Focus</span></button>
    <div class="nav-divider"></div>
    <button class="nav-item" onclick="window.toutSupprimer()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg><span>Réinitialiser</span></button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- HEADER -->
    <header class="header-premium">
      <div class="header-left">
        <h2>Tableau de bord</h2>
        <p>Supervision complète · NETUBEX</p>
      </div>

    window.suppEcole = function (id) { const e = toutesEcoles.find(e => e.id === id); showConfirm("Supprimer", `⚠️ <strong>${e?.nom||id}</strong><br><br>Action irréversible !`, () => supprimerEcole(id)); };
    window.suppProf = function (e, id, n) { showConfirm("Supprimer", `⚠️ <strong>${n}</strong><br><br>Action irréversible !`, () => supprimerProf(e, id, n)); };
    window.toutSupprimer = function () { showConfirm("RÉINITIALISATION", `⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${toutesEcoles.length} écoles<br>${tousProfs.length} professeurs<br>${toutesFiches.length} fiches`, async () => { try { for (const e of toutesEcoles) { const f = await getDocs(collection(db, `${e.id}_fiches`)); for (const d of f.docs) { await deleteDoc(d.ref); } const p = await getDocs(collection(db, `${e.id}_professeurs`)); for (const d of p.docs) { await deleteDoc(d.ref); } try { await deleteDoc(doc(db, "ecoles_autorisees", e.id)); } catch (e) {} } toast("Tout supprimé", "success"); await rafraichir(); } catch (e) { toast(`Erreur: ${e.message}`, "error"); } }); };
    async function supprimerEcole(id) { try { const f = await getDocs(collection(db, `${id}_fiches`)); for (const d of f.docs) { await deleteDoc(d.ref); } const p = await getDocs(collection(db, `${id}_professeurs`)); for (const d of p.docs) { await deleteDoc(d.ref); } try { await deleteDoc(doc(db, "ecoles_autorisees", id)); } catch (e) {} toast("École supprimée", "success"); await rafraichir(); } catch (e) { toast(`Erreur: ${e.message}`, "error"); } }
    async function supprimerProf(e, id, n) { try { await deleteDoc(doc(db, `${e}_professeurs`, id)); toast(`${n} supprimé`, "success"); await rafraichir(); } catch (e) { toast(`Erreur: ${e.message}`, "error"); } }
    async function rafraichir() { await chargerEcoles(); await initSchoolSelect(); const { total, abandons, exoneres, today } = await chargerTout(); updateStats(total, abandons, exoneres, today); renderEcoles(); renderProfs(); renderFiches(); if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard(); if (document.getElementById("elevesContainer").classList.contains("active")) renderEleves(); if (document.getElementById("logsContainer").classList.contains("active")) renderLogs(); if (document.getElementById("classementContainer").classList.contains("active")) renderClassement(); if (document.getElementById("pdfContainer").classList.contains("active")) renderPDF(); if (document.getElementById("corbeilleContainer").classList.contains("active")) renderCorbeille(); if (document.getElementById("focusContainer").classList.contains("active")) { if (focusActive) { focusListeners.forEach(unsub => unsub()); focusListeners = []; focusActive = false; if (voiceActive) { window.speechSynthesis.cancel(); voiceActive = false; } } renderFocus(); } toast("Données actualisées", "info"); }
    (async function init() { try { await chargerEcoles(); await initSchoolSelect(); const { total, abandons, exoneres, today } = await chargerTout(); updateStats(total, abandons, exoneres, today); renderEcoles(); renderProfs(); renderFiches(); setupTabs(); setupSchoolFilter(); toast("Données chargées", "success"); } catch (e) { document.getElementById("ecolesContainer").innerHTML = `<div class="empty-state-premium" style="color:#EF4444;">❌ Erreur: ${e.message}<br><button class="btn-premium primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Réessayer</button></div>`; toast("Erreur de chargement", "error"); } })();
    window.rafraichir = rafraichir;
  </script>
</body>
</html>
