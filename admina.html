<style>
/* ===== RESET & VARIABLES ===== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-primary:#0B1120;--bg-secondary:#0F172A;--bg-card:#111827;--bg-card-hover:#1E293B;
  --text-primary:#F8FAFC;--text-secondary:#94A3B8;--text-muted:#475569;
  --border-color:rgba(255,255,255,0.05);--border-hover:rgba(255,255,255,0.08);
  --blue:#3B82F6;--blue-dark:#2563EB;--green:#10B981;--orange:#F59E0B;--red:#EF4444;--purple:#A78BFA;--gold:#FBBF24;--pink:#EC4899;
  --radius:16px;--radius-sm:10px;--shadow:0 8px 24px rgba(0,0,0,0.4);
  --transition:0.2s cubic-bezier(0.16,1,0.3,1);
  --sidebar-width:260px;--sidebar-collapsed:72px;
}
body{background:var(--bg-primary);font-family:'Inter',-apple-system,sans-serif;color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-card);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:10px;}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-width);flex-shrink:0;background:var(--bg-secondary);border-right:1px solid var(--border-color);padding:16px 12px;display:flex;flex-direction:column;gap:4px;height:100vh;position:sticky;top:0;overflow-y:auto;transition:width 0.3s ease;z-index:100;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar.collapsed .sidebar-brand h1,.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item svg{width:24px;height:24px;}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px 8px;border-bottom:1px solid var(--border-color);margin-bottom:8px;}
.sidebar-brand .logo{width:40px;height:40px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;}
.sidebar-brand h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
.sidebar-brand h1 span{color:var(--blue);}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;color:var(--text-secondary);transition:all 0.15s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;position:relative;}
.nav-item svg{width:20px;height:20px;stroke:#64748B;stroke-width:1.8;fill:none;flex-shrink:0;transition:stroke 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text-primary);}
.nav-item:hover svg{stroke:var(--text-primary);}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,0.25);}
.nav-item.active svg{stroke:#fff;}
.nav-item .badge-nav{margin-left:auto;font-size:10px;font-weight:600;padding:2px 10px;border-radius:40px;background:rgba(255,255,255,0.06);color:var(--text-secondary);}
.nav-item.active .badge-nav{background:rgba(255,255,255,0.15);color:#fff;}
.nav-divider{height:1px;background:var(--border-color);margin:8px 0;}
.sidebar-toggle{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 14px;color:var(--text-secondary);cursor:pointer;font-size:12px;transition:0.15s;display:flex;align-items:center;gap:6px;}
.sidebar-toggle:hover{border-color:var(--border-hover);color:var(--text-primary);}

/* ===== MAIN ===== */
.main{flex:1;min-width:0;padding:16px 24px 40px 24px;background:var(--bg-primary);}

/* ===== TOPBAR ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 16px 0;border-bottom:1px solid var(--border-color);margin-bottom:20px;position:sticky;top:0;background:var(--bg-primary);z-index:50;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-left .breadcrumb{color:var(--text-secondary);font-size:13px;}
.topbar-left .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-left h2{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-actions .search-box{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;transition:0.15s;min-width:200px;}
.topbar-actions .search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.topbar-actions .search-box input{background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.topbar-actions .search-box input::placeholder{color:var(--text-muted);}
.topbar-actions .search-box svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;}
.btn-topbar{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:40px;transition:0.15s;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
.btn-topbar:hover{background:var(--bg-card);color:var(--text-primary);}
.btn-topbar svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn-topbar.primary{background:var(--blue);color:#fff;}
.btn-topbar.primary:hover{background:var(--blue-dark);}
.school-selector-top{background:var(--bg-card);border:1px solid var(--border-color);border-radius:40px;padding:6px 16px;color:var(--text-primary);font-size:13px;font-weight:500;cursor:pointer;outline:none;}
.school-selector-top:focus{border-color:var(--blue);}

/* ===== STATS GRID ===== */
.stats-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:14px 12px;transition:all 0.2s;text-align:center;cursor:pointer;}
.stat-card:hover{border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card .stat-icon{margin-bottom:2px;color:var(--blue);}
.stat-card .stat-icon svg{width:22px;height:22px;stroke-width:1.8;}
.stat-card .stat-value{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
.stat-card .stat-value .blue{color:var(--blue);}
.stat-card .stat-value .purple{color:var(--purple);}
.stat-card .stat-value .gold{color:var(--gold);}
.stat-card .stat-value .danger{color:var(--red);}
.stat-card .stat-value .green{color:var(--green);}
.stat-card .stat-value .orange{color:var(--orange);}
.stat-card .stat-value .pink{color:var(--pink);}
.stat-card .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);margin-top:2px;}
.stat-card .stat-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
.stat-card .mini-trend{display:inline-block;font-size:10px;font-weight:600;padding:1px 8px;border-radius:40px;margin-top:4px;}
.stat-card .mini-trend.up{background:rgba(16,185,129,0.12);color:var(--green);}
.stat-card .mini-trend.down{background:rgba(239,68,68,0.12);color:var(--red);}

/* ===== TABS ===== */
.tabs-container{display:flex;gap:4px;background:var(--bg-card);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border-color);margin-bottom:20px;flex-wrap:wrap;position:sticky;top:68px;z-index:40;backdrop-filter:blur(8px);}
.tab-btn{background:transparent;border:none;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.tab-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.04);}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.2);}
.tab-content{display:none;animation:fadeSlide 0.25s ease;}
.tab-content.active{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== CARDS ===== */
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:0.2s;}
.card:hover{border-color:var(--border-hover);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;}
.card-header h3 .count{background:var(--bg-primary);padding:0 14px;border-radius:40px;font-size:12px;font-weight:500;color:var(--text-secondary);}
.card-header .actions{display:flex;gap:6px;}

/* ===== ITEMS ===== */
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.03);transition:0.12s;flex-wrap:wrap;gap:8px;}
.item-row:hover{background:rgba(255,255,255,0.04);}
.item-row .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.item-row .name{font-weight:600;color:var(--text-primary);}
.item-row .sub{color:var(--text-secondary);font-size:13px;}
.badge{font-size:11px;font-weight:500;padding:2px 12px;border-radius:40px;background:var(--bg-primary);color:var(--text-secondary);}
.badge.green{background:rgba(16,185,129,0.12);color:var(--green);}
.badge.purple{background:rgba(167,139,250,0.12);color:var(--purple);}
.badge.gold{background:rgba(251,191,36,0.12);color:var(--gold);}
.badge.danger{background:rgba(239,68,68,0.12);color:var(--red);}
.badge.orange{background:rgba(245,158,11,0.12);color:var(--orange);}
.badge.blue{background:rgba(59,130,246,0.12);color:var(--blue);}
.badge.pink{background:rgba(236,72,153,0.12);color:var(--pink);}

/* ===== BUTTONS ===== */
.btn{border:none;padding:6px 16px;border-radius:40px;font-weight:600;font-size:12px;cursor:pointer;transition:0.15s;display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text-secondary);}
.btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;}
.btn:hover{background:rgba(255,255,255,0.04);color:var(--text-primary);}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(59,130,246,0.2);}
.btn.primary:hover{background:var(--blue-dark);transform:scale(0.97);}
.btn.danger{background:var(--red);color:#fff;}
.btn.danger:hover{background:#DC2626;transform:scale(0.97);}
.btn.success{background:var(--green);color:#fff;}
.btn.success:hover{background:#059669;transform:scale(0.97);}
.btn.outline{border:1px solid var(--border-color);background:transparent;}
.btn.outline:hover{background:rgba(255,255,255,0.04);color:var(--text-primary);}
.btn.sm{padding:4px 12px;font-size:11px;}

/* ===== CHART GRID ===== */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.chart-box{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:16px;}
.chart-box h4{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:10px;text-align:center;}
.chart-box canvas{max-height:180px;max-width:100%;}
.chart-box.full{grid-column:span 2;}

/* ===== FILTERS ===== */
.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filter-group{flex:1;min-width:120px;}
.filter-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:4px;}
.filter-group select,.filter-group input{width:100%;padding:6px 12px;border-radius:var(--radius-sm);background:var(--bg-primary);border:1px solid var(--border-color);color:var(--text-primary);font-size:13px;outline:none;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);}

/* ===== FOCUS ===== */
.focus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:4px 0 16px 0;}
.focus-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:16px;text-align:center;transition:0.2s;}
.focus-card:hover{border-color:var(--border-hover);background:var(--bg-card-hover);}
.focus-card .ecole-name{font-weight:700;color:var(--gold);margin-bottom:4px;font-size:14px;}
.focus-card .total{font-size:28px;font-weight:800;color:var(--blue);}
.focus-card .today{font-size:14px;font-weight:600;color:var(--green);margin-top:4px;}
.focus-total{background:var(--bg-card);border:1px solid rgba(251,191,36,0.08);border-radius:var(--radius);padding:14px;text-align:center;margin:0 4px 12px 4px;}
.focus-total .total-nb{font-size:32px;font-weight:800;color:var(--gold);}
.focus-total .total-label{color:var(--text-secondary);font-size:13px;}

/* ===== LOGS ===== */
.log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.03);flex-wrap:wrap;gap:6px;}
.log-item .user{font-weight:600;color:var(--text-primary);}
.log-item .action{color:var(--text-secondary);font-size:13px;}
.log-item .time{color:var(--text-muted);font-size:11px;}

/* ===== RANK ===== */
.rank-item{display:flex;align-items:center;gap:14px;padding:6px 12px;background:rgba(255,255,255,0.02);border-radius:var(--radius-sm);margin-bottom:4px;}
.rank-item .pos{font-size:18px;font-weight:800;min-width:36px;color:var(--gold);}
.rank-item .pos.silver{color:#C0C0C0;}
.rank-item .pos.bronze{color:#CD7F32;}
.rank-item .name{font-weight:600;flex:1;color:var(--text-primary);}

/* ===== PDF PREVIEW ===== */
.pdf-preview{background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);padding:16px;max-height:400px;overflow:auto;}
.pdf-preview table{width:100%;border-collapse:collapse;font-size:13px;}
.pdf-preview th{padding:6px;text-align:left;color:var(--gold);border-bottom:1px solid rgba(251,191,36,0.08);}
.pdf-preview td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,0.02);color:var(--text-primary);}

/* ===== EMPTY ===== */
.empty-state{text-align:center;padding:32px;color:var(--text-muted);font-size:14px;}

/* ===== TOAST / MODAL ===== */
.toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px;}
.toast{background:var(--bg-card);backdrop-filter:blur(8px);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--green);transform:translateX(100%);transition:0.3s cubic-bezier(0.16,1,0.3,1);box-shadow:0 12px 32px rgba(0,0,0,0.7);font-size:13px;color:var(--text-primary);}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:var(--red);}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:0.2s;}
.modal-overlay.show{visibility:visible;opacity:1;}
.modal-box{background:var(--bg-card);border-radius:var(--radius);padding:28px;max-width:420px;width:92%;border:1px solid var(--border-color);text-align:center;}
.modal-box .icon{font-size:36px;margin-bottom:4px;}
.modal-box h3{color:var(--text-primary);font-weight:700;}
.modal-box p{color:var(--text-secondary);margin:6px 0 16px;}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:992px){
  .sidebar{width:var(--sidebar-collapsed);}
  .sidebar .sidebar-brand h1,.sidebar .nav-item span,.sidebar .nav-item .nav-label{display:none;}
  .sidebar .nav-item{justify-content:center;padding:10px;}
  .sidebar .nav-item svg{width:24px;height:24px;}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{padding:12px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .chart-grid{grid-template-columns:1fr;}
  .chart-box.full{grid-column:span 1;}
  .topbar{flex-direction:column;align-items:stretch;gap:10px;}
  .topbar-actions{flex-wrap:wrap;}
  .topbar-actions .search-box{min-width:100%;}
  .tabs-container{flex-wrap:nowrap;overflow-x:auto;}
  .tab-btn{font-size:12px;padding:6px 12px;}
  .focus-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .stat-card .stat-value{font-size:20px;}
  .focus-grid{grid-template-columns:1fr;}
}

/* ===== UTILITIES ===== */
.flash{animation:flash 0.5s ease;}
@keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.04);background:rgba(16,185,129,0.08)}100%{transform:scale(1)}}
.glass{background:rgba(255,255,255,0.02);backdrop-filter:blur(4px);}
.flex{display:flex;}
.flex-center{display:flex;align-items:center;justify-content:center;}
.gap-2{gap:8px;}
.gap-4{gap:16px;}
.w-full{width:100%;}
.mt-2{margin-top:8px;}
.mb-2{margin-bottom:8px;}
.text-muted{color:var(--text-muted);}
.text-secondary{color:var(--text-secondary);}
</style>
</head>

  <div class="sidebar-brand">

  <button class="nav-item" data-tab="fiches"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="nav-label">Fiches</span></button>
  <button class="nav-item" data-tab="classement"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="nav-label">Classement</span></button>
  <button class="nav-item" data-tab="logs"><svg viewBox="0 0 24 24"><path d="M12 20v-6M12 6v4M4 10h4M16 10h4M4 16h4M16 16h4"/></svg><span class="nav-label">Logs</span></button>
  <button class="nav-item" data-tab="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-label">Focus</span></button>

<script type="module">
// ============================================================
// LOGIQUE MÉTIER - CONSERVÉE INTÉGRALEMENT
// ============================================================
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, limit, where, startAfter, getDoc, updateDoc, setDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== VARIABLES GLOBALES =====
let toutesEcoles = [], toutesFiches = [], tousProfs = [], tousEleves = [], tousLogs = [], toutesCorbeille = [];
let focusListeners = [], focusActive = false, voiceActive = false, chartInstances = {};
let logsLastDoc = null, logsLoading = false, logsHasMore = true, logsLimit = 20;
let currentSchoolFilter = "all";
let currentEleveFilter = { classe: "", option: "", sexe: "", statut: "" };

// ===== TOAST =====
function toast(m, t = "success") {
  const c = document.getElementById("toastContainer");
  if (!c) return;
  const ic = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
  const ti = { success: "Succès", error: "Erreur", warning: "Attention", info: "Info" };
  const el = document.createElement("div");
  el.className = `toast ${t}`;
  el.innerHTML = `<div class="icon">${ic[t] || "📢"}</div><div class="content"><div class="title">${ti[t] || "Info"}</div><div class="message">${m}</div></div>`;
  c.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => { if (el.parentNode) el.remove(); }, 280); }, 3400);
}

// ===== SHOW CONFIRM =====
function showConfirm(t, m, onConfirm) {
  const modal = document.getElementById("confirmModal");
  if (!modal) return;
  document.getElementById("confirmTitle").textContent = t;
  document.getElementById("confirmMessage").innerHTML = m;
  modal.classList.add("show");
  const yes = document.getElementById("confirmYes");
  const no = document.getElementById("confirmNo");
  const clean = () => { modal.classList.remove("show"); yes.removeEventListener("click", h); no.removeEventListener("click", clean); };
  const h = () => { clean(); if (onConfirm) onConfirm(); };
  yes.addEventListener("click", h);
  no.addEventListener("click", clean);
}

// ===== FORMAT =====
function formatDate(d) { const dt = new Date(d); return dt.toLocaleDateString("fr-FR") + " " + dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
function formatDateShort(d) { const dt = new Date(d); return dt.toLocaleDateString("fr-FR"); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

// ===== CHARGEMENT DES DONNÉES =====
async function chargerEcoles() {
  try {
    const snap = await getDocs(collection(db, "ecoles_autorisees"));
    toutesEcoles = [];
    snap.forEach(ds => { toutesEcoles.push({ id: ds.id, ...ds.data() }); });
    return toutesEcoles;
  } catch(e) { toast("Erreur chargement écoles", "error"); return []; }
}

async function chargerProfs(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_professeurs`));
    const p = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "prof") {
        p.push({ id: d.profId || ds.id, nom: d.nom || "Inconnu", code: d.code || "0000", actif: d.actif !== false });
      }
    });
    return p;
  } catch(e) { return []; }
}

async function chargerFiches(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_fiches`));
    const f = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (!d._type) {
        f.push({ id: ds.id, ecoleId: e, ...d });
      }
    });
    return f;
  } catch(e) { return []; }
}

async function chargerElevesCompta(e) {
  try {
    const snap = await getDocs(collection(db, `${e}_compta_eleves`));
    const el = [];
    snap.forEach(ds => {
      const d = ds.data();
      if (d._type === "compta_eleve") {
        el.push({ id: d.eleveId || ds.id, ...d });
      }
    });
    return el;
  } catch(e) { return []; }
}

async function chargerLogs(e, last = null, lim = 20) {
  try {
    let q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), limit(lim));
    if (last) {
      const snapLast = await getDoc(doc(db, `${e}_logs`, last));
      if (snapLast.exists()) {
        q = query(collection(db, `${e}_logs`), orderBy("date", "desc"), startAfter(snapLast), limit(lim));
      }
    }
    const snap = await getDocs(q);
    const l = [];
    snap.forEach(ds => { l.push({ id: ds.id, ...ds.data() }); });
    return l;
  } catch(e) { return []; }
}

async function chargerTout() {
  toutesFiches = []; tousProfs = []; tousEleves = []; toutesCorbeille = [];
  let total = 0, abandons = 0, exoneres = 0, today = 0;
  for (const e of toutesEcoles) {
    const p = await chargerProfs(e.id);
    tousProfs = tousProfs.concat(p.map(p => ({ ...p, ecoleId: e.id, ecoleNom: e.nom || e.id })));
    const f = await chargerFiches(e.id);
    f.forEach(f => { f.ecoleNom = e.nom || e.id; });
    toutesFiches = toutesFiches.concat(f);
    f.forEach(f => { if (f.eleves) total += f.eleves.length; });
    const el = await chargerElevesCompta(e.id);
    el.forEach(el => { el.ecoleNom = e.nom || e.id; el.ecoleId = e.id; });
    tousEleves = tousEleves.concat(el);
    el.forEach(el => {
      if (el.abandon === true) abandons++;
      if (el.exonere === true) exoneres++;
      if (el.dateInscription === todayStr()) today++;
    });
  }
  return { total, abandons, exoneres, today };
}

function updateStats(total, abandons, exoneres, today) {
  document.getElementById("statEcoles").textContent = toutesEcoles.length;
  document.getElementById("statProfs").textContent = tousProfs.length;
  document.getElementById("statFiches").textContent = toutesFiches.length;
  document.getElementById("statEleves").textContent = total;
  document.getElementById("statAbandons").textContent = abandons;
  document.getElementById("statExoneres").textContent = exoneres;
  document.getElementById("statToday").textContent = today;
}

function getFilteredSchools() {
  if (currentSchoolFilter === "all") return toutesEcoles;
  return toutesEcoles.filter(e => e.id === currentSchoolFilter);
}

function getFilteredEleves() {
  let eleves = tousEleves;
  if (currentSchoolFilter !== "all") eleves = eleves.filter(e => e.ecoleId === currentSchoolFilter);
  if (currentEleveFilter.classe) eleves = eleves.filter(e => e.classe === currentEleveFilter.classe);
  if (currentEleveFilter.option) eleves = eleves.filter(e => e.option === currentEleveFilter.option);
  if (currentEleveFilter.sexe) eleves = eleves.filter(e => e.sexe === currentEleveFilter.sexe);
  if (currentEleveFilter.statut === "actif") eleves = eleves.filter(e => e.abandon !== true);
  else if (currentEleveFilter.statut === "abandon") eleves = eleves.filter(e => e.abandon === true);
  else if (currentEleveFilter.statut === "exonere") eleves = eleves.filter(e => e.exonere === true);
  return eleves;
}

// ===== RENDER FUNCTIONS =====
function renderDashboard() {
  const container = document.getElementById("dashboardContainer");
  const eleves = tousEleves.filter(e => e.abandon !== true);
  if (currentSchoolFilter !== "all") eleves = tousEleves.filter(e => e.ecoleId === currentSchoolFilter && e.abandon !== true);
  const abandons = tousEleves.filter(e => e.abandon === true);
  const exoneres = tousEleves.filter(e => e.exonere === true);
  const today = tousEleves.filter(e => e.dateInscription === todayStr());
  const total = eleves.length;

  let html = `
    <div class="stats-grid" style="margin-bottom:16px;">
      <div class="stat-card"><div class="stat-value"><span class="blue">${total}</span></div><div class="stat-label">👥 Actifs</div></div>
      <div class="stat-card"><div class="stat-value"><span class="danger">${abandons.length}</span></div><div class="stat-label">❌ Abandons</div></div>
      <div class="stat-card"><div class="stat-value"><span class="green">${exoneres.length}</span></div><div class="stat-label">🌟 Exonérés</div></div>
      <div class="stat-card"><div class="stat-value"><span class="orange">${today.length}</span></div><div class="stat-label">📅 Aujourd'hui</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box"><h4>📊 Inscriptions par école</h4><canvas id="chartEcoles"></canvas></div>
      <div class="chart-box"><h4>📊 Répartition par sexe</h4><canvas id="chartSexe"></canvas></div>
      <div class="chart-box full"><h4>📊 Évolution des inscriptions</h4><canvas id="chartEvolution"></canvas></div>
    </div>
  `;
  container.innerHTML = html;

  // Charts
  setTimeout(() => {
    // Écoles
    const ecolesData = toutesEcoles.map(e => {
      const count = tousEleves.filter(el => el.ecoleId === e.id && el.abandon !== true).length;
      return { label: e.nom || e.id, value: count };
    }).sort((a,b) => b.value - a.value).slice(0, 10);

    if (document.getElementById("chartEcoles")) {
      chartInstances.ecoles = new Chart(document.getElementById("chartEcoles"), {
        type: "bar",
        data: {
          labels: ecolesData.map(d => d.label),
          datasets: [{ label: "Élèves", data: ecolesData.map(d => d.value), backgroundColor: "#3B82F6", borderRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
      });
    }

    // Sexe
    const sexeCount = { M: 0, F: 0 };
    tousEleves.forEach(e => { if (e.abandon !== true) { if (e.sexe === "M") sexeCount.M++; else if (e.sexe === "F") sexeCount.F++; } });
    if (document.getElementById("chartSexe")) {
      chartInstances.sexe = new Chart(document.getElementById("chartSexe"), {
        type: "doughnut",
        data: {
          labels: ["Garçons", "Filles"],
          datasets: [{ data: [sexeCount.M, sexeCount.F], backgroundColor: ["#3B82F6", "#EC4899"] }]
        },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: "bottom" } } }
      });
    }

    // Évolution (7 jours)
    const days7 = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days7.push(d.toISOString().slice(0, 10)); }
    const inscJours = days7.map(d => tousEleves.filter(e => e.dateInscription === d && e.abandon !== true).length);
    if (document.getElementById("chartEvolution")) {
      chartInstances.evolution = new Chart(document.getElementById("chartEvolution"), {
        type: "line",
        data: {
          labels: days7.map(d => formatDateShort(d)),
          datasets: [{
            label: "Inscriptions",
            data: inscJours,
            borderColor: "#3B82F6",
            backgroundColor: "rgba(59,130,246,0.1)",
            fill: true,
            tension: 0.4
          }]
        },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
      });
    }
  }, 200);
}

function renderEcoles() {
  const container = document.getElementById("ecolesContainer");
  const schools = getFilteredSchools();
  if (!schools.length) { container.innerHTML = '<div class="empty-state">📭 Aucune école</div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>🏫 Écoles <span class="count">'+schools.length+'</span></h3></div>';
  for (const e of schools) {
    const p = tousProfs.filter(p => p.ecoleId === e.id);
    const f = toutesFiches.filter(f => f.ecoleId === e.id);
    const el = tousEleves.filter(el => el.ecoleId === e.id && el.abandon !== true);
    const ab = tousEleves.filter(el => el.ecoleId === e.id && el.abandon === true);
    const ex = tousEleves.filter(el => el.ecoleId === e.id && el.exonere === true);
    const today = tousEleves.filter(el => el.ecoleId === e.id && el.dateInscription === todayStr());
    html += `<div class="item-row"><div class="left"><span class="name">🏫 ${e.nom || e.id}</span><span class="sub">${e.id}</span></div><div class="left"><span class="badge">👨‍🏫 ${p.length}</span><span class="badge green">📄 ${f.length}</span><span class="badge purple">👥 ${el.length}</span><span class="badge danger">❌ ${ab.length}</span><span class="badge gold">🌟 ${ex.length}</span><span class="badge orange">📅 ${today.length}</span></div></div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderProfs() {
  const container = document.getElementById("profsContainer");
  const profs = tousProfs;
  if (!profs.length) { container.innerHTML = '<div class="empty-state">👨‍🏫 Aucun professeur</div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>👨‍🏫 Professeurs <span class="count">'+profs.length+'</span></h3></div>';
  for (const pr of profs) {
    const ecolenom = toutesEcoles.find(e => e.id === pr.ecoleId)?.nom || pr.ecoleId;
    html += `<div class="item-row"><div class="left"><span class="name">${pr.nom}</span><span class="sub">${pr.code}</span><span class="sub">${ecolenom}</span><span class="badge ${pr.actif?'green':'danger'}">${pr.actif?"Actif":"Inactif"}</span></div></div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderEleves() {
  const container = document.getElementById("elevesContainer");
  const eleves = getFilteredEleves();
  let html = `<div class="card"><div class="filter-row">
    <div class="filter-group"><label>📚 Classe</label><select id="eleveFilterClasse"><option value="">Toutes</option>${[...new Set(tousEleves.map(e=>e.classe).filter(Boolean))].sort().map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>
    <div class="filter-group"><label>🎯 Option</label><select id="eleveFilterOption"><option value="">Toutes</option>${[...new Set(tousEleves.map(e=>e.option).filter(Boolean))].sort().map(o=>`<option value="${o}">${o}</option>`).join("")}</select></div>
    <div class="filter-group"><label>⚧ Sexe</label><select id="eleveFilterSexe"><option value="">Tous</option><option value="M">Garçon</option><option value="F">Fille</option></select></div>
    <div class="filter-group"><label>📌 Statut</label><select id="eleveFilterStatut"><option value="">Tous</option><option value="actif">Actif</option><option value="abandon">Abandon</option><option value="exonere">Exonéré</option></select></div>
    <div class="filter-group" style="flex:0.5;"><button class="btn primary" id="applyEleveFilter" style="width:100%;">🔍 Filtrer</button></div>
  </div>`;
  if (!eleves.length) { html += `<div class="empty-state">👥 Aucun élève</div>`; } else {
    html += `<h3 style="font-size:16px;font-weight:600;margin-bottom:12px;">👥 Élèves <span class="count" style="background:var(--bg-primary);padding:0 14px;border-radius:40px;font-size:12px;font-weight:500;color:var(--text-secondary);">${eleves.length}</span></h3>`;
    for (const el of eleves) {
      const statut = el.abandon ? "❌ Abandon" : (el.exonere ? "🌟 Exonéré" : "✅ Actif");
      const sexe = el.sexe === "F" ? "👩" : "👨";
      html += `<div class="item-row"><div class="left"><span class="name">${sexe} ${el.nom||"?"} ${el.postnom||""} ${el.prenom||""}</span><span class="sub">📚 ${el.classe||""} ${el.option?"("+el.option+")":""}</span><span class="sub">${el.ecoleNom||""}</span><span class="sub">📅 ${el.dateInscription||"-"}</span><span class="badge ${el.abandon?'danger':el.exonere?'green':'purple'}">${statut}</span></div></div>`;
    }
  }
  html += '</div>';
  container.innerHTML = html;
  document.getElementById("applyEleveFilter").onclick = function() {
    currentEleveFilter.classe = document.getElementById("eleveFilterClasse").value;
    currentEleveFilter.option = document.getElementById("eleveFilterOption").value;
    currentEleveFilter.sexe = document.getElementById("eleveFilterSexe").value;
    currentEleveFilter.statut = document.getElementById("eleveFilterStatut").value;
    renderEleves();
  };
}

function renderFiches() {
  const container = document.getElementById("fichesContainer");
  let fiches = toutesFiches;
  if (currentSchoolFilter !== "all") fiches = fiches.filter(f => f.ecoleId === currentSchoolFilter);
  if (!fiches.length) { container.innerHTML = '<div class="empty-state">📄 Aucune fiche</div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>📄 Fiches <span class="count">'+fiches.length+'</span></h3></div>';
  for (const f of fiches) {
    const nb = f.eleves ? f.eleves.length : 0;
    html += `<div class="item-row"><div class="left"><span class="name">${f.cours || "Sans cours"}</span><span class="sub">${f.classe || ""} ${f.option ? "("+f.option+")" : ""}</span><span class="badge purple">👥 ${nb}</span><span class="sub">${f.ecoleNom || ""}</span></div></div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderClassement() {
  const container = document.getElementById("classementContainer");
  const actionCount = {};
  for (const log of tousLogs) {
    const user = log.utilisateur;
    if (!user) continue;
    if (!actionCount[user]) actionCount[user] = 0;
    actionCount[user]++;
  }
  const sorted = Object.keys(actionCount).sort((a,b) => actionCount[b] - actionCount[a]).slice(0, 10);
  if (!sorted.length) { container.innerHTML = '<div class="card"><div class="card-header"><h3>🏆 Classement</h3></div><div class="empty-state">Aucune activité</div></div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>🏆 Top 10 professeurs actifs</h3></div>';
  sorted.forEach((user, idx) => {
    const pos = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
    const posClass = idx === 0 ? "" : idx === 1 ? "silver" : idx === 2 ? "bronze" : "";
    html += `<div class="rank-item"><span class="pos ${posClass}">${pos}</span><span class="name">${user}</span><span class="sub">📊 ${actionCount[user]} actions</span></div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderLogs() {
  const container = document.getElementById("logsContainer");
  let logs = tousLogs;
  if (currentSchoolFilter !== "all") logs = logs.filter(l => l.ecoleId === currentSchoolFilter);
  if (!logs.length) { container.innerHTML = '<div class="card"><div class="card-header"><h3>📊 Logs</h3></div><div class="empty-state">📭 Aucun log</div></div>'; return; }
  let html = '<div class="card"><div class="card-header"><h3>📊 Logs <span class="count">'+logs.length+'</span></h3></div>';
  for (const log of logs.slice(0, 50)) {
    const actionMap = {
      connexion_reussie: "🟢 Connexion", creation_fiche: "📄 Création",
      modification_fiche: "✏️ Modification", suppression_fiche: "🗑️ Suppression",
      connexion: "🟢 Connexion", creation: "📄 Création",
      modification: "✏️ Modification", suppression: "🗑️ Suppression"
    };
    const actionLabel = actionMap[log.action] || log.action;
    const badgeClass = log.action === "suppression" || log.action === "suppression_fiche" ? "danger" :
      (log.action === "connexion" || log.action === "connexion_reussie" ? "green" :
      (log.action === "modification" || log.action === "modification_fiche" ? "orange" : "purple"));
    html += `<div class="log-item"><div class="left"><span class="user">${log.utilisateur||"Inconnu"}</span><span class="action">${actionLabel}</span>${log.details?.cours ? `<span class="sub">${log.details.cours} ${log.details.classe||""}</span>` : ""}<span class="time">${formatDate(log.date)}</span></div><span class="badge ${badgeClass}">${log.action||"action"}</span></div>`;
  }
  if (logs.length > 50) html += `<div class="text-muted" style="text-align:center;padding:8px;">+ ${logs.length - 50} logs supplémentaires</div>`;
  html += '</div>';
  container.innerHTML = html;
}

function renderFocus() {
  const container = document.getElementById("focusContainer");
  if (focusActive) { focusListeners.forEach(unsub => unsub()); focusListeners = []; focusActive = false; if (voiceActive) { window.speechSynthesis.cancel(); voiceActive = false; } }
  let html = `<div style="padding:4px 0;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h2 style="color:var(--gold);font-weight:700;">🎯 Inscriptions temps réel</h2><button class="btn primary" id="focusFullscreen">⛶ Plein écran</button></div><div class="focus-grid" id="focusGrid"></div><div class="focus-total"><div class="total-nb" id="focusTotalGlobal">0</div><div class="total-label">📊 Total inscriptions</div></div></div>`;
  container.innerHTML = html;
  focusActive = true;
  const grid = document.getElementById("focusGrid");
  const totalEl = document.getElementById("focusTotalGlobal");
  let totalGlobal = 0;
  const schoolCounts = {};
  const todayCounts = {};
  const schools = currentSchoolFilter === "all" ? toutesEcoles : toutesEcoles.filter(e => e.id === currentSchoolFilter);
  schools.forEach(e => {
    const card = document.createElement("div");
    card.className = "focus-card";
    card.id = `focus-${e.id}`;
    card.innerHTML = `<div class="ecole-name">🏫 ${e.nom||e.id}</div><div class="total" id="focusTotal-${e.id}">0</div><div class="total-label">inscrits</div><div class="today" id="focusToday-${e.id}">⬆️ +0</div><div class="total-label">aujourd'hui</div>`;
    grid.appendChild(card);
  });
  const initCounts = async () => {
    for (const e of schools) {
      const eleves = tousEleves.filter(el => el.ecoleId === e.id);
      const actifs = eleves.filter(el => el.abandon !== true);
      const today = eleves.filter(el => el.dateInscription === todayStr() && el.abandon !== true);
      schoolCounts[e.id] = actifs.length;
      todayCounts[e.id] = today.length;
      totalGlobal += actifs.length;
      updateFocusCard(e.id);
    }
    totalEl.textContent = totalGlobal;
  };
  const updateFocusCard = (schoolId) => {
    const totalEl = document.getElementById(`focusTotal-${schoolId}`);
    const todayEl = document.getElementById(`focusToday-${schoolId}`);
    if (totalEl) totalEl.textContent = schoolCounts[schoolId] || 0;
    if (todayEl) todayEl.textContent = `⬆️ +${todayCounts[schoolId]||0}`;
    const card = document.getElementById(`focus-${schoolId}`);
    if (card) card.classList.add("flash");
    setTimeout(() => { if (card) card.classList.remove("flash"); }, 500);
  };
  schools.forEach(e => {
    const unsub = onSnapshot(collection(db, `${e.id}_compta_eleves`), (snap) => {
      if (!focusActive) return;
      let newCount = 0, newToday = 0;
      snap.forEach(ds => {
        const d = ds.data();
        if (d._type === "compta_eleve" && d.abandon !== true) {
          newCount++;
          if (d.dateInscription === todayStr()) newToday++;
        }
      });
      schoolCounts[e.id] = newCount;
      todayCounts[e.id] = newToday;
      let newTotal = 0;
      Object.values(schoolCounts).forEach(v => newTotal += v);
      totalGlobal = newTotal;
      totalEl.textContent = totalGlobal;
      updateFocusCard(e.id);
    }, (error) => {});
    focusListeners.push(unsub);
  });
  initCounts();
  voiceActive = true;
  document.getElementById("focusFullscreen")?.addEventListener("click", () => {
    if (document.fullscreenElement) { document.exitFullscreen(); } else { document.documentElement.requestFullscreen(); }
  });
  setTimeout(() => {
    const msg = `Mode focus activé. ${schools.length} écoles en surveillance.`;
    const utterance = new SpeechSynthesisUtterance(msg);
    utterance.lang = "fr-FR";
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }, 500);
}

function renderParental() {
  const container = document.getElementById("parentalContainer");
  const codes = new Map();
  tousEleves.forEach(e => {
    if (e.parentCode && !e.abandon) {
      if (!codes.has(e.parentCode)) codes.set(e.parentCode, []);
      codes.get(e.parentCode).push(e);
    }
  });
  let html = `
    <div class="card">
      <div class="card-header"><h3>👨‍👩‍👧‍👦 Espace Parental</h3></div>
      <div class="filter-row">
        <div class="filter-group"><label>🔍 Code parent</label><input type="text" id="searchParentCode" placeholder="6 chiffres" maxlength="6"></div>
        <div class="filter-group" style="flex:0.5;"><button class="btn primary" id="searchParentBtn" style="width:100%;">🔍 Rechercher</button></div>
      </div>
      <div id="parentalResult"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>📊 Statistiques parentales</h3></div>
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card"><div class="stat-value"><span class="blue">${codes.size}</span></div><div class="stat-label">Familles</div></div>
        <div class="stat-card"><div class="stat-value"><span class="purple">${tousEleves.filter(e => e.parentCode && !e.abandon).length}</span></div><div class="stat-label">Élèves avec code</div></div>
        <div class="stat-card"><div class="stat-value"><span class="danger">${tousEleves.filter(e => !e.parentCode && !e.abandon).length}</span></div><div class="stat-label">Sans code</div></div>
        <div class="stat-card"><div class="stat-value"><span class="green">${[...codes.values()].filter(f => f.length > 1).length}</span></div><div class="stat-label">Familles multi-enfants</div></div>
      </div>
    </div>
  `;
  container.innerHTML = html;

  document.getElementById("searchParentBtn").onclick = function() {
    const code = document.getElementById("searchParentCode").value.trim();
    const resultDiv = document.getElementById("parentalResult");
    if (!code || code.length !== 6) {
      resultDiv.innerHTML = '<div class="empty-state">🔑 Entrez un code parent valide (6 chiffres)</div>';
      return;
    }
    const enfants = codes.get(code) || [];
    if (enfants.length === 0) {
      resultDiv.innerHTML = `<div class="empty-state">🔑 Aucun élève trouvé avec le code ${code}</div>`;
      return;
    }
    let html = `<div style="background:rgba(59,130,246,0.08);border-radius:12px;padding:16px;border-left:3px solid var(--blue);margin-top:12px;">
      <div style="font-weight:700;font-size:16px;color:var(--gold);">🔑 Code ${code} - ${enfants.length} enfant(s)</div>`;
    for (const e of enfants) {
      const sexe = e.sexe === "F" ? "👩" : "👨";
      html += `<div class="item-row"><div class="left"><span class="name">${sexe} ${e.nom} ${e.postnom||""} ${e.prenom||""}</span><span class="sub">📚 ${e.classe||""} ${e.option?"("+e.option+")":""}</span><span class="sub">🏫 ${e.ecoleNom||""}</span></div></div>`;
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  };
}

// ===== NAVIGATION =====
function setupTabs() {
  document.querySelectorAll(".nav-item, .tab-btn").forEach(el => {
    el.addEventListener("click", function() {
      const target = this.dataset.tab;
      if (!target) return;
      document.querySelectorAll(".nav-item, .tab-btn").forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      const container = document.getElementById(target + "Container");
      if (container) container.classList.add("active");

      if (target === "dashboard") renderDashboard();
      else if (target === "eleves") renderEleves();
      else if (target === "logs") renderLogs();
      else if (target === "classement") renderClassement();
      else if (target === "focus") {
        if (focusActive) { focusListeners.forEach(unsub => unsub()); focusListeners = []; focusActive = false; if (voiceActive) { window.speechSynthesis.cancel(); voiceActive = false; } }
        renderFocus();
      } else if (target === "parental") renderParental();
      else if (target === "ecoles") renderEcoles();
      else if (target === "profs") renderProfs();
      else if (target === "fiches") renderFiches();

      document.getElementById("breadcrumb").textContent = this.textContent.trim();
      document.getElementById("pageTitle").textContent = this.textContent.trim();
    });
  });
}

function setupSchoolFilter() {
  document.getElementById("schoolFilter").addEventListener("change", function() {
    currentSchoolFilter = this.value;
    renderEcoles();
    renderProfs();
    renderFiches();
    renderLogs();
    renderEleves();
    renderClassement();
    if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
    if (document.getElementById("focusContainer").classList.contains("active")) {
      if (focusActive) { focusListeners.forEach(unsub => unsub()); focusListeners = []; focusActive = false; if (voiceActive) { window.speechSynthesis.cancel(); voiceActive = false; } }
      renderFocus();
    }
    if (document.getElementById("parentalContainer").classList.contains("active")) renderParental();
  });
}

async function initSchoolSelect() {
  const select = document.getElementById("schoolFilter");
  select.innerHTML = '<option value="all">🌍 Toutes les écoles</option>';
  toutesEcoles.forEach(e => { select.innerHTML += `<option value="${e.id}">🏫 ${e.nom||e.id}</option>`; });
}

// ===== ACTIONS GLOBALES =====
window.toutSupprimer = function() {
  showConfirm("RÉINITIALISATION", `⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${toutesEcoles.length} écoles<br>${tousProfs.length} professeurs<br>${toutesFiches.length} fiches`, async () => {
    try {
      for (const e of toutesEcoles) {
        const f = await getDocs(collection(db, `${e.id}_fiches`));
        for (const d of f.docs) { await deleteDoc(d.ref); }
        const p = await getDocs(collection(db, `${e.id}_professeurs`));
        for (const d of p.docs) { await deleteDoc(d.ref); }
        try { await deleteDoc(doc(db, "ecoles_autorisees", e.id)); } catch(e) {}
      }
      toast("Tout supprimé", "success");
      await rafraichir();
    } catch(e) { toast(`Erreur: ${e.message}`, "error"); }
  });
};

async function rafraichir() {
  await chargerEcoles();
  await initSchoolSelect();
  const { total, abandons, exoneres, today } = await chargerTout();
  updateStats(total, abandons, exoneres, today);
  renderEcoles();
  renderProfs();
  renderFiches();
  renderEleves();
  renderClassement();
  renderLogs();
  if (document.getElementById("dashboardContainer").classList.contains("active")) renderDashboard();
  if (document.getElementById("focusContainer").classList.contains("active")) {
    if (focusActive) { focusListeners.forEach(unsub => unsub()); focusListeners = []; focusActive = false; if (voiceActive) { window.speechSynthesis.cancel(); voiceActive = false; } }
    renderFocus();
  }
  if (document.getElementById("parentalContainer").classList.contains("active")) renderParental();
  toast("Données actualisées", "info");
}
window.rafraichir = rafraichir;

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('globalSearch')?.focus();
    toast("🔍 Recherche globale", "info");
  }
  if (e.key === 'Escape') {
    document.getElementById('globalSearch')?.blur();
  }
});

// ===== SIDEBAR TOGGLE =====
document.getElementById("sidebarToggle")?.addEventListener("click", function() {
  document.getElementById("sidebar").classList.toggle("collapsed");
  const btn = this;
  const isCollapsed = document.getElementById("sidebar").classList.contains("collapsed");
  btn.innerHTML = isCollapsed ? '▶ <span>Étendre</span>' : '◀ <span>Réduire</span>';
});

// ===== INIT =====
(async function init() {
  try {
    await chargerEcoles();
    await initSchoolSelect();
    const { total, abandons, exoneres, today } = await chargerTout();
    updateStats(total, abandons, exoneres, today);
    renderDashboard();
    renderEcoles();
    renderProfs();
    renderFiches();
    renderEleves();
    renderClassement();
    renderLogs();
    renderParental();
    setupTabs();
    setupSchoolFilter();
    toast("🚀 Dashboard prêt", "success");
  } catch(e) {
    document.getElementById("dashboardContainer").innerHTML = `<div class="empty-state" style="color:var(--red);">❌ Erreur: ${e.message}<br><button class="btn primary" onclick="window.rafraichir()" style="margin-top:12px;">🔄 Réessayer</button></div>`;
    toast("Erreur de chargement", "error");
  }
})();
</script>
</body>
</html>
