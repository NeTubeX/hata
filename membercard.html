<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Carte Membre NetubeX</title>

<style>
body{
  font-family: Arial;
  background:#f2f2f2;
}

.card{
  width: 350px;
  height: 220px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  position: relative;
  overflow: hidden;
  border: 2px solid #000;
}

/* WATERMARK */
.watermark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-30deg);
  font-size:35px;
  color:rgba(0,0,0,0.05);
  font-weight:bold;
  pointer-events:none;
}

/* HEADER */
.title{
  font-weight:bold;
  font-size:14px;
}

/* INFO */
.info{
  margin-top:10px;
  font-size:12px;
  line-height:1.5;
}

/* BARCODES */
.barcodes{
  position:absolute;
  bottom:10px;
  left:10px;
}
</style>

</head>

<body>

<div class="card">

  <div class="watermark">NETUBEX-SARL</div>

  <div class="title">CARTE MEMBRE OFFICIELLE</div>

  <div class="info">
    Nom : John Doe<br>
    ID : NXB-2026-0001<br>
    Statut : Membre Actif<br>
    Date : 2026
  </div>

  <div class="barcodes">
    <svg id="barcode1"></svg>
    <svg id="barcode2"></svg>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>

<script>
JsBarcode("#barcode1", "NETUBEX-SARL-2026-0001", {
  format: "CODE128",
  displayValue: true,
  width: 1,
  height: 40
});

JsBarcode("#barcode2", "VERIFY-8F3A91", {
  format: "CODE128",
  displayValue: false,
  width: 1,
  height: 25
});
</script>

</body>
</html>
