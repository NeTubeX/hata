<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Test - Piano ou Guitare ?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffd700;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .player {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .player .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .player .name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .player .status {
            font-size: 13px;
            color: #666;
        }

        .player .status.playing {
            color: #10b981;
        }

        .player audio {
            width: 100%;
            margin-top: 12px;
            border-radius: 8px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice-btn {
            background: #0f0f1a;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .choice-btn:hover {
            border-color: #ffd700;
            background: #1a1a2e;
        }

        .choice-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .choice-btn .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }

        .choice-btn .label {
            font-size: 16px;
            font-weight: 600;
        }

        .choice-btn .check {
            display: none;
            color: #10b981;
            font-size: 18px;
            margin-top: 4px;
        }

        .choice-btn.active .check {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-play {
            background: #10b981;
            color: #fff;
        }

        .btn-play:hover {
            opacity: 0.8;
        }

        .btn-play.playing {
            background: #ef4444;
        }

        .btn-stop {
            background: #333;
            color: #888;
        }

        .btn-stop:hover {
            background: #444;
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            padding: 10px 16px;
            background: #0f0f1a;
            border-radius: 40px;
        }

        .volume label {
            font-size: 13px;
            color: #888;
        }

        .volume input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
        }

        .volume .val {
            font-size: 13px;
            color: #ffd700;
            min-width: 30px;
            text-align: right;
        }

        .result {
            text-align: center;
            padding: 16px;
            background: #0f0f1a;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #333;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result .big {
            font-size: 48px;
            display: block;
        }

        .result .text {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }

        .result .sub {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Test Musique</h1>
    <p class="subtitle">Piano ou Guitare ? Écoutez et choisissez</p>

    <!-- Lecteur actuel -->
    <div class="player" id="currentPlayer">
        <span class="icon" id="playerIcon">🎹</span>
        <div class="name" id="playerName">Piano Relax</div>
        <div class="status stopped" id="playerStatus">⏸ Arrêté</div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Choix -->
    <div class="choices">
        <div class="choice-btn active" data-instrument="piano" onclick="selectInstrument('piano')">
            <span class="emoji">🎹</span>
            <div class="label">Piano</div>
            <div class="check">✅</div>
        </div>
        <div class="choice-btn" data-instrument="guitare" onclick="selectInstrument('guitare')">
            <span class="emoji">🎸</span>
            <div class="label">Guitare</div>
            <div class="check">✅</div>
        </div>
    </div>

    <!-- Contrôles -->
    <div class="controls">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">▶ Jouer</button>
        <button class="btn-stop" onclick="stopAudio()">⏹ Arrêter</button>
    </div>

    <!-- Volume -->
    <div class="volume">
        <label>🔊 Volume</label>
        <input type="range" min="0" max="100" value="15" id="volumeSlider" oninput="updateVolume(this.value)">
        <span class="val" id="volumeVal">15%</span>
    </div>

    <!-- Résultat -->
    <div class="result" id="result">
        <span class="big" id="resultEmoji">🎹</span>
        <div class="text" id="resultText">Vous avez choisi le Piano</div>
        <div class="sub" id="resultSub">Ambiance calme et sereine</div>
    </div>
</div>

<script>
    // ========== CONFIGURATION ==========
    const TRACKS = {
        piano: {
            name: 'Piano Relax',
            icon: '🎹',
            url: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_9f8b3e1b2c.mp3',
            description: 'Ambiance calme et sereine'
        },
        guitare: {
            name: 'Guitare Douce',
            icon: '🎸',
            url: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_7c3a9e8f1d.mp3',
            description: 'Ambiance chaleureuse et naturelle'
        }
    };

    // ========== ÉTAT ==========
    let currentInstrument = 'piano';
    let isPlaying = false;
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('playerStatus');
    const nameEl = document.getElementById('playerName');
    const iconEl = document.getElementById('playerIcon');

    // ========== FONCTIONS ==========
    function selectInstrument(instrument) {
        currentInstrument = instrument;
        
        // UI
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.choice-btn[data-instrument="${instrument}"]`).classList.add('active');
        
        // Charger la musique
        const track = TRACKS[instrument];
        audio.src = track.url;
        audio.volume = document.getElementById('volumeSlider').value / 100;
        iconEl.textContent = track.icon;
        nameEl.textContent = track.name;
        
        // Arrêter si en cours
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            updateUI();
        }
        
        // Afficher le résultat
        document.getElementById('resultEmoji').textContent = track.icon;
        document.getElementById('resultText').textContent = `Vous avez choisi ${instrument === 'piano' ? 'le Piano' : 'la Guitare'}`;
        document.getElementById('resultSub').textContent = track.description;
        document.getElementById('result').classList.add('show');
        
        console.log(`🎵 Instrument sélectionné : ${instrument}`);
    }

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        } else {
            audio.play().then(() => {
                isPlaying = true;
            }).catch(e => {
                console.log('⏸ Lecture bloquée, cliquez sur Play');
            });
        }
        updateUI();
    }

    function stopAudio() {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        updateUI();
    }

    function updateUI() {
        if (isPlaying) {
            playBtn.textContent = '⏸ Pause';
            playBtn.classList.add('playing');
            statusEl.textContent = '▶ En cours';
            statusEl.className = 'status playing';
        } else {
            playBtn.textContent = '▶ Jouer';
            playBtn.classList.remove('playing');
            statusEl.textContent = '⏸ Arrêté';
            statusEl.className = 'status stopped';
        }
    }

    function updateVolume(val) {
        const v = val / 100;
        audio.volume = v;
        document.getElementById('volumeVal').textContent = val + '%';
    }

    // ========== INITIALISATION ==========
    // Charger le piano par défaut
    selectInstrument('piano');

    // Écouter la fin de la musique
    audio.addEventListener('ended', () => {
        isPlaying = false;
        updateUI();
    });

    console.log('🎵 App de test chargée !');
    console.log('👉 Choisissez entre Piano 🎹 et Guitare 🎸');
</script>

</body>
</html>
