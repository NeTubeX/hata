<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Firebase Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f5;font-family:'Inter',sans-serif;padding:20px;color:#1a1a2e}
.container{max-width:1200px;margin:0 auto}
h1{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:6px;display:flex;align-items:center;gap:12px}
h1 i{color:#2563eb}
.subtitle{color:#6b7280;font-size:13px;margin-bottom:20px}
.config-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #e5e7eb}
.config-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.config-card h3 i{color:#2563eb}
.config-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.config-row input,.config-row select{padding:10px 14px;border-radius:10px;border:2px solid #e5e7eb;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .3s;background:#f8fafc;color:#1a1a2e;width:100%}
.config-row input:focus,.config-row select:focus{border-color:#2563eb}
.btn{background:#1a1a2e;color:#fff;border:none;padding:10px 20px;border-radius:30px;font-weight:600;font-size:13px;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#2a2a42;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626}
.btn-danger:hover{background:#b91c1c}
.btn-success{background:#16a34a}
.btn-success:hover{background:#15803d}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-outline{background:transparent;border:2px solid #e5e7eb;color:#1a1a2e}
.btn-outline:hover{background:#f3f4f6;border-color:#9ca3af}
.collection-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.collection-card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:all .3s}
.collection-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06);border-color:#d1d5db}
.collection-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.collection-card .name{font-weight:700;font-size:15px;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.collection-card .name i{color:#2563eb}
.collection-card .count{font-size:12px;color:#6b7280;background:#f3f4f6;padding:2px 12px;border-radius:30px}
.collection-card .docs{max-height:200px;overflow-y:auto;margin-top:8px}
.collection-card .doc-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid #f1f3f5;font-size:12px;gap:8px}
.collection-card .doc-item:last-child{border-bottom:none}
.collection-card .doc-item .doc-id{font-family:monospace;font-size:11px;color:#2563eb;word-break:break-all;flex:1}
.collection-card .doc-item .doc-actions{display:flex;gap:4px;flex-shrink:0}
.collection-card .doc-item .doc-actions button{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:11px;transition:all .2s}
.collection-card .doc-item .doc-actions .view-btn{color:#2563eb}
.collection-card .doc-item .doc-actions .view-btn:hover{background:#dbeafe}
.collection-card .doc-item .doc-actions .del-btn{color:#dc2626}
.collection-card .doc-item .doc-actions .del-btn:hover{background:#fee2e2}
.empty-state{text-align:center;padding:40px 20px;color:#6b7280}
.empty-state i{font-size:48px;opacity:0.2;margin-bottom:12px;display:block}
.loading{text-align:center;padding:30px;color:#6b7280}
.loading i{font-size:28px;animation:spin 1s linear infinite;display:block;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s}
.modal.show{visibility:visible;opacity:1}
.modal-content{background:#fff;border-radius:16px;padding:28px;max-width:600px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-content h3{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
.modal-content .doc-data{background:#f8fafc;padding:16px;border-radius:10px;border:1px solid #e5e7eb;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;margin:12px 0}
.modal-content .close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:#9ca3af;float:right}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border-radius:12px;padding:12px 18px;min-width:200px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.1);border-left:4px solid #16a34a;transform:translateY(80px);transition:transform .4s;pointer-events:auto}
.toast.show{transform:translateY(0)}
.toast.error{border-left-color:#dc2626}
.toast.warning{border-left-color:#d97706}
.toast-icon{font-size:16px}
</style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-database"></i> Firebase Manager</h1>
    <p class="subtitle">Gérez vos collections et documents Firebase</p>

    <div class="config-card">
        <h3><i class="fas fa-cog"></i> Configuration Firebase</h3>
        <div class="config-row">
            <input type="text" id="projectId" placeholder="Project ID" value="netubexmoney">
            <input type="text" id="apiKey" placeholder="API Key" value="AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA">
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" id="connectBtn"><i class="fas fa-link"></i> Connecter</button>
            <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync"></i> Rafraîchir</button>
        </div>
        <div id="statusMsg" style="margin-top:10px;font-size:13px;color:#6b7280;"></div>
    </div>

    <div id="collectionsContainer">
        <div class="loading"><i class="fas fa-spinner"></i> Connectez-vous pour charger les collections</div>
    </div>
</div>

<div class="modal" id="docModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Document</h3>
        <div class="doc-data" id="modalData"></div>
        <div class="modal-footer">
            <button class="btn btn-sm btn-outline" onclick="closeModal()">Fermer</button>
            <button class="btn btn-sm btn-danger" id="modalDeleteBtn"><i class="fas fa-trash"></i> Supprimer</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc, query, limit } from "firebase/firestore";

let db = null;
let currentCollections = {};
let currentModalDoc = null;
let currentModalCollection = null;
let isConnecting = false;

function toast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-exclamation-triangle' };
    const colors = { success: '#16a34a', error: '#dc2626', warning: '#d97706' };
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = `<div class="toast-icon" style="color:${colors[type]}"><i class="${icons[type]}"></i></div>
                    <div style="flex:1;font-size:13px;color:#1a1a2e">${message}</div>`;
    container.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3500);
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

function formatData(data) {
    try {
        return JSON.stringify(data, (key, value) => {
            if (value && typeof value === 'object' && value.seconds !== undefined) {
                return new Date(value.seconds * 1000).toISOString();
            }
            return value;
        }, 2);
    } catch(e) { return String(data); }
}

function closeModal() {
    document.getElementById('docModal').classList.remove('show');
    currentModalDoc = null;
    currentModalCollection = null;
}
window.closeModal = closeModal;

async function viewDocument(collectionName, docId) {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    try {
        const docRef = doc(db, collectionName, docId);
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            currentModalDoc = { id: docId, data: snap.data() };
            currentModalCollection = collectionName;
            document.getElementById('modalTitle').textContent = `📄 ${collectionName} / ${docId}`;
            document.getElementById('modalData').textContent = formatData(snap.data());
            document.getElementById('docModal').classList.add('show');
        } else {
            toast('Document non trouvé', 'error');
        }
    } catch (e) {
        toast('Erreur: ' + e.message, 'error');
    }
}
window.viewDocument = viewDocument;

async function deleteDocument(collectionName, docId) {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    if (!confirm(`Supprimer définitivement le document "${docId}" de "${collectionName}" ?`)) return;
    try {
        await deleteDoc(doc(db, collectionName, docId));
        toast(`Document "${docId}" supprimé`, 'warning');
        loadCollections();
    } catch (e) {
        toast('Erreur: ' + e.message, 'error');
    }
}
window.deleteDocument = deleteDocument;

document.getElementById('modalDeleteBtn').addEventListener('click', function() {
    if (currentModalDoc && currentModalCollection) {
        deleteDocument(currentModalCollection, currentModalDoc.id);
        closeModal();
    }
});

async function loadCollections() {
    const container = document.getElementById('collectionsContainer');
    if (!db) {
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Connectez-vous pour charger les collections</div>';
        return;
    }
    container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Chargement des collections...</div>';

    try {
        // Liste des collections communes à explorer
        const knownCollections = [
            'punitions', 'fiches', 'professeurs', 'eleves', 'classes',
            'utilisateurs', 'presences', 'notes', 'emplois', 'communications',
            'messages', 'users', 'students', 'teachers', 'courses'
        ];

        // Ajouter les collections avec préfixe d'école
        const urlParams = new URLSearchParams(window.location.search);
        const schoolId = urlParams.get('ecole');
        const prefixes = ['', schoolId ? schoolId.replace(/-/g, '_') + '_' : ''];

        const allDocs = {};
        const existingCollections = [];

        for (const prefix of prefixes) {
            for (const baseName of knownCollections) {
                const name = prefix + baseName;
                if (existingCollections.includes(name)) continue;
                try {
                    const q = query(collection(db, name), limit(1));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        existingCollections.push(name);
                        const fullSnap = await getDocs(collection(db, name));
                        const docs = [];
                        fullSnap.forEach(docSnap => {
                            docs.push({ id: docSnap.id, data: docSnap.data() });
                        });
                        allDocs[name] = docs;
                    }
                } catch (e) {
                    // Collection n'existe pas
                }
            }
        }

        // Tester aussi "school_" + nom
        if (schoolId) {
            const simple = schoolId.replace(/-/g, '_');
            const testNames = [simple, simple + '_data', simple + '_info'];
            for (const name of testNames) {
                if (existingCollections.includes(name)) continue;
                try {
                    const q = query(collection(db, name), limit(1));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        existingCollections.push(name);
                        const fullSnap = await getDocs(collection(db, name));
                        const docs = [];
                        fullSnap.forEach(docSnap => {
                            docs.push({ id: docSnap.id, data: docSnap.data() });
                        });
                        allDocs[name] = docs;
                    }
                } catch (e) {}
            }
        }

        currentCollections = allDocs;

        if (existingCollections.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><p>Aucune collection trouvée</p>
                <p style="font-size:12px;margin-top:6px;color:#9ca3af">Vérifiez que Firestore contient des données</p></div>`;
            return;
        }

        let html = '<div class="collection-list">';
        for (const name of existingCollections.sort()) {
            const docs = allDocs[name] || [];
            html += `
                <div class="collection-card">
                    <div class="header">
                        <span class="name"><i class="fas fa-folder"></i> ${escapeHtml(name)}</span>
                        <span class="count">${docs.length} doc${docs.length > 1 ? 's' : ''}</span>
                    </div>
                    <div class="docs">
                        ${docs.length === 0 ? '<div style="padding:8px;color:#9ca3af;font-size:12px;">Aucun document</div>' : ''}
                        ${docs.map(d => `
                            <div class="doc-item">
                                <span class="doc-id">${escapeHtml(d.id)}</span>
                                <div class="doc-actions">
                                    <button class="view-btn" onclick="viewDocument('${escapeHtml(name)}','${escapeHtml(d.id)}')" title="Voir"><i class="fas fa-eye"></i></button>
                                    <button class="del-btn" onclick="if(confirm('Supprimer ce document ?')) deleteDocument('${escapeHtml(name)}','${escapeHtml(d.id)}')" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;

    } catch (e) {
        console.error(e);
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#dc2626;opacity:0.6"></i>
            <p style="color:#dc2626">Erreur: ${escapeHtml(e.message)}</p>
            <p style="font-size:12px;margin-top:6px;color:#6b7280">Vérifiez votre configuration Firebase</p></div>`;
        toast('Erreur de chargement: ' + e.message, 'error');
    }
}

function connectFirebase() {
    if (isConnecting) return;
    isConnecting = true;
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = '⏳ Connexion en cours...';
    statusMsg.style.color = '#2563eb';

    const projectId = document.getElementById('projectId').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();

    if (!projectId || !apiKey) {
        toast('Veuillez remplir Project ID et API Key', 'error');
        statusMsg.textContent = '❌ Remplissez tous les champs';
        statusMsg.style.color = '#dc2626';
        isConnecting = false;
        return;
    }

    try {
        const config = {
            apiKey: apiKey,
            authDomain: projectId + '.firebaseapp.com',
            projectId: projectId,
            storageBucket: projectId + '.firebasestorage.app',
            messagingSenderId: '856592608176',
            appId: '1:856592608176:web:69f9df9cfd4f8c28630475'
        };
        const app = initializeApp(config);
        db = getFirestore(app);
        statusMsg.textContent = '✅ Connecté avec succès !';
        statusMsg.style.color = '#16a34a';
        toast('Connecté avec succès !', 'success');
        loadCollections();
    } catch (e) {
        console.error(e);
        statusMsg.textContent = '❌ Erreur: ' + e.message;
        statusMsg.style.color = '#dc2626';
        toast('Erreur: ' + e.message, 'error');
        db = null;
    }
    isConnecting = false;
}

document.getElementById('connectBtn').addEventListener('click', connectFirebase);
document.getElementById('refreshBtn').addEventListener('click', function() {
    if (db) {
        toast('Rafraîchissement...', 'warning');
        loadCollections();
    } else {
        toast('Connectez-vous d\'abord', 'error');
    }
});

// Connexion automatique au chargement
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(connectFirebase, 500);
});
</script>
</body>
</html>
