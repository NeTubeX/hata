<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Firebase Manager - Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f5;font-family:'Inter',sans-serif;padding:20px;color:#1a1a2e}
.container{max-width:1400px;margin:0 auto}
h1{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:6px;display:flex;align-items:center;gap:12px}
h1 i{color:#2563eb}
.subtitle{color:#6b7280;font-size:13px;margin-bottom:20px}
.config-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #e5e7eb}
.config-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.config-card h3 i{color:#2563eb}
.config-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.config-row input{padding:10px 14px;border-radius:10px;border:2px solid #e5e7eb;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .3s;background:#f8fafc;color:#1a1a2e;width:100%}
.config-row input:focus{border-color:#2563eb}
.btn{background:#1a1a2e;color:#fff;border:none;padding:10px 20px;border-radius:30px;font-weight:600;font-size:13px;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#2a2a42;transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626}
.btn-danger:hover{background:#b91c1c}
.btn-success{background:#16a34a}
.btn-success:hover{background:#15803d}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-outline{background:transparent;border:2px solid #e5e7eb;color:#1a1a2e}
.btn-outline:hover{background:#f3f4f6;border-color:#9ca3af}
.btn-purple{background:#7c3aed;color:#fff}
.btn-purple:hover{background:#6d28d9}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.collection-card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:all .3s;position:relative}
.collection-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06);border-color:#d1d5db}
.collection-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.collection-card .name{font-weight:700;font-size:14px;color:#1a1a2e;display:flex;align-items:center;gap:8px;word-break:break-all}
.collection-card .name i{color:#2563eb}
.collection-card .count{font-size:12px;color:#6b7280;background:#f3f4f6;padding:2px 12px;border-radius:30px;white-space:nowrap}
.collection-card .docs{max-height:200px;overflow-y:auto;margin-top:8px}
.collection-card .doc-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid #f1f3f5;font-size:12px;gap:8px}
.collection-card .doc-item:last-child{border-bottom:none}
.collection-card .doc-item .doc-id{font-family:monospace;font-size:11px;color:#2563eb;word-break:break-all;flex:1}
.collection-card .doc-item .doc-actions{display:flex;gap:4px;flex-shrink:0}
.collection-card .doc-item .doc-actions button{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:11px;transition:all .2s}
.collection-card .doc-item .doc-actions .view-btn{color:#2563eb}
.collection-card .doc-item .doc-actions .view-btn:hover{background:#dbeafe}
.collection-card .doc-item .doc-actions .del-btn{color:#dc2626}
.collection-card .doc-item .doc-actions .del-btn:hover{background:#fee2e2}
.collection-card .card-actions{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap}
.collection-card .card-actions .btn{font-size:11px;padding:5px 12px}
.empty-state{text-align:center;padding:40px 20px;color:#6b7280}
.empty-state i{font-size:48px;opacity:0.2;margin-bottom:12px;display:block}
.loading{text-align:center;padding:30px;color:#6b7280}
.loading i{font-size:28px;animation:spin 1s linear infinite;display:block;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s}
.modal.show{visibility:visible;opacity:1}
.modal-content{background:#fff;border-radius:16px;padding:28px;max-width:600px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-content h3{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px;word-break:break-all}
.modal-content .doc-data{background:#f8fafc;padding:16px;border-radius:10px;border:1px solid #e5e7eb;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;margin:12px 0}
.modal-content .close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:#9ca3af;float:right}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border-radius:12px;padding:12px 18px;min-width:200px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.1);border-left:4px solid #16a34a;transform:translateY(80px);transition:transform .4s;pointer-events:auto}
.toast.show{transform:translateY(0)}
.toast.error{border-left-color:#dc2626}
.toast.warning{border-left-color:#d97706}
.toast-icon{font-size:16px}
.prefix-section{margin-top:14px;padding:12px 16px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb}
.prefix-section label{font-size:12px;font-weight:600;color:#1a1a2e;display:block;margin-bottom:6px}
.prefix-tags{display:flex;flex-wrap:wrap;gap:6px}
.prefix-tag{background:#e5e7eb;padding:4px 12px;border-radius:30px;font-size:11px;color:#1a1a2e;cursor:pointer;transition:all .2s}
.prefix-tag:hover{background:#d1d5db}
.prefix-tag.active{background:#2563eb;color:#fff}
.prefix-tag .del-prefix{color:#dc2626;margin-left:6px;cursor:pointer;font-weight:700}
.prefix-tag .del-prefix:hover{color:#b91c1c}
.add-prefix-row{display:flex;gap:8px;margin-top:8px}
.add-prefix-row input{flex:1;padding:8px 12px;border-radius:30px;border:2px solid #e5e7eb;font-size:12px;font-family:'Inter',sans-serif;outline:none;background:#fff}
.add-prefix-row input:focus{border-color:#2563eb}
.add-prefix-row button{padding:8px 16px;border-radius:30px;background:#7c3aed;color:#fff;border:none;font-weight:600;font-size:12px;cursor:pointer}
.collection-name-section{margin-top:12px;padding:12px 16px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb}
.collection-name-section label{font-size:12px;font-weight:600;color:#1a1a2e;display:block;margin-bottom:6px}
.collection-name-tags{display:flex;flex-wrap:wrap;gap:6px}
.collection-name-tag{background:#e5e7eb;padding:4px 12px;border-radius:30px;font-size:11px;color:#1a1a2e}
.collection-name-tag .del-name{color:#dc2626;margin-left:6px;cursor:pointer;font-weight:700}
.collection-name-tag .del-name:hover{color:#b91c1c}
.add-name-row{display:flex;gap:8px;margin-top:8px}
.add-name-row input{flex:1;padding:8px 12px;border-radius:30px;border:2px solid #e5e7eb;font-size:12px;font-family:'Inter',sans-serif;outline:none;background:#fff}
.add-name-row input:focus{border-color:#2563eb}
.add-name-row button{padding:8px 16px;border-radius:30px;background:#8b5cf6;color:#fff;border:none;font-weight:600;font-size:12px;cursor:pointer}
.stats-bar{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb}
.stats-bar .stat{font-size:13px;color:#6b7280}
.stats-bar .stat strong{color:#1a1a2e}
.progress-bar{width:100%;height:4px;background:#e5e7eb;border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.progress-bar .progress-fill{height:100%;background:#2563eb;width:0%;transition:width .3s}
.delete-collection-btn{background:#dc2626;color:#fff;border:none;padding:5px 12px;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:6px}
.delete-collection-btn:hover{background:#b91c1c;transform:scale(1.05)}
.delete-collection-btn:disabled{opacity:0.5;cursor:not-allowed}
.manual-list{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-top:8px;max-height:150px;overflow-y:auto;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:#1a1a2e}
</style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-database"></i> Firebase Manager</h1>
    <p class="subtitle">Explorez vos collections Firebase</p>

    <div class="config-card">
        <h3><i class="fas fa-cog"></i> Configuration</h3>
        <div class="config-row">
            <input type="text" id="projectId" placeholder="Project ID" value="netubexmoney">
            <input type="text" id="apiKey" placeholder="API Key" value="AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA">
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" id="connectBtn"><i class="fas fa-link"></i> Connecter</button>
            <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync"></i> Rafraîchir</button>
            <button class="btn btn-purple" id="exploreAllBtn"><i class="fas fa-globe"></i> Explorer</button>
            <button class="btn btn-success" id="autoDetectBtn"><i class="fas fa-magic"></i> Détection auto</button>
        </div>
        <div id="statusMsg" style="margin-top:10px;font-size:13px;color:#6b7280;"></div>

        <div class="prefix-section">
            <label><i class="fas fa-tags"></i> Préfixes (cliquez pour activer/désactiver)</label>
            <div class="prefix-tags" id="prefixTags"></div>
            <div class="add-prefix-row">
                <input type="text" id="newPrefixInput" placeholder="Nouveau préfixe (ex: ursule_)">
                <button id="addPrefixBtn"><i class="fas fa-plus"></i> Ajouter</button>
                <button class="btn btn-sm btn-outline" id="addAllPrefixesBtn" style="background:#e5e7eb;">+ Tous</button>
            </div>
        </div>

        <div class="collection-name-section">
            <label><i class="fas fa-list"></i> Noms de collections</label>
            <div class="collection-name-tags" id="collectionNameTags"></div>
            <div class="add-name-row">
                <input type="text" id="newNameInput" placeholder="Nom (ex: fiches, config)">
                <button id="addNameBtn"><i class="fas fa-plus"></i> Ajouter</button>
                <button class="btn btn-sm btn-outline" id="addAllNamesBtn" style="background:#e5e7eb;">+ Tous</button>
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <span class="stat">📚 Collections: <strong id="statCollections">0</strong></span>
            <span class="stat">📄 Documents: <strong id="statDocuments">0</strong></span>
        </div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="collectionsContainer">
        <div class="loading"><i class="fas fa-spinner"></i> Connectez-vous et cliquez sur "Explorer"</div>
    </div>
</div>

<div class="modal" id="docModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Document</h3>
        <div class="doc-data" id="modalData"></div>
        <div class="modal-footer">
            <button class="btn btn-sm btn-outline" onclick="closeModal()">Fermer</button>
            <button class="btn btn-sm btn-danger" id="modalDeleteBtn"><i class="fas fa-trash"></i> Supprimer</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc, query, limit, writeBatch } from "firebase/firestore";

let db = null;
let currentModalDoc = null;
let currentModalCollection = null;
let isConnecting = false;
let isExploring = false;
let allCollectionsData = {};

// ===== TOUS LES PRÉFIXES DE VOTRE LISTE =====
const allPrefixesList = [
    '', 'jol_', 'kanto_', 'kola_', 'la charité_', 'la_vie_', 'lava_',
    'les_charitables_', 'lionnel_', 'lova_', 'lycee_francofonne_',
    'lycee_franconfonne_', 'lyon_', 'musoshi_', 'net_', 'nyali_',
    'tera_', 'umoja_ninguv_', 'umoja_ninguvu_', 'ursa_', 'ursule_'
];

// ===== TOUS LES NOMS DE COLLECTIONS DE VOTRE LISTE =====
const allNamesList = [
    'alertes_admin', 'compteur', 'config', 'corbeille', 'fiches',
    'horaires', 'logs', 'parent_messages', 'parent_usage', 'presences',
    'professeurs', 'punitions', 'plan', 'reports', 'security_alerts',
    'settings', 'data', 'users', 'students', 'teachers', 'classes',
    'eleves', 'utilisateurs', 'notes', 'emplois', 'communications'
];

let activePrefixes = [];
let collectionNames = [];

// Charger depuis localStorage
try {
    const savedPrefix = localStorage.getItem('firebase_prefixes_v2');
    if (savedPrefix) {
        const parsed = JSON.parse(savedPrefix);
        if (Array.isArray(parsed) && parsed.length > 0) activePrefixes = parsed;
        else activePrefixes = allPrefixesList.slice(0, 5);
    } else activePrefixes = allPrefixesList.slice(0, 5);

    const savedNames = localStorage.getItem('firebase_collection_names_v2');
    if (savedNames) {
        const parsed = JSON.parse(savedNames);
        if (Array.isArray(parsed) && parsed.length > 0) collectionNames = parsed;
        else collectionNames = allNamesList.slice(0, 5);
    } else collectionNames = allNamesList.slice(0, 5);
} catch(e) {
    activePrefixes = allPrefixesList.slice(0, 5);
    collectionNames = allNamesList.slice(0, 5);
}

function saveData() {
    try {
        localStorage.setItem('firebase_prefixes_v2', JSON.stringify(activePrefixes));
        localStorage.setItem('firebase_collection_names_v2', JSON.stringify(collectionNames));
    } catch(e) {}
}

function renderPrefixTags() {
    const container = document.getElementById('prefixTags');
    container.innerHTML = activePrefixes.map(p => `
        <span class="prefix-tag ${p === '' ? 'active' : ''}" onclick="togglePrefix('${p}')">
            ${p === '' ? '📁 Sans préfixe' : p}
            ${p !== '' ? `<span class="del-prefix" onclick="event.stopPropagation();removePrefix('${p}')">&times;</span>` : ''}
        </span>
    `).join('');
}
window.renderPrefixTags = renderPrefixTags;

function renderNameTags() {
    const container = document.getElementById('collectionNameTags');
    container.innerHTML = collectionNames.map(n => `
        <span class="collection-name-tag">
            ${n}
            <span class="del-name" onclick="removeName('${n}')">&times;</span>
        </span>
    `).join('');
}
window.renderNameTags = renderNameTags;

window.togglePrefix = function(prefix) {
    if (prefix === '') return;
    const index = activePrefixes.indexOf(prefix);
    if (index > -1) activePrefixes.splice(index, 1);
    else activePrefixes.push(prefix);
    saveData();
    renderPrefixTags();
    if (db) loadAllCollections();
};

window.removePrefix = function(prefix) {
    const index = activePrefixes.indexOf(prefix);
    if (index > -1) {
        activePrefixes.splice(index, 1);
        saveData();
        renderPrefixTags();
        if (db) loadAllCollections();
        toast(`Préfixe "${prefix}" supprimé`, 'warning');
    }
};

window.removeName = function(name) {
    const index = collectionNames.indexOf(name);
    if (index > -1) {
        collectionNames.splice(index, 1);
        saveData();
        renderNameTags();
        if (db) loadAllCollections();
        toast(`Nom "${name}" supprimé`, 'warning');
    }
};

function toast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-exclamation-triangle' };
    const colors = { success: '#16a34a', error: '#dc2626', warning: '#d97706' };
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = `<div class="toast-icon" style="color:${colors[type]}"><i class="${icons[type]}"></i></div>
                    <div style="flex:1;font-size:13px;color:#1a1a2e">${message}</div>`;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

function formatData(data) {
    try {
        return JSON.stringify(data, (key, value) => {
            if (value && typeof value === 'object' && value.seconds !== undefined) {
                return new Date(value.seconds * 1000).toISOString();
            }
            return value;
        }, 2);
    } catch(e) { return String(data); }
}

function closeModal() {
    document.getElementById('docModal').classList.remove('show');
    currentModalDoc = null;
    currentModalCollection = null;
}
window.closeModal = closeModal;

async function viewDocument(collectionName, docId) {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    try {
        const docRef = doc(db, collectionName, docId);
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            currentModalDoc = { id: docId, data: snap.data() };
            currentModalCollection = collectionName;
            document.getElementById('modalTitle').textContent = `📄 ${collectionName} / ${docId}`;
            document.getElementById('modalData').textContent = formatData(snap.data());
            document.getElementById('docModal').classList.add('show');
        } else toast('Document non trouvé', 'error');
    } catch (e) { toast('Erreur: ' + e.message, 'error'); }
}
window.viewDocument = viewDocument;

async function deleteDocument(collectionName, docId) {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    if (!confirm(`Supprimer le document "${docId}" ?`)) return;
    try {
        await deleteDoc(doc(db, collectionName, docId));
        toast(`Document supprimé`, 'warning');
        loadAllCollections();
    } catch (e) { toast('Erreur: ' + e.message, 'error'); }
}
window.deleteDocument = deleteDocument;

document.getElementById('modalDeleteBtn').addEventListener('click', function() {
    if (currentModalDoc && currentModalCollection) {
        deleteDocument(currentModalCollection, currentModalDoc.id);
        closeModal();
    }
});

async function deleteCollection(collectionName) {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    if (!confirm(`⚠️ Supprimer la collection "${collectionName}" et TOUS ses documents ?`)) return;
    if (!confirm(`DERNIÈRE CHANCE - Confirmer ?`)) return;

    try {
        const q = query(collection(db, collectionName));
        const snap = await getDocs(q);
        if (snap.empty) { toast(`Collection vide`, 'warning'); return; }
        const batch = writeBatch(db);
        snap.forEach(docSnap => batch.delete(docSnap.ref));
        await batch.commit();
        toast(`✅ Collection "${collectionName}" supprimée (${snap.size} docs)`, 'success');
        loadAllCollections();
    } catch (e) { toast('Erreur: ' + e.message, 'error'); }
}
window.deleteCollection = deleteCollection;

async function loadAllCollections() {
    const container = document.getElementById('collectionsContainer');
    if (!db) { container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Connectez-vous d\'abord</div>'; return; }
    if (isExploring) return;
    isExploring = true;

    container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Exploration...</div>';
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    progressBar.style.display = 'block';

    try {
        const allDocs = {};
        const foundCollections = [];
        let totalDocs = 0;
        let totalChecks = 0;
        const totalCombinations = activePrefixes.length * collectionNames.length;

        for (const prefix of activePrefixes) {
            for (const baseName of collectionNames) {
                totalChecks++;
                progressFill.style.width = ((totalChecks / totalCombinations) * 100) + '%';
                const fullName = prefix + baseName;
                if (foundCollections.includes(fullName)) continue;
                try {
                    const q = query(collection(db, fullName), limit(1));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        foundCollections.push(fullName);
                        const fullSnap = await getDocs(collection(db, fullName));
                        const docs = [];
                        fullSnap.forEach(docSnap => docs.push({ id: docSnap.id, data: docSnap.data() }));
                        allDocs[fullName] = docs;
                        totalDocs += docs.length;
                    }
                } catch (e) {}
            }
        }

        allCollectionsData = allDocs;
        document.getElementById('statCollections').textContent = foundCollections.length;
        document.getElementById('statDocuments').textContent = totalDocs;
        progressBar.style.display = 'none';

        if (foundCollections.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i>
                <p>Aucune collection trouvée</p>
                <p style="font-size:12px;color:#9ca3af">Ajoutez des préfixes et noms de collections ci-dessus</p></div>`;
            isExploring = false; return;
        }

        let html = '<div class="collection-grid">';
        for (const name of foundCollections.sort()) {
            const docs = allDocs[name] || [];
            const prefixMatch = activePrefixes.find(p => p !== '' && name.startsWith(p));
            html += `
                <div class="collection-card">
                    <div class="header">
                        <span class="name"><i class="fas fa-folder"></i> ${escapeHtml(name)}</span>
                        <span class="count">${docs.length} doc${docs.length > 1 ? 's' : ''}</span>
                    </div>
                    <div class="docs">
                        ${docs.map(d => `
                            <div class="doc-item">
                                <span class="doc-id">${escapeHtml(d.id)}</span>
                                <div class="doc-actions">
                                    <button class="view-btn" onclick="viewDocument('${escapeHtml(name)}','${escapeHtml(d.id)}')"><i class="fas fa-eye"></i></button>
                                    <button class="del-btn" onclick="if(confirm('Supprimer ?')) deleteDocument('${escapeHtml(name)}','${escapeHtml(d.id)}')"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="card-actions">
                        <button class="delete-collection-btn" onclick="deleteCollection('${escapeHtml(name)}')">
                            <i class="fas fa-trash"></i> Supprimer
                        </button>
                        ${prefixMatch ? `
                            <button class="delete-collection-btn" style="background:#d97706;" onclick="if(confirm('Supprimer TOUTES les collections "${prefixMatch}"* ?')){ 
                                const toDelete = Object.keys(allCollectionsData).filter(n => n.startsWith('${escapeHtml(prefixMatch)}'));
                                if(confirm('${toDelete.length} collection(s) vont être supprimées. Confirmer ?')) {
                                    toDelete.forEach(async n => { await deleteCollection(n); });
                                }
                            }">
                                <i class="fas fa-trash-alt"></i> Tout "${prefixMatch}"
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
        document.getElementById('statusMsg').textContent = `✅ ${foundCollections.length} collection(s) trouvée(s)`;
        document.getElementById('statusMsg').style.color = '#16a34a';
        toast(`${foundCollections.length} collections chargées`, 'success');

    } catch (e) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#dc2626"></i><p style="color:#dc2626">${escapeHtml(e.message)}</p></div>`;
        progressBar.style.display = 'none';
    }
    isExploring = false;
}

function connectFirebase() {
    if (isConnecting) return;
    isConnecting = true;
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = '⏳ Connexion...';
    const projectId = document.getElementById('projectId').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!projectId || !apiKey) {
        toast('Remplissez tous les champs', 'error');
        statusMsg.textContent = '❌ Champs manquants';
        statusMsg.style.color = '#dc2626';
        isConnecting = false; return;
    }
    try {
        const app = initializeApp({ apiKey, authDomain: projectId + '.firebaseapp.com', projectId, storageBucket: projectId + '.firebasestorage.app', messagingSenderId: '856592608176', appId: '1:856592608176:web:69f9df9cfd4f8c28630475' });
        db = getFirestore(app);
        statusMsg.textContent = '✅ Connecté !';
        statusMsg.style.color = '#16a34a';
        toast('Connecté !', 'success');
        renderPrefixTags();
        renderNameTags();
        loadAllCollections();
    } catch (e) {
        statusMsg.textContent = '❌ ' + e.message;
        statusMsg.style.color = '#dc2626';
        toast('Erreur: ' + e.message, 'error');
        db = null;
    }
    isConnecting = false;
}

// Ajouter tous les préfixes
document.getElementById('addAllPrefixesBtn').addEventListener('click', function() {
    let added = 0;
    for (const p of allPrefixesList) {
        if (!activePrefixes.includes(p)) {
            activePrefixes.push(p);
            added++;
        }
    }
    saveData();
    renderPrefixTags();
    toast(`${added} préfixes ajoutés`, 'success');
    if (db) loadAllCollections();
});

// Ajouter tous les noms
document.getElementById('addAllNamesBtn').addEventListener('click', function() {
    let added = 0;
    for (const n of allNamesList) {
        if (!collectionNames.includes(n)) {
            collectionNames.push(n);
            added++;
        }
    }
    saveData();
    renderNameTags();
    toast(`${added} noms ajoutés`, 'success');
    if (db) loadAllCollections();
});

// Détection automatique
document.getElementById('autoDetectBtn').addEventListener('click', function() {
    if (!db) { toast('Connectez-vous d\'abord', 'error'); return; }
    // Ajouter tous les préfixes et noms
    document.getElementById('addAllPrefixesBtn').click();
    document.getElementById('addAllNamesBtn').click();
    toast('🔍 Détection automatique lancée !', 'success');
});

document.getElementById('addPrefixBtn').addEventListener('click', function() {
    const input = document.getElementById('newPrefixInput');
    const val = input.value.trim();
    if (!val) { toast('Entrez un préfixe', 'error'); return; }
    if (activePrefixes.includes(val)) { toast('Déjà présent', 'warning'); return; }
    activePrefixes.push(val);
    saveData();
    input.value = '';
    renderPrefixTags();
    if (db) loadAllCollections();
    toast(`Préfixe "${val}" ajouté`, 'success');
});

document.getElementById('addNameBtn').addEventListener('click', function() {
    const input = document.getElementById('newNameInput');
    const val = input.value.trim();
    if (!val) { toast('Entrez un nom', 'error'); return; }
    if (collectionNames.includes(val)) { toast('Déjà présent', 'warning'); return; }
    collectionNames.push(val);
    saveData();
    input.value = '';
    renderNameTags();
    if (db) loadAllCollections();
    toast(`Nom "${val}" ajouté`, 'success');
});

document.getElementById('newPrefixInput').addEventListener('keypress', e => { if(e.key === 'Enter') document.getElementById('addPrefixBtn').click(); });
document.getElementById('newNameInput').addEventListener('keypress', e => { if(e.key === 'Enter') document.getElementById('addNameBtn').click(); });

document.getElementById('connectBtn').addEventListener('click', connectFirebase);
document.getElementById('refreshBtn').addEventListener('click', () => { if(db) { toast('Rafraîchissement...', 'warning'); loadAllCollections(); } else toast('Connectez-vous', 'error'); });
document.getElementById('exploreAllBtn').addEventListener('click', () => { if(db) loadAllCollections(); else toast('Connectez-vous', 'error'); });

document.addEventListener('DOMContentLoaded', function() {
    renderPrefixTags();
    renderNameTags();
    setTimeout(connectFirebase, 500);
});
</script>
</body>
</html>
