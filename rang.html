<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>🏆 Classement écoles · LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050b18;font-family:'Inter',system-ui,-apple-system,sans-serif;overflow-x:hidden;color:#f0f4fe}
body{padding:20px;background:radial-gradient(circle at 20% 30%,#0a1a2e,#030812 80%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
.container{max-width:1200px;width:100%;margin:0 auto;animation:fadeSlide 0.6s ease-out}
@keyframes fadeSlide{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.header{background:rgba(12,30,50,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.12);border-radius:40px;padding:28px 36px;margin-bottom:40px;text-align:center;box-shadow:0 20px 60px -15px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,215,0,0.06)}
.header h1{font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:-0.02em;background:linear-gradient(145deg,#fde68a,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;text-shadow:0 0 40px rgba(251,191,36,0.08)}
.header .badge-live{display:inline-block;margin-top:12px;padding:6px 28px;border-radius:60px;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#34d399;background:rgba(16,185,129,0.08);border:1px solid rgba(52,211,153,0.2);backdrop-filter:blur(4px);animation:pulse-live 2s ease-in-out infinite;box-shadow:0 0 20px rgba(16,185,129,0.05)}
.header .status-offline{display:none;margin-top:8px;padding:4px 18px;border-radius:40px;font-size:11px;font-weight:600;color:#fcd34d;background:rgba(252,211,77,0.08);border:1px solid rgba(252,211,77,0.15)}
.header .status-offline.show{display:inline-block}
@keyframes pulse-live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.96)}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;min-height:400px}
.podium-card{background:linear-gradient(145deg,#142433,#0b1828);border-radius:32px;padding:32px 24px 24px;border:1px solid rgba(255,215,0,0.05);transition:all 0.4s cubic-bezier(0.2,0.9,0.4,1);position:relative;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,0.6);display:flex;flex-direction:column;backdrop-filter:blur(4px)}
.podium-card:hover{transform:translateY(-8px);border-color:rgba(255,215,0,0.18);box-shadow:0 32px 80px rgba(0,0,0,0.8)}
.podium-card .medal{font-size:60px;display:block;text-align:center;line-height:1;margin-bottom:2px;filter:drop-shadow(0 8px 12px rgba(0,0,0,0.4))}
.podium-card .ecole-nom{font-size:24px;font-weight:700;color:#f0f4fe;text-align:center;margin:8px 0 10px;line-height:1.2;letter-spacing:-0.01em}
.podium-card .rang-label{text-align:center;font-size:15px;font-weight:600;padding:8px 0;border-radius:60px;margin-bottom:12px;width:fit-content;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
.podium-card .rang-label.premier{color:#fbbf24;background:rgba(251,191,36,0.10);border:1px solid rgba(251,191,36,0.15)}
.podium-card .rang-label.deuxieme{color:#9ca3af;background:rgba(156,163,175,0.08);border:1px solid rgba(156,163,175,0.10)}
.podium-card .rang-label.troisieme{color:#d97706;background:rgba(180,83,9,0.10);border:1px solid rgba(180,83,9,0.12)}
.podium-card .score-section{text-align:center;padding:8px 0 4px;margin-bottom:6px}
.podium-card .score-section .score-value{font-size:36px;font-weight:800;color:#fbbf24;letter-spacing:-0.02em}
.podium-card .score-section .score-label{font-size:11px;color:#7a8a9a;display:block;margin-top:4px;letter-spacing:1.5px;font-weight:500}
.podium-card .stats-vertical{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid rgba(255,215,0,0.06)}
.podium-card .stat-item{background:rgba(0,0,0,0.25);border-radius:18px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;transition:background 0.25s}
.podium-card .stat-item:hover{background:rgba(255,215,0,0.04)}
.podium-card .stat-item .stat-left{display:flex;align-items:center;gap:14px}
.podium-card .stat-item .stat-icon{font-size:22px;opacity:0.7}
.podium-card .stat-item .stat-lb{font-size:15px;color:#9aabb8;font-weight:500}
.podium-card .stat-item .stat-nb{font-size:26px;font-weight:700;color:#eef3fc;letter-spacing:-0.01em}
.podium-card.gold{border-color:rgba(251,191,36,0.25);background:linear-gradient(145deg,#2c2418,#1e1a12)}
.podium-card.gold .stat-nb{color:#fbbf24}
.podium-card.gold .score-value{color:#fbbf24}
.podium-card.silver{border-color:rgba(156,163,175,0.15);background:linear-gradient(145deg,#24242e,#18181e)}
.podium-card.silver .stat-nb{color:#d1d5db}
.podium-card.silver .score-value{color:#9ca3af}
.podium-card.bronze{border-color:rgba(180,83,9,0.15);background:linear-gradient(145deg,#262016,#18140e)}
.podium-card.bronze .stat-nb{color:#f59e0b}
.podium-card.bronze .score-value{color:#d97706}
.podium-card .badge-pos{position:absolute;top:14px;right:16px;font-size:14px;font-weight:700;color:#5a6a7a;background:rgba(0,0,0,0.25);padding:4px 18px;border-radius:40px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.02)}
.loading{text-align:center;padding:80px 20px;color:#5a6a7a;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;font-weight:500}
.loading:before{content:"";width:30px;height:30px;border:3px solid rgba(56,189,248,0.06);border-top-color:#fbbf24;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 20px;color:#6a7a8a;grid-column:1/-1;font-size:18px;font-weight:500}
@media(max-width:820px){.podium{grid-template-columns:1fr;gap:20px;min-height:auto}.podium-card{padding:24px 18px 18px}.podium-card .medal{font-size:48px}.podium-card .ecole-nom{font-size:22px}.podium-card .rang-label{font-size:14px;padding-left:20px;padding-right:20px}.podium-card .score-section .score-value{font-size:32px}.podium-card .stat-item .stat-nb{font-size:22px}.header{padding:22px 24px}.header h1{font-size:clamp(22px,6vw,32px)}}
@media(max-width:440px){body{padding:12px}.header{padding:16px 16px;border-radius:28px;margin-bottom:24px}.header h1{font-size:20px}.header .badge-live{font-size:11px;padding:4px 18px}.podium-card{padding:18px 12px 14px;border-radius:24px}.podium-card .medal{font-size:38px}.podium-card .ecole-nom{font-size:18px}.podium-card .rang-label{font-size:12px;padding:4px 14px}.podium-card .score-section .score-value{font-size:26px}.podium-card .stat-item{padding:10px 14px;border-radius:14px}.podium-card .stat-item .stat-nb{font-size:18px}.podium-card .stat-item .stat-lb{font-size:13px}.podium-card .badge-pos{font-size:12px;padding:2px 12px;top:10px;right:10px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏆 Classement des écoles partenaires</h1>
<span class="badge-live">🔴 EN DIRECT</span>
<span class="status-offline" id="statusOffline">📡 Mode hors ligne</span>
</div>
<div id="podiumContainer" class="podium">
<div class="loading">Chargement...</div>
</div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,onSnapshot}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const DB_NAME='ClassementEcoles';
const STORE_NAME='ecoles';
const DB_VERSION=1;
let dbInstance=null;
let toutesEcoles=[];
let unsubscribe=null;
const podiumContainer=document.getElementById('podiumContainer');
const statusOffline=document.getElementById('statusOffline');
function openDB(){return new Promise((resolve,reject)=>{try{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onerror=(event)=>reject(event.target.error);request.onsuccess=(event)=>{dbInstance=event.target.result;resolve(dbInstance);};request.onupgradeneeded=(event)=>{const db=event.target.result;if(!db.objectStoreNames.contains(STORE_NAME)){const store=db.createObjectStore(STORE_NAME,{keyPath:'id'});store.createIndex('effectif','effectif',{unique:false});store.createIndex('nom','nom',{unique:false});}}}catch(error){reject(error);}});}
async function sauvegarderDansIndexedDB(ecoles){if(!dbInstance)return;try{const transaction=dbInstance.transaction(STORE_NAME,'readwrite');const store=transaction.objectStore(STORE_NAME);store.clear();for(const e of ecoles){store.add(e);}}catch(error){console.error('IndexedDB sauvegarde:',error);}}
async function chargerDepuisIndexedDB(){return new Promise((resolve)=>{if(!dbInstance){resolve(null);return;}try{const transaction=dbInstance.transaction(STORE_NAME,'readonly');const store=transaction.objectStore(STORE_NAME);const request=store.getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);}catch(error){resolve(null);}});}
function calculerScore(effectif,profs,fiches,maxEffectif,maxProfs,maxFiches){const scoreEffectif=(effectif/maxEffectif)*70;const scoreProfs=(profs/maxProfs)*25;const scoreFiches=(fiches/maxFiches)*5;return Math.round(scoreEffectif+scoreProfs+scoreFiches);}
async function getAllEcolesAvecStats(){const ecolesSnap=await getDocs(collection(db,"ecoles"));const resultats=[];let maxEffectif=0,maxProfs=0,maxFiches=0;const raw=[];for(const ecoleDoc of ecolesSnap.docs){const ecoleId=ecoleDoc.id;const ecoleData=ecoleDoc.data();if(ecoleData.actif===false)continue;const profsSnap=await getDocs(collection(db,"ecoles",ecoleId,"professeurs"));const nbProfs=profsSnap.size;const fichesSnap=await getDocs(collection(db,"ecoles",ecoleId,"fiches"));const nbFiches=fichesSnap.size;let nbEleves=0;try{const elevesSnap=await getDocs(collection(db,"ecoles",ecoleId,"compta_eleves"));elevesSnap.forEach(ds=>{const data=ds.data();if(data.abandon!==true)nbEleves++;});}catch(e){nbEleves=0;}raw.push({id:ecoleId,nom:ecoleData.nom||ecoleId,ville:ecoleData.ville||"",effectif:nbEleves,profs:nbProfs,fiches:nbFiches});if(nbEleves>maxEffectif)maxEffectif=nbEleves;if(nbProfs>maxProfs)maxProfs=nbProfs;if(nbFiches>maxFiches)maxFiches=nbFiches;}for(const e of raw){e.score=calculerScore(e.effectif,e.profs,e.fiches,maxEffectif,maxProfs,maxFiches);resultats.push(e);}return resultats;}
function afficherClassement(ecoles){if(!ecoles||ecoles.length===0){podiumContainer.innerHTML='<div class="empty">📭 Aucune école trouvée</div>';return;}const sorted=[...ecoles].sort((a,b)=>(b.effectif||0)-(a.effectif||0));const top3=sorted.slice(0,3);const medals=['🥇','🥈','🥉'];const classes=['gold','silver','bronze'];const rangLabels=['Votre école est 1ère','Votre école est 2ème','Votre école est 3ème'];const labelClasses=['premier','deuxieme','troisieme'];let html='';top3.forEach((ecole,index)=>{const score=ecole.score||0;html+=`<div class="podium-card ${classes[index]}"><span class="badge-pos">#${index+1}</span><span class="medal">${medals[index]}</span><div class="ecole-nom">${ecole.nom}</div><div class="rang-label ${labelClasses[index]}">🏆 ${rangLabels[index]}</div><div class="score-section"><span class="score-value">${score}%</span><span class="score-label">🏅 Score global</span></div><div class="stats-vertical"><div class="stat-item"><div class="stat-left"><span class="stat-icon">👥</span><span class="stat-lb">Élèves</span></div><span class="stat-nb">${ecole.effectif}</span></div><div class="stat-item"><div class="stat-left"><span class="stat-icon">👨‍🏫</span><span class="stat-lb">Professeurs</span></div><span class="stat-nb">${ecole.profs}</span></div><div class="stat-item"><div class="stat-left"><span class="stat-icon">📄</span><span class="stat-lb">Fiches</span></div><span class="stat-nb">${ecole.fiches}</span></div></div></div>`;});podiumContainer.innerHTML=html;}
async function chargerDonneesDepuisFirebase(){try{statusOffline.classList.remove('show');const data=await getAllEcolesAvecStats();if(data.length>0){toutesEcoles=data;await sauvegarderDansIndexedDB(data);afficherClassement(data);}else{const cached=await chargerDepuisIndexedDB();if(cached&&cached.length>0){toutesEcoles=cached;afficherClassement(cached);statusOffline.classList.add('show');}else{podiumContainer.innerHTML='<div class="empty">📭 Aucune école trouvée</div>';}}}catch(error){console.error('Firebase error:',error);const cached=await chargerDepuisIndexedDB();if(cached&&cached.length>0){toutesEcoles=cached;afficherClassement(cached);statusOffline.classList.add('show');}else{podiumContainer.innerHTML='<div class="empty">❌ Erreur de connexion</div>';}}}
function demarrerEcouteTempsReel(){if(unsubscribe){unsubscribe();unsubscribe=null;}try{unsubscribe=onSnapshot(collection(db,"ecoles"),async()=>{await chargerDonneesDepuisFirebase();},(error)=>{console.error('Erreur écoute Firebase:',error);});}catch(error){console.error('Erreur demarrerEcoute:',error);}}
async function init(){await openDB();await chargerDonneesDepuisFirebase();demarrerEcouteTempsReel();setInterval(()=>{if(navigator.onLine){chargerDonneesDepuisFirebase();}},300000);}
init();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J')){e.preventDefault();return false;}});
</script>
</body>
</html>
