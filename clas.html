<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Classement des écoles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0e1a;font-family:'Inter',sans-serif;overflow-x:hidden}
body{padding:16px;overscroll-behavior:none}

.container{max-width:800px;margin:0 auto}

/* HEADER */
.header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:20px;padding:20px 24px;text-align:center;margin-bottom:20px;border:1px solid rgba(255,215,0,0.15)}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{font-size:11px;color:#94a3b8;margin-top:4px;letter-spacing:2px}

/* FILTRES */
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;background:rgba(18,18,31,0.9);border-radius:16px;padding:12px 16px;border:1px solid rgba(255,215,0,0.15);align-items:center}
.filters label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
.filters select{flex:1;min-width:140px;padding:8px 14px;border-radius:30px;background:#2d3748;border:1px solid #334155;color:#fff;font-size:13px;font-weight:500;cursor:pointer;outline:none;font-family:'Inter',sans-serif}
.filters select:focus{border-color:#ffd700}
.filters .badge-top{font-size:10px;color:#fbbf24;background:rgba(251,191,36,0.12);padding:4px 14px;border-radius:30px;border:1px solid rgba(251,191,36,0.15);white-space:nowrap}

/* PODIUM */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:300px}
.podium-card{background:linear-gradient(145deg,#1e2e42,#162638);border-radius:20px;padding:22px 16px 20px;text-align:center;border:1px solid rgba(255,215,0,0.08);transition:all 0.4s cubic-bezier(0.2,0.9,0.4,1);position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center}
.podium-card:hover{transform:translateY(-6px);border-color:rgba(255,215,0,0.2);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.podium-card .rank{font-size:10px;font-weight:600;color:#60a5fa;background:rgba(56,189,248,0.08);padding:2px 14px;border-radius:30px;display:inline-block;margin-bottom:6px;border:1px solid rgba(56,189,248,0.06)}
.podium-card .medal{font-size:48px;display:block;margin-bottom:4px;line-height:1}
.podium-card .ecole-nom{font-size:16px;font-weight:700;color:#e8edf5;margin:4px 0 2px;line-height:1.2}
.podium-card .valeur{font-size:28px;font-weight:800;color:#fbbf24;margin:2px 0}
.podium-card .label{font-size:10px;color:#6a7a8a}
.podium-card .stats{display:flex;justify-content:center;gap:14px;font-size:9px;color:#6a7a8a;margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,215,0,0.06);width:100%}
.podium-card .stats span{display:flex;align-items:center;gap:4px}
.podium-card.gold{border-color:rgba(251,191,36,0.25);background:linear-gradient(145deg,#2a2418,#1e1a12)}
.podium-card.gold .valeur{color:#fbbf24}
.podium-card.silver{border-color:rgba(156,163,175,0.2);background:linear-gradient(145deg,#22222a,#18181e)}
.podium-card.silver .valeur{color:#9ca3af}
.podium-card.bronze{border-color:rgba(180,83,9,0.2);background:linear-gradient(145deg,#241e14,#18140e)}
.podium-card.bronze .valeur{color:#d97706}
.podium-card .badge-pos{position:absolute;top:10px;right:12px;font-size:9px;font-weight:600;color:#4a5a6a;background:rgba(0,0,0,0.3);padding:2px 12px;border-radius:30px}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:#5a6a7a;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1}
.loading:before{content:"";width:24px;height:24px;border:2px solid rgba(56,189,248,0.06);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:#5a6a7a;grid-column:1/-1}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:14px 24px;color:#fff;font-size:13px;border-left:4px solid #ffd700;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;z-index:999;max-width:90%;text-align:center}
.toast.show{display:block;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* RESPONSIVE */
@media(max-width:640px){
.podium{grid-template-columns:1fr;gap:16px;min-height:auto}
.podium-card{padding:18px 14px 16px;min-height:140px}
.podium-card .medal{font-size:36px}
.podium-card .ecole-nom{font-size:14px}
.podium-card .valeur{font-size:22px}
.filters{flex-direction:column;align-items:stretch}
.filters select{min-width:auto}
.header h1{font-size:18px}
}
@media(max-width:400px){
body{padding:10px}
.header{padding:14px 16px}
.podium-card .stats{flex-wrap:wrap;gap:6px;font-size:8px}
}
</style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>🏆 Classement des écoles partenaires</h1>
        <p id="classementDate">Mis à jour le --</p>
    </div>

    <!-- FILTRES -->
    <div class="filters">
        <label>📊 Classer par</label>
        <select id="filtreCritere">
            <option value="effectif">👥 Effectif élèves</option>
            <option value="profs">👨‍🏫 Professeurs</option>
            <option value="fiches">📄 Fiches créées</option>
        </select>
        <span class="badge-top">⚡ TOP 3</span>
    </div>

    <!-- PODIUM -->
    <div id="podiumContainer" class="podium">
        <div class="loading">Chargement...</div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f",
  measurementId: "G-V7MF88Y5EE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let toutesEcoles = [];
let critereActuel = "effectif";

const podiumContainer = document.getElementById('podiumContainer');
const filtreSelect = document.getElementById('filtreCritere');
const classementDate = document.getElementById('classementDate');
const toastEl = document.getElementById('toast');

const labels = {
    effectif: { label: 'Élèves', icon: '👥' },
    profs: { label: 'Professeurs', icon: '👨‍🏫' },
    fiches: { label: 'Fiches', icon: '📄' }
};

function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

async function getAllEcolesAvecStats() {
    const ecolesSnap = await getDocs(collection(db, "ecoles"));
    const resultats = [];
    
    for (const ecoleDoc of ecolesSnap.docs) {
        const ecoleId = ecoleDoc.id;
        const ecoleData = ecoleDoc.data();
        
        if (ecoleData.actif === false) continue;
        
        const profsSnap = await getDocs(collection(db, "ecoles", ecoleId, "professeurs"));
        const nbProfs = profsSnap.size;
        
        const fichesSnap = await getDocs(collection(db, "ecoles", ecoleId, "fiches"));
        const nbFiches = fichesSnap.size;
        
        let nbEleves = 0;
        try {
            const elevesSnap = await getDocs(collection(db, "ecoles", ecoleId, "compta_eleves"));
            elevesSnap.forEach(ds => {
                const data = ds.data();
                if (data.abandon !== true) nbEleves++;
            });
        } catch(e) { nbEleves = 0; }
        
        resultats.push({
            id: ecoleId,
            nom: ecoleData.nom || ecoleId,
            ville: ecoleData.ville || "",
            effectif: nbEleves,
            profs: nbProfs,
            fiches: nbFiches
        });
    }
    
    return resultats;
}

function afficherClassement(critere) {
    if (toutesEcoles.length === 0) {
        podiumContainer.innerHTML = '<div class="empty">📭 Aucune école trouvée</div>';
        return;
    }
    
    const sorted = [...toutesEcoles].sort((a, b) => (b[critere] || 0) - (a[critere] || 0));
    const top3 = sorted.slice(0, 3);
    const medals = ['🥇', '🥈', '🥉'];
    const classes = ['gold', 'silver', 'bronze'];
    const label = labels[critere]?.label || 'Valeur';
    const icon = labels[critere]?.icon || '📊';
    
    let html = '';
    top3.forEach((ecole, index) => {
        const valeur = ecole[critere] || 0;
        html += `
            <div class="podium-card ${classes[index]}">
                <span class="badge-pos">#${index + 1}</span>
                <span class="rank">TOP ${index + 1}</span>
                <span class="medal">${medals[index]}</span>
                <div class="ecole-nom">${ecole.nom}</div>
                <div class="valeur">${valeur}</div>
                <div class="label">${icon} ${label}</div>
                <div class="stats">
                    <span>👥 ${ecole.effectif}</span>
                    <span>👨‍🏫 ${ecole.profs}</span>
                    <span>📄 ${ecole.fiches}</span>
                </div>
            </div>
        `;
    });
    
    podiumContainer.innerHTML = html;
    classementDate.textContent = 'Mis à jour le ' + new Date().toLocaleString('fr-FR');
}

async function chargerDonnees() {
    podiumContainer.innerHTML = '<div class="loading">Chargement...</div>';
    
    try {
        toutesEcoles = await getAllEcolesAvecStats();
        if (toutesEcoles.length === 0) {
            podiumContainer.innerHTML = '<div class="empty">📭 Aucune école active trouvée</div>';
            showToast('⚠️ Aucune école trouvée');
            return;
        }
        afficherClassement(critereActuel);
        showToast(`✅ ${toutesEcoles.length} école(s) chargée(s)`);
    } catch (error) {
        console.error(error);
        podiumContainer.innerHTML = '<div class="empty">❌ Erreur de chargement</div>';
        showToast('❌ Erreur: ' + error.message);
    }
}

filtreSelect.addEventListener('change', function() {
    critereActuel = this.value;
    afficherClassement(critereActuel);
});

setInterval(chargerDonnees, 300000);
chargerDonnees();

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) {
        e.preventDefault();
        return false;
    }
});
</script>
</body>
</html>
