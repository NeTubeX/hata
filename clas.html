<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewfit=cover">
<meta name="theme-color" content="#18191a">
<title>🏆 Classement des écoles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#18191a;font-family:'Inter',sans-serif;overflow-x:hidden}
body{padding:20px;overscroll-behavior:none}
.container{max-width:1100px;margin:0 auto}

.header{background:linear-gradient(135deg,#242526,#18191a);border-radius:24px;padding:24px 32px;text-align:center;margin-bottom:24px;border:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.5px}
.header .badge-live{display:inline-block;margin-top:8px;padding:6px 24px;border-radius:30px;font-size:12px;font-weight:700;color:#10b981;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);animation:pulse-live 1.8s ease-in-out infinite;letter-spacing:2px}
.header .status-offline{display:none;margin-top:6px;padding:4px 16px;border-radius:30px;font-size:10px;font-weight:600;color:#f59e0b;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.2)}
.header .status-offline.show{display:inline-block}
@keyframes pulse-live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.97)}}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;min-height:400px}

.podium-card{background:linear-gradient(145deg,#242526,#18191a);border-radius:24px;padding:28px 24px 24px;border:1px solid rgba(255,255,255,0.06);transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column}
.podium-card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,0.12);box-shadow:0 24px 80px rgba(0,0,0,0.8)}

/* CEINTURE ARC-EN-CIEL CIRCULAIRE */
.podium-card .rainbow-ring{position:absolute;top:-10px;right:-10px;width:90px;height:90px;border-radius:50%;background:conic-gradient(#ff0000,#ff8800,#ffff00,#00ff00,#0088ff,#8800ff,#ff0000);padding:3px;animation:spin-ring 6s linear infinite;opacity:0.5;transition:opacity 0.5s}
.podium-card:hover .rainbow-ring{opacity:1}
.podium-card .rainbow-ring .inner{width:100%;height:100%;border-radius:50%;background:#1a2a3a}
.podium-card.gold .rainbow-ring .inner{background:#2a2418}
.podium-card.silver .rainbow-ring .inner{background:#22222a}
.podium-card.bronze .rainbow-ring .inner{background:#241e14}
@keyframes spin-ring{to{transform:rotate(360deg)}}

.podium-card .medal{font-size:56px;display:block;text-align:center;line-height:1;margin-bottom:2px}
.podium-card .ecole-prefix{font-size:12px;color:#6a7a8a;text-align:center;letter-spacing:2px;font-weight:500}
.podium-card .ecole-nom{font-size:22px;font-weight:700;color:#e8edf5;text-align:center;margin:2px 0 6px;line-height:1.2}
.podium-card .rang-label{text-align:center;font-size:16px;font-weight:600;padding:6px 0;border-radius:30px;margin-bottom:8px}
.podium-card .rang-label.premier{color:#fbbf24;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.15)}
.podium-card .rang-label.deuxieme{color:#9ca3af;background:rgba(156,163,175,0.1);border:1px solid rgba(156,163,175,0.12)}
.podium-card .rang-label.troisieme{color:#d97706;background:rgba(180,83,9,0.12);border:1px solid rgba(180,83,9,0.15)}

.podium-card .score-section{text-align:center;padding:8px 0 4px}
.podium-card .score-section .score-value{font-size:32px;font-weight:800;color:#fbbf24}
.podium-card .score-section .score-label{font-size:11px;color:#6a7a8a;display:block;margin-top:2px;letter-spacing:1px}

.podium-card .stats-vertical{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06)}
.podium-card .stat-item{background:rgba(0,0,0,0.3);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;transition:background 0.3s}
.podium-card .stat-item:hover{background:rgba(255,255,255,0.03)}
.podium-card .stat-item .stat-left{display:flex;align-items:center;gap:12px}
.podium-card .stat-item .stat-icon{font-size:22px}
.podium-card .stat-item .stat-lb{font-size:15px;color:#94a3b8;font-weight:500}
.podium-card .stat-item .stat-nb{font-size:24px;font-weight:700;color:#e8edf5}

/* COMPTEUR PREMIÈRE PLACE */
.podium-card .compteur-premier{text-align:center;margin-top:10px;padding:8px 0;border-top:1px solid rgba(255,215,0,0.08)}
.podium-card .compteur-premier .cp-nb{font-size:28px;font-weight:800;color:#fbbf24}
.podium-card .compteur-premier .cp-lb{font-size:10px;color:#6a7a8a;letter-spacing:1px;display:block;margin-top:2px}

.podium-card.gold{border-color:rgba(251,191,36,0.15);background:linear-gradient(145deg,#2a2418,#1e1a12)}
.podium-card.gold .stat-nb{color:#fbbf24}
.podium-card.gold .score-value{color:#fbbf24}
.podium-card.gold .compteur-premier .cp-nb{color:#fbbf24}
.podium-card.silver{border-color:rgba(156,163,175,0.12);background:linear-gradient(145deg,#22222a,#18181e)}
.podium-card.silver .stat-nb{color:#d1d5db}
.podium-card.silver .score-value{color:#9ca3af}
.podium-card.silver .compteur-premier .cp-nb{color:#9ca3af}
.podium-card.bronze{border-color:rgba(180,83,9,0.12);background:linear-gradient(145deg,#241e14,#18140e)}
.podium-card.bronze .stat-nb{color:#f59e0b}
.podium-card.bronze .score-value{color:#d97706}
.podium-card.bronze .compteur-premier .cp-nb{color:#d97706}

.podium-card .badge-pos{position:absolute;top:12px;right:14px;font-size:14px;font-weight:700;color:#4a5a6a;background:rgba(0,0,0,0.3);padding:4px 16px;border-radius:30px}
.loading{text-align:center;padding:80px 20px;color:#5a6a7a;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1}
.loading:before{content:"";width:28px;height:28px;border:3px solid rgba(255,255,255,0.06);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 20px;color:#5a6a7a;grid-column:1/-1;font-size:18px}

@media(max-width:768px){.podium{grid-template-columns:1fr;gap:18px;min-height:auto}.podium-card{padding:22px 18px 18px}.podium-card .medal{font-size:44px}.podium-card .ecole-nom{font-size:20px}.podium-card .rang-label{font-size:14px}.podium-card .score-section .score-value{font-size:28px}.podium-card .stat-item .stat-nb{font-size:20px}.podium-card .rainbow-ring{width:70px;height:70px;top:-8px;right:-8px}.header h1{font-size:20px}}
@media(max-width:400px){body{padding:12px}.header{padding:14px 16px}.podium-card{padding:16px 12px 14px}.podium-card .medal{font-size:36px}.podium-card .ecole-nom{font-size:17px}.podium-card .rang-label{font-size:13px}.podium-card .score-section .score-value{font-size:24px}.podium-card .stat-item{padding:10px 12px}.podium-card .stat-item .stat-nb{font-size:17px}.podium-card .stat-item .stat-lb{font-size:13px}.podium-card .rainbow-ring{width:56px;height:56px;top:-6px;right:-6px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏆 Classement des écoles partenaires</h1>
<span class="badge-live">🔴 EN DIRECT</span>
<span class="status-offline" id="statusOffline">📡 Mode hors ligne</span>
</div>
<div id="podiumContainer" class="podium">
<div class="loading">Chargement...</div>
</div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,onSnapshot}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const DB_NAME='ClassementEcoles';
const STORE_NAME='ecoles';
const DB_VERSION=1;
let dbInstance=null;
let toutesEcoles=[];
let historiquePremier={};
let unsubscribe=null;
const podiumContainer=document.getElementById('podiumContainer');
const statusOffline=document.getElementById('statusOffline');

function openDB(){return new Promise((resolve,reject)=>{try{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onerror=(event)=>reject(event.target.error);request.onsuccess=(event)=>{dbInstance=event.target.result;resolve(dbInstance);};request.onupgradeneeded=(event)=>{const db=event.target.result;if(!db.objectStoreNames.contains(STORE_NAME)){const store=db.createObjectStore(STORE_NAME,{keyPath:'id'});store.createIndex('effectif','effectif',{unique:false});store.createIndex('nom','nom',{unique:false});}if(!db.objectStoreNames.contains('historique')){const storeHist=db.createObjectStore('historique',{keyPath:'id'});storeHist.createIndex('premier','premier',{unique:false});}}}catch(error){reject(error);}});}

async function sauvegarderHistorique(ecoleId){if(!dbInstance)return;try{const transaction=dbInstance.transaction('historique','readwrite');const store=transaction.objectStore('historique');const data=await new Promise((resolve)=>{const req=store.get(ecoleId);req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);});if(data){data.premier=(data.premier||0)+1;store.put(data);}else{store.put({id:ecoleId,premier:1});}}catch(error){console.error('Historique sauvegarde:',error);}}

async function chargerHistorique(){if(!dbInstance)return;try{const transaction=dbInstance.transaction('historique','readonly');const store=transaction.objectStore('historique');const request=store.getAll();request.onsuccess=()=>{const data=request.result||[];data.forEach(item=>{historiquePremier[item.id]=item.premier||0;});};}catch(error){console.error('Historique chargement:',error);}}

async function sauvegarderDansIndexedDB(ecoles){if(!dbInstance)return;try{const transaction=dbInstance.transaction(STORE_NAME,'readwrite');const store=transaction.objectStore(STORE_NAME);store.clear();for(const e of ecoles){store.add(e);}}catch(error){console.error('IndexedDB sauvegarde:',error);}}

async function chargerDepuisIndexedDB(){return new Promise((resolve)=>{if(!dbInstance){resolve(null);return;}try{const transaction=dbInstance.transaction(STORE_NAME,'readonly');const store=transaction.objectStore(STORE_NAME);const request=store.getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);}catch(error){resolve(null);}});}

function calculerScore(effectif,profs,fiches,maxEffectif,maxProfs,maxFiches){const scoreEffectif=(effectif/maxEffectif)*70;const scoreProfs=(profs/maxProfs)*25;const scoreFiches=(fiches/maxFiches)*5;return Math.round(scoreEffectif+scoreProfs+scoreFiches);}

async function getAllEcolesAvecStats(){const ecolesSnap=await getDocs(collection(db,"ecoles"));const resultats=[];let maxEffectif=0,maxProfs=0,maxFiches=0;const raw=[];for(const ecoleDoc of ecolesSnap.docs){const ecoleId=ecoleDoc.id;const ecoleData=ecoleDoc.data();if(ecoleData.actif===false)continue;const profsSnap=await getDocs(collection(db,"ecoles",ecoleId,"professeurs"));const nbProfs=profsSnap.size;const fichesSnap=await getDocs(collection(db,"ecoles",ecoleId,"fiches"));const nbFiches=fichesSnap.size;let nbEleves=0;try{const elevesSnap=await getDocs(collection(db,"ecoles",ecoleId,"compta_eleves"));elevesSnap.forEach(ds=>{const data=ds.data();if(data.abandon!==true)nbEleves++;});}catch(e){nbEleves=0;}raw.push({id:ecoleId,nom:ecoleData.nom||ecoleId,ville:ecoleData.ville||"",effectif:nbEleves,profs:nbProfs,fiches:nbFiches});if(nbEleves>maxEffectif)maxEffectif=nbEleves;if(nbProfs>maxProfs)maxProfs=nbProfs;if(nbFiches>maxFiches)maxFiches=nbFiches;}for(const e of raw){e.score=calculerScore(e.effectif,e.profs,e.fiches,maxEffectif,maxProfs,maxFiches);resultats.push(e);}return resultats;}

function afficherClassement(ecoles){if(!ecoles||ecoles.length===0){podiumContainer.innerHTML='<div class="empty">📭 Aucune école trouvée</div>';return;}
const sorted=[...ecoles].sort((a,b)=>(b.score||0)-(a.score||0));
const top3=sorted.slice(0,3);
const medals=['🥇','🥈','🥉'];
const classes=['gold','silver','bronze'];
const rangLabels=['Votre école est 1ère','Votre école est 2ème','Votre école est 3ème'];
const labelClasses=['premier','deuxieme','troisieme'];
let html='';
top3.forEach((ecole,index)=>{const score=ecole.score||0;const nomComplet=ecole.nom||'ÉCOLE';const nomAffiche=nomComplet.toUpperCase();const nbPremier=historiquePremier[ecole.id]||0;html+=`<div class="podium-card ${classes[index]}"><div class="rainbow-ring"><div class="inner"></div></div><span class="badge-pos">#${index+1}</span><span class="medal">${medals[index]}</span><div class="ecole-prefix">ÉCOLE</div><div class="ecole-nom">${nomAffiche}</div><div class="rang-label ${labelClasses[index]}">🏆 ${rangLabels[index]}</div><div class="score-section"><span class="score-value">${score}%</span><span class="score-label">🏅 Score global</span></div><div class="stats-vertical"><div class="stat-item"><div class="stat-left"><span class="stat-icon">👥</span><span class="stat-lb">Élèves</span></div><span class="stat-nb">${ecole.effectif}</span></div><div class="stat-item"><div class="stat-left"><span class="stat-icon">👨‍🏫</span><span class="stat-lb">Professeurs</span></div><span class="stat-nb">${ecole.profs}</span></div><div class="stat-item"><div class="stat-left"><span class="stat-icon">📄</span><span class="stat-lb">Fiches</span></div><span class="stat-nb">${ecole.fiches}</span></div></div><div class="compteur-premier"><span class="cp-nb">${nbPremier}</span><span class="cp-lb">🏆 Nombre de fois 1ère place</span></div></div>`;});podiumContainer.innerHTML=html;}

async function chargerDonneesDepuisFirebase(){try{statusOffline.classList.remove('show');const data=await getAllEcolesAvecStats();if(data.length>0){const sorted=[...data].sort((a,b)=>(b.score||0)-(a.score||0));const premier=sorted[0];if(premier){await sauvegarderHistorique(premier.id);await chargerHistorique();}toutesEcoles=data;await sauvegarderDansIndexedDB(data);afficherClassement(data);}else{const cached=await chargerDepuisIndexedDB();if(cached&&cached.length>0){toutesEcoles=cached;afficherClassement(cached);statusOffline.classList.add('show');}else{podiumContainer.innerHTML='<div class="empty">📭 Aucune école trouvée</div>';}}}catch(error){console.error('Firebase error:',error);const cached=await chargerDepuisIndexedDB();if(cached&&cached.length>0){toutesEcoles=cached;afficherClassement(cached);statusOffline.classList.add('show');}else{podiumContainer.innerHTML='<div class="empty">❌ Erreur de connexion</div>';}}}

function demarrerEcouteTempsReel(){if(unsubscribe){unsubscribe();unsubscribe=null;}try{unsubscribe=onSnapshot(collection(db,"ecoles"),async()=>{await chargerDonneesDepuisFirebase();},(error)=>{console.error('Erreur écoute Firebase:',error);});}catch(error){console.error('Erreur demarrerEcoute:',error);}}

async function init(){await openDB();await chargerHistorique();await chargerDonneesDepuisFirebase();demarrerEcouteTempsReel();setInterval(()=>{if(navigator.onLine){chargerDonneesDepuisFirebase();}},300000);}

init();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J')){e.preventDefault();return false;}});
</script>
</body>
</html>
