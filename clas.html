<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>🏆 Classement des écoles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0e1a;font-family:'Inter',sans-serif;overflow-x:hidden}
body{padding:20px;overscroll-behavior:none}
.container{max-width:1100px;margin:0 auto}
.header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:24px;padding:24px 32px;text-align:center;margin-bottom:24px;border:1px solid rgba(255,215,0,0.12)}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.5px}
.header .badge-live{display:inline-block;margin-top:8px;padding:6px 24px;border-radius:30px;font-size:12px;font-weight:700;color:#10b981;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);animation:pulse-live 1.8s ease-in-out infinite;letter-spacing:2px}
@keyframes pulse-live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.97)}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;min-height:400px}
.podium-card{background:linear-gradient(145deg,#1a2a3a,#0f1a28);border-radius:24px;padding:32px 28px 28px;border:1px solid rgba(255,215,0,0.06);transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.4);display:flex;flex-direction:column;backdrop-filter:blur(4px)}
.podium-card:hover{transform:translateY(-8px);border-color:rgba(255,215,0,0.15);box-shadow:0 24px 80px rgba(0,0,0,0.6)}
.podium-card .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.podium-card .rank-badge{font-size:11px;font-weight:600;color:#60a5fa;background:rgba(56,189,248,0.08);padding:4px 18px;border-radius:30px;border:1px solid rgba(56,189,248,0.06)}
.podium-card .pos{font-size:10px;font-weight:600;color:#4a5a6a;background:rgba(0,0,0,0.3);padding:2px 14px;border-radius:30px}
.podium-card .medal-area{text-align:center;margin-bottom:6px}
.podium-card .medal{font-size:60px;display:block;line-height:1}
.podium-card .ecole-nom{font-size:22px;font-weight:700;color:#e8edf5;text-align:center;margin:6px 0 4px;line-height:1.2}
.podium-card .valeur-principale{text-align:center;padding:8px 0 4px}
.podium-card .valeur-principale .nombre{font-size:38px;font-weight:800;color:#fbbf24}
.podium-card .valeur-principale .label{font-size:12px;color:#6a7a8a;display:block;margin-top:2px;letter-spacing:1px}
.podium-card .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;padding-top:20px;border-top:1px solid rgba(255,215,0,0.06)}
.podium-card .stat-item{background:rgba(0,0,0,0.25);border-radius:14px;padding:14px 8px;text-align:center;transition:background 0.3s}
.podium-card .stat-item:hover{background:rgba(255,215,0,0.05)}
.podium-card .stat-item .stat-icon{font-size:18px;display:block;margin-bottom:4px}
.podium-card .stat-item .stat-nb{font-size:20px;font-weight:700;color:#e8edf5}
.podium-card .stat-item .stat-lb{font-size:9px;color:#6a7a8a;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;display:block}
.podium-card.gold{border-color:rgba(251,191,36,0.2);background:linear-gradient(145deg,#2a2418,#1e1a12)}
.podium-card.gold .nombre{color:#fbbf24}
.podium-card.gold .stat-nb{color:#fbbf24}
.podium-card.silver{border-color:rgba(156,163,175,0.15);background:linear-gradient(145deg,#22222a,#18181e)}
.podium-card.silver .nombre{color:#9ca3af}
.podium-card.silver .stat-nb{color:#d1d5db}
.podium-card.bronze{border-color:rgba(180,83,9,0.15);background:linear-gradient(145deg,#241e14,#18140e)}
.podium-card.bronze .nombre{color:#d97706}
.podium-card.bronze .stat-nb{color:#f59e0b}
.loading{text-align:center;padding:80px 20px;color:#5a6a7a;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1}
.loading:before{content:"";width:28px;height:28px;border:3px solid rgba(56,189,248,0.06);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 20px;color:#5a6a7a;grid-column:1/-1;font-size:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:14px 24px;color:#fff;font-size:13px;border-left:4px solid #ffd700;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;z-index:999;max-width:90%;text-align:center}
.toast.show{display:block;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:768px){.podium{grid-template-columns:1fr;gap:18px;min-height:auto}.podium-card{padding:24px 20px 20px}.podium-card .medal{font-size:44px}.podium-card .ecole-nom{font-size:18px}.podium-card .valeur-principale .nombre{font-size:30px}.podium-card .stats-grid{gap:8px}.podium-card .stat-item{padding:10px 6px}.podium-card .stat-item .stat-nb{font-size:16px}.header h1{font-size:20px}.header{padding:18px 20px}}
@media(max-width:400px){body{padding:12px}.header{padding:14px 16px}.podium-card{padding:18px 14px 16px}.podium-card .medal{font-size:36px}.podium-card .ecole-nom{font-size:15px}.podium-card .valeur-principale .nombre{font-size:24px}.podium-card .stats-grid{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏆 Classement des écoles partenaires</h1>
<span class="badge-live">🔴 EN DIRECT</span>
</div>
<div id="podiumContainer" class="podium">
<div class="loading">Chargement...</div>
</div>
<div class="toast" id="toast"></div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let toutesEcoles=[];
const podiumContainer=document.getElementById('podiumContainer');
const toastEl=document.getElementById('toast');
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastEl._timer);toastEl._timer=setTimeout(()=>toastEl.classList.remove('show'),3000);}
async function getAllEcolesAvecStats(){const ecolesSnap=await getDocs(collection(db,"ecoles"));const resultats=[];for(const ecoleDoc of ecolesSnap.docs){const ecoleId=ecoleDoc.id;const ecoleData=ecoleDoc.data();if(ecoleData.actif===false)continue;const profsSnap=await getDocs(collection(db,"ecoles",ecoleId,"professeurs"));const nbProfs=profsSnap.size;const fichesSnap=await getDocs(collection(db,"ecoles",ecoleId,"fiches"));const nbFiches=fichesSnap.size;let nbEleves=0;try{const elevesSnap=await getDocs(collection(db,"ecoles",ecoleId,"compta_eleves"));elevesSnap.forEach(ds=>{const data=ds.data();if(data.abandon!==true)nbEleves++;});}catch(e){nbEleves=0;}resultats.push({id:ecoleId,nom:ecoleData.nom||ecoleId,ville:ecoleData.ville||"",effectif:nbEleves,profs:nbProfs,fiches:nbFiches});}return resultats;}
function afficherClassement(critere){if(toutesEcoles.length===0){podiumContainer.innerHTML='<div class="empty">📭 Aucune école trouvée</div>';return;}const sorted=[...toutesEcoles].sort((a,b)=>(b[critere]||0)-(a[critere]||0));const top3=sorted.slice(0,3);const medals=['🥇','🥈','🥉'];const classes=['gold','silver','bronze'];const labels={effectif:{label:'Élèves',icon:'👥'},profs:{label:'Professeurs',icon:'👨‍🏫'},fiches:{label:'Fiches',icon:'📄'}};const label=labels[critere]?.label||'Valeur';const icon=labels[critere]?.icon||'📊';let html='';top3.forEach((ecole,index)=>{const valeur=ecole[critere]||0;html+=`<div class="podium-card ${classes[index]}"><div class="top-bar"><span class="rank-badge">TOP ${index+1}</span><span class="pos">#${index+1}</span></div><div class="medal-area"><span class="medal">${medals[index]}</span></div><div class="ecole-nom">${ecole.nom}</div><div class="valeur-principale"><span class="nombre">${valeur}</span><span class="label">${icon} ${label}</span></div><div class="stats-grid"><div class="stat-item"><span class="stat-icon">👥</span><span class="stat-nb">${ecole.effectif}</span><span class="stat-lb">Élèves</span></div><div class="stat-item"><span class="stat-icon">👨‍🏫</span><span class="stat-nb">${ecole.profs}</span><span class="stat-lb">Professeurs</span></div><div class="stat-item"><span class="stat-icon">📄</span><span class="stat-nb">${ecole.fiches}</span><span class="stat-lb">Fiches</span></div></div></div>`;});podiumContainer.innerHTML=html;}
async function chargerDonnees(){podiumContainer.innerHTML='<div class="loading">Chargement...</div>';try{toutesEcoles=await getAllEcolesAvecStats();if(toutesEcoles.length===0){podiumContainer.innerHTML='<div class="empty">📭 Aucune école active trouvée</div>';showToast('⚠️ Aucune école trouvée');return;}afficherClassement('effectif');showToast(`✅ ${toutesEcoles.length} école(s) chargée(s)`);}catch(error){console.error(error);podiumContainer.innerHTML='<div class="empty">❌ Erreur de chargement</div>';showToast('❌ Erreur: '+error.message);}}
setInterval(chargerDonnees,300000);
chargerDonnees();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J')){e.preventDefault();return false;}});
</script>
</body>
</html>
