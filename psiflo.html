<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Admin - Gestion Complète</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e1a;color:#e2e8f0;padding:12px;min-height:100vh}
.container{max-width:800px;margin:0 auto}
.header{background:linear-gradient(135deg,#0f2b44,#071a2c);padding:16px 18px;border-radius:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:11px;color:#94a3b8}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:30px;font-weight:600;font-size:12px;cursor:pointer;transition:all .2s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:active{background:#b91c1c}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:active{background:#2563eb}
.btn-sm{padding:4px 12px;font-size:10px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:rgba(18,18,31,.8);border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(59,130,246,.1)}
.stat-card .number{font-size:22px;font-weight:800;color:#ffd700}
.stat-card .number.danger{color:#ef4444}
.stat-card .number.success{color:#10b981}
.stat-card .number.purple{color:#8b5cf6}
.stat-card .label{font-size:10px;color:#94a3b8;margin-top:2px}
.ecole-card{background:rgba(18,18,31,.9);border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid rgba(59,130,246,.1)}
.ecole-header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid rgba(255,215,0,.15)}
.ecole-header .nom{font-size:16px;font-weight:700;color:#ffd700}
.ecole-header .id{font-size:10px;color:#94a3b8;font-family:monospace}
.ecole-header .stats{display:flex;gap:8px;flex-wrap:wrap}
.ecole-header .stats .badge{background:rgba(59,130,246,.15);padding:2px 10px;border-radius:20px;font-size:10px;color:#60a5fa}
.ecole-header .stats .badge.green{background:rgba(16,185,129,.15);color:#10b981}
.ecole-header .stats .badge.purple{background:rgba(139,92,246,.15);color:#8b5cf6}
.ecole-actions{display:flex;gap:6px;flex-wrap:wrap}
.section-profs,.section-fiches{padding:8px 12px}
.section-title{font-size:12px;font-weight:600;color:#60a5fa;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.section-title .count{background:rgba(59,130,246,.15);padding:0 8px;border-radius:20px;font-size:10px;color:#94a3b8}
.prof-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(59,130,246,.05);flex-wrap:wrap;gap:4px;background:rgba(0,0,0,.15);border-radius:8px;margin-bottom:4px}
.prof-item .info{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.prof-item .name{font-weight:600;color:#fff}
.prof-item .code{color:#94a3b8;font-size:10px;font-family:monospace}
.prof-item .status{font-size:9px;padding:1px 8px;border-radius:20px}
.prof-item .status.active{background:rgba(16,185,129,.2);color:#10b981}
.prof-item .status.inactive{background:rgba(239,68,68,.2);color:#ef4444}
.fiche-item{display:flex;flex-direction:column;padding:8px 10px;border-bottom:1px solid rgba(59,130,246,.05);gap:4px;background:rgba(0,0,0,.1);border-radius:8px;margin-bottom:4px}
.fiche-item .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.fiche-item .cours{font-weight:600;color:#fff;font-size:13px}
.fiche-item .classe{color:#94a3b8;font-size:11px}
.fiche-item .option{background:rgba(255,215,0,.12);padding:1px 8px;border-radius:20px;font-size:10px;color:#fbbf24}
.fiche-item .ref{color:#64748b;font-size:9px;font-family:monospace}
.fiche-item .eleves-list{color:#60a5fa;font-size:10px;word-break:break-all}
.fiche-item .actions{display:flex;gap:4px}
.empty-state{text-align:center;padding:20px;color:#64748b;font-size:13px}
.loading{text-align:center;padding:30px;color:#60a5fa;font-size:14px}
.toast-container{position:fixed;top:10px;right:10px;left:10px;z-index:10000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(18,25,45,.95);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:4px solid #10b981;transform:translateX(100%);transition:transform .3s ease;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.toast.show{transform:translateX(0)}
.toast.error{border-left-color:#ef4444}
.toast.warning{border-left-color:#f59e0b}
.toast .icon{font-size:16px}
.toast .content{flex:1}
.toast .title{font-weight:600;font-size:12px;color:#fff}
.toast .message{font-size:11px;color:#cbd5e1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s}
.modal-overlay.show{visibility:visible;opacity:1}
.modal-box{background:#1e293b;border-radius:20px;padding:24px;max-width:400px;width:92%;text-align:center}
.modal-box .icon{font-size:40px;margin-bottom:12px}
.modal-box h3{color:#fff;font-size:16px;margin-bottom:8px}
.modal-box p{color:#94a3b8;font-size:13px;margin-bottom:16px;line-height:1.5}
.modal-box .buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal-box .btn{min-width:100px}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}.ecole-header{flex-direction:row;flex-wrap:wrap}.fiche-item .top{flex-wrap:nowrap}}
@media(max-width:400px){.header h1{font-size:15px}.btn{padding:6px 12px;font-size:11px}.stat-card .number{font-size:18px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="header-top">
<div><h1>🏫 Admin</h1><div class="sub">Gestion complète</div></div>
<div class="header-actions">
<button class="btn btn-danger btn-sm" onclick="toutSupprimer()">🗑️ TOUT</button>
<button class="btn btn-primary btn-sm" onclick="rafraichir()">🔄</button>
</div>
</div>
</div>
<div class="stats-grid" id="statsContainer">
<div class="stat-card"><div class="number" id="statEcoles">0</div><div class="label">🏫 Écoles</div></div>
<div class="stat-card"><div class="number purple" id="statProfesseurs">0</div><div class="label">👨‍🏫 Profs</div></div>
<div class="stat-card"><div class="number success" id="statFiches">0</div><div class="label">📄 Fiches</div></div>
<div class="stat-card"><div class="number" id="statEleves">0</div><div class="label">👥 Élèves</div></div>
</div>
<div id="ecolesContainer"><div class="loading">⏳ Chargement...</div></div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="confirmModal">
<div class="modal-box">
<div class="icon">⚠️</div>
<h3 id="confirmTitle">Confirmation</h3>
<p id="confirmMessage">Êtes-vous sûr ?</p>
<div class="buttons">
<button class="btn btn-danger" id="confirmYes">OUI</button>
<button class="btn btn-secondary" id="confirmNo" style="background:#334155;color:#fff">ANNULER</button>
</div>
</div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,deleteDoc,doc}from"firebase/firestore";

const firebaseConfig={
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let toutesEcoles=[],toutesFiches=[],tousProfesseurs=[];

function toast(m,t='success'){
const c=document.getElementById('toastContainer');
const ic={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
const ti={success:'OK',error:'Erreur',warning:'Attention',info:'Info'};
const el=document.createElement('div');
el.className=`toast ${t}`;
el.innerHTML=`<div class="icon">${ic[t]||'📢'}</div><div class="content"><div class="title">${ti[t]||'Info'}</div><div class="message">${m}</div></div>`;
c.appendChild(el);
setTimeout(()=>el.classList.add('show'),10);
setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},3000);
}

function showConfirm(t,m,onConfirm){
const modal=document.getElementById('confirmModal');
document.getElementById('confirmTitle').textContent=t;
document.getElementById('confirmMessage').innerHTML=m;
modal.classList.add('show');
const yes=document.getElementById('confirmYes');
const no=document.getElementById('confirmNo');
const clean=()=>{modal.classList.remove('show');yes.removeEventListener('click',h);no.removeEventListener('click',clean);};
const h=()=>{clean();if(onConfirm)onConfirm();};
yes.addEventListener('click',h);
no.addEventListener('click',clean);
}

async function chargerEcoles(){
try{const snap=await getDocs(collection(db,"ecoles_autorisees"));toutesEcoles=[];snap.forEach(ds=>{toutesEcoles.push({id:ds.id,...ds.data()});});return toutesEcoles;}catch(e){toast("❌ Erreur chargement","error");return[];}
}

async function chargerProfesseurs(e){
try{const snap=await getDocs(collection(db,`${e}_professeurs`));const p=[];snap.forEach(ds=>{const d=ds.data();if(d._type==='prof'){p.push({id:d.profId||ds.id,nom:d.nom||'Inconnu',code:d.code||'0000',actif:d.actif!==false});}});return p;}catch(e){return[];}
}

async function chargerFiches(e){
try{const snap=await getDocs(collection(db,`${e}_fiches`));const f=[];snap.forEach(ds=>{const d=ds.data();if(!d._type){f.push({id:ds.id,ecoleId:e,...d});}});return f;}catch(e){return[];}
}

async function chargerTout(){
document.getElementById('ecolesContainer').innerHTML='<div class="loading">⏳ Chargement...</div>';
toutesFiches=[];tousProfesseurs=[];let total=0;
for(const e of toutesEcoles){
const p=await chargerProfesseurs(e.id);
tousProfesseurs=tousProfesseurs.concat(p.map(p=>({...p,ecoleId:e.id,ecoleNom:e.nom||e.id})));
const f=await chargerFiches(e.id);
f.forEach(f=>{f.ecoleNom=e.nom||e.id;});
toutesFiches=toutesFiches.concat(f);
f.forEach(f=>{if(f.eleves)total+=f.eleves.length;});
}
return{total};
}

async function supprimerEcole(id){
try{
const f=await getDocs(collection(db,`${id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",id));}catch(e){}
toast(`✅ École supprimée`,'success');await rafraichir();
}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function supprimerProfesseur(e,id,n){
try{await deleteDoc(doc(db,`${e}_professeurs`,id));toast(`✅ ${n} supprimé`,'success');await rafraichir();}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function supprimerFiche(e,id,c){
try{await deleteDoc(doc(db,`${e}_fiches`,id));toast(`✅ ${c} supprimée`,'success');await rafraichir();}catch(e){toast(`❌ ${e.message}`,'error');}
}

async function toutSupprimer(){
showConfirm("🗑️ RÉINITIALISATION",
`⚠️ <strong>IRRÉVERSIBLE</strong><br><br>${toutesEcoles.length} écoles<br>${tousProfesseurs.length} profs<br>${toutesFiches.length} fiches`,
async()=>{
try{
for(const e of toutesEcoles){
const f=await getDocs(collection(db,`${e.id}_fiches`));for(const d of f.docs){await deleteDoc(d.ref);}
const p=await getDocs(collection(db,`${e.id}_professeurs`));for(const d of p.docs){await deleteDoc(d.ref);}
try{await deleteDoc(doc(db,"ecoles_autorisees",e.id));}catch(e){}
}
toast('✅ Tout supprimé','success');await rafraichir();
}catch(e){toast(`❌ ${e.message}`,'error');}
});
}

function afficher(total){
const c=document.getElementById('ecolesContainer');
if(!toutesEcoles.length){c.innerHTML='<div class="empty-state">📭 Aucune école</div>';return;}
document.getElementById('statEcoles').textContent=toutesEcoles.length;
document.getElementById('statProfesseurs').textContent=tousProfesseurs.length;
document.getElementById('statFiches').textContent=toutesFiches.length;
document.getElementById('statEleves').textContent=total;
let html='';
for(const e of toutesEcoles){
const p=tousProfesseurs.filter(p=>p.ecoleId===e.id);
const f=toutesFiches.filter(f=>f.ecoleId===e.id);
const nb=f.reduce((s,f)=>{if(f.eleves)s+=f.eleves.length;return s;},0);
html+=`<div class="ecole-card"><div class="ecole-header">
<div><div class="nom">🏫 ${e.nom||e.id}</div><div class="id">${e.id}</div></div>
<div class="stats"><span class="badge">👨‍🏫 ${p.length}</span><span class="badge green">📄 ${f.length}</span><span class="badge purple">👥 ${nb}</span></div>
<div class="ecole-actions"><button class="btn btn-danger btn-sm" onclick="window.suppEcole('${e.id}')">🗑️</button></div>
</div>`;
if(p.length){html+=`<div class="section-profs"><div class="section-title">👨‍🏫 Profs <span class="count">${p.length}</span></div>`;for(const pr of p){html+=`<div class="prof-item"><div class="info"><span class="name">${pr.nom}</span><span class="code">${pr.code}</span><span class="status ${pr.actif?'active':'inactive'}">${pr.actif?'Actif':'Inactif'}</span></div><button class="btn btn-danger btn-sm" onclick="window.suppProf('${e.id}','${pr.id}','${pr.nom}')">✕</button></div>`;}html+=`</div>`;}
if(f.length){html+=`<div class="section-fiches"><div class="section-title">📄 Fiches <span class="count">${f.length}</span></div>`;for(const fc of f){const eleves=fc.eleves||[];const noms=eleves.slice(0,3).map(e=>e.nom||'?').join(', ')+(eleves.length>3?` +${eleves.length-3}`:'');html+=`<div class="fiche-item"><div class="top"><div><span class="cours">📘 ${fc.cours||'?'}</span><span class="classe">${fc.classe||'?'}</span>${fc.option?`<span class="option">${fc.option}</span>`:''}${fc.numeroRef?`<span class="ref">#${fc.numeroRef}</span>`:''}</div><button class="btn btn-danger btn-sm" onclick="window.suppFiche('${e.id}','${fc.id}','${fc.cours||'?'}')">✕</button></div><div class="eleves-list">👥 ${eleves.length} élèves: ${noms||'Aucun'}</div></div>`;}html+=`</div>`;}
html+=`</div>`;
}
c.innerHTML=html;
}

window.suppEcole=function(id){const e=toutesEcoles.find(e=>e.id===id);showConfirm("🗑️ Supprimer",`⚠️ <strong>${e?.nom||id}</strong><br><br>Action irréversible !`,()=>supprimerEcole(id));};
window.suppProf=function(e,id,n){showConfirm("🗑️ Supprimer",`⚠️ <strong>${n}</strong><br><br>Action irréversible !`,()=>supprimerProfesseur(e,id,n));};
window.suppFiche=function(e,id,c){showConfirm("🗑️ Supprimer",`⚠️ <strong>${c}</strong><br><br>Action irréversible !`,()=>supprimerFiche(e,id,c));};
window.toutSupprimer=toutSupprimer;
window.rafraichir=rafraichir;

async function rafraichir(){
await chargerEcoles();
const {total}=await chargerTout();
afficher(total);
toast('✅ Actualisé','info');
}
await rafraichir();
</script>
</body>
</html>
