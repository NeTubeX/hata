<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Primaire - Bientôt disponible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a2a3e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 60px 50px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 215, 0, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .icon-ecole {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            color: #ffd700;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            position: relative;
        }
        .school-name {
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 30px;
            padding: 8px 20px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .machine-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin: 30px 0 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .machine-text .cursor {
            display: inline-block;
            width: 3px;
            height: 32px;
            background: #ffd700;
            animation: blink 0.8s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .sub-text {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .sub-text strong {
            color: #ffd700;
        }
        .btn-retour {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background: linear-gradient(180deg, #ffd700, #f59e0b);
            color: #0f172a;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-retour:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(245, 158, 11, 0.4);
        }
        .btn-retour:active {
            transform: translateY(2px) scale(0.98);
        }
        .btn-retour .arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
        }
        .btn-retour:hover .arrow {
            transform: translateX(-5px);
        }
        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            color: #64748b;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .footer-note span {
            color: #ffd700;
        }
        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
                border-radius: 28px;
            }
            h1 {
                font-size: 26px;
            }
            .machine-text {
                font-size: 22px;
                min-height: 60px;
            }
            .machine-text .cursor {
                height: 26px;
            }
            .btn-retour {
                padding: 14px 30px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }
            .icon-ecole {
                font-size: 60px;
            }
            .school-name {
                font-size: 14px;
                padding: 6px 16px;
            }
        }
        @media (max-width: 400px) {
            .container {
                padding: 30px 18px;
            }
            .machine-text {
                font-size: 18px;
                min-height: 50px;
            }
            .machine-text .cursor {
                height: 22px;
            }
            h1 {
                font-size: 22px;
            }
        }
        /* Effet de particules légères */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: particleFloat 8s infinite linear;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100%) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <span class="icon-ecole">🏫</span>
    <h1>ESPACE PRIMAIRE</h1>
    <div class="school-name" id="schoolDisplay">🏛️ CHARGEMENT...</div>

    <div class="machine-text" id="machineText">
        <span id="typedText"></span><span class="cursor"></span>
    </div>

    <p class="sub-text">
        L'espace dédié aux élèves du primaire est en cours de développement.<br>
        <strong>Revenez bientôt</strong> pour découvrir les nouveautés !
    </p>

    <a href="#" class="btn-retour" id="btnRetour">
        <span class="arrow">←</span> Retourner à l'espace comptabilité
    </a>

    <div class="footer-note">
        <span>✦</span> Complexe Scolaire <span id="footerSchool">...</span> <span>✦</span>
    </div>
</div>

<script>
    (function() {
        // Récupérer les paramètres URL
        const urlParams = new URLSearchParams(window.location.search);
        const ecole = urlParams.get('ecole') || 'Non spécifié';
        const code = urlParams.get('code') || '';

        // Afficher le nom de l'école
        const schoolDisplay = document.getElementById('schoolDisplay');
        const footerSchool = document.getElementById('footerSchool');
        const displayName = ecole.toUpperCase();
        schoolDisplay.textContent = `🏛️ ${displayName}`;
        footerSchool.textContent = displayName;

        // Texte à taper
        const textToType = '… très bientôt disponible à l\'école …';
        const typedElement = document.getElementById('typedText');
        let index = 0;
        let isDeleting = false;

        function typeEffect() {
            if (!isDeleting) {
                if (index < textToType.length) {
                    typedElement.textContent += textToType.charAt(index);
                    index++;
                    setTimeout(typeEffect, 60 + Math.random() * 40);
                } else {
                    // Pause avant de recommencer
                    setTimeout(() => {
                        isDeleting = true;
                        setTimeout(typeEffect, 300);
                    }, 2500);
                }
            } else {
                if (index > 0) {
                    typedElement.textContent = textToType.substring(0, index - 1);
                    index--;
                    setTimeout(typeEffect, 30 + Math.random() * 20);
                } else {
                    isDeleting = false;
                    setTimeout(typeEffect, 400);
                }
            }
        }

        // Démarrer l'effet machine à écrire après un court délai
        setTimeout(typeEffect, 800);

        // Gérer le bouton retour
        const btnRetour = document.getElementById('btnRetour');
        btnRetour.addEventListener('click', function(e) {
            e.preventDefault();

            // Construire l'URL de retour avec les mêmes paramètres
            const returnUrl = new URL('https://www.netubex.com/schoolchoice');
            // Essayer de revenir à la page précédente avec les paramètres
            const referrer = document.referrer;
            if (referrer) {
                try {
                    const refUrl = new URL(referrer);
                    // Si c'est la page comptabilité, on y retourne
                    if (refUrl.pathname.includes('schoolchoice') || refUrl.pathname.includes('compta')) {
                        window.location.href = referrer;
                        return;
                    }
                } catch (e) {}
            }

            // Fallback: construire l'URL manuellement
            let baseUrl = 'https://www.netubex.com/schoolchoice';
            // Si on a un paramètre ecole, on le garde
            if (ecole) {
                baseUrl = `https://www.netubex.com/login?ecole=${ecole}`;
                if (code) {
                    baseUrl += `&code=${code}`;
                }
            }
            window.location.href = baseUrl;
        });

        // Ajouter des particules décoratives
        const container = document.querySelector('.container');
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (6 + Math.random() * 6) + 's';
            particle.style.width = (2 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            container.appendChild(particle);
        }
    })();
</script>

</body>
</html>
