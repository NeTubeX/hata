<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Primaire</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0b1120,#1a2a3e);font-family:'Segoe UI',Roboto,system-ui,sans-serif;padding:1.5rem}
        .card{max-width:540px;width:100%;background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:2.5rem;padding:2.8rem 2.2rem;text-align:center;border:1px solid rgba(255,215,0,0.15);box-shadow:0 25px 60px rgba(0,0,0,0.6);position:relative}
        .icon{font-size:4.2rem;display:block;margin-bottom:0.3rem}
        h1{color:#ffd700;font-size:1.9rem;font-weight:800;letter-spacing:-0.5px}
        .school-name{color:#94a3b8;font-size:0.9rem;font-weight:500;padding:0.35rem 1.4rem;background:rgba(255,215,0,0.08);border-radius:30px;display:inline-block;border:1px solid rgba(255,215,0,0.12);margin-top:0.2rem}
        .machine{font-size:1.5rem;font-weight:700;color:#fff;margin:1.6rem 0 0.8rem;min-height:3.8rem;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap}
        .cursor{display:inline-block;width:3px;height:1.8rem;background:#ffd700;animation:blink 0.8s step-end infinite;margin-left:2px}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .sub-text{color:#94a3b8;font-size:0.85rem;line-height:1.7;max-width:440px;margin:0 auto 2rem}
        .sub-text strong{color:#ffd700}
        .btn{display:inline-flex;align-items:center;gap:0.7rem;padding:0.85rem 2.2rem;background:linear-gradient(180deg,#ffd700,#f59e0b);color:#0f172a;font-weight:700;font-size:0.9rem;border:none;border-radius:50px;cursor:pointer;text-decoration:none;text-transform:uppercase;letter-spacing:0.3px;box-shadow:0 8px 30px rgba(245,158,11,0.3);transition:all 0.25s ease}
        .btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 40px rgba(245,158,11,0.4)}
        .btn:active{transform:translateY(2px) scale(0.98)}
        .arrow{font-size:1.2rem;transition:transform 0.3s ease}
        .btn:hover .arrow{transform:translateX(-5px)}
        .footer{margin-top:1.8rem;padding-top:1rem;border-top:1px solid rgba(255,215,0,0.08);color:#64748b;font-size:0.7rem;letter-spacing:0.3px}
        .footer span{color:#ffd700}
        .particle{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,215,0,0.2);animation:particleFloat linear infinite}
        @keyframes particleFloat{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) rotate(360deg);opacity:0}}
        @media(max-width:600px){.card{padding:2.2rem 1.5rem;border-radius:2rem}h1{font-size:1.5rem}.machine{font-size:1.2rem;min-height:3.2rem}.cursor{height:1.5rem}.btn{padding:0.75rem 1.6rem;font-size:0.8rem;width:100%;justify-content:center}.icon{font-size:3.5rem}}
        @media(max-width:400px){.card{padding:1.8rem 1.2rem}.machine{font-size:1rem;min-height:2.8rem}.cursor{height:1.2rem}h1{font-size:1.2rem}}
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🏫</span>
        <h1>ESPACE PRIMAIRE</h1>
        <div class="school-name" id="schoolDisplay">🏛️ CHARGEMENT...</div>
        <div class="machine">
            <span id="typedText"></span><span class="cursor"></span>
        </div>
        <p class="sub-text">
            L'espace dédié aux élèves du primaire est en cours de préparation.<br>
            <strong>Revenez bientôt</strong> pour découvrir les nouveautés !
        </p>
        <a href="#" class="btn" id="btnRetour">
            <span class="arrow">←</span> Retourner à l'espace comptabilité
        </a>
        <div class="footer">
            <span>✦</span> Complexe Scolaire <span id="footerSchool">...</span> <span>✦</span>
        </div>
    </div>
    <script>
        (function(){
            const ecole=new URLSearchParams(window.location.search).get('ecole')||'Non spécifié';
            const code=new URLSearchParams(window.location.search).get('code')||'';
            const display=ecole.toUpperCase();
            document.getElementById('schoolDisplay').textContent='🏛️ '+display;
            document.getElementById('footerSchool').textContent=display;
            const txt='… très bientôt disponible à l\'école …';
            const el=document.getElementById('typedText');
            let i=0,d=false;
            function t(){
                if(!d){
                    if(i<txt.length){el.textContent+=txt.charAt(i);i++;setTimeout(t,60+Math.random()*40)}
                    else{setTimeout(()=>{d=true;setTimeout(t,300)},2500)}
                }else{
                    if(i>0){el.textContent=txt.substring(0,i-1);i--;setTimeout(t,30+Math.random()*20)}
                    else{d=false;setTimeout(t,400)}
                }
            }
            setTimeout(t,800);
            document.getElementById('btnRetour').addEventListener('click',function(e){
                e.preventDefault();
                const ref=document.referrer;
                if(ref){
                    try{
                        const u=new URL(ref);
                        if(u.pathname.includes('schoolchoice')||u.pathname.includes('compta')){window.location.href=ref;return}
                    }catch(e){}
                }
                let url='https://www.netubex.com/schoolchoice';
                if(ecole){url='https://www.netubex.com/login?ecole='+ecole;if(code)url+='&code='+code}
                window.location.href=url;
            });
            for(let i=0;i<10;i++){
                const p=document.createElement('div');
                p.className='particle';
                const s=2+Math.random()*4;
                p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-duration:'+(6+Math.random()*6)+'s;animation-delay:'+Math.random()*8+'s';
                document.querySelector('.card').appendChild(p);
            }
        })();
    </script>
</body>
</html>
