<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Primaire</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0b1120,#1a2a3e);font-family:'Segoe UI',Roboto,system-ui,sans-serif;padding:1.5rem}
        .card{max-width:560px;width:100%;background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:2.5rem;padding:3rem 2.5rem;text-align:center;border:1px solid rgba(255,215,0,0.15);box-shadow:0 25px 60px rgba(0,0,0,0.6)}
        .icon{font-size:4.5rem;display:block;margin-bottom:0.5rem}
        h1{color:#ffd700;font-size:2rem;font-weight:800;letter-spacing:-0.5px}
        .school-name{color:#94a3b8;font-size:0.95rem;font-weight:500;padding:0.4rem 1.5rem;background:rgba(255,215,0,0.08);border-radius:30px;display:inline-block;border:1px solid rgba(255,215,0,0.12);margin-top:0.25rem}
        .machine{font-size:1.6rem;font-weight:700;color:#fff;margin:1.8rem 0 1rem;min-height:4rem;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap}
        .cursor{display:inline-block;width:3px;height:2rem;background:#ffd700;animation:blink 0.8s step-end infinite;margin-left:2px}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .sub-text{color:#94a3b8;font-size:0.9rem;line-height:1.8;max-width:460px;margin:0 auto 2.2rem}
        .sub-text strong{color:#ffd700}
        .btn{display:inline-flex;align-items:center;gap:0.75rem;padding:0.9rem 2.5rem;background:linear-gradient(180deg,#ffd700,#f59e0b);color:#0f172a;font-weight:700;font-size:0.95rem;border:none;border-radius:50px;cursor:pointer;text-decoration:none;text-transform:uppercase;letter-spacing:0.3px;box-shadow:0 8px 30px rgba(245,158,11,0.3);transition:all 0.25s ease}
        .btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 40px rgba(245,158,11,0.4)}
        .btn:active{transform:translateY(2px) scale(0.98)}
        .arrow{font-size:1.3rem;transition:transform 0.3s ease}
        .btn:hover .arrow{transform:translateX(-5px)}
        .footer{margin-top:2rem;padding-top:1.2rem;border-top:1px solid rgba(255,215,0,0.08);color:#64748b;font-size:0.75rem;letter-spacing:0.3px}
        .footer span{color:#ffd700}
        @media(max-width:600px){.card{padding:2.5rem 1.5rem;border-radius:2rem}h1{font-size:1.6rem}.machine{font-size:1.3rem;min-height:3.5rem}.cursor{height:1.6rem}.btn{padding:0.8rem 1.8rem;font-size:0.85rem;width:100%;justify-content:center}.icon{font-size:3.5rem}}
        @media(max-width:400px){.card{padding:2rem 1.2rem}.machine{font-size:1.1rem;min-height:3rem}.cursor{height:1.3rem}h1{font-size:1.3rem}}
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🏫</span>
        <h1>ESPACE PRIMAIRE</h1>
        <div class="school-name" id="schoolDisplay">🏛️ CHARGEMENT...</div>
        <div class="machine">
            <span id="typedText"></span><span class="cursor"></span>
        </div>
        <p class="sub-text">
            L'espace dédié aux élèves du primaire est en cours de développement.<br>
            <strong>Revenez bientôt</strong> pour découvrir les nouveautés !
        </p>
        <a href="#" class="btn" id="btnRetour">
            <span class="arrow">←</span> Retourner à l'espace comptabilité
        </a>
        <div class="footer">
            <span>✦</span> Complexe Scolaire <span id="footerSchool">...</span> <span>✦</span>
        </div>
    </div>
    <script>
        (function(){
            const urlParams=new URLSearchParams(window.location.search);
            const ecole=urlParams.get('ecole')||'Non spécifié';
            const code=urlParams.get('code')||'';
            const schoolDisplay=document.getElementById('schoolDisplay');
            const footerSchool=document.getElementById('footerSchool');
            const displayName=ecole.toUpperCase();
            schoolDisplay.textContent='🏛️ '+displayName;
            footerSchool.textContent=displayName;
            const textToType='… très bientôt disponible à l\'école …';
            const typedElement=document.getElementById('typedText');
            let index=0,isDeleting=false;
            function typeEffect(){
                if(!isDeleting){
                    if(index<textToType.length){
                        typedElement.textContent+=textToType.charAt(index);
                        index++;
                        setTimeout(typeEffect,60+Math.random()*40);
                    }else{
                        setTimeout(()=>{isDeleting=true;setTimeout(typeEffect,300);},2500);
                    }
                }else{
                    if(index>0){
                        typedElement.textContent=textToType.substring(0,index-1);
                        index--;
                        setTimeout(typeEffect,30+Math.random()*20);
                    }else{
                        isDeleting=false;
                        setTimeout(typeEffect,400);
                    }
                }
            }
            setTimeout(typeEffect,800);
            const btnRetour=document.getElementById('btnRetour');
            btnRetour.addEventListener('click',function(e){
                e.preventDefault();
                const referrer=document.referrer;
                if(referrer){
                    try{
                        const refUrl=new URL(referrer);
                        if(refUrl.pathname.includes('schoolchoice')||refUrl.pathname.includes('compta')){
                            window.location.href=referrer;
                            return;
                        }
                    }catch(e){}
                }
                let baseUrl='https://www.netubex.com/schoolchoice';
                if(ecole){
                    baseUrl='https://www.netubex.com/login?ecole='+ecole;
                    if(code) baseUrl+='&code='+code;
                }
                window.location.href=baseUrl;
            });
            const container=document.querySelector('.card');
            for(let i=0;i<12;i++){
                const p=document.createElement('div');
                p.style.cssText='position:absolute;width:'+(2+Math.random()*4)+'px;height:'+(2+Math.random()*4)+'px;background:rgba(255,215,0,0.25);border-radius:50%;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation:particleFloat '+(6+Math.random()*6)+'s infinite linear;animation-delay:'+Math.random()*8+'s;pointer-events:none';
                container.style.position='relative';
                container.appendChild(p);
            }
            const style=document.createElement('style');
            style.textContent='@keyframes particleFloat{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-120px) rotate(360deg);opacity:0}}';
            document.head.appendChild(style);
        })();
    </script>
</body>
</html>
