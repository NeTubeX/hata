<!DOCTYPE html>
<html lang="fr">
<head>

<title>Sélectionnez votre établissement | NeTubeX</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;-ms-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;background:#0a0e1a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8edf5}
body{overflow:hidden;position:fixed;width:100%;height:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.15);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,0.3)}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(160deg,#0a0e1a 0%,#0d1a2b 40%,#0f2840 70%,#0a1a2e 100%)}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,0.06),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(56,189,248,0.04),transparent 50%)}
.header-fixed{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(56,189,248,0.06);padding:12px 16px 10px;width:100%;flex-shrink:0}
.header{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{background:rgba(37,99,235,0.12);border:1px solid rgba(56,189,248,0.06);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#60a5fa;flex-shrink:0}
.header-title{font-size:20px;font-weight:700;color:#e8edf5;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px}
.header-title span{font-weight:400;color:#5a6a7a;font-size:13px}
.btn-home{background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.06);padding:8px 18px;border-radius:40px;font-size:13px;font-weight:500;color:#60a5fa;cursor:pointer;transition:all 0.3s;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-home:hover{background:rgba(56,189,248,0.1);color:#93bbfc;border-color:rgba(56,189,248,0.12)}
.search-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#4a5a6a}
.search-input{width:100%;padding:11px 16px 11px 46px;border-radius:40px;border:1px solid rgba(56,189,248,0.06);background:rgba(255,255,255,0.02);font-size:14px;font-family:inherit;color:#e8edf5;transition:all 0.3s;outline:none}
.search-input:focus{border-color:rgba(56,189,248,0.15);background:rgba(255,255,255,0.04);box-shadow:0 0 0 4px rgba(56,189,248,0.02)}
.search-input::placeholder{color:#4a5a6a}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.03);border:none;font-size:13px;color:#5a6a7a;cursor:pointer;padding:4px 10px;display:none;border-radius:30px;transition:all 0.3s}
.search-clear:hover{color:#e8edf5;background:rgba(255,255,255,0.05)}
.main-container{position:fixed;top:95px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 80px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.main-container::-webkit-scrollbar{width:4px}
.main-container::-webkit-scrollbar-track{background:transparent}
.main-container::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.1);border-radius:10px}
.schools-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1000px;margin:0 auto;padding-top:4px}
.school-card{background:linear-gradient(145deg,#1e2a3a,#15202e);border:1px solid rgba(56,189,248,0.06);border-radius:24px;transition:all 0.5s cubic-bezier(0.2,0.9,0.4,1);cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:28px 28px 24px;min-height:240px;box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(56,189,248,0.04),inset 0 -2px 0 rgba(56,189,248,0.02);transform:perspective(800px) rotateX(2deg) rotateY(0deg)}
.school-card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:24px;padding:1px;background:linear-gradient(145deg,rgba(56,189,248,0.08),transparent 50%,rgba(56,189,248,0.02));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.school-card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(56,189,248,0.03),transparent 60%);pointer-events:none;opacity:0;transition:opacity 0.6s}
.school-card:hover{transform:perspective(800px) rotateX(0deg) rotateY(2deg) translateY(-6px);border-color:rgba(56,189,248,0.12);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(37,99,235,0.02),inset 0 1px 0 rgba(56,189,248,0.06)}
.school-card:hover::after{opacity:1}
.school-card:active{transform:perspective(800px) rotateX(2deg) rotateY(0deg) scale(0.97)}
.school-card.hidden{display:none}
.school-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.school-left{display:flex;align-items:center;gap:14px;min-width:0}
.school-number{display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,0.06);color:#60a5fa;font-size:11px;font-weight:600;width:30px;height:30px;border-radius:50%;flex-shrink:0;border:1px solid rgba(56,189,248,0.04)}
.school-icon{background:linear-gradient(145deg,rgba(37,99,235,0.12),rgba(37,99,235,0.04));border:1px solid rgba(56,189,248,0.04);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#60a5fa;flex-shrink:0}
.school-name{font-size:18px;font-weight:700;color:#e8edf5;letter-spacing:-0.2px;word-break:break-word;line-height:1.2}
.school-name .prefix{font-weight:400;color:#5a6a7a;font-size:14px;margin-right:4px}
.school-status{font-size:10px;padding:3px 14px;border-radius:30px;font-weight:500;white-space:nowrap;flex-shrink:0;margin-top:2px;background:rgba(34,197,94,0.06);color:#34d399;border:1px solid rgba(34,197,94,0.04)}
.school-desc{font-size:13px;color:#8a9aaa;line-height:1.6;margin:6px 0 12px;padding-left:56px;font-weight:400}
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid rgba(56,189,248,0.04);margin-top:auto}
.school-meta{font-size:11px;color:#4a5a6a;display:flex;align-items:center;gap:8px}
.school-meta .code{background:rgba(255,255,255,0.02);padding:2px 10px;border-radius:20px;font-family:monospace;font-size:10px;color:#4a5a6a}
.school-meta .location{color:#4a5a6a;display:flex;align-items:center;gap:4px}
.btn-access{background:rgba(37,99,235,0.08);border:1px solid rgba(56,189,248,0.04);padding:8px 24px;border-radius:40px;font-size:13px;font-weight:600;color:#60a5fa;transition:all 0.3s;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 12px rgba(37,99,235,0.02)}
.btn-access:after{content:"→";transition:transform 0.3s}
.school-card:hover .btn-access{background:rgba(37,99,235,0.14);border-color:rgba(56,189,248,0.08);box-shadow:0 4px 20px rgba(37,99,235,0.04)}
.school-card:hover .btn-access:after{transform:translateX(6px)}
.no-result{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:15px;grid-column:1/-1;background:rgba(255,255,255,0.02);border-radius:24px;border:1px solid rgba(56,189,248,0.04)}
.loading{text-align:center;padding:60px 20px;color:#5a6a7a;font-size:15px;display:flex;align-items:center;justify-content:center;gap:14px;grid-column:1/-1;background:rgba(255,255,255,0.02);border-radius:24px;border:1px solid rgba(56,189,248,0.04)}
.loading:before{content:"";width:24px;height:24px;border:2px solid rgba(56,189,248,0.06);border-top-color:#60a5fa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px 20px;color:#f87171;background:rgba(239,68,68,0.04);border-radius:24px;font-weight:500;border-left:3px solid #ef4444;grid-column:1/-1}
.school-card{opacity:0;animation:cardFadeIn 0.6s cubic-bezier(0.2,0.9,0.4,1) forwards}
.school-card:nth-child(1){animation-delay:0.03s}
.school-card:nth-child(2){animation-delay:0.06s}
.school-card:nth-child(3){animation-delay:0.09s}
.school-card:nth-child(4){animation-delay:0.12s}
.school-card:nth-child(5){animation-delay:0.15s}
.school-card:nth-child(6){animation-delay:0.18s}
.school-card:nth-child(7){animation-delay:0.21s}
.school-card:nth-child(8){animation-delay:0.24s}
.school-card:nth-child(9){animation-delay:0.27s}
.school-card:nth-child(10){animation-delay:0.30s}
@keyframes cardFadeIn{0%{opacity:0;transform:perspective(800px) rotateX(8deg) translateY(30px)}100%{opacity:1;transform:perspective(800px) rotateX(2deg) translateY(0)}}
html,body{overscroll-behavior:none;-webkit-overscroll-behavior:none;touch-action:pan-y}
@media(max-width:680px){.schools-grid{grid-template-columns:1fr;gap:14px}.school-card{padding:20px 20px 18px;min-height:180px;transform:perspective(800px) rotateX(0deg)}.school-card:hover{transform:perspective(800px) rotateX(0deg) rotateY(0deg) translateY(-4px)}.school-desc{padding-left:0;font-size:12px}.school-icon{width:40px;height:40px;font-size:18px}.school-name{font-size:16px}.school-name .prefix{font-size:13px}.header-title{font-size:17px}.header-title span{font-size:11px}.header-icon{width:38px;height:38px;font-size:17px}.btn-home{padding:6px 14px;font-size:12px}.search-input{padding:9px 14px 9px 42px;font-size:13px}.main-container{top:90px;padding:12px 16px 80px}.school-card{animation:cardFadeInMobile 0.5s cubic-bezier(0.2,0.9,0.4,1) forwards}@keyframes cardFadeInMobile{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}}
@media(max-width:420px){.school-card{min-height:160px;padding:14px 14px 12px}.school-desc{font-size:11px}.school-name{font-size:14px}.school-name .prefix{font-size:12px}.school-icon{width:34px;height:34px;font-size:14px}.btn-access{padding:5px 16px;font-size:11px}.main-container{top:85px;padding:8px 12px 80px}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="header-fixed">
<div class="header">
<div class="header-top">
<div class="header-left"><div class="header-icon">🏫</div><div class="header-title">Établissements <span>· sélection</span></div></div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
<div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off"><button class="search-clear" id="searchClear" aria-label="Effacer">✕</button></div>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"><div class="loading">Chargement des écoles…</div></div>
</div>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}return true});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.addEventListener('paste',function(e){e.preventDefault();return false});
document.querySelectorAll('img').forEach(function(img){img.addEventListener('contextmenu',function(e){e.preventDefault()});img.addEventListener('dragstart',function(e){e.preventDefault()})});
</script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs}from"firebase/firestore";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let allCards=[];
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(isPWA){const savedSchool=localStorage.getItem('pwa_school_id');if(savedSchool&&!window.location.search.includes('ecole')){const targetUrl=new URL('/',window.location.origin);targetUrl.searchParams.set('ecole',savedSchool);targetUrl.searchParams.set('from','pwa');targetUrl.searchParams.set('t',Date.now());window.location.href=targetUrl.toString();throw new Error('Redirection PWA')}}
const schoolDescriptions=["Excellence académique et formation intégrale.","Éducation moderne et innovation pédagogique.","Un cadre d'apprentissage exceptionnel.","École de référence pour les leaders de demain.","Enseignement de qualité et suivi personnalisé.","Tradition et modernité éducative.","Préparation à un avenir prometteur.","Pédagogie centrée sur l'élève.","Formation de citoyens responsables.","Programmes éducatifs innovants.","Excellence et encadrement de qualité.","École d'élite aux infrastructures modernes.","Réussite académique et épanouissement.","Enseignement adapté aux défis actuels.","Un environnement stimulant et sécurisé.","Excellence pédagogique reconnue.","Formation complète et humaine.","Innovation et tradition éducative.","Réussite et excellence pour tous.","Un cadre idéal pour apprendre.","Éducation d'excellence en RDC.","Des élèves préparés pour le futur.","Qualité et rigueur académique.","Une école qui forme des bâtisseurs.","Excellence, intégrité et réussite."];
async function chargerEcoles(){const container=document.getElementById('schoolsList');try{const snapshot=await getDocs(collection(db,"ecoles"));if(snapshot.empty){container.innerHTML='<div class="error">⚠️ Aucune école trouvée</div>';return}let total=0,active=0,inactive=0;const cardsData=[];let index=0;for(const docSnap of snapshot.docs){const ecole=docSnap.data();const prefixe=docSnap.id;const estActif=ecole.actif!==false;if(!estActif){inactive++;continue}total++;active++;index++;const nomSafe=(ecole.nom||prefixe||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const villeSafe=(ecole.ville||'').replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m});const descIndex=(index-1)%schoolDescriptions.length;const description=schoolDescriptions[descIndex];cardsData.push({html:'<div class="school-card" data-prefixe="'+prefixe+'" data-nom="'+nomSafe.toLowerCase()+'" data-ville="'+villeSafe.toLowerCase()+'" data-index="'+index+'"><div class="school-top"><div class="school-left"><span class="school-number">'+index+'</span><div class="school-icon">🏛️</div><div><div class="school-name"><span class="prefix">ÉCOLE</span> '+nomSafe+'</div></div></div><span class="school-status">● Actif</span></div><div class="school-desc">'+description+'</div><div class="school-bottom"><div class="school-meta"><span class="code">📋 '+prefixe+'</span><span class="location">📍 '+villeSafe+'</span></div><div class="btn-access">Accéder</div></div></div>',prefixe:prefixe,nom:nomSafe.toLowerCase(),ville:villeSafe.toLowerCase(),actif:estActif})}allCards=cardsData;renderCards(cardsData);setupSearch();setupClicks()}catch(error){container.innerHTML='<div class="error">❌ Erreur: '+error.message+'</div>';console.error(error)}}
function renderCards(cards){const container=document.getElementById('schoolsList');if(cards.length===0){container.innerHTML='<div class="no-result">🔍 Aucun établissement disponible</div>';return}container.innerHTML=cards.map(function(c){return c.html}).join('')}
function setupSearch(){const input=document.getElementById('searchInput');const clear=document.getElementById('searchClear');input.addEventListener('input',function(){const q=this.value.trim().toLowerCase();if(q.length>0){clear.style.display='block'}else{clear.style.display='none'}const filtered=allCards.filter(function(c){return c.nom.includes(q)||c.ville.includes(q)});renderCards(filtered);setupClicks()});clear.addEventListener('click',function(){document.getElementById('searchInput').value='';this.style.display='none';renderCards(allCards);setupClicks();document.getElementById('searchInput').focus()})}
function setupClicks(){document.querySelectorAll('.school-card').forEach(function(card){card.addEventListener('click',function(e){e.stopPropagation();const prefixe=this.getAttribute('data-prefixe');if(prefixe&&prefixe!=='null'&&prefixe!=='undefined'){localStorage.setItem('pwa_school_id',prefixe);localStorage.setItem('lastSchoolId',prefixe);const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;let targetUrl;if(isPWA){const baseUrl=new URL('/',window.location.origin);baseUrl.searchParams.set('ecole',prefixe);baseUrl.searchParams.set('from','pwa');baseUrl.searchParams.set('t',Date.now());targetUrl=baseUrl.toString()}else{targetUrl='/schooling?ecole='+encodeURIComponent(prefixe)}window.location.href=targetUrl}})})}
chargerEcoles();
</script>
</body>
</html>
