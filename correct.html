<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correcto Mobile</title>
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
<style>
  body { font-family: Arial; padding: 10px; background: #f4f4f4; }
 .container { background: white; padding: 15px; border-radius: 8px; }
  h2 { color: #2c3e50; font-size: 18px; }
  input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
  button { background: #27ae60; color: white; border: none; font-weight: bold; }
  button.test { background: #3498db; }
  video, canvas, img { width: 100%; border-radius: 8px; margin-top: 10px; }
  #status {color: #e67e22; font-weight: bold; text-align:center;}
  .note { font-size: 28px; font-weight: bold; color: #27ae60; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h2>📝 Correcto Mobile V4</h2>

  <b>1. Corrigé TEST</b>
  <input type="text" id="nomEpreuve" value="Test P1">
  <button onclick="sauverCorrigé()">💾 Sauvegarder Corrigé</button>

  <hr>
  <b>2. Corriger</b>
  <select id="selectCorrigé"></select>
  
  <button onclick="ouvrirCamera()">📷 Prendre Photo</button>
  <video id="video" autoplay style="display:none;"></video>
  <button id="btnPhoto" onclick="prendrePhoto()" style="display:none;">📸 Capturer</button>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="preview">

  <button id="btnCorriger" onclick="corriger()">🚀 Corriger</button>
  <div id="status"></div>
  <div id="resultat"></div>
</div>

<script>
let corriges = JSON.parse(localStorage.getItem('corriges')) || [];
let notes = [];
let imageBlob = null;

// On pré-remplit le corrigé test
if(corriges.length === 0){
  corriges.push({
    nom: "Test Français P1",
    questions: [
      {text: "Capitale RDC?", reponses: ["kinshasa"], points: 2},
      {text: "10 + 5?", reponses: ["15","quinze"], points: 2},
      {text: "Fleuve RDC?", reponses: ["congo","zambèze"], points: 1}
    ]
  });
  localStorage.setItem('corriges', JSON.stringify(corriges));
}

function sauverCorrigé(){ localStorage.setItem('corriges', JSON.stringify(corriges)); chargerSelect(); alert('Sauvé!'); }
function chargerSelect() {
  let sel = document.getElementById('selectCorrigé');
  sel.innerHTML = '';
  corriges.forEach((c, i) => sel.innerHTML += `<option value="${i}">${c.nom}</option>`);
}
chargerSelect();

async function ouvrirCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  document.getElementById('video').srcObject = stream;
  document.getElementById('video').style.display = 'block';
  document.getElementById('btnPhoto').style.display = 'block';
}

function prendrePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  imageBlob = canvas.toDataURL('image/png');
  document.getElementById('preview').src = imageBlob;
  video.srcObject.getTracks().forEach(track => track.stop());
  video.style.display = 'none';
  document.getElementById('btnPhoto').style.display = 'none';
}

async function corriger() {
  if(!imageBlob) return alert('Prends d\'abord une photo');
  const corrigéIndex = document.getElementById('selectCorrigé').value;
  
  document.getElementById('status').innerText = '⏳ Lecture... 10-20s sur mobile';
  const { data: { text } = await Tesseract.recognize(imageBlob, 'fra', {
    logger: m => document.getElementById('status').innerText = m.status + ' + Math.round(m.progress * 100) + '%'
  });

  const corrigé = corriges[corrigéIndex];
  let noteTotale = 0;
  let texteMinuscule = text.toLowerCase();
  corrigé.questions.forEach(q => {
    if(q.reponses.some(rep => texteMinuscule.includes(rep.trim()))) noteTotale += q.points;
  });

  document.getElementById('status').innerText = '✅ Terminé!';
  document.getElementById('resultat').innerHTML = `
    <p class="note">Note: ${noteTotale} / ${corrigé.questions.reduce((a,b)=>a+b.points,0)}</p>
    <p><b>Texte lu:</b><br><small>${text}</small></p>
  `;
}
</script>
</body>
</html>
