<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correcto IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial; padding: 10px; background: #f4f4f4; }
.container { background: white; padding: 15px; border-radius: 8px; max-width: 700px; margin:auto; }
  h2 { color: #2c3e50; }
  input, button, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
  button { background: #27ae60; color: white; border: none; font-weight: bold; }
  button:disabled { background: #95a5a6; }
  img { width: 100%; border-radius: 8px; margin-top: 10px; }
  #status {color: #e67e22; font-weight: bold; text-align:center;}
.note { font-size: 28px; font-weight: bold; color: #27ae60; text-align:center; }
.question { border: 1px dashed #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
  <h2>🤖 Correcto IA V6</h2>
  <p style="background:#d5f4e6; padding:10px;">100% en ligne. Prends photo → L’IA lit → L’IA corrige</p>

  <b>1. Remplis le Corrigé</b>
  <input type="text" id="nomEpreuve" placeholder="Nom: Interro Maths P1">
  <div id="questions">
    <div class="question">
      <input type="text" class="qText" placeholder="Q1: Capitale de la RDC">
      <input type="text" class="qRep" placeholder="Réponses: kinshasa">
      <input type="number" class="qPts" placeholder="Points" value="2">
    </div>
  </div>
  <button onclick="ajouterQuestion()">+ Ajouter Question</button>
  <button onclick="sauverCorrigé()">💾 Sauvegarder</button>

  <hr>
  <b>2. Corriger une copie</b>
  <select id="selectCorrigé"></select>
  <input type="file" id="imageInput" accept="image/*" capture="environment">
  <img id="preview" style="display:none;">

  <button id="btnCorriger" onclick="corriger()">🚀 Scanner & Corriger avec IA</button>
  <div id="status"></div>
  <div id="resultat"></div>
  <button onclick="exporterExcel()">📊 Exporter Excel</button>
</div>

<script>
let corriges = JSON.parse(localStorage.getItem('corriges')) || [];
let notes = [];

function ajouterQuestion() {
  document.getElementById('questions').innerHTML += `
    <div class="question">
      <input type="text" class="qText" placeholder="Question">
      <input type="text" class="qRep" placeholder="Réponses: rep1, rep2">
      <input type="number" class="qPts" placeholder="Points" value="1">
    </div>`;
}

function sauverCorrigé() {
  let nom = document.getElementById('nomEpreuve').value;
  if(!nom) return alert('Donne un nom');
  let questions = [];
  document.querySelectorAll('.question').forEach(q => {
    questions.push({
      text: q.querySelector('.qText').value,
      reponses: q.querySelector('.qRep').value.toLowerCase().split(','),
      points: parseFloat(q.querySelector('.qPts').value)
    });
  });
  corriges.push({nom, questions});
  localStorage.setItem('corriges', JSON.stringify(corriges));
  chargerSelect();
  alert('Corrigé sauvé!');
}

function chargerSelect() {
  let sel = document.getElementById('selectCorrigé');
  sel.innerHTML = '<option value="">Choisis un corrigé</option>';
  corriges.forEach((c, i) => sel.innerHTML += `<option value="${i}">${c.nom}</option>`);
}
chargerSelect();

document.getElementById('imageInput').onchange = e => {
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('preview').src = reader.result;
    document.getElementById('preview').style.display = 'block';
  }
  reader.readAsDataURL(e.target.files[0]);
}

async function corriger() {
  const file = document.getElementById('imageInput').files[0];
  const corrigéIndex = document.getElementById('selectCorrigé').value;
  if(!file) return alert('Choisis une photo');
  if(corrigéIndex === '') return alert('Choisis un corrigé');

  const btn = document.getElementById('btnCorriger');
  btn.disabled = true;
  document.getElementById('status').innerText = '⏳ L’IA lit la copie... 5-10s';

  const base64 = await toBase64(file);
  const corrigé = corriges[corrigéIndex];

  // On envoie l'image + le corrigé à l'IA
  const prompt = `Tu es un correcteur. Voici le corrigé:
${corrigé.questions.map((q,i)=>`Q${i+1}: ${q.text}. Réponses acceptées: ${q.reponses.join(', ')}. Points: ${q.points}`).join('\n')}

Analyse cette image de copie d'élève.
Pour chaque question, dis si la réponse est correcte ou pas selon les réponses acceptées.
Donne la note totale sur ${corrigé.questions.reduce((a,b)=>a+b.points,0)}.
Sois indulgent sur l'orthographe. Réponds en JSON: {"note": X, "details": ["Q1: correct", "Q2: faux"], "texte_lu": "..."}`;

  try {
    // Appel à l'IA
    const response = await fetch("https://api.meta.ai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "meta-ai-vision",
        messages: [
          { role: "user", content: [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: base64 } }
          ]}
        ]
      })
    });

    const data = await response.json();
    const result = JSON.parse(data.choices[0].message.content);

    document.getElementById('status').innerText = '✅ Terminé!';
    document.getElementById('resultat').innerHTML = `
      <p class="note">Note: ${result.note} / ${corrigé.questions.reduce((a,b)=>a+b.points,0)}</p>
      <p><b>Détails:</b><br>${result.details.join('<br>')}</p>
      <p><b>Texte lu par l'IA:</b><br><small>${result.texte_lu}</small></p>
    `;
    notes.push({eleve: 'Eleve '+ (notes.length+1), note: result.note});

  } catch(e) {
    document.getElementById('status').innerText = 'Erreur: ' + e.message;
  }
  btn.disabled = false;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

function exporterExcel() {
  if(notes.length === 0) return alert('Corrige d\'abord');
  const ws = XLSX.utils.json_to_sheet(notes);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Notes");
  XLSX.writeFile(wb, "notes.xlsx");
}
</script>
</body>
</html>
