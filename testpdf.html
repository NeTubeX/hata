<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PDF Fiche de Cotation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #0a1e3d; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 24px; }
        .preview-area { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e5e7eb; min-height: 100px; }
        .preview-area .placeholder { color: #9ca3af; text-align: center; padding: 30px; }
        .btn { background: #0a1e3d; color: white; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #1a3a6d; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10,30,61,0.3); }
        .btn:active { transform: translateY(0); }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; margin: 16px 0; }
        .col { flex: 1; min-width: 200px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #0a1e3d; box-shadow: 0 0 0 3px rgba(10,30,61,0.1); }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-gold { background: #fef3c7; color: #92400e; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; margin: 16px 0; padding: 16px; background: #f8fafc; border-radius: 8px; }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .stat-item strong { color: #0a1e3d; }
        .pdf-preview { width: 100%; height: 500px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; display: none; }
        .pdf-preview.show { display: block; }
        .pdf-preview iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
        .info-box { background: #f0f9ff; border-left: 4px solid #0a1e3d; padding: 16px; border-radius: 8px; margin: 12px 0; }
        .info-box h4 { color: #0a1e3d; margin-bottom: 4px; }
        .info-box p { color: #4b5563; font-size: 14px; }
        .eleves-list { max-height: 200px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; }
        .eleve-item { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
        .eleve-item:last-child { border-bottom: none; }
        .eleve-item .name { font-weight: 500; color: #1f2937; }
        .eleve-item .sexe { color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Test PDF - Fiche de Cotation</h1>
        <p class="subtitle">Vérifiez le design professionnel du PDF avant intégration</p>

        <div class="info-box">
            <h4>🏫 Complexe Scolaire Test</h4>
            <p>Année scolaire 2026-2027 • Gestion de scolarité</p>
        </div>

        <div class="row">
            <div class="col">
                <label>📚 Cours</label>
                <input type="text" id="coursInput" value="Mathématiques">
            </div>
            <div class="col">
                <label>📌 Classe</label>
                <select id="classeInput">
                    <option value="7ème EB">7ème EB</option>
                    <option value="8ème EB">8ème EB</option>
                    <option value="1ère Année" selected>1ère Année</option>
                    <option value="2ème Année">2ème Année</option>
                    <option value="3ème Année">3ème Année</option>
                    <option value="4ème Année">4ème Année</option>
                </select>
            </div>
            <div class="col">
                <label>📂 Option</label>
                <select id="optionInput">
                    <option value="">Aucune</option>
                    <option value="LATIN-PHILO">Latin-Philo</option>
                    <option value="SCIENCES" selected>Biochimie</option>
                    <option value="COMMERCIALE ET GESTION">Commerciale</option>
                    <option value="ELECTRICITE">Électricité</option>
                    <option value="TOUTES">Toutes options</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>👨‍🏫 Titulaire</label>
                <input type="text" id="titulaireInput" value="M. KASONGO Jean">
            </div>
            <div class="col">
                <label>📊 Note max / période</label>
                <input type="number" id="pMaxInput" value="20" min="10" max="40">
            </div>
            <div class="col">
                <label>📅 Référence</label>
                <input type="text" id="refInput" value="F001">
            </div>
        </div>

        <div style="margin: 16px 0;">
            <label>👥 Élèves (10 exemples)</label>
            <div class="eleves-list" id="elevesList"></div>
        </div>

        <div class="stats">
            <div class="stat-item"><strong>👥 Effectif :</strong> <span id="eleveCount">10</span> élèves</div>
            <div class="stat-item"><strong>📊 Périodes :</strong> 4</div>
            <div class="stat-item"><strong>📝 Épreuves :</strong> 2 par période</div>
            <div class="stat-item"><span class="badge badge-blue">P1/P2/P3/P4</span></div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0;">
            <button class="btn" id="generatePdfBtn">📄 Générer le PDF</button>
            <button class="btn btn-success" id="downloadPdfBtn">⬇️ Télécharger le PDF</button>
        </div>

        <div id="pdfPreviewContainer" class="pdf-preview">
            <iframe id="pdfPreviewFrame"></iframe>
        </div>

        <div style="margin-top: 20px; padding: 16px; background: #fef2f2; border-radius: 8px; border-left: 4px solid #ef4444; display: none;" id="errorBox">
            <p style="color: #991b1b; font-size: 14px;">❌ <span id="errorMessage">Erreur lors de la génération</span></p>
        </div>
    </div>

    <script>
        // ===== DONNÉES EXEMPLES =====
        const prenoms = ['Jean', 'Marie', 'Pierre', 'Paul', 'Jacques', 'André', 'Michel', 'Joseph', 'Antoine', 'Daniel'];
        const noms = ['KASONGO', 'MULUMBA', 'KABEYA', 'TSHIBANGU', 'KALALA', 'MUTOMBO', 'KANDA', 'MPOYI', 'KABONGO', 'LUKUSA'];
        const sexes = ['M', 'M', 'F', 'M', 'F', 'M', 'F', 'M', 'F', 'M'];

        function generateEleves(nb = 10) {
            const eleves = [];
            for (let i = 0; i < nb; i++) {
                const nom = noms[i % noms.length];
                const prenom = prenoms[i % prenoms.length];
                const sexe = sexes[i % sexes.length];
                eleves.push({
                    nom: nom + ' ' + prenom,
                    sexe: sexe,
                    notes: {
                        p1: [12 + Math.random() * 8, 10 + Math.random() * 10],
                        p2: [11 + Math.random() * 9, 9 + Math.random() * 11],
                        p3: [13 + Math.random() * 7, 11 + Math.random() * 9],
                        p4: [12 + Math.random() * 8, 10 + Math.random() * 10],
                        exam1: Math.round((10 + Math.random() * 10) * 2) / 2,
                        exam2: Math.round((10 + Math.random() * 10) * 2) / 2
                    }
                });
            }
            return eleves;
        }

        const epreuvesParPeriode = {
            1: [{ nom: 'Interro 1', max: 20 }, { nom: 'Devoir 1', max: 20 }],
            2: [{ nom: 'Interro 2', max: 20 }, { nom: 'Devoir 2', max: 20 }],
            3: [{ nom: 'Interro 3', max: 20 }, { nom: 'Devoir 3', max: 20 }],
            4: [{ nom: 'Interro 4', max: 20 }, { nom: 'Devoir 4', max: 20 }]
        };

        let elevesData = generateEleves(10);
        let pdfDoc = null;

        // ===== AFFICHAGE DES ÉLÈVES =====
        function renderEleves() {
            const container = document.getElementById('elevesList');
            container.innerHTML = '';
            elevesData.forEach((e, i) => {
                const div = document.createElement('div');
                div.className = 'eleve-item';
                div.innerHTML = `
                    <span class="name">${e.nom}</span>
                    <span class="sexe">${e.sexe === 'F' ? '👩 F' : '👨 M'}</span>
                `;
                container.appendChild(div);
            });
            document.getElementById('eleveCount').textContent = elevesData.length;
        }
        renderEleves();

        // ===== FONCTIONS DE CALCUL =====
        function calcMoy(periode, notes, eps, pMax) {
            const e = eps[periode] || [];
            if (!e.length || !notes || !notes.length) return 0;
            let sumN = 0, sumM = 0;
            for (let i = 0; i < e.length; i++) {
                sumN += (notes[i] || 0);
                sumM += (e[i].max || 1);
            }
            return sumM ? Math.min(pMax, Math.round((sumN / sumM) * pMax)) : 0;
        }

        function getNotesForEleve(eleve, eps, pMax) {
            const p1 = calcMoy(1, eleve.notes?.p1 || [], eps, pMax);
            const p2 = calcMoy(2, eleve.notes?.p2 || [], eps, pMax);
            const p3 = calcMoy(3, eleve.notes?.p3 || [], eps, pMax);
            const p4 = calcMoy(4, eleve.notes?.p4 || [], eps, pMax);
            const exam1 = eleve.notes?.exam1 || 0;
            const exam2 = eleve.notes?.exam2 || 0;
            return { p1, p2, p3, p4, exam1, exam2 };
        }

        // ===== GÉNÉRATION PDF PROFESSIONNEL =====
        async function generateProPDF() {
            const cours = document.getElementById('coursInput').value || 'Mathématiques';
            const classe = document.getElementById('classeInput').value || '1ère Année';
            const option = document.getElementById('optionInput').value || '';
            const titulaire = document.getElementById('titulaireInput').value || 'Non spécifié';
            const pMax = parseInt(document.getElementById('pMaxInput').value) || 20;
            const refNum = document.getElementById('refInput').value || 'F001';
            const schoolName = 'COMPLEXE SCOLAIRE TEST';

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const pageW = 297, pageH = 210;

            // ===== FOND =====
            pdf.setFillColor(248, 250, 252);
            pdf.rect(0, 0, pageW, pageH, 'F');

            // ===== BANDE SUPÉRIEURE =====
            pdf.setFillColor(10, 30, 60);
            pdf.rect(0, 0, pageW, 38, 'F');

            // ===== NOM ÉCOLE =====
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(18);
            pdf.setTextColor(255, 215, 0);
            pdf.text('🏫 ' + schoolName, 148, 20, { align: 'center' });

            pdf.setFontSize(10);
            pdf.setTextColor(200, 200, 200);
            pdf.text('GESTION SCOLAIRE • ANNÉE 2026-2027', 148, 30, { align: 'center' });

            // ===== TITRE =====
            pdf.setFillColor(255, 255, 255);
            pdf.roundedRect(20, 42, 257, 12, 3, 3, 'F');
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(14);
            pdf.setTextColor(10, 30, 60);
            pdf.text('📋 FICHE DE COTATION INDIVIDUELLE', 148, 51, { align: 'center' });

            // ===== INFOS =====
            let y = 62;
            pdf.setFillColor(240, 245, 250);
            pdf.roundedRect(20, y, 257, 32, 4, 4, 'F');
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(9);
            pdf.setTextColor(50, 50, 50);

            const infos = [
                ['Réf:', refNum, 'Cours:', cours],
                ['Classe:', classe + (option ? ' (' + option + ')' : ''), 'Titulaire:', titulaire],
                ['Date:', new Date().toLocaleDateString('fr-FR'), 'Note max:', pMax + '/20']
            ];

            let yInfo = y + 8;
            infos.forEach(row => {
                let x = 30;
                row.forEach((text, i) => {
                    pdf.setFont('helvetica', i % 2 === 0 ? 'bold' : 'normal');
                    pdf.text(text, x, yInfo);
                    x += pdf.getStringUnitWidth(text) * 9 * 0.35 + (i % 2 === 0 ? 3 : 28);
                });
                yInfo += 9;
            });

            // ===== PRÉPARATION TABLEAU =====
            const startY = 102;
            const eps = epreuvesParPeriode;

            // Construction des colonnes
            const cols = [
                { id: 'num', title: 'N°', w: 10 },
                { id: 'nom', title: 'NOM & PRÉNOM', w: 32 },
                { id: 'sexe', title: 'S', w: 8 },
                // P1
                ...eps[1].map((ep, i) => ({ id: 'p1_' + i, title: 'P1-' + (i+1), w: 12, max: ep.max })),
                { id: 'moy1', title: 'M1', w: 12, max: pMax, highlight: true },
                // P2
                ...eps[2].map((ep, i) => ({ id: 'p2_' + i, title: 'P2-' + (i+1), w: 12, max: ep.max })),
                { id: 'moy2', title: 'M2', w: 12, max: pMax, highlight: true },
                // EXAM S1
                { id: 'exam1', title: 'EX1', w: 12, max: pMax*2 },
                { id: 'ts1', title: 'TS1', w: 13, max: pMax*4, highlight: true },
                // P3
                ...eps[3].map((ep, i) => ({ id: 'p3_' + i, title: 'P3-' + (i+1), w: 12, max: ep.max })),
                { id: 'moy3', title: 'M3', w: 12, max: pMax, highlight: true },
                // P4
                ...eps[4].map((ep, i) => ({ id: 'p4_' + i, title: 'P4-' + (i+1), w: 12, max: ep.max })),
                { id: 'moy4', title: 'M4', w: 12, max: pMax, highlight: true },
                // EXAM S2
                { id: 'exam2', title: 'EX2', w: 12, max: pMax*2 },
                { id: 'ts2', title: 'TS2', w: 13, max: pMax*4, highlight: true },
                { id: 'total', title: 'TOTAL', w: 15, max: pMax*8, highlight: true }
            ];

            let totalW = 0;
            cols.forEach(c => totalW += c.w);
            const xStart = (pageW - totalW - 40) / 2 + 20;
            let cx = xStart;
            cols.forEach(c => { c.x = cx; cx += c.w; });

            // ===== EN-TÊTE =====
            let cy = startY;
            const headerH = 12;

            // Fond bleu
            pdf.setFillColor(10, 30, 60);
            pdf.rect(xStart, cy, totalW, headerH, 'F');

            // Texte
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(7);
            pdf.setTextColor(255, 255, 255);
            cols.forEach(c => {
                const centerX = c.x + c.w / 2;
                pdf.text(c.title, centerX, cy + 7.5, { align: 'center', maxWidth: c.w - 2 });
            });

            cy += headerH;

            // ===== LIGNE DES MAX =====
            pdf.setFillColor(230, 240, 250);
            pdf.rect(xStart, cy, totalW, 6, 'F');
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(5.5);
            pdf.setTextColor(80, 80, 80);
            cols.forEach(c => {
                if (c.max) {
                    pdf.text('/' + c.max, c.x + c.w/2, cy + 4.5, { align: 'center' });
                }
            });
            cy += 6;

            // ===== LIGNES ÉLÈVES =====
            const rowH = 9;
            const eleves = elevesData.slice(0, 18);

            let rowIdx = 0;
            for (const eleve of eleves) {
                const isAlt = rowIdx % 2 === 0;
                pdf.setFillColor(isAlt ? 255 : 248, isAlt ? 255 : 250, isAlt ? 255 : 252);
                pdf.rect(xStart, cy, totalW, rowH, 'F');

                const notes = getNotesForEleve(eleve, eps, pMax);
                const notesP1 = eleve.notes?.p1 || [0, 0];
                const notesP2 = eleve.notes?.p2 || [0, 0];
                const notesP3 = eleve.notes?.p3 || [0, 0];
                const notesP4 = eleve.notes?.p4 || [0, 0];

                pdf.setFont('helvetica', 'normal');
                pdf.setFontSize(7);
                pdf.setTextColor(30, 30, 50);

                let ci = 0;
                for (const c of cols) {
                    let val = '';
                    let color = [30, 30, 50];
                    let bold = false;

                    switch(c.id) {
                        case 'num': val = (rowIdx + 1).toString(); break;
                        case 'nom': val = eleve.nom || ''; bold = true; break;
                        case 'sexe': val = eleve.sexe === 'F' ? 'F' : 'M'; break;
                        case 'p1_0': val = notesP1[0] || 0; break;
                        case 'p1_1': val = notesP1[1] || 0; break;
                        case 'moy1': val = notes.p1; color = [10, 30, 60]; bold = true; break;
                        case 'p2_0': val = notesP2[0] || 0; break;
                        case 'p2_1': val = notesP2[1] || 0; break;
                        case 'moy2': val = notes.p2; color = [10, 30, 60]; bold = true; break;
                        case 'exam1': val = notes.exam1; break;
                        case 'ts1': val = notes.p1 + notes.p2 + notes.exam1; color = [180, 83, 9]; bold = true; break;
                        case 'p3_0': val = notesP3[0] || 0; break;
                        case 'p3_1': val = notesP3[1] || 0; break;
                        case 'moy3': val = notes.p3; color = [10, 30, 60]; bold = true; break;
                        case 'p4_0': val = notesP4[0] || 0; break;
                        case 'p4_1': val = notesP4[1] || 0; break;
                        case 'moy4': val = notes.p4; color = [10, 30, 60]; bold = true; break;
                        case 'exam2': val = notes.exam2; break;
                        case 'ts2': val = notes.p3 + notes.p4 + notes.exam2; color = [180, 83, 9]; bold = true; break;
                        case 'total': val = notes.p1 + notes.p2 + notes.p3 + notes.p4 + notes.exam1 + notes.exam2; color = [10, 30, 60]; bold = true; break;
                    }

                    if (val === 0 && !['num', 'nom', 'sexe'].includes(c.id)) val = '-';

                    pdf.setFont('helvetica', bold ? 'bold' : 'normal');
                    if (color) pdf.setTextColor(color[0], color[1], color[2]);
                    if (c.highlight) {
                        pdf.setFillColor(255, 248, 230);
                        pdf.rect(c.x, cy, c.w, rowH, 'F');
                    }
                    pdf.text(val.toString(), c.x + c.w/2, cy + 6, { align: 'center' });

                    pdf.setTextColor(30, 30, 50);
                    pdf.setFont('helvetica', 'normal');
                }

                cy += rowH;
                rowIdx++;
            }

            // ===== PIED =====
            const footY = pageH - 12;
            pdf.setDrawColor(200, 200, 200);
            pdf.setLineWidth(0.3);
            pdf.line(20, footY, pageW - 20, footY);

            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(7);
            pdf.setTextColor(150, 150, 150);
            pdf.text('Document généré le ' + new Date().toLocaleString('fr-FR'), 20, footY + 6);
            pdf.text('Page 1/1', pageW - 25, footY + 6);
            pdf.text('Service Scolarité - NeTubeX SARL', 148, footY + 6, { align: 'center' });

            return pdf;
        }

        // ===== ACTIONS =====
        document.getElementById('generatePdfBtn').addEventListener('click', async function() {
            const btn = this;
            btn.textContent = '⏳ Génération...';
            btn.disabled = true;
            document.getElementById('errorBox').style.display = 'none';

            try {
                pdfDoc = await generateProPDF();
                const previewContainer = document.getElementById('pdfPreviewContainer');
                previewContainer.classList.add('show');

                // Afficher dans l'iframe
                const iframe = document.getElementById('pdfPreviewFrame');
                const blob = pdfDoc.output('blob');
                const url = URL.createObjectURL(blob);
                iframe.src = url;

                btn.textContent = '✅ PDF généré !';
                setTimeout(() => { btn.textContent = '📄 Générer le PDF'; }, 2000);
                btn.disabled = false;

            } catch (error) {
                document.getElementById('errorBox').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message;
                btn.textContent = '❌ Erreur';
                setTimeout(() => { btn.textContent = '📄 Générer le PDF'; }, 2000);
                btn.disabled = false;
                console.error(error);
            }
        });

        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            if (!pdfDoc) {
                document.getElementById('errorBox').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Veuillez d\'abord générer le PDF.';
                return;
            }
            const cours = document.getElementById('coursInput').value || 'cours';
            const classe = document.getElementById('classeInput').value || 'classe';
            pdfDoc.save('Fiche_' + cours + '_' + classe + '.pdf');
        });

        // Mise à jour des élèves
        document.getElementById('classeInput').addEventListener('change', function() {
            const count = this.value.includes('EB') ? 8 : 10;
            elevesData = generateEleves(count);
            renderEleves();
        });

        console.log('✅ Application de test chargée. Cliquez sur "Générer le PDF" pour voir le résultat.');
    </script>
</body>
</html>
