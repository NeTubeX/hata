<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>Sélecteur d'écoles · NETUBEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e8edf5;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow-x:hidden;}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1a2335 100%);}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(circle at 30% 40%,rgba(59,130,246,0.06),transparent 70%);}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none;}
.particle{position:absolute;width:4px;height:4px;background:rgba(59,130,246,0.08);border-radius:50%;animation:float linear infinite;}
@keyframes float{0%{transform:translateY(100vh) rotate(0deg) scale(0);opacity:0;}10%{opacity:0.6;transform:scale(1);}90%{opacity:0.6;}100%{transform:translateY(-10vh) rotate(720deg) scale(0);opacity:0;}}
.main-container{width:100%;max-width:1100px;padding:40px 24px;position:relative;z-index:1;animation:fadeInUp 0.8s ease-out;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:48px;padding:16px 24px;background:rgba(18,18,31,0.6);border-radius:16px;border:1px solid rgba(59,130,246,0.08);backdrop-filter:blur(12px);}
.header .logo{display:flex;align-items:center;gap:12px;}
.header .logo .icon{width:44px;height:44px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;}
.header .logo h1{font-size:20px;font-weight:700;color:#e8edf5;}
.header .logo h1 span{color:#3b82f6;}
.header .logo .sub{font-size:11px;color:#94a3b8;font-weight:400;display:block;}
.header .home-btn{display:flex;align-items:center;gap:8px;padding:8px 20px;border-radius:30px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.08);color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;transition:all 0.3s;cursor:pointer;}
.header .home-btn:hover{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.15);color:#e8edf5;transform:translateY(-2px);}
.header .home-btn i{font-size:14px;}
.header .contact-btn{display:flex;align-items:center;gap:8px;padding:8px 20px;border-radius:30px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:all 0.3s;cursor:pointer;}
.header .contact-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(59,130,246,0.25);}
.header .contact-btn i{font-size:14px;}
.hero{text-align:center;padding:50px 20px 40px;margin-bottom:30px;animation:fadeInUp 0.8s ease-out 0.2s both;}
.hero .badge{display:inline-block;background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.1);padding:4px 18px;border-radius:20px;font-size:11px;font-weight:600;color:#60a5fa;letter-spacing:0.3px;margin-bottom:16px;}
.hero .badge i{margin-right:6px;}
.hero h2{font-size:3.6rem;font-weight:900;line-height:1.1;margin-bottom:14px;color:#e8edf5;}
.hero h2 span{color:#3b82f6;}
.hero p{font-size:1.2rem;color:#94a3b8;max-width:650px;margin:0 auto 16px;font-weight:300;line-height:1.7;}
.hero .school-count{display:inline-block;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.1);padding:6px 24px;border-radius:30px;font-size:13px;font-weight:500;color:#34d399;margin-bottom:20px;}
.hero .school-count i{margin-right:8px;}
.hero .loading-status{padding:12px 24px;border-radius:12px;margin:16px auto;max-width:500px;font-weight:500;display:none;}
.hero .loading-status.loading{display:block;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.1);color:#94a3b8;}
.hero .loading-status .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(59,130,246,0.15);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:30px;animation:fadeInUp 0.8s ease-out 0.4s both;}
.school-card{background:rgba(18,18,31,0.6);border:1px solid rgba(59,130,246,0.08);border-radius:16px;padding:20px 24px;transition:all 0.4s;backdrop-filter:blur(4px);cursor:pointer;position:relative;overflow:hidden;}
.school-card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(59,130,246,0.02),transparent);opacity:0;transition:opacity 0.4s;}
.school-card:hover{background:rgba(18,18,31,0.85);border-color:rgba(59,130,246,0.2);transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.school-card:hover::before{opacity:1;}
.school-card .school-icon{font-size:2.2rem;margin-bottom:8px;display:block;}
.school-card .school-name{font-size:1.1rem;font-weight:700;color:#e8edf5;margin-bottom:4px;}
.school-card .school-detail{font-size:0.75rem;color:#94a3b8;font-weight:300;display:flex;gap:12px;flex-wrap:wrap;}
.school-card .school-detail span{display:flex;align-items:center;gap:4px;}
.school-card .school-badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:0.65rem;font-weight:600;margin-top:8px;}
.school-card .school-badge.gesco{background:rgba(59,130,246,0.15);color:#60a5fa;}
.school-card .school-badge.money{background:rgba(251,191,36,0.15);color:#fbbf24;}
.school-card .school-badge.unknown{background:rgba(239,68,68,0.15);color:#f87171;}
.school-card .school-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#3b82f6;font-size:1.2rem;opacity:0;transition:all 0.3s;}
.school-card:hover .school-arrow{opacity:1;transform:translateY(-50%) translateX(4px);}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
.empty-state .icon{font-size:3rem;display:block;margin-bottom:12px;opacity:0.3;}
.footer{margin-top:40px;padding:16px 0;border-top:1px solid rgba(59,130,246,0.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;animation:fadeIn 1s ease-out 0.8s both;}
.footer .copy{font-size:0.75rem;color:#4a5568;}
.footer .links{display:flex;gap:16px;}
.footer .links a{color:#4a5568;font-size:0.75rem;text-decoration:none;transition:0.2s;cursor:pointer;}
.footer .links a:hover{color:#94a3b8;}
.footer .phone{display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:#60a5fa;}
.footer .phone i{font-size:0.9rem;}
@media(max-width:768px){.hero h2{font-size:2.2rem;}.schools-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.hero h2{font-size:1.6rem;}.schools-grid{grid-template-columns:1fr;}.header .logo h1{font-size:16px;}.header .home-btn,.header .contact-btn{padding:6px 14px;font-size:12px;}.school-card{padding:16px 18px;}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="particles" id="particles"></div>
<div class="main-container">
<div class="header">
<div class="logo">
<div class="icon">NX</div>
<div>
<h1>NETUBEX</h1>
<span class="sub">Sélecteur d'écoles</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
<a href="https://www.netubex.com/index" class="home-btn"><i class="fas fa-home"></i> Accueil</a>
<a href="tel:+243976953045" class="contact-btn"><i class="fas fa-phone-alt"></i> +243 976 953 045</a>
</div>
</div>
<div class="hero">
<div class="badge"><i class="fas fa-school"></i> Choisissez votre école</div>
<h2>Sélecteur d'<span>écoles</span></h2>
<p>Sélectionnez votre établissement pour accéder à votre espace.</p>
<div class="school-count" id="schoolCount"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
<div id="loadingStatus" class="loading-status loading">
<span class="spinner"></span> Chargement des écoles...
</div>
</div>
<div id="schoolsContainer" class="schools-grid">
<div class="empty-state"><span class="icon">🏫</span><p>Aucune école trouvée</p></div>
</div>
<div class="footer">
<div class="copy">© 2026 NETUBEX SARL — RDC</div>
<div class="phone"><i class="fas fa-phone-alt"></i> +243 976 953 045</div>
<div class="links">
<a href="https://www.netubex.com/index">Accueil</a>
<a href="#" onclick="event.preventDefault();">À propos</a>
</div>
</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, query, where } from "firebase/firestore";

// ============================================================
// PROJET 1: GESCO (gesco-67c43) - Écoles existantes
// ============================================================
const firebaseConfigGesco = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f",
  measurementId: "G-V7MF88Y5EE"
};

// ============================================================
// PROJET 2: NETUBEXMONEY (netubexmoney) - Nouvelles écoles
// ============================================================
const firebaseConfigMoney = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  databaseURL: "https://netubexmoney-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

// Initialisation des deux applications
const appGesco = initializeApp(firebaseConfigGesco, "gesco");
const appMoney = initializeApp(firebaseConfigMoney, "money");

const dbGesco = getFirestore(appGesco);
const dbMoney = getFirestore(appMoney);

const schoolsContainer = document.getElementById('schoolsContainer');
const schoolCount = document.getElementById('schoolCount');
const loadingStatus = document.getElementById('loadingStatus');

// ============================================================
// RÉCUPÉRATION DES ÉCOLES DES DEUX PROJETS
// ============================================================
async function getAllSchools() {
    const allSchools = [];
    const seenIds = new Set();

    try {
        // 1. Écoles GESCO
        const snapGesco = await getDocs(collection(dbGesco, "ecoles"));
        snapGesco.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            if (!seenIds.has(id)) {
                seenIds.add(id);
                allSchools.push({
                    id: id,
                    nom: data.nom || id,
                    province: data.province || '',
                    ville: data.ville || '',
                    actif: data.actif !== false,
                    projet: 'GESCO',
                    data: data
                });
            }
        });
    } catch (e) {
        console.error("Erreur GESCO:", e);
    }

    try {
        // 2. Écoles NETUBEXMONEY
        const snapMoney = await getDocs(collection(dbMoney, "ecoles"));
        snapMoney.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            if (!seenIds.has(id)) {
                seenIds.add(id);
                allSchools.push({
                    id: id,
                    nom: data.nom || id,
                    province: data.province || '',
                    ville: data.ville || '',
                    actif: data.actif !== false,
                    projet: 'NETUBEXMONEY',
                    data: data
                });
            }
        });
    } catch (e) {
        console.error("Erreur NETUBEXMONEY:", e);
    }

    // Trier par nom
    allSchools.sort((a, b) => a.nom.localeCompare(b.nom));
    return allSchools;
}

// ============================================================
// AFFICHAGE DES ÉCOLES
// ============================================================
function displaySchools(schools) {
    if (schools.length === 0) {
        schoolsContainer.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <span class="icon">🏫</span>
                <p>Aucune école trouvée</p>
                <p style="font-size:0.8rem;margin-top:4px;">Contactez le support pour ajouter votre école</p>
            </div>
        `;
        schoolCount.innerHTML = '<i class="fas fa-school"></i> 0 école';
        return;
    }

    const gescoCount = schools.filter(s => s.projet === 'GESCO').length;
    const moneyCount = schools.filter(s => s.projet === 'NETUBEXMONEY').length;

    schoolCount.innerHTML = `
        <i class="fas fa-school"></i> 
        ${schools.length} école${schools.length > 1 ? 's' : ''}
        <span style="font-weight:300;margin-left:6px;font-size:0.8rem;color:#94a3b8;">
            (GESCO: ${gescoCount} · NETUBEXMONEY: ${moneyCount})
        </span>
    `;

    let html = '';
    schools.forEach(school => {
        const badgeClass = school.projet === 'GESCO' ? 'gesco' : 'money';
        const badgeLabel = school.projet === 'GESCO' ? '🔵 GESCO' : '🟡 NETUBEXMONEY';
        const statusIcon = school.actif ? '✅' : '⛔';
        const statusText = school.actif ? 'Actif' : 'Inactif';
        const detailParts = [];
        if (school.province) detailParts.push(`📍 ${school.province}`);
        if (school.ville) detailParts.push(`🏙️ ${school.ville}`);

        html += `
            <div class="school-card" data-id="${school.id}" data-projet="${school.projet}">
                <span class="school-icon">🏫</span>
                <div class="school-name">${escapeHtml(school.nom)}</div>
                <div class="school-detail">
                    <span>🆔 ${escapeHtml(school.id)}</span>
                    ${detailParts.length > 0 ? `<span>${detailParts.join(' · ')}</span>` : ''}
                    <span>${statusIcon} ${statusText}</span>
                </div>
                <div>
                    <span class="school-badge ${badgeClass}">${badgeLabel}</span>
                </div>
                <span class="school-arrow"><i class="fas fa-arrow-right"></i></span>
            </div>
        `;
    });

    schoolsContainer.innerHTML = html;

    // ============================================================
    // CLIC SUR UNE ÉCOLE → REDIRECTION
    // ============================================================
    document.querySelectorAll('.school-card').forEach(card => {
        card.addEventListener('click', function() {
            const id = this.dataset.id;
            const projet = this.dataset.projet;

            if (projet === 'GESCO') {
                // 🔵 GESCO → /schooling?ecole=ID (Espace Professeur)
                window.location.href = `https://www.netubex.com/schooling?ecole=${encodeURIComponent(id)}`;
            } else if (projet === 'NETUBEXMONEY') {
                // 🟡 NETUBEXMONEY → /schoolingspec?ecole=ID (puis Direction)
                window.location.href = `https://www.netubex.com/schoolingspec?ecole=${encodeURIComponent(id)}`;
            }
        });
    });
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// CHARGEMENT
// ============================================================
async function loadSchools() {
    loadingStatus.className = 'loading-status loading';
    loadingStatus.innerHTML = '<span class="spinner"></span> Chargement des écoles...';
    schoolsContainer.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
            <span class="icon">⏳</span>
            <p>Chargement...</p>
        </div>
    `;

    try {
        const schools = await getAllSchools();
        loadingStatus.style.display = 'none';
        displaySchools(schools);
    } catch (error) {
        console.error("Erreur:", error);
        loadingStatus.className = 'loading-status';
        loadingStatus.style.display = 'none';
        schoolsContainer.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <span class="icon">❌</span>
                <p>Erreur de chargement</p>
                <p style="font-size:0.8rem;margin-top:4px;">${error.message}</p>
                <button onclick="location.reload()" style="margin-top:12px;padding:8px 24px;border-radius:30px;background:#3b82f6;color:#fff;border:none;cursor:pointer;font-weight:600;">⟳ Réessayer</button>
            </div>
        `;
    }
}

// ============================================================
// PARTICLES
// ============================================================
(function(){
    const container = document.getElementById('particles');
    if (!container) return;
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (Math.random() * 3 + 1) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (Math.random() * 20 + 12) + 's';
        p.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(p);
    }
})();

// ============================================================
// LANCEMENT
// ============================================================
loadSchools();

// ============================================================
// SÉCURITÉ
// ============================================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('keydown', function(e){
    if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false;}
    if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false;}
    if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false;}
    return true;
});
</script>
</body>
</html>
