<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>Sélecteur d'écoles · NETUBEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e8edf5;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow-x:hidden;}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;}
.bg-fixed-inner{width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1a2335 100%);}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(circle at 30% 40%,rgba(59,130,246,0.06),transparent 70%);}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none;}
.particle{position:absolute;width:4px;height:4px;background:rgba(59,130,246,0.08);border-radius:50%;animation:float linear infinite;}
@keyframes float{0%{transform:translateY(100vh) rotate(0deg) scale(0);opacity:0;}10%{opacity:0.6;transform:scale(1);}90%{opacity:0.6;}100%{transform:translateY(-10vh) rotate(720deg) scale(0);opacity:0;}}
.main-container{width:100%;max-width:1200px;padding:24px;position:relative;z-index:1;animation:fadeInUp 0.8s ease-out;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding:12px 20px;background:rgba(18,18,31,0.5);border-radius:12px;border:1px solid rgba(59,130,246,0.06);backdrop-filter:blur(12px);}
.header .logo{display:flex;align-items:center;gap:10px;}
.header .logo .icon{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
.header .logo h1{font-size:18px;font-weight:700;color:#e8edf5;}
.header .logo h1 span{color:#3b82f6;}
.header .logo .sub{font-size:10px;color:#4a5568;font-weight:400;display:block;}
.header .home-btn{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:30px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.08);color:#4a5568;font-size:12px;font-weight:500;text-decoration:none;transition:all 0.3s;cursor:pointer;}
.header .home-btn:hover{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.15);color:#e8edf5;transform:translateY(-2px);}
.header .home-btn i{font-size:12px;}
.header .contact-btn{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:30px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;color:#fff;font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s;cursor:pointer;}
.header .contact-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(59,130,246,0.25);}
.header .contact-btn i{font-size:12px;}
.search-section{position:sticky;top:0;z-index:10;padding:16px 0 12px 0;background:rgba(10,14,26,0.92);backdrop-filter:blur(16px);margin-bottom:16px;border-radius:0 0 12px 12px;}
.search-wrapper{position:relative;max-width:600px;margin:0 auto;}
.search-wrapper i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:15px;z-index:2;}
.search-wrapper input{width:100%;padding:14px 20px 14px 48px;border-radius:30px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);color:#1a1a2e;font-size:15px;font-weight:400;outline:none;transition:all 0.3s;font-family:'Inter',sans-serif;box-shadow:0 2px 12px rgba(0,0,0,0.04);}
.search-wrapper input::placeholder{color:#9ca3af;font-weight:300;}
.search-wrapper input:focus{border-color:#3b82f6;box-shadow:0 4px 20px rgba(59,130,246,0.08);}
.schools-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px;}
@media(max-width:768px){.schools-grid{grid-template-columns:1fr;}}
.school-card{background:#ffffff;border:1px solid rgba(0,0,0,0.04);border-radius:16px;padding:32px 36px;min-height:120px;transition:all 0.35s cubic-bezier(0.16,1,0.3,1);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.04);}
.school-card:hover{background:#ffffff;border-color:rgba(59,130,246,0.12);transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.18),0 4px 16px rgba(0,0,0,0.06);}
.school-card .left{display:flex;align-items:center;gap:20px;flex:1;min-width:0;}
.school-card .left .icon{font-size:40px;flex-shrink:0;opacity:0.7;}
.school-card .left .info{flex:1;min-width:0;}
.school-card .left .info .name{font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.school-card .left .info .detail{font-size:14px;color:#6b7280;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.school-card .right{flex-shrink:0;color:#3b82f6;font-size:18px;opacity:0.2;transition:all 0.3s;}
.school-card:hover .right{opacity:1;transform:translateX(6px);}
.loading-status{text-align:center;padding:12px;color:#4a5568;font-size:13px;font-weight:300;display:none;}
.loading-status .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(59,130,246,0.15);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle;}
.loading-status.loading{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:60px 20px;color:#4a5568;grid-column:1/-1;}
.empty-state .icon{font-size:48px;display:block;margin-bottom:12px;opacity:0.2;}
.empty-state p{font-size:14px;font-weight:300;}
.footer{margin-top:40px;padding:16px 0;border-top:1px solid rgba(59,130,246,0.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer .copy{font-size:11px;color:#2d3748;}
.footer .links{display:flex;gap:16px;}
.footer .links a{color:#2d3748;font-size:11px;text-decoration:none;transition:0.2s;cursor:pointer;}
.footer .links a:hover{color:#4a5568;}
.footer .phone{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#3b82f6;}
.footer .phone i{font-size:12px;}
@media(max-width:768px){.school-card{padding:24px 28px;min-height:100px;}.school-card .left .icon{font-size:32px;}.school-card .left .info .name{font-size:17px;}.header .logo h1{font-size:16px;}.header .home-btn,.header .contact-btn{padding:4px 12px;font-size:11px;}.search-wrapper input{font-size:14px;padding:12px 16px 12px 44px;}}
@media(max-width:480px){.school-card{padding:20px 20px;min-height:80px;flex-wrap:wrap;}.school-card .left .icon{font-size:24px;}.school-card .left .info .name{font-size:15px;}.school-card .left .info .detail{font-size:12px;}.header .logo .sub{display:none;}.search-wrapper input{font-size:13px;padding:10px 14px 10px 40px;}.search-wrapper i{left:14px;font-size:14px;}}
</style>
</head>
<body>
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="particles" id="particles"></div>
<div class="main-container">
<div class="header">
<div class="logo">
<div class="icon">NX</div>
<div>
<h1>NETUBEX</h1>
<span class="sub">Sélecteur d'écoles</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
<a href="https://www.netubex.com/index" class="home-btn"><i class="fas fa-home"></i> Accueil</a>
<a href="tel:+243976953045" class="contact-btn"><i class="fas fa-phone-alt"></i> +243 976 953 045</a>
</div>
</div>
<div class="search-section">
<div class="search-wrapper">
<i class="fas fa-search"></i>
<input type="text" id="searchInput" placeholder="Rechercher une école..." autocomplete="off">
</div>
</div>
<div id="loadingStatus" class="loading-status loading"><span class="spinner"></span> Chargement...</div>
<div id="schoolsContainer" class="schools-grid"></div>
<div class="footer">
<div class="copy">© 2026 NETUBEX SARL — RDC</div>
<div class="phone"><i class="fas fa-phone-alt"></i> +243 976 953 045</div>
<div class="links">
<a href="https://www.netubex.com/index">Accueil</a>
<a href="#" onclick="event.preventDefault();">À propos</a>
</div>
</div>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, query, where } from "firebase/firestore";
const firebaseConfigGesco = {
apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
authDomain: "gesco-67c43.firebaseapp.com",
projectId: "gesco-67c43",
storageBucket: "gesco-67c43.firebasestorage.app",
messagingSenderId: "333004443566",
appId: "1:333004443566:web:de41f60000e418dce9023f",
measurementId: "G-V7MF88Y5EE"
};
const firebaseConfigMoney = {
apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain: "netubexmoney.firebaseapp.com",
databaseURL: "https://netubexmoney-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "netubexmoney",
storageBucket: "netubexmoney.firebasestorage.app",
messagingSenderId: "856592608176",
appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};
const appGesco = initializeApp(firebaseConfigGesco, "gesco");
const appMoney = initializeApp(firebaseConfigMoney, "money");
const dbGesco = getFirestore(appGesco);
const dbMoney = getFirestore(appMoney);
const schoolsContainer = document.getElementById('schoolsContainer');
const loadingStatus = document.getElementById('loadingStatus');
const searchInput = document.getElementById('searchInput');
let allSchools = [];
function escapeHtml(text){if(!text)return'';const div=document.createElement('div');div.textContent=text;return div.innerHTML;}
async function getAllSchools(){
const schools=[];const seenIds=new Set();
try{
const snapGesco=await getDocs(collection(dbGesco,"ecoles"));
snapGesco.forEach(doc=>{const data=doc.data();const id=doc.id;if(!seenIds.has(id)){seenIds.add(id);schools.push({id:id,nom:data.nom||id,province:data.province||'',ville:data.ville||'',actif:data.actif!==false,projet:'GESCO',data:data});}});
}catch(e){console.error(e);}
try{
const snapMoney=await getDocs(collection(dbMoney,"ecoles"));
snapMoney.forEach(doc=>{const data=doc.data();const id=doc.id;if(!seenIds.has(id)){seenIds.add(id);schools.push({id:id,nom:data.nom||id,province:data.province||'',ville:data.ville||'',actif:data.actif!==false,projet:'NETUBEXMONEY',data:data});}});
}catch(e){console.error(e);}
schools.sort((a,b)=>a.nom.localeCompare(b.nom));
return schools;
}
function displaySchools(schools){
if(schools.length===0){
schoolsContainer.innerHTML=`<div class="empty-state"><span class="icon">🏫</span><p>Aucune école trouvée</p></div>`;
return;
}
let html='';
schools.forEach(school=>{
const detailParts=[];
if(school.province)detailParts.push(school.province);
if(school.ville)detailParts.push(school.ville);
const detailText=detailParts.length>0?detailParts.join(' · '):'';
html+=`
<div class="school-card" data-id="${school.id}" data-projet="${school.projet}">
<div class="left">
<span class="icon">🏫</span>
<div class="info">
<div class="name">${escapeHtml(school.nom)}</div>
${detailText?`<div class="detail">${escapeHtml(detailText)}</div>`:''}
</div>
</div>
<div class="right"><i class="fas fa-arrow-right"></i></div>
</div>
`;
});
schoolsContainer.innerHTML=html;
document.querySelectorAll('.school-card').forEach(card=>{
card.addEventListener('click',function(){
const id=this.dataset.id;
const projet=this.dataset.projet;
if(projet==='GESCO'){
window.location.href=`https://www.netubex.com/schooling?ecole=${encodeURIComponent(id)}`;
}else if(projet==='NETUBEXMONEY'){
window.location.href=`https://www.netubex.com/schoolingspec?ecole=${encodeURIComponent(id)}`;
}
});
});
}
function filterSchools(searchTerm){
const term=searchTerm.toLowerCase().trim();
if(!term){displaySchools(allSchools);return;}
const filtered=allSchools.filter(s=>s.nom.toLowerCase().includes(term)||s.id.toLowerCase().includes(term));
displaySchools(filtered);
}
async function loadSchools(){
loadingStatus.className='loading-status loading';
schoolsContainer.innerHTML='';
try{
allSchools=await getAllSchools();
loadingStatus.className='loading-status';
displaySchools(allSchools);
}catch(error){
loadingStatus.className='loading-status';
schoolsContainer.innerHTML=`<div class="empty-state"><span class="icon">❌</span><p>Erreur de chargement</p><button onclick="location.reload()" style="margin-top:12px;padding:8px 24px;border-radius:30px;background:#3b82f6;color:#fff;border:none;cursor:pointer;font-weight:600;">⟳ Réessayer</button></div>`;
}
}
searchInput.addEventListener('input',function(){filterSchools(this.value);});
(function(){
const container=document.getElementById('particles');if(!container)return;
for(let i=0;i<30;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.width=(Math.random()*3+1)+'px';p.style.height=p.style.width;p.style.animationDuration=(Math.random()*20+12)+'s';p.style.animationDelay=(Math.random()*15)+'s';container.appendChild(p);}
})();
loadSchools();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());
document.addEventListener('cut',e=>e.preventDefault());
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false;}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false;}if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false;}return true;});
</script>
</body>
</html>
