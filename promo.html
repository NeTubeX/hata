<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{overscroll-behavior:none;height:100%}
body{font-family:'Inter',sans-serif;background:#f0f2f5;overflow-y:auto;overscroll-behavior:none;color:#1a1a2e}
.container{max-width:1400px;margin:0 auto;padding:16px;padding-bottom:40px}
.school-header{background:linear-gradient(135deg,#0a0e1a,#1a2332);border-radius:20px;padding:24px 28px;text-align:center;margin-bottom:20px;position:relative;border:1px solid rgba(255,215,0,0.15);box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.school-header .logo-icon{font-size:36px;display:block;margin-bottom:4px}
.school-name{font-size:22px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0.5px}
.school-sub{font-size:12px;opacity:0.7;margin-top:4px;color:#cbd5e1;letter-spacing:2px}
.school-badge{display:inline-block;background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.2);padding:4px 16px;border-radius:30px;font-size:10px;color:#ffd700;margin-top:6px;font-weight:600;letter-spacing:1px}
.btn-logout{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.25);padding:0;border-radius:50%;font-size:16px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;width:38px;height:38px}
.btn-logout:hover{background:#ef4444;color:#fff;transform:translateY(-50%) scale(1.08);box-shadow:0 4px 16px rgba(239,68,68,0.3)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:16px;padding:18px 16px;text-align:center;border:1px solid #e8ecf0;box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:all .3s}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.08);border-color:#ffd700}
.stat-card .icon{font-size:28px;display:block;margin-bottom:6px}
.stat-card .number{font-size:28px;font-weight:800;color:#1a1a2e;line-height:1.2}
.stat-card .number.gold{color:#ffd700}
.stat-card .number.pink{color:#ec4899}
.stat-card .number.blue{color:#3b82f6}
.stat-card .number.green{color:#10b981}
.stat-card .number.red{color:#ef4444}
.stat-card .number.orange{color:#f59e0b}
.stat-card .number.purple{color:#8b5cf6}
.stat-card .label{font-size:11px;color:#6b7280;margin-top:4px;font-weight:500}
.graphs-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.graph-card{background:#fff;border-radius:16px;padding:20px;border:1px solid #e8ecf0;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.graph-card .graph-title{font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.graph-card .graph-title i{color:#ffd700}
.graph-bar-container{display:flex;flex-direction:column;gap:10px}
.graph-bar-item{display:flex;align-items:center;gap:12px}
.graph-bar-item .bar-label{font-size:12px;color:#6b7280;min-width:80px;text-align:right;font-weight:500}
.graph-bar-item .bar-track{flex:1;height:26px;background:#f1f3f5;border-radius:13px;overflow:hidden;position:relative}
.graph-bar-item .bar-fill{height:100%;border-radius:13px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);min-width:4px}
.graph-bar-item .bar-fill.filles{background:linear-gradient(90deg,#ec4899,#f472b6)}
.graph-bar-item .bar-fill.garcons{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.graph-bar-item .bar-fill.exoneres{background:linear-gradient(90deg,#10b981,#34d399)}
.graph-bar-item .bar-fill.impayes{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.graph-bar-item .bar-value{font-size:13px;font-weight:700;color:#1a1a2e;min-width:36px;text-align:right}
.table-container{background:#fff;border-radius:16px;border:1px solid #e8ecf0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:20px}
.table-header{background:#f8fafc;padding:14px 20px;border-bottom:1px solid #e8ecf0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.table-header h4{font-size:14px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.table-header h4 i{color:#ffd700}
.table-scroll{overflow-x:auto;padding:0 4px}
.table-scroll table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.table-scroll th{background:#f8fafc;padding:12px 16px;text-align:left;font-weight:600;color:#4b5563;border-bottom:2px solid #e8ecf0;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
.table-scroll td{padding:10px 16px;border-bottom:1px solid #f1f3f5;color:#1a1a2e}
.table-scroll tr:hover{background:#fafbfc}
.table-scroll .total-row{background:#f8fafc;font-weight:700}
.table-scroll .total-row td{border-top:2px solid #e8ecf0}
.table-scroll .badge-stat{display:inline-block;padding:2px 12px;border-radius:30px;font-size:10px;font-weight:600}
.table-scroll .badge-stat.complet{background:#dcfce7;color:#16a34a}
.table-scroll .badge-stat.partiel{background:#fef3c7;color:#d97706}
.table-scroll .badge-stat.nonpaye{background:#fee2e2;color:#dc2626}
.promoteur-footer{text-align:center;padding:16px 0;color:#9ca3af;font-size:11px;border-top:1px solid #e8ecf0;margin-top:8px}
.promoteur-footer .update-time{color:#6b7280;font-weight:500}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0e1a;z-index:30000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.login-overlay::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle at 70% 30%,rgba(255,215,0,0.04),transparent 70%);pointer-events:none}
.login-overlay::after{content:'';position:absolute;bottom:-50%;left:-50%;width:100%;height:100%;background:radial-gradient(circle at 30% 70%,rgba(59,130,246,0.02),transparent 70%);pointer-events:none}
.login-card{background:rgba(18,18,31,0.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:32px;padding:44px 36px;width:92%;max-width:400px;text-align:center;border:1px solid rgba(255,215,0,0.12);position:relative;z-index:1;box-shadow:0 30px 80px rgba(0,0,0,0.7)}
.login-card .login-icon{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(251,191,36,0.05));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;border:2px solid rgba(255,215,0,0.15)}
.login-card h2{font-size:22px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px;letter-spacing:-0.3px}
.login-card .login-sub{color:#64748b;font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px}
.login-card .login-divider{width:50px;height:2px;background:linear-gradient(90deg,#ffd700,#fbbf24);border-radius:2px;margin:14px auto}
.login-card .login-welcome{color:#94a3b8;font-size:13px;margin-bottom:22px;line-height:1.6}
.login-card .login-input-group{position:relative;margin-bottom:14px}
.login-card .login-input-group .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.4;pointer-events:none}
.login-card .login-input-group input{width:100%;padding:14px 16px 14px 48px;border-radius:28px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:18px;font-family:monospace;letter-spacing:6px;transition:all 0.3s;outline:none}
.login-card .login-input-group input:focus{border-color:rgba(255,215,0,0.3);background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(255,215,0,0.04)}
.login-card .login-input-group input::placeholder{color:#475569;font-size:12px;letter-spacing:2px;font-family:'Inter',sans-serif}
.login-card .login-btn{width:100%;padding:14px;border-radius:28px;background:linear-gradient(135deg,#ffd700,#fbbf24);color:#0f172a;font-weight:700;border:none;cursor:pointer;font-size:15px;transition:all 0.3s;position:relative;overflow:hidden;letter-spacing:0.5px}
.login-card .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,215,0,0.2)}
.login-card .login-btn:active{transform:scale(0.97)}
.login-card .login-btn:disabled{opacity:0.5;transform:none;box-shadow:none}
.login-card .login-error{color:#ef4444;margin-top:12px;font-size:12px;min-height:18px}
.login-card .login-footer{color:#334155;font-size:10px;margin-top:18px;letter-spacing:1px;border-top:1px solid rgba(255,255,255,0.04);padding-top:14px}
.toast-container{position:fixed;top:20px;right:20px;z-index:20000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#1e293b;border-radius:12px;padding:12px 18px;min-width:280px;display:flex;align-items:center;gap:12px;border-left:3px solid #10b981;pointer-events:auto;animation:slideDown 0.3s ease-out}
@keyframes slideDown{from{transform:translateY(-100px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.error{border-left-color:#ef4444}
.toast.warning{border-left-color:#f59e0b}
.toast-icon{font-size:18px}
.toast-content{flex:1}
.toast-title{font-weight:600;font-size:13px;color:#fff}
.toast-message{font-size:11px;color:#cbd5e1}
.empty-state{text-align:center;padding:40px;color:#94a3b8}
.empty-state i{font-size:40px;display:block;margin-bottom:10px;opacity:0.3}
@media(max-width:768px){
.container{padding:10px}
.school-header{padding:16px 18px}
.school-name{font-size:18px}
.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{padding:14px 10px}
.stat-card .number{font-size:22px}
.graphs-row{grid-template-columns:1fr;gap:12px}
.graph-card{padding:14px}
.graph-bar-item .bar-label{min-width:60px;font-size:11px}
.login-card{padding:32px 20px}
.login-card .login-icon{width:60px;height:60px;font-size:30px}
.btn-logout{right:12px;width:34px;height:34px;font-size:14px}
.table-scroll table{font-size:12px;min-width:480px}
.table-scroll th,.table-scroll td{padding:8px 10px}
}
@media(max-width:400px){
.stats-grid{grid-template-columns:1fr 1fr;gap:8px}
.stat-card{padding:10px 8px}
.stat-card .number{font-size:18px}
.stat-card .label{font-size:9px}
}
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:40px}
.loading-spinner i{font-size:32px;color:#ffd700;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#mainContent{display:none}
#mainContent.visible{display:block}
</style>
</head>

<script type="importmap">

</script>

<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,query,where,onSnapshot}from"firebase/firestore";

const firebaseConfig={
apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
authDomain:"gesco-67c43.firebaseapp.com",
projectId:"gesco-67c43",
storageBucket:"gesco-67c43.firebasestorage.app",
messagingSenderId:"333004443566",
appId:"1:333004443566:web:de41f60000e418dce9023f",
measurementId:"G-V7MF88Y5EE"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const urlParams=new URLSearchParams(window.location.search);
const schoolId=urlParams.get('ecole');
if(!schoolId){window.location.href='https://www.netubex.com/schoolchoice';}

const ECOLET_ID=schoolId.replace(/[^a-zA-Z0-9]/g,'_');
const SCHOOL_DISPLAY_NAME=schoolId;

document.getElementById('schoolName').textContent='COMPLEXE SCOLAIRE '+SCHOOL_DISPLAY_NAME;
document.getElementById('loginSchoolName').textContent='COMPLEXE SCOLAIRE '+SCHOOL_DISPLAY_NAME;

const ACCESS_CODE="5678";
let isInitialized=false;
let allEleves=[];
let allProfs=[];

function toast(msg,type='success'){
const c=document.getElementById('toastContainer');
if(!c)return;
const icons={success:'fas fa-check-circle',error:'fas fa-exclamation-circle',warning:'fas fa-exclamation-triangle'};
const colors={success:'#10b981',error:'#ef4444',warning:'#f59e0b'};
const titles={success:'Succès',error:'Erreur',warning:'Attention'};
const el=document.createElement('div');
el.className='toast '+(type||'');
el.innerHTML='<div class="toast-icon" style="color:'+colors[type]+'"><i class="'+icons[type]+'"></i></div><div class="toast-content"><div class="toast-title">'+titles[type]+'</div><div class="toast-message">'+msg+'</div></div>';
c.appendChild(el);
setTimeout(()=>el.classList.add('show'),10);
setTimeout(()=>{el.classList.remove('show');setTimeout(()=>{if(el.parentNode)el.remove()},400)},3500);
}

function formatNb(n){if(isNaN(n)||n===null||n===undefined)return"0";let resultat="",nombre=Math.abs(n),str=nombre.toString(),cpt=0;for(let i=str.length-1;i>=0;i--){cpt++;resultat=str[i]+resultat;if(cpt%3===0&&i!==0)resultat=" "+resultat;}return n<0?"-"+resultat:resultat;}

function formatDateFr(d){const dt=new Date(d);return dt.getDate().toString().padStart(2,'0')+'/'+(dt.getMonth()+1).toString().padStart(2,'0')+'/'+dt.getFullYear()+' '+dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');}

async function getAllComptaEleves(){
try{
const q=query(collection(db,"ecoles",ECOLET_ID,"compta_eleves"),where("_type","==","compta_eleve"));
const snap=await getDocs(q);
const eleves=[];
snap.forEach(ds=>{
const d=ds.data();
eleves.push({
id:d.eleveId,
nom:d.nom||'',
postnom:d.postnom||'',
prenom:d.prenom||'',
classe:d.classe||'',
option:d.option||'',
sexe:d.sexe||'M',
minerval:d.minerval||45000,
exonere:d.exonere||false,
motifExon:d.motifExon||'',
approbateur:d.approbateur||'',
abandon:d.abandon||false,
dateAbandon:d.dateAbandon||null,
dateInscription:d.dateInscription||new Date().toISOString(),
paiements:d.paiements||{},
fraisInscriptionPaye:d.fraisInscriptionPaye||0,
fraisInscriptionTotal:d.fraisInscriptionTotal||45000,
parentCode:d.parentCode||'',
moisBlancs:d.moisBlancs||[]
});
});
return eleves;
}catch(e){console.error(e);return[];}
}

async function getAllProfs(){
try{
const q=query(collection(db,"ecoles",ECOLET_ID,"professeurs"),where("_type","==","prof"));
const snap=await getDocs(q);
const profs=[];
snap.forEach(ds=>{
const d=ds.data();
if(d.nom)profs.push({id:ds.id,nom:d.nom,actif:d.actif!==false});
});
return profs;
}catch(e){return[];}
}

async function chargerStats(){
try{
allEleves=await getAllComptaEleves();
allProfs=await getAllProfs();
afficherStats();
document.getElementById('lastUpdate').textContent=formatDateFr(new Date());
}catch(e){console.error(e);}
}

const moisListe=["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];
const dateRef=new Date();
const moisActuelNum=dateRef.getMonth();
let moisCourant="Septembre";
if(moisActuelNum>=8){moisCourant=moisListe[moisActuelNum-8];}else{moisCourant=moisListe[moisActuelNum+4];}
let moisPasse=moisListe[Math.max(0,moisListe.indexOf(moisCourant)-1)]||"Septembre";

function getMoisFromDate(dateISO){if(!dateISO)return"Septembre";const date=new Date(dateISO);const mois=date.getMonth();if(mois>=8)return moisListe[mois-8];else if(mois>=0&&mois<=5)return moisListe[mois+4];return"Septembre";}

function afficherStats(){
const eleves=allEleves.filter(e=>!e.abandon);
const abandons=allEleves.filter(e=>e.abandon);
const total=eleves.length;
const filles=eleves.filter(e=>e.sexe==='F').length;
const garcons=eleves.filter(e=>e.sexe==='M').length;
const exoneres=eleves.filter(e=>e.exonere).length;
const exoneresFilles=eleves.filter(e=>e.exonere&&e.sexe==='F').length;
const exoneresGarcons=eleves.filter(e=>e.exonere&&e.sexe==='M').length;

let totalMinerval=0,totalPaye=0,impayesMoisPasse=0,listeNoire=0,aJour=0;
const classesMap={};
const optionsMap={};
const classeDetail={};
const indexActuel=moisListe.indexOf(moisCourant);
const indexPasse=moisListe.indexOf(moisPasse);

for(const e of eleves){
const paiements=e.paiements||{};
const moisBlancs=e.moisBlancs||[];
const minerval=e.exonere?0:e.minerval;
totalMinerval+=minerval*10;
for(const m of moisListe){
totalPaye+=(paiements[m]?.montant||0);
}
const dateIns=e.dateInscription||new Date().toISOString();
const moisIns=getMoisFromDate(dateIns);
const idxIns=moisListe.indexOf(moisIns);
let moisImpayes=0;
for(let i=Math.max(0,idxIns);i<indexActuel;i++){
const mois=moisListe[i];
const mt=paiements[mois]?.montant||0;
if(mt<minerval&&!moisBlancs.includes(mois))moisImpayes++;
}
if(moisImpayes>=3)listeNoire++;
else if(moisImpayes===0&&!e.exonere)aJour++;

const pm=paiements[moisPasse]?.montant||0;
if(!e.exonere&&!moisBlancs.includes(moisPasse)&&pm<minerval&&indexPasse>=0)impayesMoisPasse++;

const classe=e.classe||'Non spécifiée';
const option=e.option||'Sans option';
const key=classe+'|'+option;
if(!classeDetail[classe]){classeDetail[classe]={total:0,filles:0,garcons:0,exoneres:0,options:{}};}
classeDetail[classe].total++;
if(e.sexe==='F')classeDetail[classe].filles++;
else classeDetail[classe].garcons++;
if(e.exonere)classeDetail[classe].exoneres++;
if(!classeDetail[classe].options[option])classeDetail[classe].options[option]={total:0,filles:0,garcons:0,exoneres:0};
classeDetail[classe].options[option].total++;
if(e.sexe==='F')classeDetail[classe].options[option].filles++;
else classeDetail[classe].options[option].garcons++;
if(e.exonere)classeDetail[classe].options[option].exoneres++;
if(!classesMap[classe])classesMap[classe]=0;
classesMap[classe]++;
if(option!=='Sans option'){
if(!optionsMap[option])optionsMap[option]=0;
optionsMap[option]++;
}
}

const classesListe=Object.keys(classesMap).sort();
const optionsListe=Object.keys(optionsMap).sort();
const profsActifs=allProfs.filter(p=>p.actif!==false).length;

const container=document.getElementById('statsContainer');
if(!container)return;

const aujourdhui=new Date().toISOString().split('T')[0];
const inscritsAujourdhui=eleves.filter(e=>(e.dateInscription||'').startsWith(aujourdhui)).length;
const cetteSemaine=new Date();cetteSemaine.setDate(cetteSemaine.getDate()-7);

document.getElementById('loginBtn').onclick=async function(){
const btn=this;
const code=document.getElementById('loginCode').value.trim();
const error=document.getElementById('loginError');
btn.disabled=true;
btn.textContent='⏳ VÉRIFICATION...';
try{
if(code===ACCESS_CODE){
error.textContent='';
document.getElementById('loginOverlay').style.display='none';
document.getElementById('mainContent').classList.add('visible');
if(!isInitialized){await chargerStats();isInitialized=true;}
toast('Bienvenue dans l\'espace Promoteur','success');
}else{
error.textContent='❌ Code incorrect';
document.getElementById('loginCode').value='';
document.getElementById('loginCode').focus();
toast('Code d\'accès incorrect','error');
}
}catch(e){
error.textContent='❌ Erreur de connexion';
toast('Erreur de connexion','error');
}finally{
btn.disabled=false;
btn.textContent='SE CONNECTER';
}
};

document.getElementById('loginCode').onkeypress=function(e){
if(e.key==='Enter')document.getElementById('loginBtn').click();
};
document.getElementById('loginCode').oninput=function(){
document.getElementById('loginError').textContent='';
if(this.value.length===4)document.getElementById('loginBtn').click();
};

document.getElementById('logoutBtn').onclick=function(){
document.getElementById('loginOverlay').style.display='flex';
document.getElementById('mainContent').classList.remove('visible');
document.getElementById('loginCode').value='';
document.getElementById('loginError').textContent='';
document.getElementById('loginCode').focus();
};

setInterval(()=>{
if(document.getElementById('mainContent').classList.contains('visible')){
chargerStats();
}
},300000);

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
if(e.key==='F12'||e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='K')||e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S'||e.key==='h')){e.preventDefault();}
});

document.getElementById('loginCode').focus();
</script>
</body>
</html>
