<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>GLORIA DEI - Direction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-container{max-width:420px;width:100%;background:rgba(18,18,31,0.95);border-radius:32px;padding:48px 36px;text-align:center;border:1px solid rgba(255,215,0,0.12);box-shadow:0 30px 80px rgba(0,0,0,0.7)}
.login-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(251,191,36,0.05));display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 16px;border:2px solid rgba(255,215,0,0.15)}
.login-container h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-container .sub{color:#64748b;font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;margin-top:2px}
.divider{width:50px;height:2px;background:linear-gradient(90deg,#ffd700,#fbbf24);border-radius:2px;margin:14px auto}
.email-display{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:10px 14px;margin:16px 0;font-size:13px;color:#94a3b8}
.email-display strong{color:#ffd700}
.input-group{position:relative;margin-bottom:14px}
.input-group .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.4}
.input-group input{width:100%;padding:14px 16px 14px 48px;border-radius:28px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:20px;font-family:monospace;letter-spacing:6px;transition:all 0.3s;outline:none}
.input-group input:focus{border-color:rgba(255,215,0,0.3);background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(255,215,0,0.04)}
.input-group input::placeholder{color:#475569;font-size:12px;letter-spacing:2px;font-family:'Inter',sans-serif}
.btn{width:100%;padding:14px;border-radius:28px;background:linear-gradient(135deg,#ffd700,#fbbf24);color:#0f172a;font-weight:700;border:none;cursor:pointer;font-size:15px;transition:all 0.3s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,215,0,0.2)}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:0.5;transform:none;box-shadow:none;cursor:not-allowed}
.error{color:#ef4444;margin-top:12px;font-size:13px;min-height:20px;font-weight:500}
.error.success{color:#10b981}
.footer{color:#334155;font-size:10px;margin-top:18px;border-top:1px solid rgba(255,255,255,0.04);padding-top:14px}
.info{color:#64748b;font-size:11px;margin-top:8px}
.info strong{color:#ffd700}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-icon">🏫</div>
    <h1>GLORIA DEI</h1>
    <div class="sub">Espace Direction</div>
    <div class="divider"></div>

    <div class="email-display">
        📧 Connexion avec : <strong>direction.gloriadei@gmail.com</strong>
    </div>

    <div class="input-group">
        <span class="icon">🔐</span>
        <input type="password" id="password" placeholder="MOT DE PASSE" inputmode="numeric" maxlength="8" autocomplete="off">
    </div>

    <button class="btn" id="loginBtn">SE CONNECTER</button>
    <div id="error" class="error"></div>
    <div class="info">Mot de passe : <strong>8 chiffres</strong></div>
    <div class="footer">© 2026 - NeTubeX SARL</div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, getDoc } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
    authDomain: "netubexmoney.firebaseapp.com",
    databaseURL: "https://netubexmoney-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "netubexmoney",
    storageBucket: "netubexmoney.firebasestorage.app",
    messagingSenderId: "856592608176",
    appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DIRECTION_EMAIL = 'direction.gloriadei@gmail.com';
const SCHOOL_NAME = 'GLORIA_DEI';

const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorDiv = document.getElementById('error');

loginBtn.onclick = async function() {
    const password = passwordInput.value.trim();
    errorDiv.innerHTML = '';
    errorDiv.className = 'error';

    if(!password){errorDiv.innerHTML='❌ Veuillez entrer le mot de passe';return;}
    if(password.length!==8||!/^\d+$/.test(password)){errorDiv.innerHTML='❌ Le mot de passe doit contenir exactement 8 chiffres';return;}

    loginBtn.disabled=true;
    loginBtn.textContent='⏳ CONNEXION...';
    errorDiv.innerHTML='⏳ Authentification...';
    errorDiv.style.color='#60a5fa';

    try{
        const userCredential=await signInWithEmailAndPassword(auth,DIRECTION_EMAIL,password);
        const user=userCredential.user;

        const userRef=doc(db,'users',user.uid);
        const userSnap=await getDoc(userRef);

        if(!userSnap.exists()){
            errorDiv.innerHTML='❌ Compte non configuré. Contactez l\'administrateur.';
            errorDiv.style.color='#ef4444';
            loginBtn.disabled=false;
            loginBtn.textContent='SE CONNECTER';
            return;
        }

        const userData=userSnap.data();
        if(userData.role!=='direction'){
            errorDiv.innerHTML='❌ Accès refusé. Rôle "direction" requis.';
            errorDiv.style.color='#ef4444';
            loginBtn.disabled=false;
            loginBtn.textContent='SE CONNECTER';
            return;
        }

        errorDiv.innerHTML='✅ Connexion réussie ! Redirection...';
        errorDiv.className='error success';
        errorDiv.style.color='#10b981';

        setTimeout(()=>{
            window.location.href='https://www.netubex.com/gloriad?ecole=GLORIA_DEI';
        },1500);

    }catch(error){
        let msg='❌ Mot de passe incorrect';
        if(error.code==='auth/user-not-found')msg='❌ Aucun compte avec cet email';
        else if(error.code==='auth/wrong-password')msg='❌ Mot de passe incorrect';
        else if(error.code==='auth/too-many-requests')msg='❌ Trop de tentatives. Réessayez plus tard.';
        else if(error.code==='auth/invalid-credential')msg='❌ Mot de passe incorrect';
        errorDiv.innerHTML=msg;
        errorDiv.style.color='#ef4444';
        passwordInput.value='';
        passwordInput.focus();
    }finally{
        loginBtn.disabled=false;
        loginBtn.textContent='SE CONNECTER';
    }
};

passwordInput.onkeypress=function(e){if(e.key==='Enter')loginBtn.click();};

onAuthStateChanged(auth,async(user)=>{
    if(user&&user.email===DIRECTION_EMAIL){
        try{
            const userRef=doc(db,'users',user.uid);
            const userSnap=await getDoc(userRef);
            if(userSnap.exists()&&userSnap.data().role==='direction'){
                window.location.href='https://www.netubex.com/gloriad?ecole=GLORIA_DEI';
            }
        }catch(e){}
    }
});
</script>
</body>
</html>
