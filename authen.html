<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Changer mot de passe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{background:#141b2d;padding:40px 35px;border-radius:16px;max-width:450px;width:100%;border:1px solid rgba(255,215,0,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.title{color:#ffd700;font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.subtitle{color:#8899b0;font-size:13px;text-align:center;margin-bottom:24px}
.status{background:#0d1321;border-radius:10px;padding:12px 16px;margin-bottom:20px;border-left:3px solid #3b82f6}
.status .label{font-size:10px;color:#6a7b90;text-transform:uppercase;letter-spacing:0.5px}
.status .value{font-size:13px;color:#e8edf4;margin-top:4px;word-break:break-all}
.status .value.connected{color:#10b981}
.status .value.disconnected{color:#ef4444}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:#6a7b90;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:5px}
.form-group input{width:100%;background:#0d1321;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:11px 14px;color:#e8edf4;font-size:14px;outline:none;transition:border 0.3s;font-family:monospace;letter-spacing:2px}
.form-group input:focus{border-color:rgba(255,215,0,0.3)}
.form-group input::placeholder{color:#5a6b80;font-family:Arial,sans-serif;letter-spacing:0}
.password-row{display:flex;gap:8px;align-items:center}
.password-row input{flex:1}
.password-row .btn-gen{background:linear-gradient(180deg,#fbbf24,#d97706);color:#0f172a;border:none;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 #92400e;transition:all 0.15s;min-width:80px}
.password-row .btn-gen:hover{transform:translateY(-2px);box-shadow:0 5px 0 #92400e}
.password-row .btn-gen:active{transform:translateY(4px);box-shadow:0 1px 0 #92400e}
.password-hint{font-size:10px;color:#5a6b80;margin-top:4px}
.btn{width:100%;padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px}
.btn-primary{background:linear-gradient(180deg,#ffd700,#f59e0b);color:#0f172a;box-shadow:0 4px 0 #b45309}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 #b45309}
.btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b45309}
.btn-success{background:linear-gradient(180deg,#34d399,#059669);color:#fff;box-shadow:0 4px 0 #065f46}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 6px 0 #065f46}
.btn-success:active{transform:translateY(4px);box-shadow:0 2px 0 #065f46}
.btn-danger{background:linear-gradient(180deg,#f87171,#dc2626);color:#fff;box-shadow:0 4px 0 #991b1b}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 6px 0 #991b1b}
.btn-danger:active{transform:translateY(4px);box-shadow:0 2px 0 #991b1b}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
.hidden{display:none}
.divider{border:none;border-top:1px solid rgba(255,255,255,0.04);margin:20px 0}
.message{padding:12px 16px;border-radius:10px;margin-top:14px;font-size:13px;display:none}
.message.show{display:block}
.message.success{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.2);color:#10b981}
.message.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2);color:#ef4444}
.message.info{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.2);color:#60a5fa}
.message.warning{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.2);color:#f59e0b}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,215,0,0.2);border-top-color:#ffd700;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:16px;font-size:11px;color:#5a6b80}
.generated-code{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.15);border-radius:8px;padding:8px 14px;text-align:center;font-family:monospace;font-size:20px;font-weight:700;color:#ffd700;letter-spacing:6px;margin:6px 0 10px 0;display:none}
.generated-code.show{display:block}
.test-result{background:#0d1321;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12px;display:none}
.test-result.show{display:block}
.test-result.pass{border-left:3px solid #10b981;color:#10b981}
.test-result.fail{border-left:3px solid #ef4444;color:#ef4444}
</style>
</head>
<body>

<div class="container">
<div class="title">🔐 Changer mot de passe</div>
<div class="subtitle">Se connecter pour modifier votre mot de passe</div>

<div class="status">
<div class="label">👤 État</div>
<div class="value disconnected" id="statusText">Non connecté</div>
</div>

<div id="loginSection">
<div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="exemple@email.com"></div>
<div class="form-group"><label>Mot de passe</label><input type="password" id="loginPassword" placeholder="Votre mot de passe"></div>
<button class="btn btn-primary" id="loginBtn">Se connecter</button>
</div>

<div class="divider"></div>

<div id="changeSection" class="hidden">
<div class="form-group"><label>Ancien mot de passe</label><input type="password" id="oldPassword" placeholder="Mot de passe actuel"></div>

<div class="form-group">
<label>Nouveau mot de passe</label>
<div class="password-row">
<input type="password" id="newPassword" placeholder="Min 6 caractères" maxlength="6">
<button class="btn-gen" id="generateBtn">🎲 Générer</button>
</div>
<div class="password-hint">Génère un code unique de 6 chiffres</div>
</div>

<div id="generatedDisplay" class="generated-code"></div>

<div class="form-group"><label>Confirmer</label><input type="password" id="confirmPassword" placeholder="Confirmer le nouveau"></div>
<button class="btn btn-success" id="changeBtn">Changer le mot de passe</button>
<div id="testResult" class="test-result"></div>
<button class="btn btn-danger hidden" id="logoutBtn" style="margin-top:8px;">Se déconnecter</button>
</div>

<div class="message" id="message"></div>
<div class="footer">🔒 Aucun email envoyé · Changement direct</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>

<script type="module">
import{initializeApp}from"firebase/app";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,updatePassword}from"firebase/auth";
import{getFirestore,collection,getDocs,doc,setDoc}from"firebase/firestore";

const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);

const statusText=document.getElementById("statusText");
const loginSection=document.getElementById("loginSection");
const changeSection=document.getElementById("changeSection");
const loginEmail=document.getElementById("loginEmail");
const loginPassword=document.getElementById("loginPassword");
const loginBtn=document.getElementById("loginBtn");
const oldPassword=document.getElementById("oldPassword");
const newPassword=document.getElementById("newPassword");
const confirmPassword=document.getElementById("confirmPassword");
const changeBtn=document.getElementById("changeBtn");
const logoutBtn=document.getElementById("logoutBtn");
const messageEl=document.getElementById("message");
const generateBtn=document.getElementById("generateBtn");
const generatedDisplay=document.getElementById("generatedDisplay");
const testResult=document.getElementById("testResult");
let msgTimeout=null;
let usedCodes=new Set();
let currentUserEmail="";

function showMessage(text,type="info"){messageEl.textContent=text;messageEl.className="message show "+type;if(msgTimeout)clearTimeout(msgTimeout);msgTimeout=setTimeout(()=>{messageEl.className="message";},7000);}

function showTestResult(text,pass){testResult.textContent=text;testResult.className="test-result show "+(pass?"pass":"fail");}

function updateUI(user){if(user){currentUserEmail=user.email;statusText.innerHTML='✅ Connecté<br><span style="font-size:12px;color:#8899b0;">'+user.email+'</span>';statusText.className="value connected";loginSection.classList.add("hidden");changeSection.classList.remove("hidden");logoutBtn.classList.remove("hidden");loadUsedPasswords();}else{currentUserEmail="";statusText.innerHTML="❌ Non connecté";statusText.className="value disconnected";loginSection.classList.remove("hidden");changeSection.classList.add("hidden");logoutBtn.classList.add("hidden");loginBtn.innerHTML="Se connecter";loginBtn.disabled=false;testResult.className="test-result";generatedDisplay.className="generated-code";}}

async function loadUsedPasswords(){usedCodes.clear();try{const snap=await getDocs(collection(db,"passwords"));snap.forEach(d=>{const code=d.data().code;if(code)usedCodes.add(code);});}catch(e){console.warn("Erreur chargement codes:",e);}}

function generateUniqueCode(){let code="";let attempts=0;do{code=Math.floor(100000+Math.random()*900000).toString();attempts++;}while(usedCodes.has(code)&&attempts<200);return code;}

function saveGeneratedCode(code){try{setDoc(doc(db,"passwords",code),{code:code,createdAt:new Date().toISOString()});usedCodes.add(code);}catch(e){console.warn("Erreur sauvegarde code:",e);}}

generateBtn.onclick=function(){const code=generateUniqueCode();if(code){newPassword.value=code;confirmPassword.value="";generatedDisplay.textContent=code;generatedDisplay.className="generated-code show";showMessage("🔑 Code généré: "+code,"info");saveGeneratedCode(code);}else{showMessage("❌ Impossible de générer un code unique","error");}};

newPassword.addEventListener("input",function(){if(this.value.length===6&&/^\d+$/.test(this.value)){generatedDisplay.textContent=this.value;generatedDisplay.className="generated-code show";}else{generatedDisplay.className="generated-code";}});

onAuthStateChanged(auth,(user)=>{updateUI(user);});

loginBtn.onclick=async()=>{const email=loginEmail.value.trim();const pwd=loginPassword.value.trim();if(!email||!pwd){showMessage("Veuillez remplir tous les champs","error");return;}loginBtn.disabled=true;loginBtn.innerHTML='<span class="spinner"></span> Connexion...';try{await signInWithEmailAndPassword(auth,email,pwd);showMessage("✅ Connecté avec succès","success");loginEmail.value="";loginPassword.value="";}catch(e){let msg="Erreur de connexion";if(e.code==="auth/user-not-found")msg="❌ Utilisateur non trouvé";else if(e.code==="auth/wrong-password")msg="❌ Mot de passe incorrect";else if(e.code==="auth/invalid-email")msg="❌ Email invalide";else if(e.code==="auth/too-many-requests")msg="❌ Trop de tentatives. Attendez.";else msg="❌ "+e.message;showMessage(msg,"error");}finally{loginBtn.disabled=false;loginBtn.innerHTML="Se connecter";}};

loginPassword.addEventListener("keypress",(e)=>{if(e.key==="Enter")loginBtn.click();});
loginEmail.addEventListener("keypress",(e)=>{if(e.key==="Enter")loginBtn.click();});

changeBtn.onclick=async()=>{
const oldPwd=oldPassword.value.trim();
const newPwd=newPassword.value.trim();
const confirmPwd=confirmPassword.value.trim();

if(!oldPwd||!newPwd||!confirmPwd){showMessage("Veuillez remplir tous les champs","error");return;}
if(newPwd.length<6){showMessage("Minimum 6 caractères","error");return;}
if(newPwd!==confirmPwd){showMessage("Les mots de passe ne correspondent pas","error");return;}
if(oldPwd===newPwd){showMessage("Le nouveau mot de passe doit être différent","warning");return;}

const user=auth.currentUser;
if(!user){showMessage("Vous devez être connecté","error");return;}

const email=user.email;
changeBtn.disabled=true;
changeBtn.innerHTML='<span class="spinner"></span> Changement...';
testResult.className="test-result";

try{
showMessage("🔄 Déconnexion...","info");
await signOut(auth);

showMessage("🔄 Reconnexion avec l'ancien mot de passe...","info");
const userCredential=await signInWithEmailAndPassword(auth,email,oldPwd);
showMessage("✅ Réauthentification réussie","info");

const freshUser=userCredential.user;
await updatePassword(freshUser,newPwd);
showMessage("✅ Mot de passe changé dans Firebase Auth !","success");

await signOut(auth);

showMessage("🔄 Test du nouveau mot de passe...","info");
await signInWithEmailAndPassword(auth,email,newPwd);
showMessage("✅ TEST RÉUSSI : Nouveau mot de passe fonctionne !","success");
showTestResult("✅ Test réussi : Connexion avec le nouveau mot de passe",true);

oldPassword.value="";
newPassword.value="";
confirmPassword.value="";
generatedDisplay.className="generated-code";

}catch(error){
let msg="Erreur";
if(error.code==="auth/wrong-password"){msg="❌ Ancien mot de passe incorrect";}
else if(error.code==="auth/user-not-found"){msg="❌ Utilisateur non trouvé";}
else if(error.code==="auth/too-many-requests"){msg="❌ Trop de tentatives. Attendez.";}
else if(error.code==="auth/invalid-credential"){msg="❌ Identifiants invalides";}
else{msg="❌ "+error.message;}
showMessage(msg,"error");
showTestResult("❌ "+msg,false);
}finally{
changeBtn.disabled=false;
changeBtn.innerHTML="Changer le mot de passe";
}};

confirmPassword.addEventListener("keypress",(e)=>{if(e.key==="Enter")changeBtn.click();});

logoutBtn.onclick=async()=>{try{await signOut(auth);showMessage("Déconnecté","info");testResult.className="test-result";}catch(e){showMessage("Erreur déconnexion","error");}};

console.log("✅ App prête");
</script>

</body>
</html>
