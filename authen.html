<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Changer mot de passe Firebase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(18, 18, 31, 0.95);
            border-radius: 24px;
            padding: 40px 35px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 24px;
            font-weight: 700;
        }
        
        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .status-box {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 25px;
            border-left: 4px solid #3b82f6;
        }
        
        .status-box .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .status-box .value {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 4px;
            word-break: break-all;
        }
        
        .status-box .value.connected {
            color: #10b981;
        }
        
        .status-box .value.disconnected {
            color: #ef4444;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .form-group input {
            width: 100%;
            background: #2d3748;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
        }
        
        .form-group input::placeholder {
            color: #64748b;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(180deg, #ffd700, #f59e0b);
            color: #0f172a;
            box-shadow: 0 4px 0 #b45309;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b45309;
        }
        
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b45309;
        }
        
        .btn-danger {
            background: linear-gradient(180deg, #f87171, #dc2626);
            color: white;
            box-shadow: 0 4px 0 #991b1b;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #991b1b;
        }
        
        .btn-danger:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #991b1b;
        }
        
        .btn-success {
            background: linear-gradient(180deg, #34d399, #059669);
            color: white;
            box-shadow: 0 4px 0 #065f46;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #065f46;
        }
        
        .btn-success:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #065f46;
        }
        
        .btn-secondary {
            background: linear-gradient(180deg, #64748b, #334155);
            color: #e2e8f0;
            box-shadow: 0 4px 0 #1e293b;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1e293b;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .divider {
            border: none;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            margin: 25px 0;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .message.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }
        
        .message.warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .test-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .test-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 12px;
        }
        
        .requirements {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }
        
        .requirements h4 {
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .requirements ul {
            color: #94a3b8;
            font-size: 12px;
            padding-left: 20px;
            line-height: 1.8;
        }
        
        .requirements ul li.valid {
            color: #10b981;
        }
        
        .requirements ul li.invalid {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔐 Test Firebase Auth</h1>
            <p>Changer le mot de passe sans email</p>
        </div>

        <!-- État de connexion -->
        <div class="status-box">
            <div class="label">👤 État de connexion</div>
            <div class="value" id="authStatus">Chargement...</div>
        </div>

        <!-- Formulaire de connexion -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="exemple@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="Mot de passe actuel">
            </div>
            <button class="btn btn-primary" id="loginBtn">SE CONNECTER</button>
        </div>

        <hr class="divider">

        <!-- Formulaire de changement de mot de passe (visible après connexion) -->
        <div id="changePasswordForm" style="display:none;">
            <div class="form-group">
                <label>Ancien mot de passe</label>
                <input type="password" id="oldPassword" placeholder="Votre mot de passe actuel">
            </div>
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe (min 6 caractères)">
            </div>
            <div class="form-group">
                <label>Confirmer le nouveau mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="Confirmer le nouveau mot de passe">
            </div>
            <button class="btn btn-success" id="changePasswordBtn">CHANGER LE MOT DE PASSE</button>

            <!-- Boutons de test rapide -->
            <div class="test-actions">
                <button class="btn btn-secondary" id="testReauthBtn">🔑 Tester réauthentification</button>
                <button class="btn btn-danger" id="logoutBtn">🚪 Déconnexion</button>
            </div>
        </div>

        <!-- Message de retour -->
        <div class="message" id="message"></div>

        <!-- Informations -->
        <div class="requirements">
            <h4>📋 Informations</h4>
            <ul>
                <li id="req1">✅ L'utilisateur doit être connecté</li>
                <li id="req2">✅ Le nouveau mot de passe doit avoir 6+ caractères</li>
                <li id="req3">✅ La réauthentification est automatique</li>
                <li id="req4">❌ Aucun email n'est envoyé</li>
            </ul>
        </div>
    </div>

    <!-- Import Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            updatePassword,
            reauthenticateWithCredential,
            EmailAuthProvider
        } from "firebase/auth";

        // Configuration Firebase (à remplacer avec vos valeurs)
        const firebaseConfig = {
            apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
            authDomain: "gesco-67c43.firebaseapp.com",
            projectId: "gesco-67c43",
            storageBucket: "gesco-67c43.firebasestorage.app",
            messagingSenderId: "333004443566",
            appId: "1:333004443566:web:de41f60000e418dce9023f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Éléments DOM
        const authStatus = document.getElementById('authStatus');
        const loginForm = document.getElementById('loginForm');
        const changePasswordForm = document.getElementById('changePasswordForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const oldPassword = document.getElementById('oldPassword');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const testReauthBtn = document.getElementById('testReauthBtn');
        const messageEl = document.getElementById('message');

        // Fonction pour afficher un message
        function showMessage(text, type = 'info') {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;

            // Auto-cacher après 8 secondes
            clearTimeout(messageEl._timeout);
            messageEl._timeout = setTimeout(() => {
                messageEl.className = 'message';
            }, 8000);
        }

        // Fonction pour mettre à jour l'interface
        function updateUI(user) {
            if (user) {
                authStatus.innerHTML = `
                    ✅ Connecté<br>
                    <span style="font-size:12px;color:#94a3b8;">${user.email}</span>
                    <span style="display:block;font-size:11px;color:#64748b;margin-top:4px;">
                        UID: ${user.uid.substring(0, 15)}...
                    </span>
                `;
                authStatus.className = 'value connected';
                loginForm.style.display = 'none';
                changePasswordForm.style.display = 'block';
                showMessage(`✅ Connecté en tant que ${user.email}`, 'success');
            } else {
                authStatus.innerHTML = '❌ Non connecté';
                authStatus.className = 'value disconnected';
                loginForm.style.display = 'block';
                changePasswordForm.style.display = 'none';
                // Ne pas effacer le message de bienvenue si on est déconnecté
            }
        }

        // Écouter les changements d'état d'authentification
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
            if (!user && changePasswordForm.style.display !== 'none') {
                showMessage('Vous avez été déconnecté', 'warning');
            }
        });

        // Fonction de connexion
        async function handleLogin() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Connexion...';
                showMessage('Connexion en cours...', 'info');

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                showMessage(`✅ Connecté avec succès !`, 'success');
                loginEmail.value = '';
                loginPassword.value = '';

            } catch (error) {
                console.error('Erreur de connexion:', error);
                let message = 'Erreur de connexion';
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = '❌ Utilisateur non trouvé';
                        break;
                    case 'auth/wrong-password':
                        message = '❌ Mot de passe incorrect';
                        break;
                    case 'auth/invalid-email':
                        message = '❌ Email invalide';
                        break;
                    case 'auth/too-many-requests':
                        message = '❌ Trop de tentatives. Attendez un moment.';
                        break;
                    default:
                        message = `❌ ${error.message}`;
                }
                showMessage(message, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'SE CONNECTER';
            }
        }

        // Fonction de changement de mot de passe
        async function handleChangePassword() {
            const oldPwd = oldPassword.value.trim();
            const newPwd = newPassword.value.trim();
            const confirmPwd = confirmPassword.value.trim();

            // Valider les champs
            if (!oldPwd || !newPwd || !confirmPwd) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (newPwd.length < 6) {
                showMessage('Le nouveau mot de passe doit faire au moins 6 caractères', 'error');
                return;
            }

            if (newPwd !== confirmPwd) {
                showMessage('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showMessage('Vous devez être connecté pour changer le mot de passe', 'error');
                return;
            }

            try {
                changePasswordBtn.disabled = true;
                changePasswordBtn.innerHTML = '<span class="loading"></span> Changement...';

                showMessage('📝 Réauthentification en cours...', 'info');

                // 1. Réauthentifier l'utilisateur
                const credential = EmailAuthProvider.credential(
                    user.email,
                    oldPwd
                );
                await reauthenticateWithCredential(user, credential);
                showMessage('✅ Réauthentification réussie', 'success');

                // 2. Changer le mot de passe
                showMessage('📝 Mise à jour du mot de passe...', 'info');
                await updatePassword(user, newPwd);

                showMessage('✅ Mot de passe changé avec succès ! Aucun email n\'a été envoyé.', 'success');

                // Vider les champs
                oldPassword.value = '';
                newPassword.value = '';
                confirmPassword.value = '';

            } catch (error) {
                console.error('Erreur changement de mot de passe:', error);
                let message = 'Erreur';
                switch (error.code) {
                    case 'auth/wrong-password':
                        message = '❌ Ancien mot de passe incorrect';
                        break;
                    case 'auth/requires-recent-login':
                        message = '❌ Session trop ancienne. Reconnectez-vous.';
                        break;
                    case 'auth/too-many-requests':
                        message = '❌ Trop de tentatives. Attendez un moment.';
                        break;
                    default:
                        message = `❌ ${error.message}`;
                }
                showMessage(message, 'error');
            } finally {
                changePasswordBtn.disabled = false;
                changePasswordBtn.innerHTML = 'CHANGER LE MOT DE PASSE';
            }
        }

        // Fonction de déconnexion
        async function handleLogout() {
            try {
                await signOut(auth);
                showMessage('Déconnecté avec succès', 'info');
            } catch (error) {
                showMessage(`Erreur de déconnexion: ${error.message}`, 'error');
            }
        }

        // Fonction pour tester la réauthentification uniquement
        async function testReauth() {
            const oldPwd = oldPassword.value.trim();
            if (!oldPwd) {
                showMessage('Veuillez entrer votre mot de passe actuel dans le champ "Ancien mot de passe"', 'warning');
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showMessage('Vous devez être connecté', 'error');
                return;
            }

            try {
                testReauthBtn.disabled = true;
                testReauthBtn.innerHTML = '<span class="loading"></span> Test...';

                const credential = EmailAuthProvider.credential(user.email, oldPwd);
                await reauthenticateWithCredential(user, credential);
                showMessage('✅ Réauthentification réussie ! Le mot de passe est correct.', 'success');

            } catch (error) {
                console.error('Erreur test réauth:', error);
                if (error.code === 'auth/wrong-password') {
                    showMessage('❌ Mot de passe incorrect', 'error');
                } else {
                    showMessage(`❌ Erreur: ${error.message}`, 'error');
                }
            } finally {
                testReauthBtn.disabled = false;
                testReauthBtn.innerHTML = '🔑 Tester réauthentification';
            }
        }

        // --- Événements ---
        loginBtn.addEventListener('click', handleLogin);

        // Enter pour se connecter
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        loginEmail.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        changePasswordBtn.addEventListener('click', handleChangePassword);

        // Enter pour changer le mot de passe
        confirmPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChangePassword();
        });

        logoutBtn.addEventListener('click', handleLogout);
        testReauthBtn.addEventListener('click', testReauth);

        // Vider les champs de connexion après déconnexion (géré par onAuthStateChanged)
        console.log('✅ App de test Firebase Auth prête');
    </script>

</body>
</html>
