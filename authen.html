<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLORIA DEI - Création & Authentification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(18, 18, 31, 0.95);
            border-radius: 24px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .logo .icon {
            font-size: 72px;
            display: block;
            margin-bottom: 10px;
        }
        .logo h1 {
            color: #ffd700;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .logo h1 span {
            color: #fff;
        }
        .logo .subtitle {
            color: #64748b;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .info-box {
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0 25px 0;
            font-size: 13px;
            color: #94a3b8;
            line-height: 2;
            text-align: left;
        }
        .info-box strong {
            color: #ffd700;
        }
        .info-box .label {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-box .value {
            color: #fff;
            font-weight: 500;
            float: right;
        }
        .info-box .value.email {
            color: #60a5fa;
        }
        .info-box .value.pass {
            color: #f59e0b;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .btn-auth {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #ffd700, #fbbf24);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-auth:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.35);
        }
        .btn-auth:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-auth .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(15, 23, 42, 0.2);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-auth.loading .spinner {
            display: inline-block;
        }
        .btn-auth.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-msg {
            margin-top: 16px;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            line-height: 1.6;
        }
        .status-msg.show {
            display: block;
        }
        .status-msg.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        .status-msg.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .status-msg.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }
        .status-msg.warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }
        .badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #ffd700;
            color: #0f172a;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #334155;
        }
        .check-icon {
            color: #10b981;
            font-weight: bold;
        }
        .cross-icon {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <span class="icon">🏫</span>
            <h1>GLORIA <span>DEI</span></h1>
            <div class="subtitle">Complexe Scolaire</div>
        </div>

        <div class="info-box">
            <span class="badge">🔐 Création & Authentification</span>
            <br><br>
            <div><span class="label">📛 École</span><span class="value"><strong>GLORIA_DEI</strong></span></div>
            <div><span class="label">📧 Email Direction</span><span class="value email">direction.gloriadei@gmail.com</span></div>
            <div><span class="label">🔑 Mot de passe</span><span class="value pass">12345678</span></div>
            <div><span class="label">👑 Rôle</span><span class="value" style="color:#ffd700;">DIRECTION</span></div>
        </div>

        <button class="btn-auth" id="authBtn">
            <span class="spinner"></span>
            <span class="btn-text">🚀 CRÉER & AUTHENTIFIER</span>
        </button>

        <div class="status-msg" id="statusMsg"></div>

        <div class="footer">Firebase • GLORIA DEI • Direction</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "firebase/auth";
        import { getFirestore, doc, setDoc, getDoc } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
            authDomain: "netubexmoney.firebaseapp.com",
            databaseURL: "https://netubexmoney-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "netubexmoney",
            storageBucket: "netubexmoney.firebasestorage.app",
            messagingSenderId: "856592608176",
            appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // CONSTANTES
        const SCHOOL_NAME = 'GLORIA_DEI';
        const SCHOOL_DISPLAY = 'GLORIA DEI';
        const DIRECTION_EMAIL = 'direction.gloriadei@gmail.com';
        const DIRECTION_PASSWORD = '12345678';
        const ROLE = 'direction';

        const authBtn = document.getElementById('authBtn');
        const statusMsg = document.getElementById('statusMsg');

        function setStatus(type, message) {
            statusMsg.className = 'status-msg show ' + type;
            statusMsg.innerHTML = message;
        }

        async function createAndAuthenticate() {
            authBtn.disabled = true;
            authBtn.classList.add('loading');
            setStatus('info', '⏳ Création de GLORIA DEI et authentification en cours...');

            try {
                // ÉTAPE 1: Créer le compte utilisateur Firebase Auth
                setStatus('info', '📧 Création du compte direction...');
                
                let user = null;
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, DIRECTION_EMAIL, DIRECTION_PASSWORD);
                    user = userCredential.user;
                    setStatus('info', '✅ Compte direction créé avec succès !');
                } catch (authError) {
                    if (authError.code === 'auth/email-already-in-use') {
                        setStatus('warning', '⚠️ Le compte existe déjà. Tentative de connexion...');
                        const userCredential = await signInWithEmailAndPassword(auth, DIRECTION_EMAIL, DIRECTION_PASSWORD);
                        user = userCredential.user;
                    } else {
                        throw authError;
                    }
                }

                if (!user) {
                    throw new Error('Impossible de créer ou connecter le compte');
                }

                // ÉTAPE 2: Créer le document de l'école dans Firestore
                setStatus('info', '🏫 Création de l\'école GLORIA DEI...');
                
                const ecoleRef = doc(db, 'ecoles', SCHOOL_NAME);
                const ecoleSnap = await getDoc(ecoleRef);
                
                if (!ecoleSnap.exists()) {
                    await setDoc(ecoleRef, {
                        _createdAt: new Date().toISOString(),
                        _createdBy: user.uid,
                        _type: 'ecole',
                        nom: `COMPLEXE SCOLAIRE ${SCHOOL_DISPLAY}`,
                        adresse: 'Kinshasa, RDC'
                    });

                    // Créer settings/data
                    const settingsRef = doc(db, 'ecoles', SCHOOL_NAME, 'settings', 'data');
                    await setDoc(settingsRef, {
                        nom: `COMPLEXE SCOLAIRE ${SCHOOL_DISPLAY}`,
                        adresse: 'Kinshasa, RDC',
                        codeAcces: '123456',
                        _createdAt: new Date().toISOString()
                    });

                    // Créer les collections vides
                    const collections = ['compta_eleves', 'fiches', 'professeurs', 'punitions', 'corbeille', 'config'];
                    for (const col of collections) {
                        const placeholderRef = doc(db, 'ecoles', SCHOOL_NAME, col, '_placeholder');
                        await setDoc(placeholderRef, {
                            _type: 'placeholder',
                            _createdAt: new Date().toISOString(),
                            _message: 'Collection créée automatiquement'
                        });
                    }

                    // Créer les options
                    const optionsRef = doc(db, 'ecoles', SCHOOL_NAME, 'config', 'options');
                    await setDoc(optionsRef, {
                        "7eme EB": [],
                        "8eme EB": [],
                        "1ere Annee": ["LATIN-PHILO", "SCIENCES", "PEDAGOGIE GENERALE", "COMMERCIALE ET GESTION", "ELECTRICITE", "MECANIQUE GENERALE", "COUPE ET COUTURE"],
                        "2eme Annee": ["LATIN-PHILO", "SCIENCES", "PEDAGOGIE GENERALE", "COMMERCIALE ET GESTION", "ELECTRICITE", "MECANIQUE GENERALE", "COUPE ET COUTURE"],
                        "3eme Annee": ["LATIN-PHILO", "SCIENCES", "PEDAGOGIE GENERALE", "COMMERCIALE ET GESTION", "ELECTRICITE", "MECANIQUE GENERALE", "COUPE ET COUTURE"],
                        "4eme Annee": ["LATIN-PHILO", "SCIENCES", "PEDAGOGIE GENERALE", "COMMERCIALE ET GESTION", "ELECTRICITE", "MECANIQUE GENERALE", "COUPE ET COUTURE"]
                    });

                    setStatus('info', '✅ École GLORIA DEI créée avec succès !');
                } else {
                    setStatus('info', '✅ École GLORIA DEI existe déjà !');
                }

                // ÉTAPE 3: Lier l'utilisateur à l'école avec le rôle "direction"
                setStatus('info', '🔗 Liaison du compte direction à l\'école...');
                
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        email: DIRECTION_EMAIL,
                        school: SCHOOL_NAME,
                        role: ROLE,
                        createdAt: new Date().toISOString()
                    });
                } else {
                    // Mettre à jour si nécessaire
                    const userData = userSnap.data();
                    if (userData.school !== SCHOOL_NAME || userData.role !== ROLE) {
                        await setDoc(userRef, {
                            ...userData,
                            school: SCHOOL_NAME,
                            role: ROLE,
                            updatedAt: new Date().toISOString()
                        });
                    }
                }

                // SUCCÈS !
                setStatus('success', `
                    ✅ <strong>GLORIA DEI</strong> est authentifiée avec succès !
                    <br><br>
                    <div style="text-align:left; font-size:13px; background:rgba(0,0,0,0.2); padding:12px; border-radius:8px; margin-top:8px;">
                        <div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span style="color:#94a3b8;">📛 École</span>
                            <span style="color:#ffd700; font-weight:600;">${SCHOOL_DISPLAY}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span style="color:#94a3b8;">📧 Email</span>
                            <span style="color:#60a5fa; font-weight:600;">${DIRECTION_EMAIL}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span style="color:#94a3b8;">👑 Rôle</span>
                            <span style="color:#ffd700; font-weight:600;">DIRECTION</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; padding:3px 0;">
                            <span style="color:#94a3b8;">🔑 Code accès</span>
                            <span style="color:#10b981; font-weight:600; font-family:monospace;">123456</span>
                        </div>
                    </div>
                    <br>
                    <span style="font-size:12px; color:#94a3b8;">
                        ✅ Toutes les collections sont prêtes à être utilisées.
                    </span>
                `);

            } catch (error) {
                console.error('Erreur détaillée:', error);
                let errorMsg = error.message;
                if (error.code === 'auth/invalid-email') {
                    errorMsg = '❌ Email invalide';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = '❌ Mot de passe trop faible (8+ caractères)';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = '❌ Trop de tentatives, réessayez plus tard';
                }
                setStatus('error', `
                    ❌ Erreur : ${errorMsg}
                    <br>
                    <span style="font-size:12px; color:#64748b;">
                        Vérifiez votre connexion Internet et les règles Firestore.
                    </span>
                `);
            } finally {
                authBtn.disabled = false;
                authBtn.classList.remove('loading');
            }
        }

        // Bouton d'authentification
        authBtn.addEventListener('click', createAndAuthenticate);

        // Vérifier l'état de l'authentification
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === DIRECTION_EMAIL) {
                console.log('✅ Déjà authentifié :', user.email);
                // On pourrait afficher un message mais on laisse l'utilisateur cliquer
            }
        });

        // Authentification automatique au chargement
        console.log('🏫 GLORIA DEI - Création et authentification automatique...');
        setTimeout(createAndAuthenticate, 800);

        console.log('✅ App prête - GLORIA DEI Direction');
    </script>

</body>
</html>
