<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>GLORIA DEI - Authentification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:400px;width:100%;background:rgba(18,18,31,0.95);border-radius:32px;padding:48px 36px;text-align:center;border:1px solid rgba(255,215,0,0.12);box-shadow:0 30px 80px rgba(0,0,0,0.7)}
.icon{font-size:72px;display:block;margin-bottom:10px}
h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#64748b;font-size:11px;letter-spacing:4px;text-transform:uppercase;margin-top:2px}
.divider{width:50px;height:2px;background:linear-gradient(90deg,#ffd700,#fbbf24);border-radius:2px;margin:14px auto}
.info-box{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:14px;margin:16px 0;font-size:13px;color:#94a3b8;line-height:2;text-align:left}
.info-box .label{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.info-box .value{color:#fff;font-weight:500;float:right}
.info-box .value.email{color:#60a5fa}
.btn{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,#ffd700,#fbbf24);color:#0f172a;font-weight:700;border:none;cursor:pointer;font-size:16px;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,215,0,0.3)}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn .spinner{display:none;width:20px;height:20px;border:3px solid rgba(15,23,42,0.2);border-top-color:#0f172a;border-radius:50%;animation:spin 0.8s linear infinite}
.btn.loading .spinner{display:inline-block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.status{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;font-weight:500;display:none;line-height:1.6}
.status.show{display:block}
.status.success{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#10b981}
.status.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444}
.status.info{background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);color:#60a5fa}
.badge{display:inline-block;padding:3px 14px;border-radius:30px;font-size:10px;font-weight:700;text-transform:uppercase;background:#ffd700;color:#0f172a}
.footer{color:#334155;font-size:10px;margin-top:18px;border-top:1px solid rgba(255,255,255,0.04);padding-top:14px}
</style>
</head>
<body>

<div class="container">
    <span class="icon">🏫</span>
    <h1>GLORIA DEI</h1>
    <div class="sub">Complexe Scolaire</div>
    <div class="divider"></div>

    <div class="info-box">
        <span class="badge">🔐 Authentification</span>
        <br><br>
        <div><span class="label">📛 École</span><span class="value"><strong>GLORIA_DEI</strong></span></div>
        <div><span class="label">📧 Email Direction</span><span class="value email">direction.gloriadei@gmail.com</span></div>
        <div><span class="label">👑 Rôle</span><span class="value" style="color:#ffd700;">DIRECTION</span></div>
    </div>

    <button class="btn" id="authBtn">
        <span class="spinner"></span>
        <span class="btn-text">🔑 AUTHENTIFIER L'ÉCOLE</span>
    </button>

    <div class="status" id="status"></div>
    <div class="footer">© 2026 - NeTubeX SARL</div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, getDoc, setDoc } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
    authDomain: "netubexmoney.firebaseapp.com",
    databaseURL: "https://netubexmoney-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "netubexmoney",
    storageBucket: "netubexmoney.firebasestorage.app",
    messagingSenderId: "856592608176",
    appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SCHOOL_NAME = 'GLORIA_DEI';
const DIRECTION_EMAIL = 'direction.gloriadei@gmail.com';
const DIRECTION_PASSWORD = '12345678';

const authBtn = document.getElementById('authBtn');
const status = document.getElementById('status');

function setStatus(type, message) {
    status.className = 'status show ' + type;
    status.innerHTML = message;
}

async function authenticate() {
    authBtn.disabled = true;
    authBtn.classList.add('loading');
    setStatus('info', '⏳ Authentification de GLORIA DEI...');

    try {
        // ÉTAPE 1: Se connecter avec Firebase Auth
        setStatus('info', '📧 Connexion à Firebase Auth...');
        let user;
        try {
            const userCredential = await signInWithEmailAndPassword(auth, DIRECTION_EMAIL, DIRECTION_PASSWORD);
            user = userCredential.user;
        } catch (authError) {
            if (authError.code === 'auth/user-not-found') {
                setStatus('info', '📝 Création du compte direction...');
                const userCredential = await signInWithEmailAndPassword(auth, DIRECTION_EMAIL, DIRECTION_PASSWORD);
                user = userCredential.user;
            } else {
                throw authError;
            }
        }

        if (!user) throw new Error('Impossible de s\'authentifier');

        // ÉTAPE 2: Vérifier/créer le document utilisateur
        setStatus('info', '🔍 Vérification du profil direction...');
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            await setDoc(userRef, {
                email: DIRECTION_EMAIL,
                school: SCHOOL_NAME,
                role: 'direction',
                createdAt: new Date().toISOString()
            });
        }

        // ÉTAPE 3: Vérifier/créer l'école
        setStatus('info', '🏫 Vérification de l\'école...');
        const ecoleRef = doc(db, 'ecoles', SCHOOL_NAME);
        const ecoleSnap = await getDoc(ecoleRef);

        if (!ecoleSnap.exists()) {
            await setDoc(ecoleRef, {
                _createdAt: new Date().toISOString(),
                _createdBy: user.uid,
                _type: 'ecole',
                nom: 'COMPLEXE SCOLAIRE GLORIA DEI',
                adresse: 'Kinshasa, RDC'
            });

            const settingsRef = doc(db, 'ecoles', SCHOOL_NAME, 'settings', 'data');
            await setDoc(settingsRef, {
                nom: 'COMPLEXE SCOLAIRE GLORIA DEI',
                adresse: 'Kinshasa, RDC',
                codeAcces: '123456',
                _createdAt: new Date().toISOString()
            });

            const collections = ['compta_eleves', 'fiches', 'professeurs', 'punitions', 'corbeille', 'config'];
            for (const col of collections) {
                const placeholderRef = doc(db, 'ecoles', SCHOOL_NAME, col, '_placeholder');
                await setDoc(placeholderRef, {
                    _type: 'placeholder',
                    _createdAt: new Date().toISOString()
                });
            }
        }

        // SUCCÈS
        setStatus('success', `
            ✅ <strong>GLORIA DEI</strong> authentifiée avec succès !
            <br><br>
            <div style="text-align:left;font-size:12px;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;margin-top:6px;">
                <div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="color:#94a3b8;">📛 École</span>
                    <span style="color:#ffd700;font-weight:600;">${SCHOOL_NAME}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="color:#94a3b8;">📧 Email</span>
                    <span style="color:#60a5fa;font-weight:600;">${DIRECTION_EMAIL}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:2px 0;">
                    <span style="color:#94a3b8;">👑 Rôle</span>
                    <span style="color:#ffd700;font-weight:600;">DIRECTION</span>
                </div>
            </div>
            <br>
            <span style="font-size:12px;color:#94a3b8;">🔑 Code d'accès : <strong style="color:#ffd700;">123456</strong></span>
        `);

        authBtn.textContent = '✅ AUTHENTIFIÉ';
        authBtn.style.background = '#10b981';
        authBtn.style.color = 'white';

    } catch (error) {
        console.error('Erreur:', error);
        setStatus('error', `
            ❌ Erreur : ${error.message}
            <br>
            <span style="font-size:12px;color:#64748b;">
                Vérifiez votre connexion Internet.
            </span>
        `);
    } finally {
        authBtn.disabled = false;
        authBtn.classList.remove('loading');
    }
}

authBtn.addEventListener('click', authenticate);

onAuthStateChanged(auth, (user) => {
    if (user && user.email === DIRECTION_EMAIL) {
        console.log('✅ Déjà authentifié');
        authenticate();
    }
});

console.log('🏫 GLORIA DEI - Authentification');
console.log('📧', DIRECTION_EMAIL);
console.log('🔑', DIRECTION_PASSWORD);
</script>
</body>
</html>
