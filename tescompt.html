function toast(message, type = "success") {
const container = document.getElementById("toastContainer");
if (!container) return;
const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
const titles = { success: "Succès", error: "Erreur", warning: "Attention", info: "Information" };
const colors = { success: "#10b981", error: "#ef4444", warning: "#f59e0b", info: "#3b82f6" };

el.className = `toast-notification ${type}`;

container.appendChild(el);
requestAnimationFrame(() => el.classList.add("show"));
setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3500);
}

function getMoisActuel() {
const date = new Date();
const mois = date.getMonth();
if(mois >= 8) return moisListe[mois - 8];
else if(mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function getMoisFromDate(dateISO) {
if (!dateISO) return "Septembre";
const date = new Date(dateISO);
const mois = date.getMonth();
if (mois >= 8) return moisListe[mois - 8];
else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function estMoisDansAnnee(mois) {
const moisActuel = getMoisActuel();
const idx = moisListe.indexOf(mois);
const idxActuel = moisListe.indexOf(moisActuel);
if(idxActuel === -1) return false;
return idx <= idxActuel;
}

function getCacheKey(question, eleveData) {
const hash = getDataHash(eleveData);
if (!hash) return null;
return `${hash}_${question.toLowerCase().trim().replace(/\s+/g, ' ')}`;
}

function getDataHash(eleveData) {
if (!eleveData) return null;
const dataStr = JSON.stringify({
nom: eleveData.nom,
prenom: eleveData.prenom,
sexe: eleveData.sexe,
classe: eleveData.classe,
frais: eleveData.frais
});
let hash = 0;
for (let i = 0; i < dataStr.length; i++) {
const char = dataStr.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash = hash & hash;
}
return hash.toString();
}

function getSexePronom(sexe) {
if (sexe === 'F' || sexe === 'Féminin' || sexe === 'fille') {
return { genre: 'fille', pronom: 'elle', possessif: 'sa' };
}
return { genre: 'garçon', pronom: 'il', possessif: 'son' };
}

function convertirNombreEnFrancais(n) {
if (n === 0) return 'zéro';
if (n < 0) return 'moins ' + convertirNombreEnFrancais(-n);
const unite = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const dizaine = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante-dix', 'quatre-vingt', 'quatre-vingt-dix'];
if (n < 20) return unite[n];
if (n < 100) {
const d = Math.floor(n / 10);
const u = n % 10;
if (d === 7 || d === 9) {
const base = (d === 7) ? 'soixante' : 'quatre-vingt';
const reste = (d === 7) ? n - 60 : n - 80;
return base + '-' + convertirNombreEnFrancais(reste);
}
if (u === 0) {
if (d === 8) return 'quatre-vingts';
return dizaine[d];
}
if (d === 8) return 'quatre-vingt-' + unite[u];
return dizaine[d] + '-' + unite[u];
}
if (n < 1000) {
const c = Math.floor(n / 100);
const r = n % 100;
if (c === 1) {
if (r === 0) return 'cent';
return 'cent ' + convertirNombreEnFrancais(r);
}
if (r === 0) return unite[c] + ' cents';
return unite[c] + ' cent ' + convertirNombreEnFrancais(r);
}
if (n < 1000000) {
const m = Math.floor(n / 1000);
const r = n % 1000;
if (m === 1) {
if (r === 0) return 'mille';
return 'mille ' + convertirNombreEnFrancais(r);
}
if (r === 0) return convertirNombreEnFrancais(m) + ' mille';
return convertirNombreEnFrancais(m) + ' mille ' + convertirNombreEnFrancais(r);
}
return n.toString();
}

function voixParentale(texte) {
if (!texte || !window.speechSynthesis) return;
window.speechSynthesis.cancel();
let texteParle = texte.replace(/[📊💰📝📅⚠️✅❌👨‍👩‍👧‍👦🔑💡📌👉💬🏫👋🎯🌟👍👌📖🔒❌⚠️✅💰📝📅]/g, '');
texteParle = texteParle.replace(/\*\*/g, '').replace(/[\(\)]/g, '').replace(/[|]/g, '');
texteParle = texteParle.replace(/\n/g, '. ').replace(/\.\./g, '.').replace(/\./g, '. ');
texteParle = texteParle.replace(/\?/g, '? ').replace(/\!/g, '! ').replace(/:/g, ': ');
texteParle = texteParle.replace(/(\d{1,3}(?:[\s.,]\d{3})*)\s*FC/g, (match, p1) => {
const num = parseInt(p1.replace(/[\s.,]/g, ''));
if (num >= 1000) return convertirNombreEnFrancais(num) + ' francs congolais';
return convertirNombreEnFrancais(num) + ' francs congolais';
});
texteParle = texteParle.replace(/(\d+)\s*FC/g, (match, p1) => {
const num = parseInt(p1);
if (num >= 1000) return convertirNombreEnFrancais(num) + ' francs congolais';
return convertirNombreEnFrancais(num) + ' francs congolais';
});
const utterance = new SpeechSynthesisUtterance(texteParle);
utterance.lang = 'fr-FR';
utterance.rate = 0.65;
utterance.pitch = 1;
const voices = window.speechSynthesis.getVoices();
const voixFR = voices.find(v => v.lang.startsWith('fr'));
if (voixFR) utterance.voice = voixFR;
window.speechSynthesis.speak(utterance);
}

async function getDernierCommunique() {
try {
const q = query(collection(db, SCHOOL_PREFIX + "_communiques"), where("actif", "==", true), orderBy("date", "desc"), limit(1));
const snap = await getDocs(q);
if (snap.empty) return null;
const docSnap = snap.docs[0];
const data = docSnap.data();
const dateComm = new Date(data.date);
const aujourdhui = new Date();
const diffJours = Math.floor((aujourdhui - dateComm) / (1000 * 60 * 60 * 24));
if (diffJours > 7) return null;
return {
titre: data.titre || "Nouveau communiqué",
contenu: data.contenu || "",
date: dateComm.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
statut: diffJours === 0 ? "Aujourd'hui" : diffJours === 1 ? "Hier" : `Il y a ${diffJours} jours`,
priorite: data.priorite || "moyenne"
};
} catch (error) { return null; }
}

async function obtenirInfosFinancieresAvecPaiements(code) {
try {
let q = query(collection(db, "ecoles", SCHOOL_PREFIX, "compta_eleves"), where("parentCode", "==", code), where("_type", "==", "compta_eleve"));
let snap = await getDocs(q);
if (snap.empty) {
q = query(collection(db, SCHOOL_PREFIX + "_compta_eleves"), where("parentCode", "==", code), where("_type", "==", "compta_eleve"));
snap = await getDocs(q);
}
if (snap.empty) return null;
const eleves = [];
const moisActuel = getMoisActuel();
snap.forEach(doc => {
const data = doc.data();
const paiements = data.paiements || {};
const minerval = data.minerval || 45000;
const totalAnnuel = minerval * 10;
let totalPaye = 0;
let moisImpayes = [];
const dateInscription = data.dateInscription || new Date().toISOString();
const moisInscription = getMoisFromDate(dateInscription);
const indexInscription = moisListe.indexOf(moisInscription);
const indexActuel = moisListe.indexOf(moisActuel);

// Calculer le total payé sur TOUS les mois
for (let i = 0; i < moisListe.length; i++) {
const montant = paiements[moisListe[i]]?.montant || 0;
totalPaye += montant;
}

// Calculer les mois impayés sur la période écoulée seulement
for (let i = indexInscription; i < indexActuel; i++) {
const mois = moisListe[i];
if (!estMoisDansAnnee(mois)) continue;
const montant = paiements[mois]?.montant || 0;
if (montant < minerval && !data.exonere) {
moisImpayes.push(mois);
}
}

const reste = totalAnnuel - totalPaye;
let statut = "En ordre";
if (data.exonere) statut = "Exonéré";
else if (moisImpayes.length >= 3) statut = "Liste noire";
else if (moisImpayes.length > 0) statut = "Paiement partiel";
else if (totalPaye === 0) statut = "Aucun paiement";

eleves.push({
id: data.eleveId,
nom: data.nom,
prenom: data.prenom || "",
sexe: data.sexe || "M",
classe: data.classe,
option: data.option || "",
exonere: data.exonere || false,
minerval: minerval,
totalAnnuel: totalAnnuel,
totalPaye: totalPaye,
reste: reste,
moisImpayes: moisImpayes,
statut: statut,
parentCode: data.parentCode,
dateInscription: dateInscription,
abandon: data.abandon || false
});
});
return eleves.filter(e => !e.abandon);
} catch (e) {
return null;
}
}

async function getQuestionCountForCode(code) {
if (!code || code.length !== 6) return 0;
const today = new Date().toISOString().slice(0, 10);
try {
const docRef = doc(db, SCHOOL_PREFIX + "_parent_usage", code);
const docSnap = await getDoc(docRef);
if (docSnap.exists()) {
const data = docSnap.data();
if (data.date === today) return data.count || 0;
}
return 0;
} catch (e) { return 0; }
}

async function incrementQuestionCount(code) {
if (!code || code.length !== 6) return 0;
const today = new Date().toISOString().slice(0, 10);
try {
const docRef = doc(db, SCHOOL_PREFIX + "_parent_usage", code);
const docSnap = await getDoc(docRef);
let currentCount = 0;
if (docSnap.exists()) {
const data = docSnap.data();
if (data.date === today) currentCount = data.count || 0;
}
const newCount = currentCount + 1;
await setDoc(docRef, { code: code, count: newCount, date: today, ecole: SCHOOL_PREFIX, lastUpdated: new Date().toISOString() });
return newCount;
} catch (e) { return 0; }
}

function addMessage(text, sender = 'bot') {

bubble.className = 'bubble';

container.appendChild(div);
container.scrollTop = container.scrollHeight;
}

function createTypingIndicator() {
const div = document.createElement('div');
div.className = 'chat-msg bot';
div.id = 'typingIndicator';
div.innerHTML = '<div class="typing-indicator"><span>en train d\'écrire</span><div class="typing-dots"><span></span><span></span><span></span></div></div>';
return div;
}

async function typeWriterEffect(element, text, speed = 12) {
element.innerHTML = '';
for (let i = 0; i < text.length; i++) {
element.innerHTML += text.charAt(i);
await new Promise(r => setTimeout(r, speed));
}
}

function getSalutation() {
const h = new Date().getHours();
if (h < 12) return "Bonjour";
if (h < 18) return "Bon après-midi";
return "Bonsoir";
}

async function genererReponseFrais(eleveData) {
const nomComplet = `${eleveData.nom} ${eleveData.prenom || ''}`;
const frais = eleveData.frais;
let reponse = `Alors, parlons des frais de ${nomComplet}.\n\n`;
reponse += `Le minerval est de ${frais.minerval.toLocaleString()} francs congolais par mois.\n`;
reponse += `${frais.totalPaye.toLocaleString()} francs ont déjà été payés.\n`;
reponse += `Il reste ${frais.reste.toLocaleString()} francs à payer.\n`;
const nbImpayes = frais.moisImpayes.length;
if (frais.totalPaye === 0 && nbImpayes === 0) {
reponse += `\nVotre enfant n'a pas encore de mois à payer.`;
} else if (nbImpayes === 0) {
reponse += `\nVotre enfant est en ordre.`;
} else if (nbImpayes === 1) {
reponse += `\nIl manque 1 mois : ${frais.moisImpayes[0]}.`;
} else if (nbImpayes === 2) {
reponse += `\nIl manque 2 mois : ${frais.moisImpayes.join(' et ')}.`;
} else if (nbImpayes >= 3) {
reponse += `\nURGENT : Il manque ${nbImpayes} mois !`;
}
return reponse;
}

async function genererReponseNotes(eleveData) {
return `${eleveData.nom} ${eleveData.prenom || ''} n'a pas encore de notes enregistrées dans le système parental. Contactez l'école pour plus d'informations.`;
}

async function genererReponsePresence(eleveData) {

}

async function genererReponsePunitions(eleveData) {
return `Je n'ai pas d'informations de punitions pour ${eleveData.nom} ${eleveData.prenom || ''} dans le système parental.`;
}

function genererPropositions(eleveData) {
const nomComplet = `${eleveData.nom} ${eleveData.prenom || ''}`;
const sections = ['frais', 'notes', 'presence', 'punitions'];
const nonVisitees = sections.filter(s => !eleveData.sectionsVisitees?.includes(s));
if (nonVisitees.length === 0) return `\n\nVous avez vu toutes les informations sur ${nomComplet}.`;
let propositions = '\n\nVoulez-vous voir ';
const noms = nonVisitees.map(s => ({ frais: 'les frais', notes: 'les notes', presence: 'la présence', punitions: 'les punitions' }[s]));
if (noms.length === 1) propositions += noms[0] + ' maintenant ?';
else if (noms.length === 2) propositions += noms[0] + ' ou ' + noms[1] + ' ?';
else propositions += noms.slice(0, -1).join(', ') + ' ou ' + noms[noms.length - 1] + ' ?';
return propositions;
}

async function traiterMessage(message) {
const msg = message.trim().toLowerCase();
const nomEcole = schoolNameForDisplay;

const aujourdhui = new Date();
const jourSemaine = aujourdhui.getDay();
if (jourSemaine === 0) {
return `Désolé, aujourd'hui c'est dimanche. Veuillez revenir un jour ouvrable, entre le lundi et le samedi.`;
}

// Gestion du code parent
if (/^\d{6}$/.test(msg)) {
const code = msg;
const count = await getQuestionCountForCode(code);
if (count >= 10) {
return `⚠️ Limite quotidienne atteinte pour ce code parent. Veuillez revenir demain à partir de 08h00. Si vous avez besoin d'aide, contactez la comptabilité de l'école ${nomEcole}.`;
}
const infos = await obtenirInfosFinancieresAvecPaiements(code);
if (!infos || infos.length === 0) {
currentEleveData = null;
return `Code parent "${msg}" non reconnu à l'école ${nomEcole}. Veuillez vérifier votre code ou contacter la comptabilité.`;
}
currentParentCode = code;
await incrementQuestionCount(code);
if (infos.length === 1) {
updateUIForEleve(infos[0]);
return await afficherInfosEleve(infos[0]);
} else {
listeElevesEnAttente = infos;
enAttenteChoixEleve = true;
let reponse = `Plusieurs élèves sont liés à ce code parent :\n\n`;
infos.forEach((eleve, index) => {
const { pronom } = getSexePronom(eleve.sexe);
reponse += `${index+1}. ${eleve.nom} ${eleve.prenom || ''} (${pronom === 'il' ? 'garçon' : 'fille'}) - ${eleve.classe}${eleve.option ? ' ('+eleve.option+')' : ''}\n`;
});
reponse += `\nRépondez avec le numéro de l'élève (1. 2. 3...).`;
return reponse;
}
}

// Gestion du choix multi-élèves
if (enAttenteChoixEleve && listeElevesEnAttente.length > 0) {
const choix = parseInt(msg.trim());
if (!isNaN(choix) && choix >= 1 && choix <= listeElevesEnAttente.length) {
const eleveChoisi = listeElevesEnAttente[choix - 1];
enAttenteChoixEleve = false;
listeElevesEnAttente = [];
updateUIForEleve(eleveChoisi);
return await afficherInfosEleveMulti(eleveChoisi);
} else {
let listeNoms = listeElevesEnAttente.map((e, i) => {
const { pronom } = getSexePronom(e.sexe);
return `${i+1}. ${e.nom} ${e.prenom} (${pronom === 'il' ? 'garçon' : 'fille'})`;
}).join('\n');
return `Choix non reconnu. Choisissez un numéro entre 1 et ${listeElevesEnAttente.length} :\n\n${listeNoms}`;
}
}

// Gestion des questions après connexion
if (currentEleveData) {
const texteComplet = msg;
const motsBonjour = ['bonjour', 'salut', 'coucou', 'hello', 'hey', 'yo', 'bonsoir', 'bjr', 'slt'];
const motsMerci = ['merci', 'remerciement', 'remettre', 'je vous remercie', 'je te remercie', 'merci beaucoup', 'merci infiniment', 'merci bien', 'merci pour tout'];
const motsAurevoir = ['au revoir', 'bye', 'bye bye', 'ciao', 'adieu', 'à bientôt', 'à plus', 'à tout à l\'heure', 'à demain', 'à la prochaine', 'bonne journée', 'bonne soirée', 'bonne nuit'];
const estBonjour = motsBonjour.some(m => texteComplet.includes(m));
const estMerci = motsMerci.some(m => texteComplet.includes(m));
const estAurevoir = motsAurevoir.some(m => texteComplet.includes(m));

if (estBonjour) return `En tout cas! Je suis là à votre service.`;
if (estMerci) return `De rien, c'est un plaisir de vous aider.`;
if (estAurevoir) return `Au revoir ! Passez une excellente journée.`;

if (texteComplet.includes('frais') || texteComplet.includes('argent') || texteComplet.includes('payer') || texteComplet.includes('minerval')) {
const reponse = await genererReponseFrais(currentEleveData);
return reponse + genererPropositions(currentEleveData);
}
if (texteComplet.includes('note') || texteComplet.includes('résultat') || texteComplet.includes('point')) {
const reponse = await genererReponseNotes(currentEleveData);
return reponse + genererPropositions(currentEleveData);
}
if (texteComplet.includes('présence') || texteComplet.includes('absent') || texteComplet.includes('present')) {
const reponse = await genererReponsePresence(currentEleveData);
return reponse + genererPropositions(currentEleveData);
}
if (texteComplet.includes('punition') || texteComplet.includes('sanction') || texteComplet.includes('comportement')) {
const reponse = await genererReponsePunitions(currentEleveData);
return reponse + genererPropositions(currentEleveData);
}
if (texteComplet.includes('résumé') || texteComplet.includes('tout') || texteComplet.includes('complet') || texteComplet.includes('global') || texteComplet.includes('info')) {
const frais = await genererReponseFrais(currentEleveData);
const notes = await genererReponseNotes(currentEleveData);
const presence = await genererReponsePresence(currentEleveData);
const punitions = await genererReponsePunitions(currentEleveData);
return `RÉSUMÉ\n\n${frais}\n\n${notes}\n\n${presence}\n\n${punitions}\n\nVoilà ce que je sais sur ${currentEleveData.nom} ${currentEleveData.prenom || ''}.`;
}

return await genererReponseFrais(currentEleveData) + genererPropositions(currentEleveData);
}

return `${getSalutation()} ! Entrez votre code parent. Si vous n'en avez pas, contactez la comptabilité de l'école ${nomEcole}.`;
}

async function envoyerMessage() {
if (estEnAttenteReponse) {
toast("Veuillez patienter, je suis en train d'écrire", 'warning');
return;
}
const input = document.getElementById('chatInput');
const message = input.value.trim();
if (!message) return;
input.value = '';
addMessage(message, 'user');
const typingIndicator = createTypingIndicator();
document.getElementById('chatMessages').appendChild(typingIndicator);
document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
estEnAttenteReponse = true;
try {
const reponse = await traiterMessage(message);
const typingElement = document.getElementById('typingIndicator');
if (typingElement) typingElement.remove();
const msgDiv = document.createElement('div');
msgDiv.className = 'chat-msg bot';
const bubble = document.createElement('div');
bubble.className = 'bubble';
msgDiv.appendChild(bubble);
document.getElementById('chatMessages').appendChild(msgDiv);
document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
await typeWriterEffect(bubble, reponse, 12);
document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
voixParentale(reponse);
} catch (error) {
const typingElement = document.getElementById('typingIndicator');
if (typingElement) typingElement.remove();
addMessage("Désolé, une erreur s'est produite. Veuillez réessayer.", 'bot');
} finally {
estEnAttenteReponse = false;
}
}
