<meta name="theme-color" content="#0a0e1a">
<title>Espace Direction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{height:100%;background:#f0f2f5}
body{min-height:100vh;background:#f0f2f5;font-family:'Inter',sans-serif;overflow-y:auto !important;overflow-x:hidden;-webkit-overflow-scrolling:touch;color:#1a2332;margin:0;padding:0;position:relative;width:100%}
body.reco-fullscreen .container{padding:0;max-width:100%}
body.reco-fullscreen .school-header,body.reco-fullscreen .tabs-container,body.reco-fullscreen #tabPunitions,body.reco-fullscreen #tabAdmin,body.reco-fullscreen #tabSettings{display:none!important}
body.reco-fullscreen #tabReco{display:block!important;height:100vh;padding:0;margin:0;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#ece5dd}
body.reco-fullscreen #tabReco .card{border-radius:0;margin:0;height:100vh;min-height:100vh;border:none;background:#ece5dd;display:flex;flex-direction:column}
body.reco-fullscreen .reco-header{border-radius:0;flex-shrink:0}
body.reco-fullscreen .reco-input-area{flex-shrink:0;background:#fff;padding:10px 12px;border-bottom:1px solid #e5e7eb;z-index:5}
body.reco-fullscreen .reco-body-wrapper{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
body.reco-fullscreen .reco-body{flex:1;overflow-y:auto;padding:12px 16px 8px;background:#ece5dd;display:flex;flex-direction:column;min-height:0;scroll-behavior:smooth;overscroll-behavior:contain}
body.reco-fullscreen .reco-body::-webkit-scrollbar{width:6px}
body.reco-fullscreen .reco-body::-webkit-scrollbar-track{background:#e5e7eb;border-radius:3px}
body.reco-fullscreen .reco-body::-webkit-scrollbar-thumb{background:#075e54;border-radius:3px}
body.reco-fullscreen .reco-footer-card{flex-shrink:0;height:150px;background:transparent;padding:0;border-top:none;text-align:center;color:transparent;font-size:0;font-weight:0;letter-spacing:0;line-height:0;z-index:10;display:flex;align-items:center;justify-content:center;box-shadow:none}
body.reco-fullscreen #recoMessagesContainer{flex:1;display:flex;flex-direction:column;gap:4px;min-height:0;padding-bottom:4px}
.container{max-width:1400px;margin:0 auto;padding:14px;min-height:calc(100vh - 60px)}
.school-header{background:#ffffff;border-radius:20px;padding:20px 28px;text-align:center;margin-bottom:20px;box-shadow:0 2px 16px rgba(0,0,0,0.06);border:1px solid #e8ecf0;position:relative}
.school-name{font-size:22px;font-weight:800;color:#1a2332;letter-spacing:.5px}
.school-name span{color:#2563eb}
.school-sub{font-size:12px;opacity:.7;margin-top:4px;color:#6b7280;font-weight:500}
.btn-logout{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#f1f3f5;color:#dc2626;border:1px solid #e5e7eb;padding:0;border-radius:50%;font-size:15px;font-weight:700;cursor:pointer;transition:all
