<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartes Élèves - Gloria Dei</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter',sans-serif;padding:20px;min-height:100vh}
.header{max-width:820px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.header h1{color:#ffd700;font-size:22px;font-weight:800}
.header h1 span{color:#94a3b8;font-size:13px;font-weight:400;display:block}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 24px;border-radius:40px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:all 0.2s}
.btn-primary{background:#ffd700;color:#0f172a}
.btn-primary:hover{opacity:0.9;transform:scale(0.98)}
.btn-success{background:#10b981;color:white}
.btn-success:hover{opacity:0.9;transform:scale(0.98)}
.controls{max-width:820px;margin:0 auto 20px;background:rgba(18,18,31,0.9);border-radius:16px;padding:14px 18px;border:1px solid rgba(255,215,0,0.15);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls label{color:#94a3b8;font-size:12px;font-weight:600}
.controls select,.controls input{padding:8px 14px;border-radius:10px;background:#2d3748;border:1px solid #334155;color:#fff;font-size:13px}
.controls .count{color:#ffd700;font-weight:700;font-size:14px;margin-left:auto}
.carte-grid{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media print{.carte-grid{grid-template-columns:repeat(2,1fr) !important;gap:10px !important}.header,.controls,.no-print{display:none !important}.carte{page-break-inside:avoid;box-shadow:none !important;border:1px solid #c9a84c !important}}
@media(max-width:600px){.carte-grid{grid-template-columns:1fr}}
.pagination{max-width:820px;margin:16px auto;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pagination button{padding:8px 16px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#cbd5e1;cursor:pointer;font-weight:600;font-size:12px;transition:all 0.2s}
.pagination button:hover{background:#ffd700;color:#0f172a}
.pagination button.active{background:#ffd700;color:#0f172a}
.pagination button:disabled{opacity:0.3;cursor:not-allowed}
.empty{color:#64748b;text-align:center;padding:60px;font-size:16px}

.carte{
width:100%;
max-width:360px;
aspect-ratio:85/54;
background:#ffffff;
border-radius:8px;
padding:8px 12px;
position:relative;
overflow:hidden;
border:1.5px solid #c9a84c;
box-shadow:0 4px 16px rgba(0,0,0,0.25);
transition:transform 0.2s;
margin:0 auto;
}
.carte:hover{transform:translateY(-2px)}

.carte-guilloche{
position:absolute;
top:0;left:0;right:0;bottom:0;
background:
repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(201,168,76,0.025) 2px, rgba(201,168,76,0.025) 3px),
repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(201,168,76,0.025) 2px, rgba(201,168,76,0.025) 3px);
pointer-events:none;
z-index:1;
border-radius:6px;
}

.carte-bande{
position:absolute;
left:0;top:0;bottom:0;
width:4px;
border-radius:6px 0 0 6px;
z-index:2;
}
.carte-bande.eb{background:#d97706}
.carte-bande.humanites{background:#1d4ed8}
.carte-bande.scientifique{background:#059669}
.carte-bande.litteraire{background:#7c3aed}
.carte-bande.commerciale{background:#db2777}
.carte-bande.technique{background:#ea580c}

.carte-content{
position:relative;
z-index:3;
height:100%;
display:flex;
flex-direction:column;
}

.carte-header-card{
display:flex;
justify-content:space-between;
align-items:center;
padding-left:4px;
border-bottom:1.5px solid #c9a84c;
padding-bottom:2px;
}
.carte-header-card .ecole{
font-size:9px;
font-weight:800;
color:#0f2b44;
letter-spacing:1px;
text-transform:uppercase;
}
.carte-header-card .titre{
font-size:7px;
font-weight:700;
color:#c9a84c;
letter-spacing:1px;
text-transform:uppercase;
border:1px solid #c9a84c;
padding:1px 10px;
border-radius:3px;
}
.carte-header-card .annee{
font-size:6px;
color:#94a3b8;
font-weight:600;
letter-spacing:0.5px;
}

.carte-body{
display:flex;
gap:8px;
margin-top:3px;
padding-left:4px;
}
.carte-photo{
width:36px;
height:36px;
border-radius:50%;
background:linear-gradient(135deg,#1e293b,#334155);
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #c9a84c;
font-size:16px;
color:white;
}
.carte-identite{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.carte-identite .nom{font-size:10px;font-weight:800;color:#0f172a;line-height:1.15}
.carte-identite .nom small{font-weight:400;font-size:7px;color:#64748b}
.carte-identite .classe{font-size:7px;font-weight:600;color:#1e40af}
.carte-identite .matricule{font-size:6px;color:#64748b;font-weight:600;font-family:monospace;margin-top:1px}

.carte-infos{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:1px 6px;
margin-top:2px;
padding:3px 0 2px 4px;
border-top:1px solid rgba(201,168,76,0.12);
border-bottom:1px solid rgba(201,168,76,0.12);
}
.carte-infos .info{display:flex;flex-direction:column;gap:0px;font-size:6px;color:#475569}
.carte-infos .info .label{color:#94a3b8;font-size:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.carte-infos .info .value{font-weight:600;color:#0f172a;font-size:6.5px}
.carte-infos .info .value.code{color:#2563eb;font-family:monospace;font-size:7px;font-weight:700}
.carte-infos .info .value.sexe{color:#64748b;font-weight:600}

.carte-parents{
display:flex;
gap:10px;
padding:2px 0 1px 4px;
font-size:6px;
color:#475569;
border-bottom:1px solid rgba(201,168,76,0.08);
}
.carte-parents .parent{display:flex;align-items:center;gap:2px}
.carte-parents .parent .nom{font-weight:600;color:#0f172a}

.carte-bottom{
display:flex;
gap:8px;
padding:2px 0 1px 4px;
align-items:center;
flex:1;
}
.carte-barcode{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
}
.carte-barcode .barcode-wrapper{
background:white;
padding:2px 4px;
border-radius:3px;
border:1px solid rgba(201,168,76,0.12);
display:flex;
align-items:center;
justify-content:center;
width:100%;
}
.carte-barcode .barcode-wrapper svg{
height:18px !important;
width:100% !important;
max-width:130px;
}
.carte-barcode .barcode-label{
font-size:4.5px;
color:#94a3b8;
font-weight:600;
letter-spacing:0.3px;
text-transform:uppercase;
margin-top:1px;
}
.carte-barcode .barcode-label strong{color:#0f2b44}

.carte-footer{
display:flex;
justify-content:space-between;
align-items:center;
padding:1px 4px 0 4px;
border-top:1px solid rgba(201,168,76,0.1);
margin-top:auto;
}
.carte-footer .mention{font-size:4.5px;color:#94a3b8;font-weight:500;letter-spacing:0.2px}
.carte-footer .mention strong{color:#0f2b44}
.carte-footer .perte{font-size:4px;color:#ef4444;font-weight:600}

.carte-premium-border{
position:absolute;
top:-1px;left:-1px;right:-1px;bottom:-1px;
border-radius:8px;
border:1.5px solid #c9a84c;
pointer-events:none;
z-index:5;
}

.carte-watermark{
position:absolute;
bottom:3px;right:5px;
font-size:11px;
font-weight:900;
color:rgba(15,43,68,0.025);
letter-spacing:3px;
pointer-events:none;
z-index:1;
transform:rotate(-6deg);
font-family:'Inter',sans-serif;
}
</style>
</head>
<body>

<div class="header">
<div>
<h1>🏫 GLORIA DEI SCHOOL <span>Génération de cartes d'élèves • Année 2026-2027</span></h1>
</div>
<div class="header-actions">
<button class="btn btn-primary" onclick="genererPDF()">📄 Exporter PDF</button>
<button class="btn btn-success" onclick="imprimer()">🖨️ Imprimer</button>
</div>
</div>

<div class="controls">
<label>Classe</label>
<select id="filterClasse" onchange="afficherCartes()">
<option value="">Toutes</option>
<option value="7eme EB">7eme EB</option>
<option value="8eme EB">8eme EB</option>
<option value="1ere Annee">1ere Annee</option>
<option value="2eme Annee">2eme Annee</option>
<option value="3eme Annee">3eme Annee</option>
<option value="4eme Annee">4eme Annee</option>
</select>
<label>Rechercher</label>
<input type="text" id="searchEleve" placeholder="Nom, matricule..." oninput="afficherCartes()" style="width:160px">
<label>Par page</label>
<select id="perPage" onchange="afficherCartes()">
<option value="8">8</option>
<option value="16">16</option>
<option value="24">24</option>
</select>
<span class="count" id="totalCount">Total: 0 élèves</span>
</div>

<div id="carteContainer" class="carte-grid"></div>
<div class="pagination" id="pagination"></div>

<script>
let elevesData = [];
let currentPage = 1;
let perPage = 8;

function getBandeClasse(classe){
if(classe.includes('EB')) return 'eb';
if(classe.includes('1ere') || classe.includes('2eme') || classe.includes('3eme') || classe.includes('4eme')){
const opt = arguments[1] || '';
if(opt.includes('SCIENCES')) return 'scientifique';
if(opt.includes('LATIN') || opt.includes('PHILO') || opt.includes('PEDAGOGIE')) return 'litteraire';
if(opt.includes('COMMERCIALE') || opt.includes('GESTION')) return 'commerciale';
if(opt.includes('ELECTRICITE') || opt.includes('MECANIQUE') || opt.includes('COUPE')) return 'technique';
return 'humanites';
}
return 'humanites';
}

function genererEleves(nb) {
const noms = ['KABEYA','LUMUMBA','TSHISEKEDI','KAMBA','MUTOMBO','KALALA','MWANZA','KIBANDA','LUKUSA','KASONGO','MUKENDI','KALONJI','TUNDA','KABILA','KATUMBA','MWEMBA','KALONJI','TUNDA'];
const prenoms = ['Jean','Pierre','Marie','Joseph','François','Jeanne','André','Pauline','Michel','Catherine','Daniel','Esther','David','Ruth','Emmanuel','Grace','Samuel','Sarah'];
const classes = ['7eme EB','8eme EB','1ere Annee','2eme Annee','3eme Annee','4eme Annee'];
const options = ['LATIN-PHILO','SCIENCES','PEDAGOGIE','COMMERCIALE','ELECTRICITE','MECANIQUE','COUPE-COUTURE',''];
const statuts = ['ACTIF','ACTIF','ACTIF','ACTIF','ACTIF','EXONÉRÉ','ACTIF','ACTIF'];

for(let i=0; i<nb; i++) {
const nom = noms[i % noms.length];
const prenom = prenoms[i % prenoms.length];
const sexe = i % 2 === 0 ? 'M' : 'F';
const classe = classes[i % classes.length];
const opt = (classe === '7eme EB' || classe === '8eme EB') ? '' : options[i % options.length];
const code = String(100000 + i).padStart(6, '0');
const matricule = 'GLD-' + String(i+1).padStart(4, '0');

elevesData.push({
id: 'eleve_' + i,
matricule: matricule,
nom: nom,
postnom: nom.slice(0,4) + 'a',
prenom: prenom,
dateNaissAff: String(1+i%28).padStart(2,'0') + '/' + String(1+i%12).padStart(2,'0') + '/' + String(2005 + i%10),
lieuNaiss: ['Kinshasa','Lubumbashi','Mbuji-Mayi','Kananga','Kisangani','Goma','Bukavu'][i%7],
sexe: sexe,
sexeLabel: sexe === 'M' ? 'Masculin' : 'Féminin',
classe: classe,
option: opt,
parentCode: code,
nomPere: nom + ' ' + ['Pierre','Jean','Joseph','Michel','David','Emmanuel'][i%6],
nomMere: nom + ' ' + ['Marie','Jeanne','Pauline','Catherine','Esther','Sarah'][i%6],
statut: statuts[i % statuts.length],
bande: getBandeClasse(classe, opt)
});
}
}

function getFiltered() {
const classe = document.getElementById('filterClasse').value;
const search = document.getElementById('searchEleve').value.toLowerCase();
perPage = parseInt(document.getElementById('perPage').value) || 8;
let result = [...elevesData];
if(classe) result = result.filter(e => e.classe === classe);
if(search) {
result = result.filter(e => 
e.nom.toLowerCase().includes(search) || 
e.prenom.toLowerCase().includes(search) ||
e.matricule.toLowerCase().includes(search) ||
e.parentCode.includes(search)
);
}
return result;
}

function afficherCartes() {
const filtered = getFiltered();
const total = filtered.length;
document.getElementById('totalCount').textContent = 'Total: ' + total + ' élèves';

if(total === 0) {
document.getElementById('carteContainer').innerHTML = '<div class="empty">Aucun élève trouvé</div>';
document.getElementById('pagination').innerHTML = '';
return;
}

const totalPages = Math.ceil(total / perPage);
if(currentPage > totalPages) currentPage = totalPages;
if(currentPage < 1) currentPage = 1;

const start = (currentPage - 1) * perPage;
const end = Math.min(start + perPage, total);
const pageData = filtered.slice(start, end);

const container = document.getElementById('carteContainer');
container.innerHTML = '';

pageData.forEach((e) => {
const div = document.createElement('div');
div.className = 'carte';
div.id = 'carte_' + e.id;
div.innerHTML = `
<div class="carte-guilloche"></div>
<div class="carte-bande ${e.bande}"></div>
<div class="carte-premium-border"></div>
<div class="carte-watermark">GLORIA DEI</div>
<div class="carte-content">
<div class="carte-header-card">
<span class="ecole">ECOLE GLORIA DEI</span>
<span class="titre">CARTE D'ELEVE</span>
<span class="annee">2026-2027</span>
</div>
<div class="carte-body">
<div class="carte-photo">${e.sexe === 'F' ? 'F' : 'M'}</div>
<div class="carte-identite">
<div class="nom">${e.nom} <small>${e.postnom}</small> ${e.prenom}</div>
<div class="classe">${e.classe} ${e.option ? '• ' + e.option : ''}</div>
<div class="matricule">Matricule: ${e.matricule}</div>
</div>
</div>
<div class="carte-infos">
<div class="info"><span class="label">Date de naissance</span><span class="value">${e.dateNaissAff}</span></div>
<div class="info"><span class="label">Lieu de naissance</span><span class="value">${e.lieuNaiss}</span></div>
<div class="info"><span class="label">Sexe</span><span class="value sexe">${e.sexeLabel}</span></div>
</div>
<div class="carte-parents">
<span class="parent">Pere: <span class="nom">${e.nomPere}</span></span>
<span class="parent">Mere: <span class="nom">${e.nomMere}</span></span>
</div>
<div class="carte-bottom">
<div class="carte-barcode">
<div class="barcode-wrapper"><svg id="barcode_${e.id}"></svg></div>
<span class="barcode-label"><strong>Scanner</strong> pour marquer votre présence</span>
</div>
</div>
<div class="carte-footer">
<span class="mention"><strong>Propriete de l'ecole</strong> • En cas de perte, prevenir la direction</span>
<span class="perte">Ne pas preter</span>
</div>
</div>
`;
container.appendChild(div);
});

setTimeout(() => {
document.querySelectorAll('.carte').forEach((carte, idx) => {
const e = pageData[idx];
if(!e) return;
try {
const barcodeId = 'barcode_' + e.id;
const svg = document.getElementById(barcodeId);
if(svg) {
JsBarcode('#' + barcodeId, e.matricule, {
format: "CODE128",
width: 1.4,
height: 20,
displayValue: true,
fontSize: 8,
font: 'monospace',
textAlign: 'center',
textPosition: 'bottom',
textMargin: 1,
fontWeight: 'bold',
background: '#ffffff',
lineColor: '#0f172a'
});
}
} catch(err) {}
});
}, 500);

const pagination = document.getElementById('pagination');
if(totalPages > 1) {
let html = '';
html += `<button onclick="goToPage(1)" ${currentPage===1?'disabled':''}>⏮</button>`;
html += `<button onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>◀</button>`;
let startP = Math.max(1, currentPage - 2);
let endP = Math.min(totalPages, currentPage + 2);
for(let p = startP; p <= endP; p++) {
html += `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`;
}
html += `<button onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>▶</button>`;
html += `<button onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>⏭</button>`;
pagination.innerHTML = html;
} else {
pagination.innerHTML = '';
}
}

function goToPage(p) {
currentPage = p;
afficherCartes();
window.scrollTo({top: 0, behavior: 'smooth'});
}

async function genererPDF() {
const filtered = getFiltered();
if(filtered.length === 0) { alert('Aucun élève à exporter'); return; }

const container = document.getElementById('carteContainer');
const cartes = container.querySelectorAll('.carte');
if(cartes.length === 0) { alert('Aucune carte à exporter'); return; }

const { jsPDF } = window.jspdf;
const doc = new jsPDF('p', 'mm', 'a4');
const cols = 2;
const rows = 4;
const cardWidth = 80;
const cardHeight = 51;
const marginX = 22;
const marginY = 18;
const gapX = 8;
const gapY = 8;

let totalCartes = 0;

for(let i = 0; i < cartes.length; i++) {
const carte = cartes[i];
try {
const canvas = await html2canvas(carte, {
scale: 6,
backgroundColor: '#ffffff',
allowTaint: true,
useCORS: true,
logging: false,
width: 360,
height: 228,
onclone: function(document) {
const cards = document.querySelectorAll('.carte');
cards.forEach(c => {
c.style.transform = 'none';
c.style.boxShadow = 'none';
});
}
});

const imgData = canvas.toDataURL('image/jpeg', 1.0);
const col = totalCartes % cols;
const row = Math.floor(totalCartes / cols) % rows;
const x = marginX + col * (cardWidth + gapX);
const y = marginY + row * (cardHeight + gapY);

if(totalCartes > 0 && totalCartes % (cols*rows) === 0) {
doc.addPage();
}

doc.addImage(imgData, 'JPEG', x, y, cardWidth, cardHeight);
totalCartes++;
} catch(err) {
console.error('Erreur carte ' + i, err);
}
}

doc.save('cartes_eleves_' + new Date().toISOString().slice(0,10) + '.pdf');
}

function imprimer() { window.print(); }

document.addEventListener('DOMContentLoaded', function() {
genererEleves(50);
afficherCartes();
});
</script>
</body>
</html>
