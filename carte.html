<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartes Élèves - Gloria Dei</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter',sans-serif;padding:20px;min-height:100vh}
.header{max-width:1200px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.header h1{color:#ffd700;font-size:24px;font-weight:800}
.header h1 span{color:#94a3b8;font-size:14px;font-weight:400;display:block}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 24px;border-radius:40px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:all 0.2s}
.btn-primary{background:#ffd700;color:#0f172a}
.btn-primary:hover{opacity:0.9;transform:scale(0.98)}
.btn-success{background:#10b981;color:white}
.btn-success:hover{opacity:0.9;transform:scale(0.98)}
.btn-outline{background:transparent;border:1.5px solid #ffd700;color:#ffd700}
.btn-outline:hover{background:rgba(255,215,0,0.1)}
.controls{max-width:1200px;margin:0 auto 20px;background:rgba(18,18,31,0.9);border-radius:16px;padding:16px 20px;border:1px solid rgba(255,215,0,0.15);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.controls label{color:#94a3b8;font-size:12px;font-weight:600}
.controls select,.controls input{padding:8px 14px;border-radius:10px;background:#2d3748;border:1px solid #334155;color:#fff;font-size:13px}
.controls .count{color:#ffd700;font-weight:700;font-size:14px;margin-left:auto}
.carte-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media print{.carte-grid{grid-template-columns:repeat(3,1fr) !important;gap:15px !important}.header,.controls,.no-print{display:none !important}.carte{page-break-inside:avoid;box-shadow:none !important;border:1px solid #c9a84c !important}}
@media(max-width:900px){.carte-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.carte-grid{grid-template-columns:1fr}}
.pagination{max-width:1200px;margin:20px auto;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pagination button{padding:8px 16px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#cbd5e1;cursor:pointer;font-weight:600;font-size:12px;transition:all 0.2s}
.pagination button:hover{background:#ffd700;color:#0f172a}
.pagination button.active{background:#ffd700;color:#0f172a}
.pagination button:disabled{opacity:0.3;cursor:not-allowed}
.empty{color:#64748b;text-align:center;padding:60px;font-size:16px}

.carte{
width:100%;
max-width:320px;
aspect-ratio:85/54;
background:linear-gradient(145deg,#f8f6f0,#e8e4dc);
border-radius:14px;
padding:10px 12px;
position:relative;
overflow:hidden;
border:2px solid #c9a84c;
box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,215,0,0.3);
transition:transform 0.2s;
margin:0 auto;
}
.carte:hover{transform:translateY(-3px)}

.carte-guilloche{
position:absolute;
top:0;left:0;right:0;bottom:0;
background:
radial-gradient(circle at 20% 30%, rgba(201,168,76,0.04) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(201,168,76,0.04) 0%, transparent 50%),
repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(201,168,76,0.02) 4px, rgba(201,168,76,0.02) 5px),
repeating-linear-gradient(-45deg, transparent, transparent 4px, rgba(201,168,76,0.02) 4px, rgba(201,168,76,0.02) 5px);
pointer-events:none;
z-index:1;
border-radius:12px;
}
.carte-guilloche::after{
content:'';
position:absolute;
top:8px;left:8px;right:8px;bottom:8px;
border:1px solid rgba(201,168,76,0.06);
border-radius:8px;
background:
repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(201,168,76,0.015) 3px, rgba(201,168,76,0.015) 4px),
repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(201,168,76,0.015) 3px, rgba(201,168,76,0.015) 4px);
}

.carte-bande{
position:absolute;
left:0;top:0;bottom:0;
width:8px;
border-radius:12px 0 0 12px;
z-index:2;
}
.carte-bande.eb{background:linear-gradient(180deg,#f59e0b,#d97706)}
.carte-bande.humanites{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.carte-bande.scientifique{background:linear-gradient(180deg,#10b981,#059669)}
.carte-bande.litteraire{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}
.carte-bande.commerciale{background:linear-gradient(180deg,#ec4899,#db2777)}
.carte-bande.technique{background:linear-gradient(180deg,#f97316,#ea580c)}

.carte-content{
position:relative;
z-index:3;
height:100%;
display:flex;
flex-direction:column;
}

.carte-top{
display:flex;
justify-content:space-between;
align-items:center;
padding-left:6px;
}
.carte-top .titre{
font-size:7px;
font-weight:800;
color:#0f2b44;
letter-spacing:2px;
text-transform:uppercase;
background:linear-gradient(135deg,#0f2b44,#071a2c);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}
.carte-top .annee{
font-size:5px;
color:#94a3b8;
font-weight:600;
letter-spacing:1px;
background:rgba(201,168,76,0.15);
padding:1px 8px;
border-radius:8px;
border:1px solid rgba(201,168,76,0.2);
}

.carte-ecole{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:2px;
padding-left:6px;
}
.carte-ecole .nom{
font-size:9px;
font-weight:800;
background:linear-gradient(135deg,#0f2b44,#071a2c);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
letter-spacing:0.5px;
}
.carte-ecole .badge-statut{
font-size:5px;
font-weight:700;
padding:1px 8px;
border-radius:8px;
text-transform:uppercase;
letter-spacing:0.5px;
}
.badge-statut.actif{background:#10b981;color:white}
.badge-statut.exonere{background:#f59e0b;color:white}
.badge-statut.abandon{background:#ef4444;color:white}

.carte-body{
display:flex;
gap:8px;
margin-top:4px;
flex:1;
padding-left:6px;
}
.carte-photo{
width:36px;
height:36px;
border-radius:50%;
background:linear-gradient(135deg,#1e293b,#334155);
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #c9a84c;
font-size:16px;
color:white;
box-shadow:0 2px 8px rgba(201,168,76,0.2);
}
.carte-identite{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.carte-identite .nom{font-size:9px;font-weight:800;color:#0f172a;line-height:1.1}
.carte-identite .nom small{font-weight:400;font-size:7px;color:#64748b}
.carte-identite .classe{font-size:7px;font-weight:600;color:#1e40af}
.carte-identite .matricule{font-size:6px;color:#94a3b8;font-family:monospace}

.carte-infos{
display:grid;
grid-template-columns:1fr 1fr;
gap:1px 8px;
margin-top:2px;
padding:3px 0 2px 6px;
border-top:1px solid rgba(201,168,76,0.15);
border-bottom:1px solid rgba(201,168,76,0.15);
}
.carte-infos .info{display:flex;align-items:center;gap:2px;font-size:6px;color:#475569}
.carte-infos .info .icon{font-size:7px;width:12px;text-align:center}
.carte-infos .info .label{color:#94a3b8;font-size:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.carte-infos .info .value{font-weight:600;color:#0f172a}
.carte-infos .info .value.code{color:#2563eb;font-family:monospace;font-size:7px;font-weight:800}

.carte-parents{
display:flex;
gap:8px;
padding:2px 0 2px 6px;
font-size:5.5px;
color:#475569;
border-bottom:1px solid rgba(201,168,76,0.1);
}
.carte-parents .parent{display:flex;align-items:center;gap:2px}
.carte-parents .parent .nom{font-weight:600;color:#0f172a}

.carte-codes{
display:flex;
gap:6px;
padding:3px 0 2px 6px;
align-items:center;
justify-content:space-between;
}
.carte-codes .qr-wrapper{
background:white;
padding:2px;
border-radius:4px;
border:1px solid rgba(201,168,76,0.2);
display:inline-block;
flex-shrink:0;
}
.carte-codes .qr-wrapper canvas,.carte-codes .qr-wrapper img{width:28px !important;height:28px !important;display:block}
.carte-codes .barcode-wrapper{
flex:1;
background:white;
padding:2px 4px;
border-radius:4px;
border:1px solid rgba(201,168,76,0.15);
display:flex;
align-items:center;
justify-content:center;
min-height:20px;
}
.carte-codes .barcode-wrapper svg{height:18px !important;width:100% !important;max-width:120px}
.carte-codes .code-label{font-size:4px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;writing-mode:vertical-lr;text-orientation:mixed;padding-right:2px}

.carte-footer{
display:flex;
justify-content:space-between;
align-items:center;
padding:2px 6px 0 6px;
border-top:1px solid rgba(201,168,76,0.15);
margin-top:auto;
}
.carte-footer .mention{font-size:4.5px;color:#94a3b8;font-weight:600;letter-spacing:0.3px}
.carte-footer .mention strong{color:#0f2b44}
.carte-footer .perte{font-size:4px;color:#ef4444;font-weight:600}
.carte-footer .propriete{font-size:4px;color:#c9a84c;font-weight:700;letter-spacing:0.5px}

.carte-premium-border{
position:absolute;
top:-1px;left:-1px;right:-1px;bottom:-1px;
border-radius:14px;
border:1.5px solid transparent;
background:linear-gradient(135deg,#c9a84c,#fbbf24,#c9a84c) border-box;
-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
z-index:5;
}
.carte-premium-border::after{
content:'';
position:absolute;
top:-2px;left:-2px;right:-2px;bottom:-2px;
border-radius:15px;
background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(251,191,36,0.05),rgba(201,168,76,0.15));
z-index:-1;
filter:blur(4px);
}

.carte-watermark{
position:absolute;
bottom:6px;right:8px;
font-size:16px;
font-weight:900;
color:rgba(15,43,68,0.03);
letter-spacing:4px;
pointer-events:none;
z-index:1;
transform:rotate(-8deg);
font-family:'Inter',sans-serif;
}
</style>
</head>
<body>

<div class="header">
<div>
<h1>🏫 GLORIA DEI SCHOOL <span>Génération de cartes d'élèves • Année 2026-2027</span></h1>
</div>
<div class="header-actions">
<button class="btn btn-primary" onclick="genererPDF()">📄 Exporter PDF</button>
<button class="btn btn-success" onclick="imprimer()">🖨️ Imprimer</button>
</div>
</div>

<div class="controls">
<label>📚 Classe</label>
<select id="filterClasse" onchange="afficherCartes()">
<option value="">Toutes</option>
<option value="7eme EB">7eme EB</option>
<option value="8eme EB">8eme EB</option>
<option value="1ere Annee">1ere Annee</option>
<option value="2eme Annee">2eme Annee</option>
<option value="3eme Annee">3eme Annee</option>
<option value="4eme Annee">4eme Annee</option>
</select>
<label>🔍 Rechercher</label>
<input type="text" id="searchEleve" placeholder="Nom, matricule..." oninput="afficherCartes()" style="width:180px">
<label>📋 Par page</label>
<select id="perPage" onchange="afficherCartes()">
<option value="9">9</option>
<option value="18">18</option>
<option value="27">27</option>
<option value="36">36</option>
</select>
<span class="count" id="totalCount">Total: 0 élèves</span>
</div>

<div id="carteContainer" class="carte-grid"></div>
<div class="pagination" id="pagination"></div>

<script>
let elevesData = [];
let currentPage = 1;
let perPage = 9;

function getBandeClasse(classe){
if(classe.includes('EB')) return 'eb';
if(classe.includes('1ere') || classe.includes('2eme') || classe.includes('3eme') || classe.includes('4eme')){
const opt = arguments[1] || '';
if(opt.includes('SCIENCES') || opt.includes('PHYSIQUE')) return 'scientifique';
if(opt.includes('LATIN') || opt.includes('PHILO') || opt.includes('PEDAGOGIE')) return 'litteraire';
if(opt.includes('COMMERCIALE') || opt.includes('GESTION')) return 'commerciale';
if(opt.includes('ELECTRICITE') || opt.includes('MECANIQUE') || opt.includes('COUPE')) return 'technique';
return 'humanites';
}
return 'humanites';
}

function genererEleves(nb) {
const noms = ['KABEYA','LUMUMBA','TSHISEKEDI','KAMBA','MUTOMBO','KALALA','MWANZA','KIBANDA','LUKUSA','KASONGO','MUKENDI','KALONJI','TUNDA','KABILA','KATUMBA'];
const prenoms = ['Jean','Pierre','Marie','Joseph','François','Jeanne','André','Pauline','Michel','Catherine','Daniel','Esther','David','Ruth','Emmanuel'];
const classes = ['7eme EB','8eme EB','1ere Annee','2eme Annee','3eme Annee','4eme Annee'];
const options = ['LATIN-PHILO','SCIENCES','PEDAGOGIE','COMMERCIALE','ELECTRICITE','MECANIQUE','COUPE-COUTURE',''];
const statuts = ['ACTIF','ACTIF','ACTIF','ACTIF','ACTIF','EXONÉRÉ','ACTIF','ACTIF'];

for(let i=0; i<nb; i++) {
const nom = noms[i % noms.length];
const prenom = prenoms[i % prenoms.length];
const sexe = i % 2 === 0 ? 'M' : 'F';
const classe = classes[i % classes.length];
const opt = (classe === '7eme EB' || classe === '8eme EB') ? '' : options[i % options.length];
const code = String(100000 + i).padStart(6, '0');
const matricule = 'GLD-' + String(i+1).padStart(4, '0');

elevesData.push({
id: 'eleve_' + i,
matricule: matricule,
nom: nom,
postnom: nom.slice(0,4) + 'a',
prenom: prenom,
dateNaiss: String(2005 + i%10) + '-' + String(1+i%12).padStart(2,'0') + '-' + String(1+i%28).padStart(2,'0'),
dateNaissAff: String(1+i%28).padStart(2,'0') + '/' + String(1+i%12).padStart(2,'0') + '/' + String(2005 + i%10),
lieuNaiss: ['Kinshasa','Lubumbashi','Mbuji-Mayi','Kananga','Kisangani','Goma','Bukavu'][i%7],
sexe: sexe,
classe: classe,
option: opt,
telephone: '081' + String(100000 + i%900000).padStart(6, '0'),
parentCode: code,
nomPere: nom + ' ' + ['Pierre','Jean','Joseph','Michel','David','Emmanuel'][i%6],
nomMere: nom + ' ' + ['Marie','Jeanne','Pauline','Catherine','Esther','Sarah'][i%6],
statut: statuts[i % statuts.length],
bande: getBandeClasse(classe, opt)
});
}
}

function getFiltered() {
const classe = document.getElementById('filterClasse').value;
const search = document.getElementById('searchEleve').value.toLowerCase();
perPage = parseInt(document.getElementById('perPage').value) || 9;
let result = [...elevesData];
if(classe) result = result.filter(e => e.classe === classe);
if(search) {
result = result.filter(e => 
e.nom.toLowerCase().includes(search) || 
e.prenom.toLowerCase().includes(search) ||
e.matricule.toLowerCase().includes(search) ||
e.parentCode.includes(search)
);
}
return result;
}

function afficherCartes() {
const filtered = getFiltered();
const total = filtered.length;
document.getElementById('totalCount').textContent = 'Total: ' + total + ' élèves';

if(total === 0) {
document.getElementById('carteContainer').innerHTML = '<div class="empty">📭 Aucun élève trouvé</div>';
document.getElementById('pagination').innerHTML = '';
return;
}

const totalPages = Math.ceil(total / perPage);
if(currentPage > totalPages) currentPage = totalPages;
if(currentPage < 1) currentPage = 1;

const start = (currentPage - 1) * perPage;
const end = Math.min(start + perPage, total);
const pageData = filtered.slice(start, end);

const container = document.getElementById('carteContainer');
container.innerHTML = '';

pageData.forEach((e) => {
const div = document.createElement('div');
div.className = 'carte';
div.id = 'carte_' + e.id;
div.innerHTML = `
<div class="carte-guilloche"></div>
<div class="carte-bande ${e.bande}"></div>
<div class="carte-premium-border"></div>
<div class="carte-watermark">GLORIA DEI</div>
<div class="carte-content">
<div class="carte-top">
<span class="titre">🎓 CARTE D'ÉLÈVE</span>
<span class="annee">2026-2027</span>
</div>
<div class="carte-ecole">
<span class="nom">🏫 GLORIA DEI SCHOOL</span>
<span class="badge-statut ${e.statut === 'ACTIF' ? 'actif' : e.statut === 'EXONÉRÉ' ? 'exonere' : 'abandon'}">${e.statut}</span>
</div>
<div class="carte-body">
<div class="carte-photo">${e.sexe === 'F' ? '👩' : '👨'}</div>
<div class="carte-identite">
<div class="nom">${e.nom} <small>${e.postnom}</small> ${e.prenom}</div>
<div class="classe">${e.classe} ${e.option ? '• ' + e.option : ''}</div>
<div class="matricule">#${e.matricule}</div>
</div>
</div>
<div class="carte-infos">
<div class="info"><span class="icon">📅</span><span class="label">Né</span><span class="value">${e.dateNaissAff}</span></div>
<div class="info"><span class="icon">📍</span><span class="label">Lieu</span><span class="value">${e.lieuNaiss}</span></div>
<div class="info"><span class="icon">📞</span><span class="label">Tél</span><span class="value">${e.telephone}</span></div>
<div class="info"><span class="icon">🔑</span><span class="label">Code</span><span class="value code">${e.parentCode}</span></div>
</div>
<div class="carte-parents">
<span class="parent">👨 <span class="nom">${e.nomPere}</span></span>
<span class="parent">👩 <span class="nom">${e.nomMere}</span></span>
</div>
<div class="carte-codes">
<div class="qr-wrapper"><div id="qr_${e.id}"></div></div>
<div class="barcode-wrapper"><svg id="barcode_${e.id}"></svg></div>
</div>
<div class="carte-footer">
<span class="mention"><strong>🏛️ Propriété de l'école</strong> • En cas de perte, prévenir la direction</span>
<span class="perte">⚠️ Ne pas prêter</span>
</div>
</div>
`;
container.appendChild(div);

setTimeout(() => {
const qrContainer = document.getElementById('qr_' + e.id);
if(qrContainer) {
new QRCode(qrContainer, {
text: 'GLD|' + e.matricule + '|' + e.parentCode,
width: 28,
height: 28,
colorDark: "#0f172a",
colorLight: "#ffffff",
correctLevel: QRCode.CorrectLevel.H
});
}
try {
JsBarcode("#barcode_" + e.id, e.matricule, {
format: "CODE128",
width: 1.2,
height: 20,
displayValue: true,
fontSize: 8,
font: 'monospace',
textAlign: 'center',
textPosition: 'bottom',
textMargin: 1,
fontWeight: 'bold',
background: '#ffffff',
lineColor: '#0f172a'
});
} catch(err) {}
}, 100);
});

const pagination = document.getElementById('pagination');
if(totalPages > 1) {
let html = '';
html += `<button onclick="goToPage(1)" ${currentPage===1?'disabled':''}>⏮</button>`;
html += `<button onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>◀</button>`;
let startP = Math.max(1, currentPage - 2);
let endP = Math.min(totalPages, currentPage + 2);
for(let p = startP; p <= endP; p++) {
html += `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`;
}
html += `<button onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>▶</button>`;
html += `<button onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>⏭</button>`;
pagination.innerHTML = html;
} else {
pagination.innerHTML = '';
}
}

function goToPage(p) {
currentPage = p;
afficherCartes();
window.scrollTo({top: 0, behavior: 'smooth'});
}

async function genererPDF() {
const filtered = getFiltered();
if(filtered.length === 0) { alert('Aucun élève à exporter'); return; }

const container = document.getElementById('carteContainer');
const cartes = container.querySelectorAll('.carte');
if(cartes.length === 0) { alert('Aucune carte à exporter'); return; }

const { jsPDF } = window.jspdf;
const doc = new jsPDF('p', 'mm', 'a4');
const cols = 3;
const rows = 3;
const cardWidth = 62;
const cardHeight = 88;
const marginX = 8;
const marginY = 10;
const gapX = 6;
const gapY = 6;

let totalCartes = 0;

for(let i = 0; i < cartes.length; i++) {
const carte = cartes[i];
try {
const canvas = await html2canvas(carte, {
scale: 3,
backgroundColor: '#ffffff',
allowTaint: false,
useCORS: true,
logging: false
});

const imgData = canvas.toDataURL('image/jpeg', 0.98);
const col = totalCartes % cols;
