<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Génération Cartes Élèves - Gloria Dei</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter',sans-serif;padding:20px;min-height:100vh}
.header{max-width:1200px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.header h1{color:#ffd700;font-size:24px;font-weight:800}
.header h1 span{color:#94a3b8;font-size:14px;font-weight:400;display:block}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 24px;border-radius:40px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:all 0.2s}
.btn-primary{background:#ffd700;color:#0f172a}
.btn-primary:hover{opacity:0.9;transform:scale(0.98)}
.btn-success{background:#10b981;color:white}
.btn-success:hover{opacity:0.9;transform:scale(0.98)}
.btn-danger{background:#7f1d1d;color:white}
.btn-danger:hover{background:#991b1b}
.btn-outline{background:transparent;border:1.5px solid #ffd700;color:#ffd700}
.btn-outline:hover{background:rgba(255,215,0,0.1)}
.controls{max-width:1200px;margin:0 auto 20px;background:rgba(18,18,31,0.9);border-radius:16px;padding:16px 20px;border:1px solid rgba(255,215,0,0.15);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.controls label{color:#94a3b8;font-size:12px;font-weight:600}
.controls select,.controls input{padding:8px 14px;border-radius:10px;background:#2d3748;border:1px solid #334155;color:#fff;font-size:13px}
.controls .count{color:#ffd700;font-weight:700;font-size:14px;margin-left:auto}
.carte-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media print{.carte-grid{grid-template-columns:repeat(3,1fr) !important;gap:12px !important}.header,.controls,.no-print{display:none !important}.carte{page-break-inside:avoid;box-shadow:none !important;border:1px solid #ddd}}
@media(max-width:900px){.carte-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.carte-grid{grid-template-columns:1fr}}
.carte{background:white;border-radius:12px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border:1px solid rgba(255,215,0,0.15);position:relative;transition:transform 0.2s}
.carte:hover{transform:translateY(-3px)}
.carte-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:8px 8px 0 0;padding:8px 12px;text-align:center;margin:-12px -12px 0 -12px}
.carte-header .ecole{font-size:12px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.carte-header .annee{font-size:8px;color:#94a3b8;display:block;letter-spacing:1px}
.carte-body{display:flex;gap:10px;padding:10px 0 8px 0;border-bottom:1px solid #f1f5f9}
.carte-photo{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1e293b,#334155);flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid #ffd700;font-size:22px;color:white}
.carte-identite{flex:1;min-width:0}
.carte-identite .nom{font-size:13px;font-weight:800;color:#0f172a;line-height:1.2}
.carte-identite .nom small{font-weight:400;font-size:10px;color:#64748b}
.carte-identite .classe{font-size:10px;font-weight:600;color:#1e40af}
.carte-identite .matricule{font-size:8px;color:#94a3b8;font-family:monospace}
.statut-badge{display:inline-block;padding:1px 10px;border-radius:12px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.statut-badge.actif{background:#10b981;color:white}
.statut-badge.exonere{background:#f59e0b;color:white}
.statut-badge.abandon{background:#ef4444;color:white}
.carte-info{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding:6px 0 4px 0;font-size:9px;color:#475569}
.carte-info .info-item{display:flex;align-items:center;gap:3px}
.carte-info .info-item .icon{font-size:10px;width:14px;text-align:center}
.carte-info .info-item .label{color:#94a3b8;font-size:7px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.carte-info .info-item .value{font-weight:600;color:#0f172a}
.carte-info .info-item .value.code{color:#2563eb;font-family:monospace;font-size:10px;font-weight:800;background:rgba(37,99,235,0.08);padding:0 4px;border-radius:3px}
.carte-parents{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding:4px 0 6px 0;font-size:8px;color:#475569;border-bottom:1px solid #f1f5f9}
.carte-parents .parent-item{display:flex;align-items:center;gap:3px}
.carte-parents .parent-item .nom{font-weight:600;color:#0f172a}
.carte-qr{padding:6px 0 2px 0;display:flex;flex-direction:column;align-items:center}
.carte-qr .qr-wrapper{background:white;padding:4px;border-radius:6px;border:1px solid #e2e8f0;display:inline-block}
.carte-qr .qr-wrapper canvas,.carte-qr .qr-wrapper img{width:48px !important;height:48px !important}
.carte-qr .qr-label{font-size:6px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-top:3px}
.carte-footer{padding-top:4px;text-align:center;font-size:6px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;border-top:1px solid rgba(255,215,0,0.15)}
.pagination{max-width:1200px;margin:20px auto;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pagination button{padding:8px 16px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#cbd5e1;cursor:pointer;font-weight:600;font-size:12px;transition:all 0.2s}
.pagination button:hover{background:#ffd700;color:#0f172a}
.pagination button.active{background:#ffd700;color:#0f172a}
.pagination button:disabled{opacity:0.3;cursor:not-allowed}
.loading{color:#ffd700;text-align:center;padding:40px;font-size:18px}
.empty{color:#64748b;text-align:center;padding:60px;font-size:16px}
</style>
</head>
<body>

<div class="header">
<div>
<h1>🏫 GLORIA DEI SCHOOL <span>Génération de cartes d'élèves • Année 2026-2027</span></h1>
</div>
<div class="header-actions">
<button class="btn btn-primary" onclick="genererPDF()">📄 Exporter PDF</button>
<button class="btn btn-success" onclick="imprimer()">🖨️ Imprimer</button>
</div>
</div>

<div class="controls">
<label>📚 Classe</label>
<select id="filterClasse" onchange="afficherCartes()">
<option value="">Toutes</option>
<option value="7eme EB">7eme EB</option>
<option value="8eme EB">8eme EB</option>
<option value="1ere Annee">1ere Annee</option>
<option value="2eme Annee">2eme Annee</option>
<option value="3eme Annee">3eme Annee</option>
<option value="4eme Annee">4eme Annee</option>
</select>
<label>🔍 Rechercher</label>
<input type="text" id="searchEleve" placeholder="Nom, matricule..." oninput="afficherCartes()" style="width:180px">
<label>📋 Par page</label>
<select id="perPage" onchange="afficherCartes()">
<option value="9">9</option>
<option value="18">18</option>
<option value="27">27</option>
<option value="36">36</option>
</select>
<span class="count" id="totalCount">Total: 0 élèves</span>
</div>

<div id="carteContainer" class="carte-grid"></div>

<div class="pagination" id="pagination"></div>

<script>
let elevesData = [];
let currentPage = 1;
let perPage = 9;

function genererEleves(nb) {
const noms = ['KABEYA','LUMUMBA','TSHISEKEDI','KAMBA','MUTOMBO','KALALA','MWANZA','KIBANDA','LUKUSA','KASONGO','MUKENDI','KALONJI','TUNDA','KABILA','KATUMBA','MWEMBA','KALALA','KABEYA','LUMUMBA','TSHISEKEDI'];
const prenoms = ['Jean','Pierre','Marie','Joseph','François','Jeanne','André','Pauline','Michel','Catherine','Daniel','Esther','David','Ruth','Emmanuel','Grace','Samuel','Sarah','Jonathan','Nathalie'];
const classes = ['7eme EB','8eme EB','1ere Annee','2eme Annee','3eme Annee','4eme Annee'];
const options = ['LATIN-PHILO','SCIENCES','PEDAGOGIE','COMMERCIALE','ELECTRICITE','MECANIQUE','COUPE-COUTURE',''];
const statuts = ['ACTIF','ACTIF','ACTIF','ACTIF','ACTIF','EXONÉRÉ','ACTIF','ACTIF'];

for(let i=0; i<nb; i++) {
const nom = noms[i % noms.length];
const prenom = prenoms[i % prenoms.length];
const sexe = i % 2 === 0 ? 'M' : 'F';
const classe = classes[i % classes.length];
const opt = (classe === '7eme EB' || classe === '8eme EB') ? '' : options[i % options.length];
const code = String(100000 + i).padStart(6, '0');
const matricule = 'GLD-' + String(i+1).padStart(4, '0');

elevesData.push({
id: 'eleve_' + i,
matricule: matricule,
nom: nom,
postnom: nom.slice(0,4) + 'a',
prenom: prenom,
dateNaiss: String(2005 + i%10) + '-' + String(1+i%12).padStart(2,'0') + '-' + String(1+i%28).padStart(2,'0'),
dateNaissAff: String(1+i%28).padStart(2,'0') + '/' + String(1+i%12).padStart(2,'0') + '/' + String(2005 + i%10),
lieuNaiss: ['Kinshasa','Lubumbashi','Mbuji-Mayi','Kananga','Kisangani','Goma','Bukavu'][i%7],
sexe: sexe,
classe: classe,
option: opt,
telephone: '081' + String(100000 + i%900000).padStart(6, '0'),
adresse: 'Quartier ' + ['Matonge','Limete','Gombe','Kalamu','Bandalungwa','Ngaliema'][i%6] + ', Kinshasa',
parentCode: code,
nomPere: nom + ' ' + ['Pierre','Jean','Joseph','Michel','David','Emmanuel'][i%6],
nomMere: nom + ' ' + ['Marie','Jeanne','Pauline','Catherine','Esther','Sarah'][i%6],
ecole: 'Complexe Scolaire Gloria Dei',
annee: '2026-2027',
statut: statuts[i % statuts.length],
minerval: classe === '7eme EB' || classe === '8eme EB' ? 35000 : 45000,
fraisInscription: 45000,
fraisInscriptionPaye: 45000,
presences: {total:20, presents:15 + i%6, absents:3, retards:2},
dernierePresence: '18/07/2026 08:15'
});
}
}

function getFiltered() {
const classe = document.getElementById('filterClasse').value;
const search = document.getElementById('searchEleve').value.toLowerCase();
perPage = parseInt(document.getElementById('perPage').value) || 9;

let result = [...elevesData];

if(classe) result = result.filter(e => e.classe === classe);
if(search) {
result = result.filter(e => 
e.nom.toLowerCase().includes(search) || 
e.prenom.toLowerCase().includes(search) ||
e.matricule.toLowerCase().includes(search) ||
e.parentCode.includes(search)
);
}

return result;
}

function afficherCartes() {
const filtered = getFiltered();
const total = filtered.length;
document.getElementById('totalCount').textContent = 'Total: ' + total + ' élèves';

if(total === 0) {
document.getElementById('carteContainer').innerHTML = '<div class="empty">📭 Aucun élève trouvé</div>';
document.getElementById('pagination').innerHTML = '';
return;
}

const totalPages = Math.ceil(total / perPage);
if(currentPage > totalPages) currentPage = totalPages;
if(currentPage < 1) currentPage = 1;

const start = (currentPage - 1) * perPage;
const end = Math.min(start + perPage, total);
const pageData = filtered.slice(start, end);

const container = document.getElementById('carteContainer');
container.innerHTML = '';

pageData.forEach((e, idx) => {
const div = document.createElement('div');
div.className = 'carte';
div.id = 'carte_' + e.id;
div.innerHTML = `
<div class="carte-header">
<div class="ecole">🏫 GLORIA DEI SCHOOL</div>
<span class="annee">📅 2026-2027</span>
</div>
<div class="carte-body">
<div class="carte-photo">${e.sexe === 'F' ? '👩' : '👨'}</div>
<div class="carte-identite">
<div class="nom">${e.nom} <small>${e.postnom}</small> ${e.prenom}</div>
<div class="classe">🎓 ${e.classe} ${e.option ? '| ' + e.option : ''}</div>
<div class="matricule">📌 ${e.matricule}</div>
<span class="statut-badge ${e.statut === 'ACTIF' ? 'actif' : e.statut === 'EXONÉRÉ' ? 'exonere' : 'abandon'}">${e.statut === 'ACTIF' ? '🟢 ACTIF' : e.statut === 'EXONÉRÉ' ? '🌟 EXONÉRÉ' : '🔴 ABANDON'}</span>
</div>
</div>
<div class="carte-info">
<div class="info-item"><span class="icon">📅</span><span class="label">Né</span><span class="value">${e.dateNaissAff}</span></div>
<div class="info-item"><span class="icon">📍</span><span class="label">Lieu</span><span class="value">${e.lieuNaiss}</span></div>
<div class="info-item"><span class="icon">📞</span><span class="label">Tél</span><span class="value">${e.telephone}</span></div>
<div class="info-item"><span class="icon">🔑</span><span class="label">Code</span><span class="value code">${e.parentCode}</span></div>
</div>
<div class="carte-parents">
<div class="parent-item">👨 Père: <span class="nom">${e.nomPere}</span></div>
<div class="parent-item">👩 Mère: <span class="nom">${e.nomMere}</span></div>
</div>
<div class="carte-qr">
<div class="qr-wrapper"><div id="qr_${e.id}"></div></div>
<span class="qr-label">📱 Scanner pour présence</span>
</div>
<div class="carte-footer">✅ Valide • Gardez précieusement</div>
`;
container.appendChild(div);

setTimeout(() => {
const qrContainer = document.getElementById('qr_' + e.id);
if(qrContainer) {
const jsonData = JSON.stringify({
matricule: e.matricule,
nom: e.nom,
postnom: e.postnom,
prenom: e.prenom,
dateNaiss: e.dateNaiss,
lieuNaiss: e.lieuNaiss,
sexe: e.sexe,
classe: e.classe,
option: e.option,
telephone: e.telephone,
adresse: e.adresse,
parentCode: e.parentCode,
nomPere: e.nomPere,
nomMere: e.nomMere,
ecole: e.ecole,
annee: e.annee,
statut: e.statut
});
new QRCode(qrContainer, {
text: jsonData,
width: 48,
height: 48,
colorDark: "#0f172a",
colorLight: "#ffffff",
correctLevel: QRCode.CorrectLevel.H
});
}
}, 50);
});

const pagination = document.getElementById('pagination');
let pagHtml = '';
pagination.innerHTML = '';

if(totalPages > 1) {
pagHtml += `<button onclick="goToPage(1)" ${currentPage===1?'disabled':''}>⏮</button>`;
pagHtml += `<button onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>◀</button>`;

let startP = Math.max(1, currentPage - 2);
let endP = Math.min(totalPages, currentPage + 2);

for(let p = startP; p <= endP; p++) {
pagHtml += `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`;
}

pagHtml += `<button onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>▶</button>`;
pagHtml += `<button onclick="goToPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>⏭</button>`;
pagination.innerHTML = pagHtml;
}
}

function goToPage(p) {
currentPage = p;
afficherCartes();
window.scrollTo({top: 0, behavior: 'smooth'});
}

function genererPDF() {
if(typeof jspdf === 'undefined') {
alert('La librairie jsPDF est en cours de chargement...');
return;
}

const filtered = getFiltered();
if(filtered.length === 0) { alert('Aucun élève à exporter'); return; }

const { jsPDF } = window.jspdf;
const doc = new jsPDF('p', 'mm', 'a4');
const pageWidth = 210;
const pageHeight = 297;
const cols = 3;
const rows = 3;
const cardWidth = 60;
const cardHeight = 85;
const marginX = 8;
const marginY = 10;

let count = 0;
for(let e of filtered) {
const col = count % cols;
const row = Math.floor(count / cols) % rows;
const x = marginX + col * (cardWidth + 6);
const y = marginY + row * (cardHeight + 6);

if(count > 0 && count % (cols*rows) === 0) {
doc.addPage();
}

doc.setFillColor(255,255,255);
doc.rect(x, y, cardWidth, cardHeight, 'F');
doc.setDrawColor(200,200,200);
doc.rect(x, y, cardWidth, cardHeight, 'S');

doc.setFillColor(15,43,68);
doc.rect(x, y, cardWidth, 14, 'F');
doc.setFontSize(7);
doc.setFont('helvetica', 'bold');
doc.setTextColor(255,215,0);
doc.text('GLORIA DEI', x + cardWidth/2, y + 5, {align:'center'});
doc.setFontSize(5);
doc.setTextColor(148,163,184);
doc.text('2026-2027', x + cardWidth/2, y + 11, {align:'center'});

doc.setFontSize(8);
doc.setFont('helvetica', 'bold');
doc.setTextColor(15,23,42);
const nomLine = e.nom + ' ' + (e.postnom || '') + ' ' + e.prenom;
const nomTrunc = nomLine.length > 22 ? nomLine.substring(0,20) + '...' : nomLine;
doc.text(nomTrunc, x + 4, y + 23);

doc.setFontSize(6);
doc.setFont('helvetica', 'bold');
doc.setTextColor(30,64,175);
doc.text(e.classe + (e.option ? ' | ' + e.option : ''), x + 4, y + 30);

doc.setFontSize(5);
doc.setTextColor(148,163,184);
doc.text('Matricule: ' + e.matricule, x + 4, y + 36);

doc.setFillColor(e.statut === 'ACTIF' ? [16,185,129] : e.statut === 'EXONÉRÉ' ? [245,158,11] : [239,68,68]);
doc.roundedRect(x + cardWidth - 32, y + 17, 28, 6, 3, 3, 'F');
doc.setFontSize(4);
doc.setFont('helvetica', 'bold');
doc.setTextColor(255,255,255);
doc.text(e.statut, x + cardWidth - 18, y + 21.5, {align:'center'});

doc.setFontSize(5);
doc.setFont('helvetica', 'normal');
doc.setTextColor(71,85,105);
doc.text('📅 ' + e.dateNaissAff, x + 4, y + 45);
doc.text('📍 ' + e.lieuNaiss, x + 34, y + 45);
doc.text('📞 ' + e.telephone, x + 4, y + 52);
doc.text('🔑 ' + e.parentCode, x + 34, y + 52);

doc.setFontSize(4.5);
doc.text('👨 ' + e.nomPere, x + 4, y + 60);
doc.text('👩 ' + e.nomMere, x + 34, y + 60);

doc.setDrawColor(0,0,0);
doc.rect(x + 20, y + 63, 20, 20, 'S');

const qrText = JSON.stringify({
matricule: e.matricule,
nom: e.nom,
prenom: e.prenom,
classe: e.classe,
parentCode: e.parentCode,
statut: e.statut
});

try {
const qrCode = new QRCode(doc, qrText, {x: x+21, y: y+64, w: 18, h: 18});
} catch(e) {}

doc.setFontSize(4);
doc.setTextColor(148,163,184);
doc.text('📱 Scanner pour présence', x + cardWidth/2, y + 86, {align:'center'});

count++;
}

doc.save('cartes_eleves_' + new Date().toISOString().slice(0,10) + '.pdf');
}

function imprimer() {
window.print();
}

document.addEventListener('DOMContentLoaded', function() {
genererEleves(50);
afficherCartes();
});
</script>
</body>
</html>
