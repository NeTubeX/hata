<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page introuvable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            color: #EAEAEA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }
        .error-icon {
            font-size: 4rem;
            color: #3b82f6;
            display: block;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2rem;
            margin: 10px 0;
        }
        p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 12px 30px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #EAEAEA;
        }
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        .help {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
            color: #8a9aaa;
        }
        .help i {
            color: #3b82f6;
            margin-right: 8px;
        }
        .help strong {
            color: #3b82f6;
        }
        @media (max-width: 480px) {
            .error-code {
                font-size: 80px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="error-icon"><i class="fas fa-compass"></i></span>
        <div class="error-code">404</div>
        <h1>Page introuvable</h1>
        <p>La page que vous recherchez n'existe pas, a été déplacée ou est temporairement indisponible.</p>
        <div>
            <a href="#" class="btn"><i class="fas fa-home"></i> Accueil</a>
            <a href="#" class="btn btn-secondary"><i class="fas fa-graduation-cap"></i> Système Scolarité</a>
        </div>
        <div class="help">
            <i class="fas fa-headset"></i> Besoin d'aide ? Contactez-nous au <strong>+243 845 048 412</strong>
        </div>
    </div>
</body>
</html>
