<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 - Page introuvable | NeTubeX</title>
<link rel="icon" type="image/png" href="favicon.png.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
html,body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:500;line-height:1.7;overflow:hidden;transition:background 0.4s,color 0.4s}
body.dark{background:#0a0e1a;color:#EAEAEA}
body.light{background:#f0f2f5;color:#1a1a2e}
.bg-fixed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2}
body.dark .bg-fixed-inner{width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a 0%,#0f172a 50%,#1a2335 100%)}
body.light .bg-fixed-inner{width:100%;height:100%;background:linear-gradient(135deg,#e8ecf1 0%,#d5dce6 50%,#c8d0dc 100%)}
.bg-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1}
body.dark .bg-overlay{background:radial-gradient(circle at 30% 40%,rgba(59,130,246,0.04),transparent 70%)}
body.light .bg-overlay{background:radial-gradient(circle at 30% 40%,rgba(59,130,246,0.03),transparent 70%)}
.navbar{position:fixed;top:max(20px,env(safe-area-inset-top,20px));left:50%;transform:translateX(-50%);width:auto;min-width:280px;max-width:95%;border-radius:60px;padding:10px 20px;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:all 0.4s cubic-bezier(0.4,0,0.2,1)}
body.dark .navbar{background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(56,189,248,0.15)}
body.light .navbar{background:rgba(240,242,245,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(100,130,180,0.2)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid rgba(56,189,248,0.2);pointer-events:none}
.logo-text{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.nav-buttons{display:flex;gap:10px;flex-shrink:0;align-items:center}
.btn-nav{background:transparent;border:1px solid rgba(56,189,248,0.2);padding:8px 18px;border-radius:40px;font-weight:600;cursor:pointer;transition:all 0.3s;font-size:.9rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
body.dark .btn-nav{color:#EAEAEA}
body.light .btn-nav{color:#1a1a2e;border-color:rgba(100,130,180,0.3)}
.btn-nav-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;color:#FFF;box-shadow:0 2px 10px rgba(59,130,246,0.3)}
.btn-nav-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,0.5)}
.btn-nav:hover{background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.4);transform:translateY(-2px)}
.theme-toggle{background:transparent;border:1px solid rgba(56,189,248,0.2);padding:8px 14px;border-radius:40px;font-weight:600;cursor:pointer;transition:all 0.3s;font-size:.9rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
body.dark .theme-toggle{color:#EAEAEA}
body.light .theme-toggle{color:#1a1a2e;border-color:rgba(100,130,180,0.3)}
.theme-toggle:hover{background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.4);transform:translateY(-2px)}
.container{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:calc(100px + env(safe-area-inset-top,0px)) 24px 60px 24px}
.error-card{max-width:560px;width:100%;padding:60px 48px;border-radius:48px;text-align:center;transition:all 0.4s;position:relative;overflow:hidden}
body.dark .error-card{background:rgba(15,23,42,0.5);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,0.08);box-shadow:0 25px 50px -12px rgba(0,0,0,0.4)}
body.light .error-card{background:rgba(255,255,255,0.6);backdrop-filter:blur(12px);border:1px solid rgba(100,130,180,0.12);box-shadow:0 25px 50px -12px rgba(0,0,0,0.1)}
.error-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(59,130,246,0.03),transparent 70%);pointer-events:none}
.error-code{font-size:120px;font-weight:900;line-height:1;margin-bottom:8px;background:linear-gradient(135deg,#3b82f6,#60a5fa,#3b82f6);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientMove 4s ease-in-out infinite}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.error-icon{font-size:4rem;color:#3b82f6;margin-bottom:8px;display:block;opacity:0.6}
.error-title{font-size:2rem;font-weight:700;margin-bottom:12px}
body.dark .error-title{color:#EAEAEA}
body.light .error-title{color:#1a1a2e}
.error-desc{font-size:1.05rem;margin-bottom:32px;opacity:0.8}
body.dark .error-desc{color:#C0D0E0}
body.light .error-desc{color:#2a2a4a}
.error-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;padding:14px 32px;border-radius:60px;font-weight:700;color:#FFF;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:1rem;transition:all .3s;box-shadow:0 4px 15px rgba(59,130,246,0.3);text-decoration:none}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 30px rgba(59,130,246,0.5)}
.btn-secondary{background:transparent;border:2px solid #3b82f6;padding:12px 28px;border-radius:60px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:1rem;transition:all .3s;text-decoration:none}
body.dark .btn-secondary{color:#EAEAEA}
body.light .btn-secondary{color:#1a1a2e}
.btn-secondary:hover{background:rgba(59,130,246,0.12);transform:translateY(-2px)}
.error-help{margin-top:32px;padding-top:24px;border-top:1px solid;font-size:.9rem}
body.dark .error-help{border-top-color:rgba(56,189,248,0.08);color:#8a9aaa}
body.light .error-help{border-top-color:rgba(100,130,180,0.1);color:#5a5a7a}
.error-help i{color:#3b82f6;margin-right:8px}
.support-float{position:fixed;bottom:max(28px,env(safe-area-inset-bottom,28px));right:28px;background:linear-gradient(135deg,#3b82f6,#2563eb);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;z-index:1000;border:none;box-shadow:0 8px 25px rgba(59,130,246,0.4);transition:all .3s;animation:pulse 2s infinite;color:#FFF;text-decoration:none}
.support-float:hover{transform:translateY(-5px) scale(1.1);box-shadow:0 15px 35px rgba(59,130,246,0.6)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,0.5)}70%{box-shadow:0 0 0 18px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.floating-404{position:absolute;font-size:8rem;font-weight:900;opacity:0.03;top:-20px;right:-20px;pointer-events:none;color:#3b82f6}
@media(max-width:768px){.error-card{padding:40px 24px;border-radius:32px}.error-code{font-size:80px}.error-title{font-size:1.5rem}.navbar{padding:8px 14px;gap:8px;min-width:auto;width:95%}.logo-img{width:40px;height:40px}.logo-text{font-size:1.15rem}.floating-404{font-size:5rem}.support-float{width:54px;height:54px;font-size:1.3rem}.btn-primary,.btn-secondary{padding:10px 20px;font-size:.9rem}}
@media(max-width:480px){.navbar{padding:6px 10px;gap:6px}.logo-text{font-size:1rem}.logo-img{width:34px;height:34px}.btn-nav{font-size:.75rem;padding:6px 12px}.theme-toggle{font-size:.75rem;padding:6px 10px}.error-code{font-size:64px}.error-card{padding:32px 16px}}
</style>
</head>
<body class="dark">
<div class="bg-fixed"><div class="bg-fixed-inner"></div></div>
<div class="bg-overlay"></div>
<div class="navbar" id="navbar">
<div class="logo" id="logoHome"><img src="favicon.png.png" alt="NeTubeX" class="logo-img"><span class="logo-text">NeTubeX</span></div>
<div class="nav-buttons">
<button class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i> <span id="themeLabel">Sombre</span></button>
</div>
</div>
<div class="container">
<div class="error-card">
<div class="floating-404">404</div>
<span class="error-icon"><i class="fas fa-compass"></i></span>
<div class="error-code">404</div>
<h1 class="error-title">Page introuvable</h1>
<p class="error-desc">La page que vous recherchez n'existe pas, a été déplacée ou est temporairement indisponible.</p>
<div class="error-actions">
<a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Accueil NeTubeX</a>
<a href="https://www.netubex.com/schoolchoice" class="btn-secondary"><i class="fas fa-graduation-cap"></i> Système Scolarité</a>
</div>
<div class="error-help"><i class="fas fa-headset"></i> Besoin d'aide ? Contactez-nous au <strong style="color:#3b82f6">+243 845 048 412</strong></div>
</div>
</div>
<a href="tel:+243845048412" class="support-float"><i class="fas fa-phone-alt"></i></a>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
document.addEventListener('keydown',function(e){
if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}
if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();return false}
if(e.ctrlKey&&(e.key==='U'||e.key==='S'||e.key==='P')){e.preventDefault();return false}
return true
});
document.addEventListener('selectstart',function(e){e.preventDefault();return false});
document.addEventListener('copy',function(e){e.preventDefault();return false});
document.addEventListener('cut',function(e){e.preventDefault();return false});
document.querySelectorAll('img').forEach(function(img){
img.addEventListener('contextmenu',function(e){e.preventDefault()});
img.addEventListener('dragstart',function(e){e.preventDefault()})
});
document.getElementById('logoHome')?.addEventListener('click',function(){window.location.href='index.html'});

const themeToggle=document.getElementById('themeToggle');
const themeIcon=document.getElementById('themeIcon');
const themeLabel=document.getElementById('themeLabel');
let isDark=true;
function toggleTheme(){
isDark=!isDark;
document.body.className=isDark?'dark':'light';
themeIcon.className=isDark?'fas fa-moon':'fas fa-sun';
themeLabel.textContent=isDark?'Sombre':'Clair';
localStorage.setItem('theme',isDark?'dark':'light');
}
themeToggle.addEventListener('click',toggleTheme);
const savedTheme=localStorage.getItem('theme');
if(savedTheme){
isDark=savedTheme==='dark';
document.body.className=savedTheme;
themeIcon.className=isDark?'fas fa-moon':'fas fa-sun';
themeLabel.textContent=isDark?'Sombre':'Clair';
}
</script>
</body>
</html>
