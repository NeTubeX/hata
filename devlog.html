<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connexion - Gestion de Scolarité</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#e8edf5 0%,#d5dce6 50%,#c8d0dc 100%);position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(59,130,246,0.03) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(139,92,246,0.03) 0%,transparent 60%);animation:bgFloat 20s ease-in-out infinite alternate}
@keyframes bgFloat{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(2%,1%) rotate(2deg)}}
.floating-shapes{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.floating-shapes .shape{position:absolute;border-radius:50%;opacity:0.06;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.floating-shapes .shape:nth-child(1){width:300px;height:300px;top:-80px;right:-80px;animation:floatShape 25s ease-in-out infinite alternate}
.floating-shapes .shape:nth-child(2){width:200px;height:200px;bottom:-60px;left:-60px;animation:floatShape 20s ease-in-out infinite alternate-reverse}
.floating-shapes .shape:nth-child(3){width:150px;height:150px;top:40%;left:60%;animation:floatShape 30s ease-in-out infinite alternate}
@keyframes floatShape{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-30px) scale(1.1)}}
.login-wrapper{position:relative;z-index:1;width:100%;max-width:420px;perspective:1200px}
.login-box{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:32px;padding:40px 36px 32px;border:1px solid rgba(255,255,255,0.7);box-shadow:0 30px 80px rgba(0,0,0,0.08),0 10px 30px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.8);transform:rotateX(1deg) rotateY(-0.5deg);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#3b82f6);background-size:200% 100%;animation:gradientMove 3s ease-in-out infinite}
@keyframes gradientMove{0%{background-position:0% 0%}50%{background-position:100% 0%}100%{background-position:0% 0%}}
.login-box:hover{transform:rotateX(0deg) rotateY(0deg) translateY(-4px);box-shadow:0 40px 100px rgba(0,0,0,0.12),0 15px 40px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8)}
.login-box .logo{text-align:center;font-size:48px;margin-bottom:4px;display:block;filter:drop-shadow(0 8px 20px rgba(59,130,246,0.15))}
.login-box h1{text-align:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,#1a2a3a,#2d4a6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;margin-bottom:2px}
.login-box .sub{text-align:center;color:#5a7a9a;font-size:13px;font-weight:400;margin-bottom:4px}
.login-box .ecole-wrapper{text-align:center;margin-bottom:20px}
.login-box .ecole-id{color:#3b82f6;font-size:12px;background:rgba(59,130,246,0.08);padding:6px 20px;border-radius:30px;border:1px solid rgba(59,130,246,0.12);display:inline-block;font-weight:500;letter-spacing:0.3px;backdrop-filter:blur(4px)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:#2d4a6a;font-size:12px;font-weight:600;margin-bottom:6px;text-align:center;letter-spacing:0.3px}
.form-group input{width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,0.9);border:2px solid rgba(59,130,246,0.1);color:#1a2a3a;font-size:22px;text-align:center;letter-spacing:10px;font-family:monospace;outline:none;transition:all 0.3s ease;box-shadow:inset 0 2px 8px rgba(0,0,0,0.03)}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,0.08),inset 0 2px 8px rgba(0,0,0,0.02);background:#ffffff}
.form-group input::placeholder{color:#94a3b8;font-size:14px;letter-spacing:2px;font-family:'Inter',sans-serif;font-weight:300}
.form-group input:disabled{opacity:0.5;cursor:not-allowed}
.code-hint{text-align:center;color:#94a3b8;font-size:10px;margin-top:6px;font-weight:400;letter-spacing:0.3px}
#loginBtn{width:100%;padding:14px;border-radius:16px;border:none;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);letter-spacing:0.5px;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(59,130,246,0.25)}
#loginBtn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left 0.6s}
#loginBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 35px rgba(59,130,246,0.35)}
#loginBtn:hover:not(:disabled)::after{left:100%}
#loginBtn:active:not(:disabled){transform:scale(0.97)}
#loginBtn:disabled{opacity:0.5;transform:none;box-shadow:none;cursor:not-allowed}
.error{color:#ef4444;font-size:12px;text-align:center;margin-top:10px;min-height:20px;font-weight:500}
.info{color:#10b981;font-size:12px;text-align:center;margin-top:10px;min-height:20px;font-weight:500}
.footer{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(59,130,246,0.08)}
.footer p{color:#94a3b8;font-size:10px;letter-spacing:0.5px;font-weight:400}
.footer .support{color:#64748b;font-size:10px;margin-top:4px}
.footer .support a{color:#3b82f6;text-decoration:none;font-weight:600;transition:color 0.3s}
.footer .support a:hover{color:#1d4ed8;text-decoration:underline}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-box{animation:fadeIn 0.6s cubic-bezier(0.16,1,0.3,1)}
.loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.role-badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:9px;font-weight:600;margin-top:4px}
.role-badge.direction{background:rgba(251,191,36,0.15);color:#d97706}
.role-badge.comptabilite{background:rgba(16,185,129,0.15);color:#059669}
.role-badge.promoteur{background:rgba(139,92,246,0.15);color:#7c3aed}
@media(max-width:480px){.login-box{padding:28px 20px 24px}.login-box h1{font-size:19px}.login-box .logo{font-size:40px}.form-group input{font-size:20px;letter-spacing:8px;padding:12px}}
</style>
</head>
<body>
<div class="floating-shapes">
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>
</div>
<div class="login-wrapper">
<div class="login-box">
<span class="logo">🏫</span>
<h1>GESTION SCOLAIRE</h1>
<p class="sub" id="schoolSub">PORTAL DE CONNEXION</p>
<div class="ecole-wrapper"><span class="ecole-id" id="ecoleDisplay">📌 CHARGEMENT...</span></div>
<div class="form-group">
<label>🔑 CODE D'ACCÈS</label>
<input type="password" id="loginPassword" placeholder="••••••" maxlength="6" inputmode="numeric" autofocus>
<div class="code-hint">Entrez votre code à 6 chiffres</div>
</div>
<button id="loginBtn">🔓 SE CONNECTER</button>
<div id="errorMsg" class="error"></div>
<div id="infoMsg" class="info"></div>
<div class="footer">
<p>© 2026 - Tous droits réservés</p>
<p class="support">📞 Support : <a href="tel:+243845048412">+243845048412</a></p>
</div>
</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from"firebase/auth";
import{getFirestore,doc,getDoc}from"firebase/firestore";

const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const urlParams=new URLSearchParams(window.location.search);
const ecoleId=urlParams.get("ecole")||"mon-ecole";
const schoolDisplay=ecoleId.toUpperCase().replace(/-/g," ");
document.getElementById("ecoleDisplay").textContent="📌 ÉCOLE : "+schoolDisplay;
document.getElementById("schoolSub").textContent="COMPLEXE SCOLAIRE "+schoolDisplay;
document.title="Connexion - "+schoolDisplay;

let tentatives=0;

function genererEmailPromoteur(ecoleId){return`promoteur.${ecoleId}@gmail.com`;}

async function getSchoolCodes(){
    try{
        const ref=doc(db,"ecoles",ecoleId,"settings","data");
        let snap=await getDoc(ref);
        if(snap.exists()){
            const data=snap.data();
            if(!data.codeDirection){
                const schoolRef=doc(db,"ecoles",ecoleId);
                const schoolSnap=await getDoc(schoolRef);
                if(schoolSnap.exists()){
                    const schoolData=schoolSnap.data();
                    if(schoolData.codeDirection) data.codeDirection=schoolData.codeDirection;
                }
            }
            return data;
        }else{
            return null;
        }
    }catch(e){
        console.error("Erreur chargement codes:",e);
        return null;
    }
}

async function seConnecter(){
    const password=document.getElementById("loginPassword").value.trim();
    const btn=document.getElementById("loginBtn");
    const errorDiv=document.getElementById("errorMsg");
    const infoDiv=document.getElementById("infoMsg");
    errorDiv.textContent="";
    infoDiv.textContent="";

    if(!password||password.length<4){
        errorDiv.textContent="❌ Veuillez entrer votre code d'accès";
        tentatives++;
        if(tentatives>=5){
            errorDiv.textContent="❌ Trop de tentatives. Contactez le support : +243845048412";
            document.getElementById("loginPassword").disabled=true;
        }
        return;
    }

    btn.disabled=true;
    btn.innerHTML='<span class="loading-spinner"></span> Vérification...';

    try{
        const codes=await getSchoolCodes();
        if(!codes){
            errorDiv.textContent="❌ École non trouvée. Contactez le support.";
            btn.disabled=false;
            btn.innerHTML='🔓 SE CONNECTER';
            return;
        }

        let role=null;
        let email=null;
        let urlDestination='';

        const codeDir=codes.codeDirection?codes.codeDirection.trim():'';
        const codeCompta=codes.codeComptabilite?codes.codeComptabilite.trim():'';
        const codePromoteur=codes.codePromoteur?codes.codePromoteur.trim():'';
        const passwordClean=password.trim();

        if(codeDir===passwordClean){
            role='direction';
            email=codes.emailDirection||`direction.${ecoleId}@gmail.com`;
            urlDestination='https://www.netubex.com/schooldirection';
        }else if(codeCompta===passwordClean){
            role='comptabilite';
            email=codes.emailComptabilite||`compta.${ecoleId}@gmail.com`;
            urlDestination='https://www.netubex.com/schoolcompta';
        }else if(codePromoteur===passwordClean){
            role='promoteur';
            email=codes.emailPromoteur||genererEmailPromoteur(ecoleId);
            urlDestination='https://www.netubex.com/promo';
        }else{
            errorDiv.textContent="❌ Code d'accès incorrect";
            tentatives++;
            btn.disabled=false;
            btn.innerHTML='🔓 SE CONNECTER';
            if(tentatives>=5){
                errorDiv.textContent="❌ Trop de tentatives. Contactez le support : +243845048412";
                document.getElementById("loginPassword").disabled=true;
            }
            return;
        }

        const roleLabels={direction:'👔 Direction',comptabilite:'💰 Comptabilité',promoteur:'👔 Promoteur'};
        infoDiv.innerHTML=`✅ Code vérifié - ${roleLabels[role]}`;

        try{
            await createUserWithEmailAndPassword(auth,email,password);
        }catch(e){
            if(e.code!=='auth/email-already-in-use'){
                console.error("Erreur création compte:",e);
            }
        }

        try{
            await signInWithEmailAndPassword(auth,email,password);
        }catch(authError){
            if(authError.code==='auth/user-not-found'){
                await createUserWithEmailAndPassword(auth,email,password);
                await signInWithEmailAndPassword(auth,email,password);
            }else{
                throw authError;
            }
        }

        infoDiv.innerHTML=`✅ Redirection vers ${roleLabels[role]}...`;

        setTimeout(()=>{
            window.location.href=`${urlDestination}?ecole=${ecoleId}&code=${password}&role=${role}`;
        },600);

    }catch(error){
        console.error("Erreur:",error);
        errorDiv.textContent="❌ Erreur de connexion. Contactez le support : +243845048412";
        btn.disabled=false;
        btn.innerHTML='🔓 SE CONNECTER';
    }
}

document.getElementById("loginBtn").onclick=seConnecter;
document.getElementById("loginPassword").addEventListener("keypress",function(e){
    if(e.key==="Enter") seConnecter();
});
document.getElementById("loginPassword").addEventListener("input",function(){
    if(this.value.length>6) this.value=this.value.slice(0,6);
    document.getElementById("errorMsg").textContent="";
});
document.getElementById("loginPassword").focus();
</script>
</body>
</html>
