<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0e1a;font-family:'Inter',sans-serif;}
body{overscroll-behavior:none;-webkit-overscroll-behavior:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a0e1a 0%,#0f172a 50%,#1a2335 100%);position:relative;}
.floating-shapes{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.floating-shapes .shape{position:absolute;border-radius:50%;opacity:0.04;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.floating-shapes .shape:nth-child(1){width:300px;height:300px;top:-80px;right:-80px;animation:floatShape1 25s ease-in-out infinite alternate}
.floating-shapes .shape:nth-child(2){width:200px;height:200px;bottom:-60px;left:-60px;animation:floatShape2 20s ease-in-out infinite alternate-reverse}
.floating-shapes .shape:nth-child(3){width:150px;height:150px;top:40%;left:60%;animation:floatShape3 30s ease-in-out infinite alternate}
@keyframes floatShape1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-30px) scale(1.1)}}
@keyframes floatShape2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-20px,20px) scale(0.9)}}
@keyframes floatShape3{0%{transform:translate(0,0) scale(1) rotate(0deg)}100%{transform:translate(-15px,-15px) scale(1.05) rotate(10deg)}}
.login-wrapper{position:relative;width:100%;max-width:420px;padding:20px;perspective:1200px;z-index:10;height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:rgba(18,18,31,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:32px;padding:28px 28px 24px;border:1px solid rgba(255,215,0,0.10);box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.04);transform:rotateX(0.5deg) rotateY(-0.3deg);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;width:100%;}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#3b82f6);background-size:200% 100%;animation:gradientMove 3s ease-in-out infinite}
@keyframes gradientMove{0%{background-position:0% 0%}50%{background-position:100% 0%}100%{background-position:0% 0%}}
.login-box:hover{transform:rotateX(0deg) rotateY(0deg) translateY(-2px);box-shadow:0 40px 100px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06);}
.logo-container{display:flex;align-items:center;justify-content:center;margin-bottom:6px;position:relative;}
.logo-wrapper{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#0f172a,#1a2335);border:3px solid rgba(255,215,0,0.15);padding:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,0.3);}
.logo-wrapper img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.logo-wrapper .placeholder{font-size:40px;color:#64748b;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.login-box h1{text-align:center;font-size:20px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.3px;margin-bottom:2px;}
.login-box .sub{text-align:center;color:#94a3b8;font-size:12px;font-weight:400;margin-bottom:2px;}
.login-box .ecole-wrapper{text-align:center;margin-bottom:16px;}
.login-box .ecole-id{color:#60a5fa;font-size:12px;background:rgba(59,130,246,0.08);padding:5px 18px;border-radius:30px;border:1px solid rgba(59,130,246,0.12);display:inline-block;font-weight:500;letter-spacing:0.3px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;color:#cbd5e1;font-size:11px;font-weight:600;margin-bottom:5px;text-align:center;letter-spacing:0.5px;}
.form-group input{width:100%;padding:13px 16px;border-radius:14px;background:rgba(45,55,72,0.6);border:2px solid rgba(255,215,0,0.10);color:#fff;font-size:22px;text-align:center;letter-spacing:10px;font-family:'Inter',sans-serif;outline:none;transition:all 0.3s ease;}
.form-group input:focus{border-color:#ffd700;box-shadow:0 0 0 4px rgba(255,215,0,0.06);background:rgba(45,55,72,0.8);}
.form-group input::placeholder{color:#475569;font-size:14px;letter-spacing:2px;font-weight:300;}
.form-group input:disabled{opacity:0.4;cursor:not-allowed;}
.code-hint{text-align:center;color:#475569;font-size:10px;margin-top:5px;font-weight:400;}
#loginBtn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#ffd700,#fbbf24);color:#0f172a;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);letter-spacing:0.5px;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(255,215,0,0.15);}
#loginBtn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left 0.6s;}
#loginBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 35px rgba(255,215,0,0.25);}
#loginBtn:hover:not(:disabled)::after{left:100%;}
#loginBtn:active:not(:disabled){transform:scale(0.97);}
#loginBtn:disabled{opacity:0.5;transform:none;box-shadow:none;cursor:not-allowed;}
.error{color:#ef4444;font-size:12px;text-align:center;margin-top:10px;min-height:20px;font-weight:500;}
.info{color:#10b981;font-size:12px;text-align:center;margin-top:10px;min-height:20px;font-weight:500;}
.footer{text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,215,0,0.05);}
.footer p{color:#334155;font-size:10px;letter-spacing:0.5px;}
.footer .support{color:#475569;font-size:10px;margin-top:4px;}
.footer .support a{color:#ffd700;text-decoration:none;font-weight:600;transition:color 0.3s;}
.footer .support a:hover{color:#fbbf24;text-decoration:underline;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-box{animation:fadeIn 0.5s cubic-bezier(0.16,1,0.3,1)}
.loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(15,23,42,0.2);border-top-color:#0f172a;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="floating-shapes">
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>
</div>
<div class="login-wrapper">
<div class="login-box">
<div class="logo-container">
<div class="logo-wrapper" id="logoWrapper">
<div class="placeholder" id="logoPlaceholder">🏫</div>
<img id="schoolLogo" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Logo école">
</div>
</div>
<h1 id="schoolNameTitle">GESTION SCOLAIRE</h1>
<p class="sub" id="schoolSub">PORTAL DE CONNEXION</p>
<div class="ecole-wrapper"><span class="ecole-id" id="ecoleDisplay">📌 CHARGEMENT...</span></div>
<div class="form-group">
<label>🔑 CODE D'ACCÈS</label>
<input type="password" id="loginPassword" placeholder="••••••" maxlength="6" inputmode="numeric" autofocus>
<div class="code-hint">Entrez votre code à 6 chiffres</div>
</div>
<button id="loginBtn">🔓 SE CONNECTER</button>
<div id="errorMsg" class="error"></div>
<div id="infoMsg" class="info"></div>
<div class="footer">
<p>© 2026 - Tous droits réservés</p>
<p class="support">📞 Support : <a href="tel:+243845048412">+243845048412</a></p>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "firebase/auth";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "firebase/firestore";

const firebaseConfig = {
apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
authDomain: "gesco-67c43.firebaseapp.com",
projectId: "gesco-67c43",
storageBucket: "gesco-67c43.firebasestorage.app",
messagingSenderId: "333004443566",
appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const ecoleId = urlParams.get("ecole") || "mon-ecole";
const schoolDisplay = ecoleId.toUpperCase().replace(/-/g, " ");
document.getElementById("ecoleDisplay").textContent = "📌 ÉCOLE : " + schoolDisplay;
document.getElementById("schoolSub").textContent = "COMPLEXE SCOLAIRE " + schoolDisplay;
document.getElementById("schoolNameTitle").textContent = "ÉCOLE " + schoolDisplay;
document.title = "Connexion - " + schoolDisplay;

let tentatives = 0;

function genererEmailPromoteur(ecoleId){return`promoteur.${ecoleId}@gmail.com`;}
function genererEmailDirection(ecoleId){return`direction.${ecoleId}@gmail.com`;}
function genererEmailCompta(ecoleId){return`compta.${ecoleId}@gmail.com`;}

async function getSchoolLogo(ecoleId) {
try {
const docRef = doc(db, "ecoles", ecoleId);
const docSnap = await getDoc(docRef);
if (docSnap.exists()) {
const data = docSnap.data();
return data.logoUrl || null;
}
return null;
} catch (error) {
console.error("Erreur chargement logo:", error);
return null;
}
}

async function updateSchoolLogo(ecoleId) {
const logoImg = document.getElementById('schoolLogo');
const placeholder = document.getElementById('logoPlaceholder');
const logoUrl = await getSchoolLogo(ecoleId);
if (logoUrl) {
logoImg.src = logoUrl;
logoImg.style.display = 'block';
placeholder.style.display = 'none';
logoImg.onerror = function() {
logoImg.style.display = 'none';
placeholder.style.display = 'flex';
};
} else {
logoImg.style.display = 'none';
placeholder.style.display = 'flex';
}
}

async function getSchoolCodes() {
try {
const ref = doc(db, "ecoles", ecoleId, "settings", "data");
let snap = await getDoc(ref);
if(snap.exists()){
const data = snap.data();
if(!data.codeDirection){
const schoolRef = doc(db, "ecoles", ecoleId);
const schoolSnap = await getDoc(schoolRef);
if(schoolSnap.exists()){
const schoolData = schoolSnap.data();
if(schoolData.codeDirection) data.codeDirection = schoolData.codeDirection;
}
}
return data;
}else{
return null;
}
}catch(e){
console.error("Erreur chargement codes:", e);
return null;
}
}

async function seConnecter(){
const password = document.getElementById("loginPassword").value.trim();
const btn = document.getElementById("loginBtn");
const errorDiv = document.getElementById("errorMsg");
const infoDiv = document.getElementById("infoMsg");
errorDiv.textContent = "";
infoDiv.textContent = "";

if(!password || password.length < 4){
errorDiv.textContent = "❌ Veuillez entrer votre code d'accès";
tentatives++;
if(tentatives >= 5){
errorDiv.textContent = "❌ Trop de tentatives. Contactez le support : +243845048412";
document.getElementById("loginPassword").disabled = true;
}
return;
}

btn.disabled = true;
btn.innerHTML = '<span class="loading-spinner"></span> Vérification...';

try{
const codes = await getSchoolCodes();
if(!codes){
errorDiv.textContent = "❌ École non trouvée. Contactez le support.";
btn.disabled = false;
btn.innerHTML = '🔓 SE CONNECTER';
return;
}

let role = null;
let email = null;
let urlDestination = '';

const codeDir = codes.codeDirection ? codes.codeDirection.trim() : '';
const codeCompta = codes.codeComptabilite ? codes.codeComptabilite.trim() : '';
const codePromoteur = codes.codePromoteur ? codes.codePromoteur.trim() : '';
const passwordClean = password.trim();

if(codeDir === passwordClean){
role = 'direction';
email = codes.emailDirection || genererEmailDirection(ecoleId);
urlDestination = 'https://www.netubex.com/schooldirection';
}else if(codeCompta === passwordClean){
role = 'comptabilite';
email = codes.emailComptabilite || genererEmailCompta(ecoleId);
urlDestination = 'https://www.netubex.com/schoolcompta';
}else if(codePromoteur === passwordClean){
role = 'promoteur';
email = codes.emailPromoteur || genererEmailPromoteur(ecoleId);
urlDestination = 'https://www.netubex.com/promo';
}else{
errorDiv.textContent = "❌ Code d'accès incorrect";
tentatives++;
btn.disabled = false;
btn.innerHTML = '🔓 SE CONNECTER';
if(tentatives >= 5){
errorDiv.textContent = "❌ Trop de tentatives. Contactez le support : +243845048412";
document.getElementById("loginPassword").disabled = true;
}
return;
}

const roleLabels = { direction:'👔 Direction', comptabilite:'💰 Comptabilité', promoteur:'👔 Promoteur' };
infoDiv.innerHTML = `✅ Code vérifié - ${roleLabels[role]}`;

try{
await createUserWithEmailAndPassword(auth, email, password);
}catch(e){
if(e.code !== 'auth/email-already-in-use'){
console.error("Erreur création compte:", e);
}
}

try{
await signInWithEmailAndPassword(auth, email, password);
}catch(authError){
if(authError.code === 'auth/user-not-found'){
await createUserWithEmailAndPassword(auth, email, password);
await signInWithEmailAndPassword(auth, email, password);
}else{
throw authError;
}
}

infoDiv.innerHTML = `✅ Redirection vers ${roleLabels[role]}...`;

setTimeout(()=>{
window.location.href = `${urlDestination}?ecole=${ecoleId}&code=${password}&role=${role}`;
}, 600);

}catch(error){
console.error("Erreur:", error);
errorDiv.textContent = "❌ Erreur de connexion. Contactez le support : +243845048412";
btn.disabled = false;
btn.innerHTML = '🔓 SE CONNECTER';
}
}

document.getElementById("loginBtn").onclick = seConnecter;
document.getElementById("loginPassword").addEventListener("keypress", function(e){
if(e.key === "Enter") seConnecter();
});
document.getElementById("loginPassword").addEventListener("input", function(){
if(this.value.length > 6) this.value = this.value.slice(0, 6);
document.getElementById("errorMsg").textContent = "";
});
document.getElementById("loginPassword").focus();

updateSchoolLogo(ecoleId);
</script>
</body>
</html>
