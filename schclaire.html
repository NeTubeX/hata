<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>ESPACE PARENTAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:'Inter',sans-serif;height:100vh;overflow:hidden;}
.parent-floating-btn{position:fixed;bottom:24px;right:24px;width:80px;height:80px;border-radius:50%;background:transparent;border:none;padding:0;cursor:pointer;z-index:10001;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;box-shadow:0 0 0 0 rgba(16,185,129,0.6);animation:breathe 2.5s ease-in-out infinite;}
.parent-floating-btn img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:3px solid #10b981;box-sizing:border-box;}
@keyframes breathe{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.5);}50%{transform:scale(1.08);box-shadow:0 0 35px 15px rgba(16,185,129,0.25);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.5);}}
.parent-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(16px);z-index:10002;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all 0.3s ease;}
.parent-modal-overlay.active{visibility:visible;opacity:1;}
.parent-modal{background:linear-gradient(135deg,#1e293b,#0f172a);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
.parent-modal .header-fixe{position:sticky;top:0;z-index:999;background:#0a0e1a;padding:12px 20px;border-bottom:1px solid rgba(59,130,246,0.1);}
.parent-modal-body{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0;}
.parent-chat{display:flex;flex-direction:column;height:100%;width:100%;}
.parent-info{background:linear-gradient(135deg,#0f2b44,#071a2c);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(59,130,246,0.2);flex-shrink:0;}
.parent-info-left{display:flex;flex-direction:column;gap:4px;}
.parent-info-left span:first-child{color:#ffd700;font-size:15px;font-weight:600;}
.parent-info-left span:last-child{color:#94a3b8;font-size:12px;}
.parent-info-right{display:flex;align-items:center;gap:12px;}
#parentQuestionCounter{background:#10b981;color:white;padding:4px 12px;border-radius:40px;font-weight:bold;font-size:14px;}
.parent-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 20% 30%, rgba(59,130,246,0.05), transparent 80%);min-height:0;}
.parent-msg{display:flex;width:100%;animation:fadeInUp 0.3s ease-out;}
.parent-msg.user{justify-content:flex-end;}
.parent-msg.bot{justify-content:flex-start;}
.parent-msg .bubble{max-width:85%;padding:18px 24px;border-radius:24px;font-size:18px;line-height:1.6;word-wrap:break-word;font-weight:400;white-space:pre-wrap;font-family:'Inter',sans-serif;}
.parent-msg.user .bubble{background:linear-gradient(135deg,rgba(59,130,246,0.95),rgba(30,64,175,0.95));backdrop-filter:blur(12px);color:#fff;font-weight:500;border-radius:24px 24px 8px 24px;}
.parent-msg.bot .bubble{background:rgba(18,25,45,0.85);backdrop-filter:blur(16px);color:#e2e8f0;border:2px solid rgba(255,107,107,0.3);border-radius:24px 24px 24px 8px;}
.parent-msg.bot .bubble strong{color:#60a5fa;}
.parent-input-area{flex-shrink:0;display:flex;gap:12px;background:#0f172a;padding:16px;border-top:1px solid #334155;}
.parent-input{flex:1;padding:14px 18px;background:#0f172a;border:1px solid #334155;border-radius:40px;color:#fff;font-size:16px;outline:none;resize:none;font-family:'Inter',sans-serif;line-height:1.4;}
.parent-input:focus{border-color:#3b82f6;}
.parent-send{background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;padding:0 24px;color:#fff;font-weight:600;cursor:pointer;font-size:18px;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.typing-indicator{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(18,25,45,0.85);border-radius:20px;border:2px solid rgba(255,107,107,0.3);color:#94a3b8;font-size:14px;font-style:italic;}
.typing-dots{display:flex;gap:4px;align-items:center;}
.typing-dots span{width:8px;height:8px;background:#94a3b8;border-radius:50%;display:inline-block;animation:typingBounce 1.4s infinite ease-in-out;}
.typing-dots span:nth-child(1){animation-delay:0s;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}
</style>
</head>
<body>

<button class="parent-floating-btn" id="parentFloatingBtn"><img src="https://www.netubex.com/parent.jpg" alt="Espace Parental"></button>

<div class="parent-modal-overlay" id="parentModalOverlay">
<div class="parent-modal">
<div class="header-fixe">
<div style="display:flex;align-items:center;gap:18px;padding:6px 0;">
<div style="position:relative;width:75px;height:75px;flex-shrink:0;animation:pulse 2s ease-in-out infinite;">
<div style="position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#f59e0b);padding:4px;">
<div style="width:100%;height:100%;border-radius:50%;background:#0a0e1a;overflow:hidden;">
<img src="https://www.netubex.com/png.png" alt="Logo">
</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;">
<div style="font-size:20px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap;">👪 ESPACE PARENTAL</div>
<div style="font-size:14px;color:#10b981;font-weight:600;">Système Intelligent</div>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(18,25,45,0.6);border-radius:12px;padding:6px 16px;margin-top:6px;border:1px solid rgba(59,130,246,0.15);">
<button id="closeParentModal" style="background:rgba(239,68,68,0.1);border:none;color:#f87171;font-size:22px;font-weight:700;cursor:pointer;padding:0 8px;line-height:1;">✕</button>
<div style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.3);padding:4px 14px 4px 10px;border-radius:40px;border:1px solid rgba(255,255,255,0.06);">
<span style="font-size:11px;color:#94a3b8;">💬</span>
<span id="parentQuestionCounter" style="background:#10b981;color:white;padding:1px 12px;border-radius:40px;font-weight:bold;font-size:14px;">0/10</span>
</div>
</div>
</div>
<div class="parent-modal-body">
<div id="parentChatContainer" class="parent-chat">
<div class="parent-info">
<div class="parent-info-left">
<span id="parentInfoEleve" style="font-size:12px;color:#94a3b8;"></span>
</div>
<div class="parent-info-right"></div>
</div>
<div id="parentChatMessages" class="parent-messages"></div>
<div class="parent-input-area">
<textarea id="parentQuestionInput" class="parent-input" placeholder="Code parent (6 chiffres)..." rows="2" style="height:auto;min-height:50px;max-height:120px;"></textarea>
<button id="parentSendBtn" class="parent-send">📤</button>
</div>
</div>
</div>
</div>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, query, where, getDocs, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'gloria_dei';
const SCHOOL_PREFIX = schoolId.replace(/-/g, '_');

const parentFloatingBtn = document.getElementById('parentFloatingBtn');
const parentModalOverlay = document.getElementById('parentModalOverlay');
const closeParentModal = document.getElementById('closeParentModal');
const parentChatMessages = document.getElementById('parentChatMessages');
const parentQuestionInput = document.getElementById('parentQuestionInput');
const parentSendBtn = document.getElementById('parentSendBtn');
const parentInfoEleve = document.getElementById('parentInfoEleve');

let currentParentCode = null;
let unsubscribe = null;
let elevesData = [];

const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];

function getMoisActuel() {
const date = new Date(); const mois = date.getMonth();
if(mois >= 8) return moisListe[mois - 8];
else if(mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function getMoisFromDate(dateISO) {
if(!dateISO) return "Septembre";
const date = new Date(dateISO); const mois = date.getMonth();
if(mois >= 8) return moisListe[mois - 8];
else if(mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function estMoisDansAnnee(mois) {
const moisActuel = getMoisActuel();
const idx = moisListe.indexOf(mois);
const idxActuel = moisListe.indexOf(moisActuel);
if(idxActuel === -1) return false;
return idx <= idxActuel;
}

function calculerTotalPaye(paiements) {
let total = 0;
for(let mois in paiements) { total += paiements[mois]?.montant || 0; }
return total;
}

function compterMoisImpayes(eleve) {
const paiements = eleve.paiements || {};
const moisBlancs = eleve.moisBlancs || [];
let impayes = 0;
const minerval = eleve.minerval || 45000;
const dateInscription = eleve.dateInscription || new Date().toISOString();
const moisInscription = getMoisFromDate(dateInscription);
const indexInscription = moisListe.indexOf(moisInscription);
const indexActuel = moisListe.indexOf(getMoisActuel());
for(let i = Math.max(0, indexInscription); i < indexActuel; i++) {
const mois = moisListe[i];
if(moisBlancs.includes(mois)) continue;
const paye = paiements[mois]?.montant || 0;
if(paye < minerval) impayes++;
}
return impayes;
}

function determinerStatut(eleve) {
if(eleve.exonere) return "Exonéré";
const impayes = compterMoisImpayes(eleve);
if(impayes >= 3) return "Liste noire";
if(impayes > 0) return "Paiement partiel";
return "En ordre";
}

function afficherResultats(eleves) {
if(!eleves || eleves.length === 0) {
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">❌ Aucun élève trouvé avec ce code parent</div></div>`;
return;
}

let html = '';
eleves.forEach(eleve => {
const totalPaye = calculerTotalPaye(eleve.paiements || {});
const minerval = eleve.minerval || 45000;
const totalMinerval = minerval * 10;
const reste = totalMinerval - totalPaye;
const moisImpayes = compterMoisImpayes(eleve);
const statut = determinerStatut(eleve);
const sexeIcon = eleve.sexe === 'F' ? '👩' : '👨';
const nomComplet = `${eleve.nom} ${eleve.prenom || ''}`.trim();

let badge = '';
if(eleve.exonere) badge = '🌟 EXONÉRÉ';
else if(moisImpayes >= 3) badge = '⚠️ LISTE NOIRE';
else if(moisImpayes > 0) badge = '⚠️ IMPAYÉ';
else badge = '✅ EN ORDRE';

const paiements = eleve.paiements || {};
const moisBlancs = eleve.moisBlancs || [];
const dateInscription = eleve.dateInscription || new Date().toISOString();
const moisInscription = getMoisFromDate(dateInscription);
const indexInscription = moisListe.indexOf(moisInscription);
const moisActuel = getMoisActuel();

let detailsMois = '';
for(let i = 0; i < moisListe.length; i++) {
const mois = moisListe[i];
if(i < indexInscription) continue;
if(!estMoisDansAnnee(mois) && mois !== moisActuel) continue;
const p = paiements[mois] || { montant: 0 };
const estBlanc = moisBlancs.includes(mois);
const estPaye = p.montant >= minerval;
let cls = 'impaye', lbl = '❌';
if(eleve.exonere) { cls = 'paye'; lbl = '🌟'; }
else if(estBlanc) { cls = 'blanc'; lbl = '❄️'; }
else if(estPaye) { cls = 'paye'; lbl = '✅'; }
else if(p.montant > 0) { cls = 'impaye'; lbl = '⚠️'; }
detailsMois += `${mois}: ${p.montant.toLocaleString()} FC ${lbl}\n`;
}

html += `👤 ${sexeIcon} ${nomComplet}\n`;
html += `📚 ${eleve.classe} ${eleve.option ? '- ' + eleve.option : ''}\n`;
html += `💰 Minerval: ${minerval.toLocaleString()} FC/mois\n`;
html += `✅ Total payé: ${totalPaye.toLocaleString()} FC\n`;
html += `⚠️ Reste: ${reste.toLocaleString()} FC\n`;
html += `📌 ${badge}\n`;
html += `📅 Détail:\n${detailsMois}`;
});

parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble" style="white-space:pre-wrap;">${html}</div></div>`;
parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
}

async function chargerDonnees(code) {
if(!code || code.length !== 6) {
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">⚠️ Veuillez entrer un code parent valide (6 chiffres)</div></div>`;
return;
}

currentParentCode = code;
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">🔄 Chargement des données pour le code ${code}...</div></div>`;

if(unsubscribe) { unsubscribe(); unsubscribe = null; }

const q = query(
collection(db, "ecoles", SCHOOL_PREFIX, "compta_eleves"),
where("parentCode", "==", code),
where("_type", "==", "compta_eleve")
);

unsubscribe = onSnapshot(q, (snapshot) => {
if(snapshot.empty) {
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">🔍 Aucun élève trouvé avec le code ${code}</div></div>`;
return;
}
elevesData = [];
snapshot.forEach(doc => {
const data = doc.data();
elevesData.push({
id: data.eleveId,
nom: data.nom,
prenom: data.prenom || "",
sexe: data.sexe || "M",
classe: data.classe,
option: data.option || "",
minerval: data.minerval || 45000,
exonere: data.exonere || false,
paiements: data.paiements || {},
parentCode: data.parentCode || "",
dateInscription: data.dateInscription || new Date().toISOString(),
moisBlancs: data.moisBlancs || []
});
});
const totalPaye = elevesData.reduce((s,e) => s + calculerTotalPaye(e.paiements || {}), 0);
const totalMinerval = elevesData.reduce((s,e) => s + (e.minerval || 45000) * 10, 0);
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">✅ ${elevesData.length} élève(s) trouvé(s) | 💰 ${totalPaye.toLocaleString()} FC payés | ⚠️ ${(totalMinerval - totalPaye).toLocaleString()} FC reste</div></div>`;
afficherResultats(elevesData);
}, (error) => {
console.error(error);
parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">❌ Erreur: ${error.message}</div></div>`;
});
}

parentFloatingBtn.onclick = () => {
const nomEcole = schoolId ? schoolId.toUpperCase().replace(/-/g, ' ') : 'COMPLEXE SCOLAIRE';
parentModalOverlay.classList.add('active');
document.body.style.overflow = 'hidden';
parentChatMessages.innerHTML = `<div class="parent-msg bot"><div class="bubble">🔑 Entrez votre code parent à 6 chiffres pour voir les données financières en temps réel</div></div>`;
parentInfoEleve.innerHTML = `ÉCOLE ${nomEcole}`;
parentQuestionInput.value = '';
parentQuestionInput.focus();
};

closeParentModal.onclick = () => {
parentModalOverlay.classList.remove('active');
document.body.style.overflow = '';
if(unsubscribe) { unsubscribe(); unsubscribe = null; }
};

parentModalOverlay.onclick = (e) => {
if(e.target === parentModalOverlay) {
parentModalOverlay.classList.remove('active');
document.body.style.overflow = '';
if(unsubscribe) { unsubscribe(); unsubscribe = null; }
}
};

parentSendBtn.onclick = () => {
const message = parentQuestionInput.value.trim();
if(!message) return;
parentChatMessages.innerHTML += `<div class="parent-msg user"><div class="bubble">${message}</div></div>`;
parentQuestionInput.value = '';
parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
chargerDonnees(message);
};

parentQuestionInput.addEventListener('keypress', (e) => {
if(e.key === 'Enter') { e.preventDefault(); parentSendBtn.click(); }
});

console.log(`✅ ESPACE PARENTAL - TEST FIREBASE - École: ${SCHOOL_PREFIX}`);
</script>
</body>
</html>
