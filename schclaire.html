<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, orderBy, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'gloria_dei';
const SCHOOL_PREFIX = schoolId.replace(/-/g, '_');

// ============================================
// PARTIE ESPACE PARENTAL - ORIGINAL SANS MODIFICATION SAUF LA FONCTION FRAIS
// ============================================

let currentParentCode = null;
let dernierEleveData = null;
let reponseCache = new Map();
let lastDataHash = null;
let enAttenteChoixEleve = false;
let listeElevesEnAttente = [];
let historiqueSections = {};
let unsubscribe = null;
let estEnAttenteReponse = false;

const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];

function getMoisActuel() {
const date = new Date(); const mois = date.getMonth();
if(mois >= 8) return moisListe[mois - 8];
else if(mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function getMoisFromDate(dateISO) {
if(!dateISO) return "Septembre";
const date = new Date(dateISO); const mois = date.getMonth();
if(mois >= 8) return moisListe[mois - 8];
else if(mois >= 0 && mois <= 5) return moisListe[mois + 4];
return "Septembre";
}

function estMoisDansAnnee(mois) {
const moisActuel = getMoisActuel();
const idx = moisListe.indexOf(mois);
const idxActuel = moisListe.indexOf(moisActuel);
if(idxActuel === -1) return false;
return idx <= idxActuel;
}

async function chercherInfosFinancieresParCode(code) {
try {
const q = query(collection(db, "ecoles", SCHOOL_PREFIX, "compta_eleves"), where("parentCode", "==", code), where("_type", "==", "compta_eleve"));
const snap = await getDocs(q);
if(snap.empty) return null;
const eleves = [];
const moisActuel = getMoisActuel();
snap.forEach(doc => {
const data = doc.data();
const paiements = data.paiements || {};
const minerval = data.minerval || 45000;
const totalAnnuel = minerval * 10;
let totalPaye = 0, moisImpayes = [];
const dateInscription = data.dateInscription || new Date().toISOString();
const moisInscription = getMoisFromDate(dateInscription);
const indexInscription = moisListe.indexOf(moisInscription);
const indexActuel = moisListe.indexOf(moisActuel);
for(let i = indexInscription; i < indexActuel; i++) {
const mois = moisListe[i];
if(!estMoisDansAnnee(mois)) continue;
const montant = paiements[mois]?.montant || 0;
totalPaye += montant;
if(montant < minerval && !data.exonere) { moisImpayes.push(mois); }
}
const reste = totalAnnuel - totalPaye;
let statut = "En ordre";
if(data.exonere) statut = "Exonéré";
else if(moisImpayes.length >= 3) statut = "Liste noire";
else if(moisImpayes.length > 0) statut = "Paiement partiel";
eleves.push({
id: data.eleveId,
nom: data.nom,
prenom: data.prenom || "",
sexe: data.sexe || "M",
classe: data.classe,
option: data.option || "",
exonere: data.exonere || false,
minerval,
totalAnnuel,
totalPaye,
reste,
moisImpayes,
statut,
parentCode: data.parentCode,
dateInscription: dateInscription
});
});
return eleves;
} catch(e) { return null; }
}

function getDataHash(eleveData) {
if(!eleveData) return null;
const dataStr = JSON.stringify({ nom: eleveData.nom, prenom: eleveData.prenom, sexe: eleveData.sexe, classe: eleveData.classe, notes: eleveData.notes, frais: eleveData.frais, punitions: eleveData.punitions, presences: eleveData.presences });
let hash = 0;
for(let i = 0; i < dataStr.length; i++) { const char = dataStr.charCodeAt(i); hash = ((hash << 5) - hash) + char; hash = hash & hash; }
return hash.toString();
}

function getSexePronom(sexe) {
if(sexe === 'F' || sexe === 'Féminin' || sexe === 'fille') {
return { genre: 'fille', pronom: 'elle', possessif: 'sa' };
}
return { genre: 'garçon', pronom: 'il', possessif: 'son' };
}

function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }

function sectionDejaVisitee(section) {
if(!dernierEleveData) return false;
if(dernierEleveData.sectionsVisitees && dernierEleveData.sectionsVisitees.includes(section)) return true;
if(dernierEleveData.id && historiqueSections[dernierEleveData.id]) return historiqueSections[dernierEleveData.id].includes(section);
return false;
}

function ajouterSectionVisitee(section) {
if(!dernierEleveData) return;
if(!dernierEleveData.sectionsVisitees) dernierEleveData.sectionsVisitees = [];
if(!dernierEleveData.sectionsVisitees.includes(section)) dernierEleveData.sectionsVisitees.push(section);
if(dernierEleveData.id) {
if(!historiqueSections[dernierEleveData.id]) historiqueSections[dernierEleveData.id] = [];
if(!historiqueSections[dernierEleveData.id].includes(section)) historiqueSections[dernierEleveData.id].push(section);
}
}

function genererPropositions(eleveData) {
const sections = { frais: { nom: 'les frais' }, notes: { nom: 'les notes' }, presence: { nom: 'la présence' }, punitions: { nom: 'les punitions' } };
const nonVisitees = Object.keys(sections).filter(section => !sectionDejaVisitee(section));
if(nonVisitees.length === 0) return `\n\nVous avez vu toutes les informations sur ${eleveData.nom} ${eleveData.prenom||''}.`;
let propositions = '\n\nVoulez-vous voir ';
const noms = nonVisitees.map(s => sections[s].nom);
if(noms.length === 1) propositions += noms[0] + ' maintenant ?';
else if(noms.length === 2) propositions += noms[0] + ' ou ' + noms[1] + ' ?';
else propositions += noms.slice(0, -1).join(', ') + ' ou ' + noms[noms.length - 1] + ' ?';
return propositions;
}

// ============================================
// FONCTIONS POUR LES NOTES, PRESENCES, PUNITIONS - IDENTIQUES A L'ORIGINAL
// ============================================

async function chercherNotesParNom(nom) {
try {
const fichesSnap = await getDocs(collection(db, SCHOOL_PREFIX + "_fiches"));
const resultats = [];
const searchTerm = nom.toLowerCase().trim();
for(const ds of fichesSnap.docs) {
const fiche = ds.data();
if(!fiche.eleves) continue;
for(const eleve of fiche.eleves) {
const nomEleve = (eleve.nom || '').toLowerCase();
if(nomEleve.includes(searchTerm) || searchTerm.includes(nomEleve)) {
const epreuvesList = [];
if(eleve.notes) {
for(let periode = 1; periode <= 4; periode++) {
const epreuves = fiche.epreuvesParPeriode?.[periode] || [];
const notesPeriode = eleve.notes[`p${periode}`] || [];
for(let i = 0; i < epreuves.length; i++) {
const nomEpreuve = epreuves[i].nom || "Epreuve";
if(!nomEpreuve.toLowerCase().includes("examen")) {
let note = notesPeriode[i] || 0;
let max = epreuves[i].max || 1;
if(note > 0) {
epreuvesList.push({ matiere: fiche.cours, epreuve: nomEpreuve, note: note, max: max, periode: periode, titulaire: fiche.titulaire || null, classe: fiche.classe, option: fiche.option || '' });
}
}
}
}
}
const punitions = await chercherPunitionsParNom(eleve.nom);
const presences = await chercherPresencesParNom(eleve.nom);
resultats.push({
eleveNom: eleve.nom,
sexe: eleve.sexe || 'M',
classe: fiche.classe,
option: fiche.option || '',
titulaire: fiche.titulaire || null,
epreuves: epreuvesList,
nombreElevesClasse: fiche.eleves ? fiche.eleves.length : 0,
punitions: punitions,
presences: presences
});
}
}
}
return resultats;
} catch(e) { return []; }
}

async function chercherPunitionsParNom(nom) {
try {
const q = query(collection(db, SCHOOL_PREFIX + "_punitions"), where("eleveNom", "==", nom), where("statut", "==", "active"));
const snap = await getDocs(q);
const punitions = [];
snap.forEach(ds => {
const data = ds.data();
punitions.push({ motif: data.motif, justification: data.justification, date: data.date, gravite: data.gravite || 'moyenne', classe: data.classe });
});
return punitions;
} catch(e) { return []; }
}

async function chercherPresencesParNom(nom) {
try {
const snap = await getDocs(collection(db, SCHOOL_PREFIX + "_presences"));
const presences = [];
const maintenant = new Date();
const heureActuelle = maintenant.getHours() + maintenant.getMinutes() / 60;
const aujourdhui = maintenant.toISOString().slice(0, 10);
snap.forEach(ds => {
const data = ds.data();
if(!data.eleves) return;
data.eleves.forEach(e => {
if(e.nom === nom) {
const dateStr = data.date ? data.date.slice(0, 10) : '';
if(dateStr === aujourdhui) {
if(heureActuelle >= 12 && heureActuelle < 17.5) {
presences.push({ date: data.date, present: e.present, classe: data.classe, option: data.option || '', estAujourdhui: true, enCours: true, heureActuelle: heureActuelle });
} else if(heureActuelle < 12) {
presences.push({ date: data.date, present: null, classe: data.classe, option: data.option || '', estAujourdhui: true, avantCours: true, heureActuelle: heureActuelle });
} else {
presences.push({ date: data.date, present: e.present, classe: data.classe, option: data.option || '', estAujourdhui: true, apresCours: true, heureActuelle: heureActuelle });
}
} else {
presences.push({ date: data.date, present: e.present, classe: data.classe, option: data.option || '', estAujourdhui: false });
}
}
});
});
presences.sort((a, b) => b.date.localeCompare(a.date));
return presences.slice(0, 5);
} catch(e) { return []; }
}

// GENERER REPONSE NOTES - IDENTIQUE A L'ORIGINAL
// ============================================

async function genererReponseNotes(eleveData) {
ajouterSectionVisitee('notes');
const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
const notes = eleveData.notes || [];
const notesValides = notes.filter(n => n.note > 0);
if(notesValides.length === 0) { return `${nomComplet} n'a pas encore de notes enregistrées.`; }
let meilleureNote = null, meilleurScore = 0;
notesValides.forEach(n => { if(n.note > meilleurScore) { meilleurScore = n.note; meilleureNote = n; } });
const periodeEnLettres = { 1: 'première', 2: 'deuxième', 3: 'troisième', 4: 'quatrième' };
const periodeTexte = meilleureNote.periode ? periodeEnLettres[meilleureNote.periode] || `période ${meilleureNote.periode}` : '';
let reponse = `Résultat de ${nomComplet}\n\n`;
reponse += ` Meilleure note : ${meilleureNote.note}/${meilleureNote.max}`;
if(meilleureNote.matiere) { reponse += ` en ${meilleureNote.matiere}`; }
if(meilleureNote.epreuve) {
const typeEpreuve = meilleureNote.epreuve.toLowerCase();
if(typeEpreuve.includes('interro')) { reponse += `, c'était une interrogation`; }
else if(typeEpreuve.includes('devoir')) { reponse += `, c'était un devoir`; }
else if(typeEpreuve.includes('examen')) { reponse += `, c'était un examen`; }
else { reponse += `, c'était une ${meilleureNote.epreuve}`; }
}
if(periodeTexte) { reponse += ` en ${periodeTexte} période`; }
reponse += `.`;
reponse += genererPropositions(eleveData);
return reponse;
}

// ============================================
// GENERER REPONSE PRESENCE - IDENTIQUE A L'ORIGINAL
// ============================================

async function genererReponsePresence(eleveData) {
ajouterSectionVisitee('presence');
const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
const presences = eleveData.presences || [];
const maintenant = new Date();
const heureActuelle = maintenant.getHours() + maintenant.getMinutes() / 60;
const jourSemaine = maintenant.getDay();
let reponse = `Je regarde la présence de ${nomComplet}.`;
if(jourSemaine === 0 || jourSemaine === 6) {
reponse += `\n\nAujourd'hui c'est le week-end, il n'y a pas cours.`;
reponse += genererPropositions(eleveData);
return reponse;
}
if(heureActuelle < 12) {
const minutesRestantes = Math.round((12 - heureActuelle) * 60);
let tempsRestant;
if(minutesRestantes >= 60) {
const heures = Math.floor(minutesRestantes / 60);
const minutes = minutesRestantes % 60;
if(minutes === 0) { tempsRestant = `${heures} heure${heures > 1 ? 's' : ''}`; }
else { tempsRestant = `${heures} heure${heures > 1 ? 's' : ''} et ${minutes} minute${minutes > 1 ? 's' : ''}`; }
} else { tempsRestant = `${minutesRestantes} minute${minutesRestantes > 1 ? 's' : ''}`; }
reponse += `\n\nLes cours commencent à 12h00. Il reste ${tempsRestant}.`;
if(presences.length > 0) {
const derniere = presences[0];
if(!derniere.estAujourdhui) {
const dateDerniere = new Date(derniere.date).toLocaleDateString('fr-FR');
reponse += `\nLa dernière présence enregistrée date du ${dateDerniere}. ${derniere.present?'Présent':'Absent'}`;
}
}
reponse += genererPropositions(eleveData);
return reponse;
}
if(presences.length === 0) {
reponse += `\n\nJe n'ai pas d'informations sur sa présence pour le moment.`;
reponse += genererPropositions(eleveData);
return reponse;
}
const aujourdhui = presences.find(p => p.estAujourdhui);
if(aujourdhui && aujourdhui.present !== null) {
if(heureActuelle >= 17.5) { reponse += `\n\nAujourd'hui, ${nomComplet} était ${aujourdhui.present?'présent':'absent'}.`; }
else { reponse += `\n\nAujourd'hui, ${nomComplet} est ${aujourdhui.present?'présent':'absent'}.`; }
} else if(aujourdhui && aujourdhui.avantCours) {
reponse += `\n\nLes cours n'ont pas encore commencé.`;
} else {
const derniere = presences[0];
if(derniere) {
const dateDerniere = new Date(derniere.date).toLocaleDateString('fr-FR');
reponse += `\n\nLa dernière présence enregistrée date du ${dateDerniere}. ${derniere.present?'Présent':'Absent'}`;
}
}
reponse += genererPropositions(eleveData);
return reponse;
}

const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
const minerval = eleveData.frais.minerval;
const totalPaye = eleveData.frais.totalPaye;
const reste = eleveData.frais.reste;
const moisImpayes = eleveData.frais.moisImpayes || [];

let reponse = `Alors, parlons des frais de ${nomComplet}.\n\n`;
reponse += `Le minerval est de ${minerval.toLocaleString()} francs congolais par mois.\n`;
reponse += `${totalPaye.toLocaleString()} francs ont déjà été payés.\n`;
reponse += `Il reste ${reste.toLocaleString()} francs à payer.\n`;

const nbImpayes = moisImpayes.length;
if(totalPaye === 0 && nbImpayes === 0) {
reponse += `\nVotre enfant n'a pas encore de mois à payer.`;
} else if(nbImpayes === 0) {
reponse += `\nVotre enfant est en ordre.`;
} else if(nbImpayes === 1) {
reponse += `\nIl manque 1 mois : ${moisImpayes[0]}.`;
} else if(nbImpayes === 2) {
reponse += `\nIl manque 2 mois : ${moisImpayes.join(' et ')}.`;
} else if(nbImpayes >= 3) {
reponse += `\nURGENT : Il manque ${nbImpayes} mois !`;
}
reponse += genererPropositions(eleveData);
return reponse;
}

const questionKey = getCacheKey(question, eleveData);
if(questionKey && reponseCache.has(questionKey) && isCacheValid(eleveData)) {
return reponseCache.get(questionKey);
}
const currentHash = getDataHash(eleveData);
if(currentHash !== lastDataHash) { reponseCache.clear(); lastDataHash = currentHash; }
let reponse = null;
if(msg.includes('aide') || msg.includes('conseil') || msg.includes('que faire') || msg.includes('comment') || msg.includes('quoi') || msg.includes('que puis-je')) {
reponse = `Je suis là à votre service.`;
} else if(msg.includes('sexe') || msg.includes('garçon') || msg.includes('fille') || msg.includes('est-ce') || msg.includes('est il') || msg.includes('est elle')) {
const { genre } = getSexePronom(eleveData.sexe);
reponse = `${eleveData.nom} ${eleveData.prenom||''} est un${genre==='fille'?'e':''} ${genre}.`;
} else if(msg.includes('titulaire') || msg.includes('professeur') || msg.includes('enseignant')) {
if(eleveData.titulaire) reponse = `Le professeur titulaire de ${eleveData.nom} ${eleveData.prenom||''} est ${eleveData.titulaire}.`;
else reponse = `Je n'ai pas d'information sur le titulaire de ${eleveData.nom} ${eleveData.prenom||''}.`;

function stopSpeaking() { if(window.speechSynthesis) window.speechSynthesis.cancel(); }

function voixParentale(texte) {
if(!texte) return;
if(!window.speechSynthesis) return;
window.speechSynthesis.cancel();
let texteParle = texte;
texteParle = texteParle.replace(/[📊💰📝📅⚠️✅❌👨‍👩‍👧‍👦🔑💡📌👉💬🏫👋🎯🌟👍👌📖🔒❌⚠️✅💰📝📅]/g, '');
texteParle = texteParle.replace(/\*\*/g, '');
texteParle = texteParle.replace(/[\(\)]/g, '');
texteParle = texteParle.replace(/[|]/g, '');
texteParle = texteParle.replace(/\n/g, '. ');
texteParle = texteParle.replace(/\.\./g, '.');
texteParle = texteParle.replace(/\./g, '. ');
texteParle = texteParle.replace(/\?/g, '? ');
texteParle = texteParle.replace(/\!/g, '! ');
texteParle = texteParle.replace(/:/g, ': ');
texteParle = texteParle.replace(/-\s/g, '. ');
texteParle = texteParle.replace(/\d+\.\s/g, (match) => { return match.replace(/\./, '. '); });
texteParle = texteParle.replace(/,/g, ', ');
texteParle = texteParle.replace(/\s+/g, ' ');
texteParle = texteParle.replace(/\.\s+\./g, '. ');
texteParle = texteParle.replace(/\?\s+\?/g, '? ');
texteParle = texteParle.replace(/\!\s+\!/g, '! ');
texteParle = texteParle.replace(/(\d{1,3}(?:[\s.,]\d{3})*)\s*FC/g, (match, p1) => { const num = parseInt(p1.replace(/[\s.,]/g, '')); if(num >= 1000) return convertirNombreEnFrancais(num) + ' francs congolais'; return convertirNombreEnFrancais(num) + ' francs congolais'; });
texteParle = texteParle.replace(/(\d+)\s*FC/g, (match, p1) => { const num = parseInt(p1); if(num >= 1000) return convertirNombreEnFrancais(num) + ' francs congolais'; return convertirNombreEnFrancais(num) + ' francs congolais'; });
texteParle = texteParle.replace(/\b(\d{1,3}(?:[\s.,]\d{3})*)\b/g, (match, p1) => { if(match.includes('FC') || match.includes('/')) return match; const num = parseInt(p1.replace(/[\s.,]/g, '')); if(num >= 1000) return convertirNombreEnFrancais(num); return convertirNombreEnFrancais(num); });
texteParle = texteParle.replace(/(\d+)\/(\d+)/g, (match, p1, p2) => { return convertirNombreEnFrancais(parseInt(p1)) + ' sur ' + convertirNombreEnFrancais(parseInt(p2)); });
texteParle = texteParle.replace(/\s+/g, ' ');
const utterance = new SpeechSynthesisUtterance(texteParle);
utterance.lang = 'fr-FR';
utterance.rate = 0.65;
utterance.pitch = 1;
const voices = window.speechSynthesis.getVoices();
const voixFR = voices.find(v => v.lang.startsWith('fr'));
if(voixFR) utterance.voice = voixFR;
window.speechSynthesis.speak(utterance);
}

function convertirNombreEnFrancais(n) {
if(n === 0) return 'zéro';
if(n < 0) return 'moins ' + convertirNombreEnFrancais(-n);
const unite = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const dizaine = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante-dix', 'quatre-vingt', 'quatre-vingt-dix'];
if(n < 20) return unite[n];
if(n < 100) {
const d = Math.floor(n / 10); const u = n % 10;
if(d === 7 || d === 9) { const base = (d === 7) ? 'soixante' : 'quatre-vingt'; const reste = (d === 7) ? n - 60 : n - 80; return base + '-' + convertirNombreEnFrancais(reste); }
if(u === 0) { if(d === 8) return 'quatre-vingts'; return dizaine[d]; }
if(d === 8) return 'quatre-vingt-' + unite[u];
return dizaine[d] + '-' + unite[u];
}
if(n < 1000) {
const c = Math.floor(n / 100); const r = n % 100;
if(c === 1) { if(r === 0) return 'cent'; return 'cent ' + convertirNombreEnFrancais(r); }
if(r === 0) return unite[c] + ' cents';
return unite[c] + ' cent ' + convertirNombreEnFrancais(r);
}
if(n < 1000000) {
const m = Math.floor(n / 1000); const r = n % 1000;
if(m === 1) { if(r === 0) return 'mille'; return 'mille ' + convertirNombreEnFrancais(r); }
if(r === 0) return convertirNombreEnFrancais(m) + ' mille';
return convertirNombreEnFrancais(m) + ' mille ' + convertirNombreEnFrancais(r);
}
if(n < 1000000000) {
const m = Math.floor(n / 1000000); const r = n % 1000000;
if(m === 1) { if(r === 0) return 'un million'; return 'un million ' + convertirNombreEnFrancais(r); }
if(r === 0) return convertirNombreEnFrancais(m) + ' millions';
return convertirNombreEnFrancais(m) + ' millions ' + convertirNombreEnFrancais(r);
}
return n.toString();
}
