<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:'Inter',sans-serif;height:100vh;overflow:hidden;}
.parent-floating-btn{position:fixed;bottom:24px;right:24px;width:80px;height:80px;border-radius:50%;background:transparent;border:none;padding:0;cursor:pointer;z-index:10001;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;box-shadow:0 0 0 0 rgba(16,185,129,0.6);animation:breathe 2.5s ease-in-out infinite;}
.parent-floating-btn img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:3px solid #10b981;box-sizing:border-box;}
@keyframes breathe{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.5);}50%{transform:scale(1.08);box-shadow:0 0 35px 15px rgba(16,185,129,0.25);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.5);}}
.parent-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(16px);z-index:10002;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all 0.3s ease;}
.parent-modal-overlay.active{visibility:visible;opacity:1;}
.parent-modal{background:linear-gradient(135deg,#1e293b,#0f172a);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,130,246,0.4);}50%{transform:scale(1.05);box-shadow:0 0 30px 10px rgba(59,130,246,0.15);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,130,246,0.4);}}

.parent-chat{display:flex;flex-direction:column;height:100%;width:100%;}
.parent-info{background:linear-gradient(135deg,#0f2b44,#071a2c);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(59,130,246,0.2);flex-shrink:0;}
.parent-info-left{display:flex;flex-direction:column;gap:4px;}
.parent-info-left span:first-child{color:#ffd700;font-size:15px;font-weight:600;}

#parentQuestionCounter{background:#10b981;color:white;padding:4px 12px;border-radius:40px;font-weight:bold;font-size:14px;transition:all 0.3s ease;}
.parent-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 20% 30%, rgba(59,130,246,0.05), transparent 80%);min-height:0;}
.parent-msg{display:flex;width:100%;animation:fadeInUp 0.3s ease-out;}
.parent-msg.user{justify-content:flex-end;}
.parent-msg.bot{justify-content:flex-start;}
.parent-msg .bubble{max-width:85%;padding:18px 24px;border-radius:24px;font-size:18px;line-height:1.6;word-wrap:break-word;font-weight:400;transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1.1);white-space:pre-wrap;font-family:'Inter',sans-serif;}
.parent-msg.user .bubble{background:linear-gradient(135deg,rgba(59,130,246,0.95),rgba(30,64,175,0.95));backdrop-filter:blur(12px);color:#fff;font-weight:500;box-shadow:0 15px 30px -10px rgba(59,130,246,0.5),0 5px 10px -3px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.2),inset 0 -2px 0 rgba(0,0,0,0.1);border:1px solid rgba(255,255,255,0.25);border-radius:24px 24px 8px 24px;}
.parent-msg.bot .bubble{background:rgba(18,25,45,0.85);backdrop-filter:blur(16px);color:#e2e8f0;border:2px solid rgba(255,107,107,0.3);box-shadow:0 12px 28px -8px rgba(0,0,0,0.4),0 4px 8px -2px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.08);border-radius:24px 24px 24px 8px;overflow:hidden;position:relative;}
.parent-msg.bot .bubble strong,.parent-msg.bot .bubble b{color:#60a5fa;font-weight:600;}
.parent-input-area{flex-shrink:0;display:flex;gap:12px;background:#0f172a;padding:16px;border-top:1px solid #334155;}
.parent-input{flex:1;padding:14px 18px;background:#0f172a;border:1px solid #334155;border-radius:40px;color:#fff;font-size:16px;outline:none;resize:none;font-family:'Inter',sans-serif;line-height:1.4;}
.parent-input:focus{border-color:#3b82f6;}
.parent-send{background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;padding:0 24px;color:#fff;font-weight:600;cursor:pointer;transition:all 0.2s;font-size:18px;}
.parent-send:active{transform:scale(0.97);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.typing-indicator{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(18,25,45,0.85);border-radius:20px;border:2px solid rgba(255,107,107,0.3);backdrop-filter:blur(16px);color:#94a3b8;font-size:14px;font-style:italic;}
.typing-dots{display:flex;gap:4px;align-items:center;}
.typing-dots span{width:8px;height:8px;background:#94a3b8;border-radius:50%;display:inline-block;animation:typingBounce 1.4s infinite ease-in-out;}
.typing-dots span:nth-child(1){animation-delay:0s;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}
.toast-container{position:fixed;top:20px;right:20px;z-index:30000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast-notification{background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:18px 24px;min-width:340px;max-width:380px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border-left:4px solid #10b981;transform:translateX(400px);transition:transform 0.3s ease;pointer-events:auto;}
.toast-notification.show{transform:translateX(0);}
.toast-notification.error{border-left-color:#ef4444;}
.toast-notification.warning{border-left-color:#f59e0b;}
.toast-icon{font-size:18px;}
.toast-content{flex:1;}
.toast-title{font-weight:700;font-size:16px;color:#fff;margin-bottom:4px;}
.toast-message{font-size:14px;color:#cbd5e1;line-height:1.4;}
</style>

<script type="importmap">

    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, orderBy, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
    authDomain: "netubexmoney.firebaseapp.com",
    projectId: "netubexmoney",
    storageBucket: "netubexmoney.firebasestorage.app",
    messagingSenderId: "856592608176",
    appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'gloria_dei';
const SCHOOL_PREFIX = schoolId.replace(/-/g, '_');

let currentParentCode = null;
let dernierEleveData = null;
let reponseCache = new Map();
let lastDataHash = null;
let estEnAttenteReponse = false;
let historiqueSections = {};

const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];

function getMoisActuel() {
    const date = new Date();
    const mois = date.getMonth();
    if (mois >= 8) return moisListe[mois - 8];
    else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
    return "Septembre";
}

function getMoisFromDate(dateISO) {
    if (!dateISO) return "Septembre";
    const date = new Date(dateISO);
    const mois = date.getMonth();
    if (mois >= 8) return moisListe[mois - 8];
    else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
    return "Septembre";
}

function estMoisDansAnnee(mois) {
    const moisActuel = getMoisActuel();
    const idx = moisListe.indexOf(mois);
    const idxActuel = moisListe.indexOf(moisActuel);
    if (idxActuel === -1) return false;
    return idx <= idxActuel;
}

function calculerTotalPaye(paiements) {
    let total = 0;
    for (let mois in paiements) {
        total += paiements[mois]?.montant || 0;
    }
    return total;
}

function compterMoisImpayes(eleve) {
    const paiements = eleve.paiements || {};
    const moisBlancs = eleve.moisBlancs || [];
    let impayes = 0;
    const minerval = eleve.minerval || 45000;
    const dateInscription = eleve.dateInscription || new Date().toISOString();
    const moisInscription = getMoisFromDate(dateInscription);
    const indexInscription = moisListe.indexOf(moisInscription);
    const indexActuel = moisListe.indexOf(getMoisActuel());
    for (let i = Math.max(0, indexInscription); i < indexActuel; i++) {
        const mois = moisListe[i];
        if (moisBlancs.includes(mois)) continue;
        const paye = paiements[mois]?.montant || 0;
        if (paye < minerval) impayes++;
    }
    return impayes;
}

function determinerStatut(eleve) {
    if (eleve.exonere) return "Exonéré";
    const impayes = compterMoisImpayes(eleve);
    if (impayes >= 3) return "Liste noire";
    if (impayes > 0) return "Paiement partiel";
    return "En ordre";
}

function getDataHash(eleveData) {
    if (!eleveData) return null;
    const dataStr = JSON.stringify({
        nom: eleveData.nom,
        prenom: eleveData.prenom,
        sexe: eleveData.sexe,
        classe: eleveData.classe,
        frais: eleveData.frais
    });
    let hash = 0;
    for (let i = 0; i < dataStr.length; i++) {
        const char = dataStr.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return hash.toString();
}

function getSexePronom(sexe) {
    if (sexe === 'F' || sexe === 'Féminin' || sexe === 'fille') {
        return { genre: 'fille', pronom: 'elle', possessif: 'sa' };
    }
    return { genre: 'garçon', pronom: 'il', possessif: 'son' };
}

function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }

function sectionDejaVisitee(section) {
    if (!dernierEleveData) return false;
    if (dernierEleveData.sectionsVisitees && dernierEleveData.sectionsVisitees.includes(section)) return true;
    if (dernierEleveData.id && historiqueSections[dernierEleveData.id]) return historiqueSections[dernierEleveData.id].includes(section);
    return false;
}

function ajouterSectionVisitee(section) {
    if (!dernierEleveData) return;
    if (!dernierEleveData.sectionsVisitees) dernierEleveData.sectionsVisitees = [];
    if (!dernierEleveData.sectionsVisitees.includes(section)) dernierEleveData.sectionsVisitees.push(section);
    if (dernierEleveData.id) {
        if (!historiqueSections[dernierEleveData.id]) historiqueSections[dernierEleveData.id] = [];
        if (!historiqueSections[dernierEleveData.id].includes(section)) historiqueSections[dernierEleveData.id].push(section);
    }
}

async function chercherInfosFinancieresParCode(code) {
    try {
        const q = query(
            collection(db, "ecoles", SCHOOL_PREFIX, "compta_eleves"),
            where("parentCode", "==", code),
            where("_type", "==", "compta_eleve")
        );
        const snap = await getDocs(q);
        if (snap.empty) return null;
        const eleves = [];
        const moisActuel = getMoisActuel();
        snap.forEach(doc => {
            const data = doc.data();
            const paiements = data.paiements || {};
            const minerval = data.minerval || 45000;
            const totalAnnuel = minerval * 10;
            let totalPaye = 0, moisImpayes = [];
            const dateInscription = data.dateInscription || new Date().toISOString();
            const moisInscription = getMoisFromDate(dateInscription);
            const indexInscription = moisListe.indexOf(moisInscription);
            const indexActuel = moisListe.indexOf(moisActuel);
            for (let i = indexInscription; i < indexActuel; i++) {
                const mois = moisListe[i];
                if (!estMoisDansAnnee(mois)) continue;
                const montant = paiements[mois]?.montant || 0;
                totalPaye += montant;
                if (montant < minerval && !data.exonere) { moisImpayes.push(mois); }
            }
            const reste = totalAnnuel - totalPaye;
            let statut = "En ordre";
            if (data.exonere) statut = "Exonéré";
            else if (moisImpayes.length >= 3) statut = "Liste noire";
            else if (moisImpayes.length > 0) statut = "Paiement partiel";
            eleves.push({
                id: data.eleveId,
                nom: data.nom,
                prenom: data.prenom || "",
                sexe: data.sexe || "M",
                classe: data.classe,
                option: data.option || "",
                exonere: data.exonere || false,
                minerval,
                totalAnnuel,
                totalPaye,
                reste,
                moisImpayes,
                statut,
                parentCode: data.parentCode,
                dateInscription: dateInscription
            });
        });
        return eleves;
    } catch (e) { return null; }
}

function genererPropositions(eleveData) {
    const sections = { frais: { nom: 'les frais' }, notes: { nom: 'les notes' }, presence: { nom: 'la présence' }, punitions: { nom: 'les punitions' } };
    const nonVisitees = Object.keys(sections).filter(section => !sectionDejaVisitee(section));
    if (nonVisitees.length === 0) return `\n\nVous avez vu toutes les informations sur ${eleveData.nom} ${eleveData.prenom||''}.`;
    let propositions = '\n\nVoulez-vous voir ';
    const noms = nonVisitees.map(s => sections[s].nom);
    if (noms.length === 1) propositions += noms[0] + ' maintenant ?';
    else if (noms.length === 2) propositions += noms[0] + ' ou ' + noms[1] + ' ?';
    else propositions += noms.slice(0, -1).join(', ') + ' ou ' + noms[noms.length - 1] + ' ?';
    return propositions;
}

// ============================================
// GENERER REPONSE FRAIS - AVEC RECHARGEMENT DIRECT
// ============================================

async function genererReponseFrais(eleveData) {
    if (eleveData && eleveData.parentCode) {
        try {
            const infosFraiches = await chercherInfosFinancieresParCode(eleveData.parentCode);
            if (infosFraiches && infosFraiches.length > 0) {
                const eleveMaj = infosFraiches.find(e => e.id === eleveData.id);
                if (eleveMaj) {
                    eleveData.frais = {
                        minerval: eleveMaj.minerval,
                        totalPaye: eleveMaj.totalPaye,
                        reste: eleveMaj.reste,
                        moisImpayes: eleveMaj.moisImpayes,
                        statut: eleveMaj.statut
                    };
                    eleveData.minerval = eleveMaj.minerval;
                    eleveData.exonere = eleveMaj.exonere;
                    if (dernierEleveData && dernierEleveData.id === eleveData.id) {
                        dernierEleveData.frais = {
                            minerval: eleveMaj.minerval,
                            totalPaye: eleveMaj.totalPaye,
                            reste: eleveMaj.reste,
                            moisImpayes: eleveMaj.moisImpayes,
                            statut: eleveMaj.statut
                        };
                        dernierEleveData.minerval = eleveMaj.minerval;
                        dernierEleveData.exonere = eleveMaj.exonere;
                    }
                    reponseCache.clear();
                }
            }
        } catch (e) { console.error("Erreur rechargement:", e); }
    }
    
    const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
    const minerval = eleveData.frais.minerval;
    const totalPaye = eleveData.frais.totalPaye;
    const reste = eleveData.frais.reste;
    const moisImpayes = eleveData.frais.moisImpayes || [];
    
    let reponse = `Alors, parlons des frais de ${nomComplet}.\n\n`;
    reponse += `Le minerval est de ${minerval.toLocaleString()} francs congolais par mois.\n`;
    reponse += `${totalPaye.toLocaleString()} francs ont déjà été payés.\n`;
    reponse += `Il reste ${reste.toLocaleString()} francs à payer.\n`;
    
    const nbImpayes = moisImpayes.length;
    if (totalPaye === 0 && nbImpayes === 0) {
        reponse += `\nVotre enfant n'a pas encore de mois à payer.`;
    } else if (nbImpayes === 0) {
        reponse += `\nVotre enfant est en ordre.`;
    } else if (nbImpayes === 1) {
        reponse += `\nIl manque 1 mois : ${moisImpayes[0]}.`;
    } else if (nbImpayes === 2) {
        reponse += `\nIl manque 2 mois : ${moisImpayes.join(' et ')}.`;
    } else if (nbImpayes >= 3) {
        reponse += `\nURGENT : Il manque ${nbImpayes} mois !`;
    }
    
    reponse += genererPropositions(eleveData);
    return reponse;
}

async function genererReponseNotes(eleveData) {
    ajouterSectionVisitee('notes');
    const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
    if (!eleveData.notes || eleveData.notes.length === 0) {
        return `${nomComplet} n'a pas encore de notes enregistrées.`;
    }
    const notesValides = eleveData.notes.filter(n => n.note > 0);
    if (notesValides.length === 0) {
        return `${nomComplet} n'a pas encore de notes enregistrées.`;
    }
    let meilleureNote = null, meilleurScore = 0;
    notesValides.forEach(n => { if (n.note > meilleurScore) { meilleurScore = n.note; meilleureNote = n; } });
    let reponse = `Résultat de ${nomComplet}\n\n`;
    reponse += ` Meilleure note : ${meilleureNote.note}/${meilleureNote.max}`;
    if (meilleureNote.matiere) { reponse += ` en ${meilleureNote.matiere}`; }
    if (meilleureNote.epreuve) { reponse += ` (${meilleureNote.epreuve})`; }
    reponse += `.`;
    reponse += genererPropositions(eleveData);
    return reponse;
}

async function genererReponsePresence(eleveData) {
    ajouterSectionVisitee('presence');
    const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
    const presences = eleveData.presences || [];
    const maintenant = new Date();
    const heureActuelle = maintenant.getHours() + maintenant.getMinutes() / 60;
    const jourSemaine = maintenant.getDay();
    let reponse = `Je regarde la présence de ${nomComplet}.`;
    if (jourSemaine === 0 || jourSemaine === 6) {
        reponse += `\n\nAujourd'hui c'est le week-end, il n'y a pas cours.`;
        reponse += genererPropositions(eleveData);
        return reponse;
    }
    if (heureActuelle < 12) {
        const minutesRestantes = Math.round((12 - heureActuelle) * 60);
        let tempsRestant = minutesRestantes >= 60 ? Math.floor(minutesRestantes / 60) + 'h' + (minutesRestantes % 60) + 'min' : minutesRestantes + 'min';
        reponse += `\n\nLes cours commencent à 12h00. Il reste ${tempsRestant}.`;
        if (presences.length > 0) {
            const derniere = presences[0];
            if (!derniere.estAujourdhui) {
                const dateDerniere = new Date(derniere.date).toLocaleDateString('fr-FR');
                reponse += `\nLa dernière présence enregistrée date du ${dateDerniere}. ${derniere.present?'Présent':'Absent'}`;
            }
        }
        reponse += genererPropositions(eleveData);
        return reponse;
    }
    if (presences.length === 0) {
        reponse += `\n\nJe n'ai pas d'informations sur sa présence pour le moment.`;
        reponse += genererPropositions(eleveData);
        return reponse;
    }
    const aujourdhui = presences.find(p => p.estAujourdhui);
    if (aujourdhui && aujourdhui.present !== null) {
        if (heureActuelle >= 17.5) { reponse += `\n\nAujourd'hui, ${nomComplet} était ${aujourdhui.present?'présent':'absent'}.`; }
        else { reponse += `\n\nAujourd'hui, ${nomComplet} est ${aujourdhui.present?'présent':'absent'}.`; }
    } else if (aujourdhui && aujourdhui.avantCours) {
        reponse += `\n\nLes cours n'ont pas encore commencé.`;
    } else {
        const derniere = presences[0];
        if (derniere) {
            const dateDerniere = new Date(derniere.date).toLocaleDateString('fr-FR');
            reponse += `\n\nLa dernière présence enregistrée date du ${dateDerniere}. ${derniere.present?'Présent':'Absent'}`;
        }
    }
    reponse += genererPropositions(eleveData);
    return reponse;
}

async function genererReponsePunitions(eleveData) {
    ajouterSectionVisitee('punitions');
    const nomComplet = `${eleveData.nom} ${eleveData.prenom||''}`.trim();
    const punitions = eleveData.punitions || [];
    const { pronom } = getSexePronom(eleveData.sexe);
    let reponse = `Voyons les punitions de ${nomComplet}.\n`;
    if (punitions.length === 0) {
        reponse += `\nAucune punition active. ${pronom==='il'?'Il':'Elle'} a un bon comportement, c'est bien !`;
    } else {
        reponse += `\nVoici les punitions enregistrées :\n`;
        punitions.forEach((p, index) => {
            const date = new Date(p.date).toLocaleDateString('fr-FR');
            reponse += `\n${index+1}. ${p.motif}\n   Date : ${date}`;
            if (p.justification) reponse += `\n   Justification : ${p.justification}`;
        });
    }
    reponse += genererPropositions(eleveData);
    return reponse;
}

// AFFICHER INFOS ELEVE - AVEC DONNEES DIRECTES

async function afficherInfosEleve(eleve) {
    const nomEcole = schoolId ? schoolId.toUpperCase().replace(/-/g, ' ') : 'COMPLEXE SCOLAIRE';
    const sexe = eleve.sexe || 'M';
    const { genre, pronom } = getSexePronom(sexe);
    
    // RECHARGER DIRECTEMENT LES DONNEES COMME DANS LE TEST
    const infosFraiches = await chercherInfosFinancieresParCode(eleve.parentCode);
    let eleveMaj = eleve;
    if (infosFraiches && infosFraiches.length > 0) {
        const found = infosFraiches.find(e => e.id === eleve.id);
        if (found) eleveMaj = found;
    }
    
    const eleveId = eleve.id || eleve.nom;
    if (!historiqueSections[eleveId]) historiqueSections[eleveId] = [];
    
    dernierEleveData = {
        id: eleveId,
        nom: eleve.nom,
        prenom: eleve.prenom,
        sexe: sexe,
        genre: genre,
        pronom: pronom,
        classe: eleve.classe,
        option: eleve.option,
        ecole: nomEcole,
        notes: [],
        titulaire: null,
        nombreElevesClasse: 0,
        parentCode: eleve.parentCode,
        frais: {
            minerval: eleveMaj.minerval,
            totalPaye: eleveMaj.totalPaye,
            reste: eleveMaj.reste,
            moisImpayes: eleveMaj.moisImpayes,
            statut: eleveMaj.statut
        },
        punitions: [],
        presences: [],
        sectionsVisitees: historiqueSections[eleveId] || []
    };
    
    reponseCache.clear();
    lastDataHash = getDataHash(dernierEleveData);
    
    function getSalutation() {
        const h = new Date().getHours();
        if (h < 12) return "Bonjour";
        if (h < 18) return "Bon après-midi";
        return "Bonsoir";
    }
    
    let reponse = `${getSalutation()} cher parent,\n\n`;
    reponse += `J'ai trouvé ${eleve.nom} ${eleve.prenom||''} dans notre système.\n`;
    reponse += `C'est ${pronom==='il'?'un garçon':'une fille'}.\n`;
    reponse += `${pronom==='il'?'Il':'Elle'} est en ${eleve.classe}${eleve.option?' option '+eleve.option:''}.\n\n`;
    reponse += `Je peux vous parler de sa situation financière, de ses notes, de sa présence ou de ses punitions.\n`;
    reponse += `Par quoi voulez-vous commencer ?`;
    return reponse;
}

// ============================================
// TRAITER LE MESSAGE
// ============================================

async function traiterMessage(message) {
    const msg = message.trim().toLowerCase();
    const nomEcole = schoolId ? schoolId.toUpperCase().replace(/-/g, ' ') : 'COMPLEXE SCOLAIRE';
    const aujourdhui = new Date();
    const jourSemaine = aujourdhui.getDay();
    
    if (jourSemaine === 0) {
        return `Désolé, aujourd'hui c'est dimanche. Veuillez revenir un jour ouvrable, entre le lundi et le samedi.`;
    }
    
    if (msg === 'oui' || msg === 'o' || msg === 'ok' || msg === 'd\'accord' || msg === 'vas-y' || msg === 'go') {
        if (dernierEleveData) {
            const sections = ['notes', 'frais', 'presence', 'punitions'];
            const sectionsVisitees = dernierEleveData.sectionsVisitees || [];
            let prochaineSection = null;
            for (const section of sections) {
                if (!sectionsVisitees.includes(section)) { prochaineSection = section; break; }
            }
            if (prochaineSection) {
                switch(prochaineSection) {
                    case 'notes': return await genererReponseNotes(dernierEleveData);
                    case 'frais': return await genererReponseFrais(dernierEleveData);
                    case 'presence': return await genererReponsePresence(dernierEleveData);
                    case 'punitions': return await genererReponsePunitions(dernierEleveData);
                    default: return `Je peux vous parler de sa situation financière, de ses notes, de sa présence ou de ses punitions. Par quoi voulez-vous commencer ?`;
                }
            } else {
                return `Vous avez vu toutes les informations sur ${dernierEleveData.nom} ${dernierEleveData.prenom||''}.\n\nSi vous avez d'autres questions, n'hésitez pas à les poser. Sinon, vous pouvez entrer un autre code parent.`;
            }
        } else {
            const h = new Date().getHours();
            const salutation = h < 12 ? "Bonjour" : (h < 18 ? "Bon après-midi" : "Bonsoir");
            return `${salutation} cher parent, veuillez d'abord entrer votre code parent.`;
        }
    }
    
    if (/^\d{6}$/.test(msg)) {
        const code = msg;
        const infos = await chercherInfosFinancieresParCode(msg);
        if (!infos || infos.length === 0) {
            dernierEleveData = null;
            return `Code parent "${msg}" non reconnu à l'école ${nomEcole}. Veuillez vérifier votre code ou contacter la comptabilité.`;
        }
        if (infos.length === 1) {
            currentParentCode = code;
            return await afficherInfosEleve(infos[0]);
        } else {
            let reponse = `Plusieurs élèves sont liés à ce code parent :\n\n`;
            infos.forEach((eleve, index) => {
                const { pronom } = getSexePronom(eleve.sexe);
                reponse += `${index+1}. ${eleve.nom} ${eleve.prenom||''} (${pronom==='il'?'garçon':'fille'}) - ${eleve.classe}${eleve.option?' ('+eleve.option+')':''}\n`;
            });
            reponse += `\nRépondez avec le numéro de l'élève (1. 2. 3...).`;
            return reponse;
        }
    }
    
    if (dernierEleveData) {
        const eleveData = dernierEleveData;
        const texteComplet = msg;
        
        const motsFrais = ['frais', 'finance', 'argent', 'dette', 'payer', 'minerval', 'paiement', 'cout', 'prix', 'facture', 'scolarité', 'mensualité', 'reste', 'impayé', 'payé', 'crédit', 'solde', 'montant', 'total', 'annuel', 'mois'];
        if (motsFrais.some(m => texteComplet.includes(m))) return await genererReponseFrais(eleveData);
        
        const motsNotes = ['note', 'notes', 'résultat', 'résultats', 'bulletin', 'point', 'points', 'epreuve', 'epreuves', 'devoir', 'devoirs', 'interro', 'interrogation', 'matière', 'matières', 'cours', 'classe', 'contrôle', 'évaluation', 'test', 'noté', 'notation'];
        if (motsNotes.some(m => texteComplet.includes(m))) return await genererReponseNotes(eleveData);
        
        const motsPresence = ['présence', 'present', 'présent', 'absent', 'absence', 'assiduité', 'venir', 'viens', 'vient', 'venu', 'école', 'jour', 'aujourd\'hui', 'hier', 'semaine', 'retard', 'retards', 'ponctualité', 'cours'];
        if (motsPresence.some(m => texteComplet.includes(m))) return await genererReponsePresence(eleveData);
        
        const motsPunitions = ['punition', 'punitions', 'sanction', 'sanctions', 'puni', 'punie', 'comportement', 'discipline', 'exclusion', 'avertissement', 'retenue', 'blâme', 'conseil', 'mauvaise', 'faute', 'erreur'];
        if (motsPunitions.some(m => texteComplet.includes(m))) return await genererReponsePunitions(eleveData);
        
        const motsBonjour = ['bonjour', 'salut', 'coucou', 'hello', 'hey', 'yo', 'bonsoir', 'bjr', 'slt'];
        const motsMerci = ['merci', 'remerciement', 'remettre', 'je vous remercie', 'je te remercie', 'merci beaucoup', 'merci infiniment', 'merci bien', 'merci pour tout'];
        const motsAurevoir = ['au revoir', 'bye', 'bye bye', 'ciao', 'adieu', 'à bientôt', 'à plus', 'à tout à l\'heure', 'à demain', 'à la prochaine', 'bonne journée', 'bonne soirée', 'bonne nuit'];
        if (motsBonjour.some(m => texteComplet.includes(m))) return `En tout cas! Je suis là à votre service.`;
        if (motsMerci.some(m => texteComplet.includes(m))) return `De rien, c'est un plaisir de vous aider.`;
        if (motsAurevoir.some(m => texteComplet.includes(m))) return `Au revoir ! Passez une excellente journée.`;
        
        return `Je peux vous parler de sa situation financière, de ses notes, de sa présence ou de ses punitions. Par quoi voulez-vous commencer ?`;
    }
    
    const h = new Date().getHours();
    const salutation = h < 12 ? "Bonjour" : (h < 18 ? "Bon après-midi" : "Bonsoir");
    return `${salutation} ! Entrez votre code parent. Si vous n'en avez pas, contactez la comptabilité de l'école ${nomEcole}.`;
}

function createTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'parent-msg bot';
    div.id = 'typingIndicator';
    div.innerHTML = '<div class="typing-indicator"><span>en train d\'écrire</span><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    return div;
}

async function typeWriterEffect(element, text, speed = 15) {
    element.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
        element.innerHTML += text.charAt(i);
        await new Promise(r => setTimeout(r, speed));
    }
}

function toast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
    const titles = { success: "Succès", error: "Erreur", warning: "Attention", info: "Information" };
    const colors = { success: "#10b981", error: "#ef4444", warning: "#f59e0b", info: "#3b82f6" };
    const el = document.createElement("div");
    el.className = `toast-notification ${type}`;
    el.innerHTML = `<div class="toast-icon">${icons[type] || "ℹ️"}</div><div class="toast-content"><div class="toast-title" style="color:${colors[type]}">${titles[type] || "Information"}</div><div class="toast-message">${message}</div></div>`;
    container.appendChild(el);
    requestAnimationFrame(() => { el.classList.add("show"); });
    setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => { if (el.parentNode) el.remove(); }, 400);
    }, 3500);
}

if (parentSendBtn) {
    parentSendBtn.onclick = async () => {
        if (estEnAttenteReponse) { toast("Veuillez patienter, je suis en train d'écrire", 'warning'); return; }
        const message = parentQuestionInput.value.trim();
        if (!message) return;
        
        const aujourdhui = new Date();
        const jourSemaine = aujourdhui.getDay();
        if (jourSemaine === 0) {
            parentChatMessages.innerHTML += `<div class="parent-msg user"><div class="bubble">${escapeHtml(message)}</div></div>`;
            parentChatMessages.innerHTML += `<div class="parent-msg bot"><div class="bubble">Désolé, aujourd'hui c'est dimanche. Veuillez revenir un jour ouvrable, entre le lundi et le samedi.</div></div>`;
            parentQuestionInput.value = '';
            parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
            return;
        }
        
        parentChatMessages.innerHTML += `<div class="parent-msg user"><div class="bubble">${escapeHtml(message)}</div></div>`;

        const typingIndicator = createTypingIndicator();
        parentChatMessages.appendChild(typingIndicator);
        parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
        estEnAttenteReponse = true;
        
        try {
            const reponse = await traiterMessage(message);

            if (typingElement) typingElement.remove();
            
            const msgBotDiv = document.createElement('div');
            msgBotDiv.className = 'parent-msg bot';

            parentChatMessages.appendChild(msgBotDiv);
            parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
            await typeWriterEffect(bubbleBot, reponse, 12);
            parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
            
            if (dernierEleveData && dernierEleveData.frais) {
                console.log(`💰 Données à jour - Payé: ${dernierEleveData.frais.totalPaye} FC, Reste: ${dernierEleveData.frais.reste} FC`);
            }
        } catch (error) {
            const typingElement = document.getElementById('typingIndicator');
            if (typingElement) typingElement.remove();
            const msgBotDiv = document.createElement('div');
            msgBotDiv.className = 'parent-msg bot';
            const bubbleBot = document.createElement('div');
            bubbleBot.className = 'bubble';
            bubbleBot.textContent = "Désolé, une erreur s'est produite. Veuillez réessayer.";
            msgBotDiv.appendChild(bubbleBot);
            parentChatMessages.appendChild(msgBotDiv);
            parentChatMessages.scrollTop = parentChatMessages.scrollHeight;
            console.error("Erreur traitement message:", error);
        } finally { estEnAttenteReponse = false; }
    };
}
