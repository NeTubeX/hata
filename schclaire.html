<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 TEST FIREBASE - DONNÉES FINANCIÈRES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:'Courier New',monospace;padding:20px;color:#fff;}
.container{max-width:1200px;margin:0 auto;}
h1{color:#ffd700;font-size:24px;margin-bottom:20px;text-align:center;}
h2{color:#60a5fa;font-size:16px;margin:20px 0 10px 0;}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #ffd700;}
.card.paye{border-left-color:#10b981;}
.card.impaye{border-left-color:#ef4444;}
.card.exonere{border-left-color:#8b5cf6;}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:bold;}
.badge-paye{background:#10b981;color:#fff;}
.badge-impaye{background:#ef4444;color:#fff;}
.badge-exonere{background:#8b5cf6;color:#fff;}
.badge-listenoir{background:#dc2626;color:#fff;}
.badge-enordre{background:#10b981;color:#fff;}
.info{color:#94a3b8;font-size:13px;margin-top:4px;}
.value{color:#fff;font-weight:bold;}
.value-paye{color:#10b981;}
.value-reste{color:#ef4444;}
.frais-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px;}
.frais-item{background:#0f172a;border-radius:8px;padding:10px;text-align:center;}
.frais-item .mois{color:#94a3b8;font-size:11px;}
.frais-item .montant{font-size:18px;font-weight:bold;}
.frais-item .montant.paye{color:#10b981;}
.frais-item .montant.impaye{color:#ef4444;}
.frais-item .montant.blanc{color:#60a5fa;}
.status{font-size:14px;font-weight:bold;margin-top:8px;}
.loading{text-align:center;padding:40px;color:#94a3b8;}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #1e293b;border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{background:#7f1d1d;padding:20px;border-radius:12px;text-align:center;color:#fca5a5;}
.refresh-btn{background:#3b82f6;border:none;padding:10px 24px;border-radius:30px;color:#fff;font-weight:bold;cursor:pointer;margin:10px 0;}
.refresh-btn:hover{background:#2563eb;}
.code-input{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px 16px;color:#fff;font-size:16px;width:200px;text-align:center;font-family:monospace;letter-spacing:4px;}
.code-input:focus{outline:none;border-color:#ffd700;}
.search-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin:20px 0;}
</style>
</head>
<body>

<div class="container">
    <h1>🔍 TEST FIREBASE - DONNÉES FINANCIÈRES</h1>
    
    <div class="search-box">
        <input type="text" id="codeInput" class="code-input" placeholder="Code parent (6 chiffres)" maxlength="6" inputmode="numeric">
        <button class="refresh-btn" id="searchBtn">🔍 RECHERCHER</button>
        <button class="refresh-btn" id="refreshBtn" style="background:#10b981;">🔄 RAFRAÎCHIR</button>
    </div>
    
    <div id="status" style="text-align:center;color:#94a3b8;font-size:14px;margin-bottom:20px;">
        Entrez un code parent pour voir les données en temps réel
    </div>
    
    <div id="results"></div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, query, where, getDocs, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
    authDomain: "netubexmoney.firebaseapp.com",
    projectId: "netubexmoney",
    storageBucket: "netubexmoney.firebasestorage.app",
    messagingSenderId: "856592608176",
    appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'gloria_dei';
const SCHOOL_PREFIX = schoolId.replace(/-/g, '_');

const codeInput = document.getElementById('codeInput');
const searchBtn = document.getElementById('searchBtn');
const refreshBtn = document.getElementById('refreshBtn');
const resultsDiv = document.getElementById('results');
const statusDiv = document.getElementById('status');

let currentCode = null;
let unsubscribe = null;
let elevesData = [];

const moisListe = ["Septembre", "Octobre", "Novembre", "Decembre", "Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin"];

function getMoisActuel() {
    const date = new Date();
    const mois = date.getMonth();
    if (mois >= 8) return moisListe[mois - 8];
    else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
    return "Septembre";
}

function getMoisFromDate(dateISO) {
    if (!dateISO) return "Septembre";
    const date = new Date(dateISO);
    const mois = date.getMonth();
    if (mois >= 8) return moisListe[mois - 8];
    else if (mois >= 0 && mois <= 5) return moisListe[mois + 4];
    return "Septembre";
}

function estMoisDansAnnee(mois) {
    const moisActuel = getMoisActuel();
    const idx = moisListe.indexOf(mois);
    const idxActuel = moisListe.indexOf(moisActuel);
    if (idxActuel === -1) return false;
    return idx <= idxActuel;
}

function calculerTotalPaye(paiements) {
    let total = 0;
    for (let mois in paiements) {
        total += paiements[mois]?.montant || 0;
    }
    return total;
}

function compterMoisImpayes(eleve) {
    const paiements = eleve.paiements || {};
    const moisBlancs = eleve.moisBlancs || [];
    let impayes = 0;
    const minerval = eleve.minerval || 45000;
    const dateInscription = eleve.dateInscription || new Date().toISOString();
    const moisInscription = getMoisFromDate(dateInscription);
    const indexInscription = moisListe.indexOf(moisInscription);
    const indexActuel = moisListe.indexOf(getMoisActuel());
    
    for (let i = Math.max(0, indexInscription); i < indexActuel; i++) {
        const mois = moisListe[i];
        if (moisBlancs.includes(mois)) continue;
        const paye = paiements[mois]?.montant || 0;
        if (paye < minerval) impayes++;
    }
    return impayes;
}

function determinerStatut(eleve) {
    if (eleve.exonere) return "Exonéré";
    const impayes = compterMoisImpayes(eleve);
    if (impayes >= 3) return "Liste noire";
    if (impayes > 0) return "Paiement partiel";
    return "En ordre";
}

function afficherResultats(eleves) {
    if (!eleves || eleves.length === 0) {
        resultsDiv.innerHTML = `
            <div class="error">
                <p>❌ Aucun élève trouvé avec ce code parent</p>
                <p style="font-size:12px;color:#94a3b8;margin-top:10px;">Vérifiez que le code est correct (6 chiffres)</p>
            </div>
        `;
        return;
    }

    let html = '';
    const moisActuel = getMoisActuel();

    eleves.forEach(eleve => {
        const totalPaye = calculerTotalPaye(eleve.paiements || {});
        const minerval = eleve.minerval || 45000;
        const totalMinerval = minerval * 10;
        const reste = totalMinerval - totalPaye;
        const statut = determinerStatut(eleve);
        const moisImpayes = compterMoisImpayes(eleve);
        
        let statutBadge = '';
        let cardClass = '';
        if (eleve.exonere) {
            statutBadge = '<span class="badge badge-exonere">🌟 EXONÉRÉ</span>';
            cardClass = 'exonere';
        } else if (moisImpayes >= 3) {
            statutBadge = '<span class="badge badge-listenoir">⚠️ LISTE NOIRE</span>';
            cardClass = 'impaye';
        } else if (moisImpayes > 0) {
            statutBadge = '<span class="badge badge-impaye">⚠️ IMPAYÉ</span>';
            cardClass = 'impaye';
        } else {
            statutBadge = '<span class="badge badge-enordre">✅ EN ORDRE</span>';
            cardClass = 'paye';
        }

        const nomComplet = `${eleve.nom} ${eleve.prenom || ''}`.trim();
        const sexeIcon = eleve.sexe === 'F' ? '👩' : '👨';

        html += `
            <div class="card ${cardClass}">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                    <div>
                        <strong style="font-size:18px;color:#ffd700;">${sexeIcon} ${nomComplet}</strong>
                        <div class="info">📚 ${eleve.classe} ${eleve.option ? '- ' + eleve.option : ''}</div>
                    </div>
                    <div>
                        ${statutBadge}
                        <span style="font-family:monospace;background:#0f172a;padding:4px 12px;border-radius:12px;font-size:13px;margin-left:8px;">🔑 ${eleve.parentCode || 'Aucun'}</span>
                    </div>
                </div>
                
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;background:#0f172a;border-radius:10px;padding:12px;">
                    <div style="text-align:center;">
                        <div style="color:#94a3b8;font-size:11px;">💰 MINERVAL MENSUEL</div>
                        <div style="font-size:20px;font-weight:bold;color:#ffd700;">${minerval.toLocaleString()} FC</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="color:#94a3b8;font-size:11px;">✅ TOTAL PAYÉ</div>
                        <div style="font-size:20px;font-weight:bold;color:#10b981;">${totalPaye.toLocaleString()} FC</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="color:#94a3b8;font-size:11px;">⚠️ RESTE À PAYER</div>
                        <div style="font-size:20px;font-weight:bold;color:${reste > 0 ? '#ef4444' : '#10b981'};">${reste.toLocaleString()} FC</div>
                    </div>
                </div>

                <div style="margin-top:12px;">
                    <div style="color:#94a3b8;font-size:11px;margin-bottom:6px;">📅 DÉTAIL PAR MOIS :</div>
                    <div class="frais-grid">
        `;

        const paiements = eleve.paiements || {};
        const moisBlancs = eleve.moisBlancs || [];
        const dateInscription = eleve.dateInscription || new Date().toISOString();
        const moisInscription = getMoisFromDate(dateInscription);
        const indexInscription = moisListe.indexOf(moisInscription);

        for (let i = 0; i < moisListe.length; i++) {
            const mois = moisListe[i];
            if (i < indexInscription) continue;
            if (!estMoisDansAnnee(mois) && mois !== getMoisActuel()) continue;
            
            const p = paiements[mois] || { montant: 0 };
            const estBlanc = moisBlancs.includes(mois);
            const estPaye = p.montant >= minerval;
            const estPartiel = p.montant > 0 && p.montant < minerval;
            
            let classeMontant = 'impaye';
            let label = '';
            if (eleve.exonere) {
                classeMontant = 'paye';
                label = '🌟';
            } else if (estBlanc) {
                classeMontant = 'blanc';
                label = '❄️';
            } else if (estPaye) {
                classeMontant = 'paye';
                label = '✅';
            } else if (estPartiel) {
                classeMontant = 'impaye';
                label = '⚠️';
            } else {
                classeMontant = 'impaye';
                label = '❌';
            }

            const isCurrent = mois === getMoisActuel();
            
            html += `
                <div class="frais-item" style="${isCurrent ? 'border:2px solid #ffd700;' : ''}">
                    <div class="mois">${mois} ${isCurrent ? '📌' : ''}</div>
                    <div class="montant ${classeMontant}">
                        ${p.montant.toLocaleString()} FC
                        <span style="font-size:10px;color:#94a3b8;">/ ${minerval.toLocaleString()} FC</span>
                    </div>
                    <div style="font-size:10px;color:#94a3b8;margin-top:4px;">
                        ${label} ${estBlanc ? 'MOIS BLANC' : (eleve.exonere ? 'EXONÉRÉ' : (estPaye ? 'PAYÉ' : (estPartiel ? 'PARTIEL' : 'IMP')))}
                    </div>
                </div>
            `;
        }

        html += `
                    </div>
                </div>
                
                <div style="margin-top:12px;padding-top:10px;border-top:1px solid #334155;font-size:11px;color:#94a3b8;">
                    📅 Inscription: ${eleve.dateInscription || 'Non renseignée'} 
                    | 🔑 Code: ${eleve.parentCode || 'Aucun'}
                    ${eleve.exonere ? ' | 📝 Approbateur: ' + (eleve.approbateur || 'Non renseigné') : ''}
                </div>
            </div>
        `;
    });

    resultsDiv.innerHTML = html;
}

async function chargerDonnees(code) {
    if (!code || code.length !== 6) {
        resultsDiv.innerHTML = `<div class="error"><p>⚠️ Veuillez entrer un code parent valide (6 chiffres)</p></div>`;
        return;
    }

    currentCode = code;
    statusDiv.innerHTML = '🔄 Chargement des données...';
    resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">Recherche des élèves avec le code ${code}...</p></div>`;

    try {
        // Arrêter l'écoute précédente
        if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
        }

        const q = query(
            collection(db, "ecoles", SCHOOL_PREFIX, "compta_eleves"),
            where("parentCode", "==", code),
            where("_type", "==", "compta_eleve")
        );

        // Écoute en temps réel
        unsubscribe = onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                statusDiv.innerHTML = `🔍 Aucun élève trouvé avec le code <strong>${code}</strong>`;
                resultsDiv.innerHTML = `<div class="error"><p>❌ Aucun élève trouvé avec ce code parent</p></div>`;
                return;
            }

            elevesData = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                elevesData.push({
                    id: data.eleveId,
                    nom: data.nom,
                    postnom: data.postnom || "",
                    prenom: data.prenom || "",
                    sexe: data.sexe || "M",
                    classe: data.classe,
                    option: data.option || "",
                    minerval: data.minerval || 45000,
                    exonere: data.exonere || false,
                    paiements: data.paiements || {},
                    parentCode: data.parentCode || "",
                    abandon: data.abandon || false,
                    dateInscription: data.dateInscription || new Date().toISOString(),
                    moisBlancs: data.moisBlancs || [],
                    approbateur: data.approbateur || ""
                });
            });

            const totalPayeTotal = elevesData.reduce((sum, e) => sum + calculerTotalPaye(e.paiements || {}), 0);
            const totalMinervalTotal = elevesData.reduce((sum, e) => sum + (e.minerval || 45000) * 10, 0);
            
            statusDiv.innerHTML = `
                ✅ <strong>${elevesData.length}</strong> élève(s) trouvé(s) avec le code <strong>${code}</strong>
                | 💰 Total payé: <strong style="color:#10b981;">${totalPayeTotal.toLocaleString()} FC</strong>
                | ⚠️ Reste: <strong style="color:${(totalMinervalTotal - totalPayeTotal) > 0 ? '#ef4444' : '#10b981'};">${(totalMinervalTotal - totalPayeTotal).toLocaleString()} FC</strong>
                <span style="font-size:11px;color:#94a3b8;margin-left:12px;">🔄 Écoute en temps réel activée</span>
            `;

            afficherResultats(elevesData);
        }, (error) => {
            console.error("Erreur écoute:", error);
            statusDiv.innerHTML = `❌ Erreur: ${error.message}`;
            resultsDiv.innerHTML = `<div class="error"><p>❌ Erreur de connexion à Firebase</p></div>`;
        });

    } catch (error) {
        console.error("Erreur:", error);
        statusDiv.innerHTML = `❌ Erreur: ${error.message}`;
        resultsDiv.innerHTML = `<div class="error"><p>❌ Erreur lors du chargement des données</p></div>`;
    }
}

searchBtn.addEventListener('click', () => {
    const code = codeInput.value.trim();
    chargerDonnees(code);
});

refreshBtn.addEventListener('click', () => {
    if (currentCode) {
        chargerDonnees(currentCode);
    } else {
        toast("Veuillez d'abord rechercher un code parent", "warning");
    }
});

codeInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        searchBtn.click();
    }
});

codeInput.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length > 6) this.value = this.value.slice(0, 6);
});

// Vérifier si un code est passé dans l'URL
const urlCode = urlParams.get('code');
if (urlCode && urlCode.length === 6) {
    codeInput.value = urlCode;
    setTimeout(() => chargerDonnees(urlCode), 500);
}

console.log(`✅ Test Firebase connecté - École: ${SCHOOL_PREFIX}`);
console.log(`💡 Entrez un code parent à 6 chiffres pour voir les données en temps réel`);

</script>
</body>
</html>
