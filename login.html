<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connexion - Gestion Scolarité</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0e1a,#0f172a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:0}
.login-box{background:rgba(18,18,31,0.95);backdrop-filter:blur(20px);border-radius:32px;padding:44px 36px;width:100%;max-width:400px;border:1px solid rgba(255,215,0,0.15);box-shadow:0 30px 80px rgba(0,0,0,0.7);position:relative;margin:auto}
.login-box .logo{text-align:center;font-size:48px;margin-bottom:8px}
.login-box h1{text-align:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,#ffd700,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.login-box .sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:4px}
.login-box .ecole-id{text-align:center;color:#64748b;font-size:11px;margin-bottom:28px;background:rgba(255,215,0,0.05);padding:6px 16px;border-radius:20px;border:1px solid rgba(255,215,0,0.08);display:inline-block}
.login-box .ecole-wrapper{text-align:center}
.form-group{margin-bottom:20px}
.form-group label{display:block;color:#cbd5e1;font-size:13px;font-weight:500;margin-bottom:8px;text-align:center}
.form-group input{width:100%;padding:16px;border-radius:16px;background:rgba(45,55,72,0.6);border:2px solid rgba(255,215,0,0.12);color:#fff;font-size:22px;text-align:center;letter-spacing:8px;font-family:monospace;outline:none;transition:all 0.3s}
.form-group input:focus{border-color:#ffd700;box-shadow:0 0 0 4px rgba(255,215,0,0.08);background:rgba(45,55,72,0.8)}
.form-group input::placeholder{color:#475569;font-size:14px;letter-spacing:2px;font-family:'Inter',sans-serif}
#loginBtn{width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#ffd700,#fbbf24);color:#0f172a;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;letter-spacing:0.5px}
#loginBtn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,215,0,0.2)}
#loginBtn:active{transform:scale(0.97)}
#loginBtn:disabled{opacity:0.5;transform:none;box-shadow:none}
.error{color:#ef4444;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.info{color:#10b981;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.footer{text-align:center;margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,215,0,0.06)}
.footer p{color:#334155;font-size:11px;letter-spacing:0.5px}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-box{animation:fadeIn 0.5s ease-out}
.code-hint{text-align:center;color:#475569;font-size:11px;margin-top:6px}
.contact-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 28px;border-radius:50px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all 0.3s;text-decoration:none;margin:20px auto 0;box-shadow:0 4px 20px rgba(37,99,235,0.25)}
.contact-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,99,235,0.35)}
.contact-btn:active{transform:scale(0.97)}
.contact-btn svg{width:20px;height:20px;flex-shrink:0}
.contact-wrapper{text-align:center;padding-top:20px;width:100%;max-width:400px}
.contact-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.2),transparent);margin:0 auto}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">🏫</div>
<h1>GESTION SCOLAIRE</h1>
<p class="sub" id="schoolSub">COMPLEXE SCOLAIRE</p>
<div class="ecole-wrapper"><span class="ecole-id" id="ecoleDisplay">📌 ÉCOLE : CHARGEMENT...</span></div>
<div class="form-group">
<label>🔑 Code d'accès</label>
<input type="password" id="loginCode" placeholder="••••" maxlength="6" inputmode="numeric" autofocus>
<div class="code-hint">4 à 6 chiffres</div>
</div>
<button id="loginBtn">🔓 SE CONNECTER</button>
<div id="errorMsg" class="error"></div>
<div id="infoMsg" class="info"></div>
<div class="footer"><p>© 2026 - Tous droits réservés</p></div>
</div>
<div class="contact-wrapper">
<div class="contact-divider"></div>
<button class="contact-btn" onclick="window.location.href='tel:+243976953045'">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
Discuter avec NeTubeX SARL
</button>
</div>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>
<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,doc,getDoc,setDoc}from"firebase/firestore";
document.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false});
document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='K'||e.keyCode===73||e.keyCode===74||e.keyCode===75)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='u'||e.key==='U'||e.keyCode===85)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='s'||e.key==='S'||e.keyCode===83)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='h'||e.key==='H'||e.keyCode===72)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='c'||e.key==='C'||e.keyCode===67)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='p'||e.key==='P'||e.keyCode===80)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='o'||e.key==='O'||e.keyCode===79)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='n'||e.key==='N'||e.keyCode===78)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='f'||e.key==='F'||e.keyCode===70)){e.preventDefault();e.stopPropagation();return false}return true});
document.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();return false});
document.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();return false});
document.addEventListener('selectstart',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();return false}});
document.addEventListener('keyup',function(e){if(e.altKey&&e.key==='Tab'){e.preventDefault();return false}});
Object.defineProperty(window,'console',{value:console,writable:false,configurable:false});
document.querySelectorAll('img').forEach(img=>{img.addEventListener('contextmenu',function(e){e.preventDefault();return false})});
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const DEFAULT_CONFIG={codeDirection:"1111",codeComptabilite:"0000",urlDirection:"https://www.netubex.com/director",urlComptabilite:"https://www.netubex.com/schoolcompta"};
const urlParams=new URLSearchParams(window.location.search);
const ecoleId=urlParams.get("ecole")||"mon-ecole";
const schoolDisplay=ecoleId.toUpperCase().replace(/-/g," ");
document.getElementById("ecoleDisplay").textContent="📌 ÉCOLE : "+schoolDisplay;
document.getElementById("schoolSub").textContent="COMPLEXE SCOLAIRE "+schoolDisplay;
document.title="Connexion - "+schoolDisplay;
let config={...DEFAULT_CONFIG};
async function chargerConfig(){
try{
const ref=doc(db,"ecoles",ecoleId,"settings","data");
const snap=await getDoc(ref);
if(snap.exists()){
const data=snap.data();
config.codeDirection=data.codeDirection||DEFAULT_CONFIG.codeDirection;
config.codeComptabilite=data.codeComptabilite||DEFAULT_CONFIG.codeComptabilite;
config.urlDirection=data.urlDirection||DEFAULT_CONFIG.urlDirection;
config.urlComptabilite=data.urlComptabilite||DEFAULT_CONFIG.urlComptabilite;
}else{
await setDoc(ref,{...DEFAULT_CONFIG,ecoleId,createdAt:new Date().toISOString()});
}
}catch(e){console.error(e);}
}
async function seConnecter(){
const code=document.getElementById("loginCode").value.trim();
const btn=document.getElementById("loginBtn");
const errorDiv=document.getElementById("errorMsg");
const infoDiv=document.getElementById("infoMsg");
errorDiv.textContent="";
infoDiv.textContent="";
if(!code||code.length<4){errorDiv.textContent="❌ Code invalide (minimum 4 chiffres)";return;}
btn.disabled=true;
btn.textContent="⏳ VÉRIFICATION...";
try{
await chargerConfig();
let role=null,url="";
if(code===config.codeDirection){role="Direction";url=config.urlDirection;}
else if(code===config.codeComptabilite){role="Comptabilité";url=config.urlComptabilite;}
else{errorDiv.textContent="❌ Code d'accès incorrect";btn.disabled=false;btn.textContent="🔓 SE CONNECTER";return;}
infoDiv.textContent="✅ "+role+" - Redirection...";
setTimeout(()=>{window.location.href=url+"?ecole="+ecoleId+"&code="+code;},800);
}catch(e){
console.error(e);
errorDiv.textContent="❌ Erreur : "+e.message;
btn.disabled=false;
btn.textContent="🔓 SE CONNECTER";
}
}
document.getElementById("loginBtn").onclick=seConnecter;
document.getElementById("loginCode").addEventListener("keypress",function(e){if(e.key==="Enter")seConnecter();});
document.getElementById("loginCode").addEventListener("input",function(){if(this.value.length>6)this.value=this.value.slice(0,6);document.getElementById("errorMsg").textContent=""});
await chargerConfig();
document.getElementById("loginCode").focus();
document.addEventListener('dblclick',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){e.preventDefault();return false}});
window.addEventListener('keydown',function(e){if(e.ctrlKey&&e.shiftKey&&(e.key==='w'||e.key==='W'||e.keyCode===87)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='q'||e.key==='Q'||e.keyCode===81)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&(e.key==='t'||e.key==='T'||e.keyCode===84)){e.preventDefault();e.stopPropagation();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='t'||e.key==='T'||e.keyCode===84)){e.preventDefault();e.stopPropagation();return false}},true);
document.addEventListener('keydown',function(e){if(e.key==='ContextMenu'||e.keyCode===93){e.preventDefault();e.stopPropagation();return false}});
console.log('🔒 Protection active');
</script>
</body>
</html>
