<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test - Bouton EFFACER</title>
<style>
body {
    background: #0a0e1a;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.card {
    background: rgba(18,18,31,0.9);
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    border: 1px solid rgba(59,130,246,0.2);
}
h2 {
    color: #60a5fa;
    margin-bottom: 20px;
    text-align: center;
}
.form-group {
    margin-bottom: 15px;
}
label {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-bottom: 5px;
    font-weight: 600;
}
input, select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    background: #2d3748;
    border: 1px solid #334155;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
}
input:focus, select:focus {
    outline: none;
    border-color: #3b82f6;
}
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}
.btn {
    padding: 10px 20px;
    border-radius: 40px;
    font-weight: 500;
    cursor: pointer;
    font-size: 13px;
    border: none;
    flex: 1;
    min-width: 100px;
    transition: all 0.2s;
}
.btn:hover {
    opacity: 0.9;
    transform: scale(0.98);
}
.btn-success {
    background: #14532d;
    color: #fff;
}
.btn-danger {
    background: #7f1d1d;
    color: #fff;
}
.btn-secondary {
    background: #334155;
    color: #fff;
}
.btn-primary {
    background: #1e3a5f;
    color: #fff;
}
.status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 12px;
    background: #0f172a;
    font-size: 13px;
    color: #cbd5e1;
    text-align: center;
}
.status .active {
    color: #10b981;
    font-weight: 600;
}
.status .inactive {
    color: #ef4444;
    font-weight: 600;
}
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18,25,45,0.95);
    padding: 12px 24px;
    border-radius: 12px;
    border-left: 4px solid #10b981;
    color: #fff;
    font-size: 14px;
    display: none;
    z-index: 1000;
}
.toast.show {
    display: block;
    animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.field-disabled {
    opacity: 0.5;
    pointer-events: none;
}
.field-active {
    opacity: 1;
    pointer-events: auto;
}
.test-indicator {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-left: 8px;
}
.test-indicator.active {
    background: #10b981;
}
.test-indicator.inactive {
    background: #ef4444;
}
</style>
</head>
<body>

<div class="card">
    <h2>🧪 TEST - BOUTON EFFACER</h2>
    <p style="color:#94a3b8;font-size:13px;text-align:center;margin-bottom:20px;">
        Cliquez sur EFFACER pour vider les champs. Ils doivent rester actifs (modifiables).
    </p>
    
    <div class="form-group">
        <label>COURS <span style="color:#ef4444;">*</span></label>
        <input type="text" id="coursInput" placeholder="ex: Français" value="Mathématiques">
    </div>
    
    <div class="form-group">
        <label>CLASSE <span style="color:#ef4444;">*</span></label>
        <select id="classeSelect">
            <option value="">-- Sélectionner --</option>
            <option value="7ème EB">7ème EB</option>
            <option value="8ème EB">8ème EB</option>
            <option value="1ère Année" selected>1ère Année</option>
            <option value="2ème Année">2ème Année</option>
            <option value="3ème Année">3ème Année</option>
            <option value="4ème Année">4ème Année</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>OPTION</label>
        <select id="optionSelect">
            <option value="">-- Sélectionner --</option>
            <option value="LATIN-PHILO">LATIN-PHILO</option>
            <option value="SCIENCES" selected>SCIENCES</option>
            <option value="PEDAGOGIE GENERALE">PÉDAGOGIE GÉNÉRALE</option>
            <option value="COMMERCIALE ET GESTION">COMMERCIALE ET GESTION</option>
            <option value="ELECTRICITE">ÉLECTRICITÉ</option>
            <option value="MECANIQUE GENERALE">MÉCANIQUE GÉNÉRALE</option>
            <option value="COUPE ET COUTURE">COUPE ET COUTURE</option>
            <option value="TOUTES">TOUTES</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>NOTE MAX / PÉRIODE</label>
        <input type="number" id="p1MaxConfig" value="20" step="1">
    </div>
    
    <div class="btn-group">
        <button class="btn btn-secondary" id="viderChampsBtn">🧹 EFFACER</button>
        <button class="btn btn-success" id="creerFicheBtn">📝 CRÉER</button>
    </div>
    
    <div class="status" id="statusDisplay">
        <span>État des champs : </span>
        <span class="active" id="statusText">ACTIFS</span>
        <span class="test-indicator active" id="statusIndicator"></span>
        <div style="margin-top:8px;font-size:11px;color:#94a3b8;" id="statusDetail">Les champs sont modifiables</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// État des champs
let champsModifiables = true;

// Fonction pour mettre à jour l'affichage du statut
function updateStatus() {
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusDetail = document.getElementById('statusDetail');
    
    if (champsModifiables) {
        statusText.textContent = 'ACTIFS';
        statusText.className = 'active';
        statusIndicator.className = 'test-indicator active';
        statusDetail.textContent = '✅ Les champs sont modifiables';
    } else {
        statusText.textContent = 'VERROUILLÉS';
        statusText.className = 'inactive';
        statusIndicator.className = 'test-indicator inactive';
        statusDetail.textContent = '🔒 Les champs sont verrouillés (non modifiables)';
    }
}

// Fonction pour activer tous les champs
function activerChamps() {
    const inputs = ['coursInput', 'classeSelect', 'optionSelect', 'p1MaxConfig'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.disabled = false;
            el.style.opacity = '1';
            el.style.cursor = 'text';
            el.style.borderColor = '#3b82f6';
            el.style.pointerEvents = 'auto';
            el.style.background = '#2d3748';
            el.style.color = '#fff';
            // Pour les selects, restaurer l'apparence
            if (el.tagName === 'SELECT') {
                el.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>\")";
                el.style.backgroundRepeat = 'no-repeat';
                el.style.backgroundPosition = 'right 12px center';
                el.style.backgroundSize = '14px';
                el.style.paddingRight = '32px !important';
            }
        }
    });
    champsModifiables = true;
    updateStatus();
}

// Fonction pour désactiver les champs
function desactiverChamps() {
    const inputs = ['coursInput', 'classeSelect', 'optionSelect', 'p1MaxConfig'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.disabled = true;
            el.style.opacity = '0.5';
            el.style.cursor = 'not-allowed';
            el.style.borderColor = '#334155';
            el.style.pointerEvents = 'none';
        }
    });
    champsModifiables = false;
    updateStatus();
}

// Fonction pour vider les champs (les laisse actifs)
function viderChamps() {
    document.getElementById('coursInput').value = '';
    document.getElementById('classeSelect').value = '';
    document.getElementById('optionSelect').value = '';
    document.getElementById('p1MaxConfig').value = 20;
    
    // FORCER la réactivation de TOUS les champs
    const inputs = ['coursInput', 'classeSelect', 'optionSelect', 'p1MaxConfig'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.disabled = false;
            el.style.opacity = '1';
            el.style.cursor = 'text';
            el.style.borderColor = '#3b82f6';
            el.style.pointerEvents = 'auto';
            el.style.background = '#2d3748';
            el.style.color = '#fff';
            if (el.tagName === 'SELECT') {
                el.style.backgroundImage = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>\")";
                el.style.backgroundRepeat = 'no-repeat';
                el.style.backgroundPosition = 'right 12px center';
                el.style.backgroundSize = '14px';
                el.style.paddingRight = '32px !important';
            }
        }
    });
    
    champsModifiables = true;
    updateStatus();
    showToast('🧹 Champs vidés - Ils restent modifiables !', 'success');
}

// Fonction pour afficher un toast
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.borderLeftColor = type === 'success' ? '#10b981' : '#ef4444';
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// Événement pour le bouton EFFACER
document.getElementById('viderChampsBtn').addEventListener('click', function() {
    viderChamps();
});

// Événement pour le bouton CRÉER (simulation)
document.getElementById('creerFicheBtn').addEventListener('click', function() {
    const cours = document.getElementById('coursInput').value.trim();
    const classe = document.getElementById('classeSelect').value;
    const option = document.getElementById('optionSelect').value;
    
    if (!cours) {
        showToast('⚠️ Veuillez renseigner le cours', 'error');
        return;
    }
    if (!classe) {
        showToast('⚠️ Veuillez sélectionner une classe', 'error');
        return;
    }
    
    showToast(`✅ Fiche créée : ${cours} - ${classe}${option ? ' ('+option+')' : ''}`, 'success');
});

// Détecter les changements dans les champs pour montrer qu'ils sont actifs
document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('focus', function() {
        if (champsModifiables) {
            this.style.borderColor = '#3b82f6';
            this.style.boxShadow = '0 0 0 2px rgba(59,130,246,0.2)';
        }
    });
    el.addEventListener('blur', function() {
        this.style.boxShadow = 'none';
        if (champsModifiables) {
            this.style.borderColor = '#3b82f6';
        } else {
            this.style.borderColor = '#334155';
        }
    });
    el.addEventListener('input', function() {
        if (!champsModifiables) {
            this.value = this.defaultValue || '';
        }
    });
});

// Initialisation
updateStatus();
showToast('✅ Test démarré - Les champs sont modifiables', 'success');

// Instructions dans la console
console.log('🧪 TEST - Bouton EFFACER');
console.log('📌 Cliquez sur EFFACER pour vider les champs');
console.log('📌 Les champs doivent rester modifiables après');
console.log('📌 Le statut en bas indique si les champs sont actifs');
</script>

</body>
</html>
